      kpis.push([fmt(r.kgDocena, 2), 'kg', 'Alimento por docena de huevos']);
      kpis.push([fmt(r.conversion, 2), '', 'Conversión (kg alimento / kg huevo)']);
      kpis.push([fmt(r.vivasFin), 'aves', `Al final del ciclo (${fmt(r.viab, 1)} % viven)`]);
      kpis.push([fmt(r.alimento - r.alimRecria), 'kg', 'Alimento en postura (lote)']);
      if (r.alimRecria > 0) kpis.push([fmt(r.alimRecria), 'kg', 'Alimento de recría (lote)']);
      else kpis.push([fmt(r.masaKg), 'kg', 'Masa de huevo del lote']);
    } else {
      heroe = `<p class="eyebrow plan-heroe-titulo">Peso vivo por ave a los ${st.dFin} días</p>
        <p class="plan-heroe-num num">${fmt(r.pesoFin / 1000, 2)}<small>kg</small></p>
        <p class="plan-heroe-sub"><b>${fmt(r.kgVivo)}</b> kg en pie · ${fmt(r.kgCanal)} kg de canal</p>`;
      kpis.push([fmt(r.caAcum, 2), '', 'Conversión acumulada']);
      kpis.push([fmt(r.vivasFin), 'aves', `Para la venta (${fmt(r.viab, 1)} % viven)`]);
      kpis.push([fmt(r.alimento), 'kg', 'Alimento desde hoy (lote)']);
      kpis.push([fmt(r.caPeriodo, 2), '', 'Conversión desde hoy']);
      if (esBroiler(st.g)) kpis.push([fmt(r.iep), '', 'Índice de eficiencia productiva (IEP)']);
      else kpis.push([fmt(st.g.carne.rend), '%', 'Rendimiento a canal']);
      kpis.push([fmt(r.pesoStdFin / 1000, 2), 'kg', 'Peso estándar de la genética']);
    }
    const F = r.F;
    const avisos = [];
    if (F.altPeso > 0.5) avisos.push(h ? `Altitud de ${fmt(st.alt)} m: la proyección descuenta ${fmt(F.altPeso, 1)} % de producción.` : `Altitud de ${fmt(st.alt)} m: la proyección descuenta ${fmt(F.altPeso, 1)} % del crecimiento${F.altMort > 0.1 ? ` y suma ${fmt(F.altMort, 1)} puntos de mortalidad por ascitis` : ''}.`);
    if (F.enf) avisos.push(`${F.enf.n}: ${F.mit > 0 ? `con el tratamiento elegido se recupera cerca del ${fmt(F.mit * 100)} % de la pérdida.` : 'sin tratamiento, la pérdida se aplica completa.'}`);
    if (st.real != null) avisos.push(h ? `La proyección parte de tu ${fmt(st.real, 1)} % de postura actual.` : `La proyección parte de tu peso actual de ${fmt(st.real)} g.`);
    const unidadGana = h ? 'huevos' : 'kg';
    const ind = F.indice;
    const precio = (id, etiqueta, valor, ej) => `<div class="reg-campo"><label class="reg-etiqueta" for="${id}">${etiqueta}</label>
      <input class="reg-texto num" id="${id}" type="number" inputmode="decimal" step="0.01" min="0" placeholder="${ej}" value="${esc(valor)}"></div>`;
    return `<h1>Proyección de ${h ? 'huevos' : 'carne'}</h1>
  <p class="pantalla-texto plan-lead">${esc(st.g.nombre)} · ${fmt(st.aves)} aves de ${esc(P.edadTxt())} · ${fmt(st.alt)} msnm</p>
  <div class="reg-campo"><p class="reg-etiqueta" id="plan-lbl-fin">${h ? 'Proyectar hasta la semana' : 'Edad de venta'}</p>
    <div class="nl-presets" role="group" aria-labelledby="plan-lbl-fin">${ops.map(o =>
      `<button type="button" class="segmento-btn" data-accion="plan-fin" data-v="${o}" aria-pressed="${o === st.dFin}">${h ? 'Sem. ' + o / 7 : o + ' días'}</button>`).join('')}</div></div>
  <article class="tarjeta tarjeta-verde plan-heroe">${heroe}<p class="plan-vs">${fmt(pct)} % del estándar de la genética</p></article>
  <div class="plan-kpis">${kpis.map(k => `<div class="plan-kpi"><span class="plan-kpi-v num">${esc(k[0])}${k[1] ? `<small>${esc(k[1])}</small>` : ''}</span><span class="plan-kpi-l">${esc(k[2])}</span></div>`).join('')}</div>
  ${grafico(st, r)}
  <article class="tarjeta plan-mejoras">
    <div class="plan-indice-fila"><div><p class="eyebrow">Índice de manejo</p><p class="plan-indice-num num plan-indice-proy">${ind} %</p></div>
      ${Boton({ texto: 'Ajustar manejo', variante: 'secundario', accion: 'plan-ir', datos: { paso: 'manejo' } })}</div>
    <div class="plan-medidor${ind >= 85 ? ' plan-medidor-bueno' : ind < 50 ? ' plan-medidor-malo' : ''}" aria-hidden="true"><span style="width:${ind}%"></span></div>
    ${br.length ? `<h2 class="plan-sub">Lo que más sumaría a tu ${h ? 'producción' : 'lote'}</h2>
      <ul class="plan-brechas">${br.slice(0, 5).map(b => `<li><span class="plan-brecha-texto"><span class="plan-brecha-n">${esc(b.n)}</span><span class="plan-brecha-c">${esc(b.cat)}</span></span><span class="plan-brecha-g num">+${fmt(b.gana, 0)} ${unidadGana}</span></li>`).join('')}</ul>`
      : `<p class="reg-ayuda">Aplicas todas las prácticas recomendadas para esta fase.</p>`}
  </article>
  ${avisos.length ? `<div class="plan-aviso plan-aviso-suave">${icono('info')}<span>${avisos.map(esc).join('<br>')}</span></div>` : ''}
  <article class="tarjeta plan-precios">
    <header class="tarjeta-cab"><h2 class="tarjeta-titulo">Ingresos y margen</h2></header>
    <p class="reg-ayuda">Escribe tus precios en dólares para ver el margen sobre el alimento.</p>
    ${h ? precio('plan-p-cubeta', 'Precio de la cubeta de 30', P.precios.cubeta, 'Ej.: 3,60') : precio('plan-p-kg', 'Precio del kg en pie', P.precios.kgVivo, 'Ej.: 1,90')}
    ${precio('plan-p-alim', 'Costo del kg de alimento', P.precios.kgAlim, 'Ej.: 0,62')}
    <div class="plan-eco" id="plan-eco">${ecoHTML(r)}</div>
    <p class="reg-ayuda">No incluye compra de aves, mano de obra, energía ni medicamentos.</p>
  </article>
  <details class="plan-metodo"><summary>¿Cómo se calcula?</summary>
    <ul>
      <li>La curva parte del estándar publicado: ${esc(st.g.fuente)}.</li>
      <li>Se aplica un ajuste de campo del ${fmt((st.g.campo || 1) * 100)} % por la diferencia entre las condiciones de prueba de la casa genética y una granja típica.</li>
      <li>Cada práctica que no marcas descuenta producción y suma mortalidad según su importancia. Son coeficientes de referencia de la literatura técnica, no mediciones de tu granja.</li>
      <li>La altitud reduce el crecimiento del pollo de engorde y desde los 2.000 m suma riesgo de ascitis.</li>
      <li>Si escribes un dato real (postura o peso de hoy), la proyección parte de él y en unas 4 semanas se acerca al nivel que permite el manejo elegido.</li>
      <li>Úsala para planificar y compárala cada semana con tus registros.</li>
    </ul></details>
  <div class="rep-acciones plan-acciones plan-final">
    ${Boton({ texto: 'Copiar resumen', icono: 'copiar', variante: 'secundario', accion: 'plan-copiar', clase: 'btn-ancho' })}
    <div class="rep-copia plan-copia" hidden><label class="reg-etiqueta" for="plan-copia-texto">Selecciona y copia el resumen</label><textarea class="reg-texto rep-texto" id="plan-copia-texto" rows="7" readonly></textarea></div>
    ${Boton({ texto: 'Crear lote con este plan', icono: 'mas', variante: 'primario', accion: 'plan-crear-lote', clase: 'btn-ancho btn-grande' })}
    ${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'plan-ir', datos: { paso: 'manejo' }, clase: 'btn-ancho' })}
  </div>`;
  }

  function montar(raiz) {
    raiz.addEventListener('input', e => {
      const t = e.target, k = { 'plan-p-cubeta': 'cubeta', 'plan-p-kg': 'kgVivo', 'plan-p-alim': 'kgAlim' }[t.id];
      if (!k) return;
      P.precios[k] = t.value; P.guardarPrecios();
      const { r } = P.calcular(); $v('#plan-eco').innerHTML = ecoHTML(r);
    });
  }

  /* Portapapeles; si falla, textarea oculto + execCommand; si tampoco, caja visible para copiar a mano. */
  async function copiar(texto) {
    try { await navigator.clipboard.writeText(texto); return true; } catch (e) { /* respaldo */ }
    const ta = document.createElement('textarea');
    ta.value = texto; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    let ok = false;
    try { ta.focus(); ta.select(); ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  ACCIONES['plan-fin'] = el => { P.S.fin = Number(el.dataset.v); P.guardar(); App.refrescar(); };
  ACCIONES['plan-copiar'] = async () => {
    if (!P.loteValido()) return;
    const txt = P.textoResumen();
    if (await copiar(txt)) { App.toast('Resumen copiado'); return; }
    const caja = $v('.plan-copia'), ta = $v('#plan-copia-texto');
    if (!caja || !ta) return;
    caja.hidden = false; ta.value = txt;
    ta.scrollIntoView({ block: 'center' }); ta.focus(); ta.select();
    App.toast('Copia el texto de la caja');
  };
  ACCIONES['plan-crear-lote'] = () => {
    const d = P.datosLote();
    if (!d) { App.ir('#/plan/lote'); return; }
    App.estado.prefillLote = d;
    App.ir('#/nuevo-lote');
  };

  return { html, montar };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Planificar (#/plan/genetica|lote|manejo|proyeccion).
   Enrutador de pasos, encabezado (Atrás + indicador de 4 pasos) y los pasos
   1 · Genética y 2 · Lote. Manejo y Proyección viven en planManejo.js y planProyeccion.js;
   el estado y las reglas, en planEstado.js (copiados del planificador original).
   ========================================================================= */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

(function () {
  'use strict';
  const P = PlanEstado, S = P.S;
  const NOMBRES = { genetica: 'Genética', lote: 'Lote', manejo: 'Manejo', proyeccion: 'Proyección' };
  const ATRAS = { lote: 'genetica', manejo: 'lote', proyeccion: 'manejo' };
  const $v = s => document.querySelector('#view ' + s);
  const apagado = (html, off) => (off ? html.replace('<button ', '<button disabled ') : html);

  /* ------------------------------ Encabezado ------------------------------ */
  function cabecera(paso) {
    const i = P.PASOS.indexOf(paso);
    const puede = k => k === 'genetica' || (k === 'lote' && P.gen()) || ((k === 'manejo' || k === 'proyeccion') && P.loteValido());
    const volver = ATRAS[paso]
      ? Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'plan-ir', datos: { paso: ATRAS[paso] }, clase: 'plan-volver' })
      : Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'ir', datos: { ruta: '#/mas' }, clase: 'plan-volver' });
    return `<div class="plan-cab">${volver}<p class="eyebrow">Planificar · Paso ${i + 1} de 4</p></div>
  <ol class="plan-pasos" aria-label="Pasos">${P.PASOS.map((k, j) => `<li class="plan-paso${j < i ? ' plan-paso-hecho' : ''}"${j === i ? ' aria-current="step"' : ''}>
    <button type="button" data-accion="plan-ir" data-paso="${k}"${puede(k) ? '' : ' disabled'}><span class="paso-barra" aria-hidden="true"></span><span class="plan-paso-nombre">${NOMBRES[k]}</span></button></li>`).join('')}</ol>`;
  }

  /* ============================ 1 · GENÉTICA ============================ */
  const FILTROS = [['todas', 'Todas'], ['postura', 'Postura'], ['carne', 'Carne'], ['doble', 'Doble propósito'], ['criolla', 'Criolla']];
  function listaGen() {
    return GENETICAS.filter(g => S.filtro === 'todas' || g.tipo === S.filtro).map(g => `
    <button type="button" class="gen-opcion plan-gen" data-accion="plan-genetica" data-id="${esc(g.id)}" aria-pressed="${S.gid === g.id}">
      <span class="gen-cab"><b class="gen-nombre">${esc(g.nombre)}</b><span class="gen-tipo gen-tipo-${esc(g.tipo)}">${esc(TIPOS[g.tipo].corto)}</span></span>
      <span class="gen-desc">${esc(g.desc)}</span>
      <span class="plan-datos">${g.datos.map(d => `<span><span class="plan-dt">${esc(d[0])}</span><b class="num">${esc(d[1])}</b></span>`).join('')}</span>
      <span class="gen-desc">${esc(g.rasgo)} · ${esc(g.origen)}</span>
    </button>`).join('');
  }
  function pasoGenetica() {
    return `<h1>¿Qué gallinas vas a manejar?</h1>
  <p class="pantalla-texto">Elige la genética. Cada línea tiene su propio estándar de producción y sus recomendaciones.</p>
  <div class="segmento" role="group" aria-label="Filtrar por tipo">${FILTROS.map(f =>
    `<button type="button" class="segmento-btn" data-accion="plan-filtro" data-v="${f[0]}" aria-pressed="${S.filtro === f[0]}">${f[1]}</button>`).join('')}</div>
  <div class="gen-lista">${listaGen()}</div>`;
  }

  /* ============================== 2 · LOTE ============================== */
  function presetsEdad() {
    const g = P.gen();
    if (P.modo() === 'huevos') return [[1, 'dias', '1 día'], [4, 'semanas', '4 sem'], [10, 'semanas', '10 sem'], [17, 'semanas', '17 sem'], [25, 'semanas', '25 sem'], [40, 'semanas', '40 sem'], [60, 'semanas', '60 sem']];
    if (esBroiler(g)) return [1, 7, 14, 21, 28, 35].map(d => [d, 'dias', d === 1 ? '1 día' : `${d} días`]);
    if (g.id === 'campero') return [1, 14, 28, 42, 56].map(d => [d, 'dias', d === 1 ? '1 día' : `${d} días`]);
    return [[1, 'dias', '1 día'], [4, 'semanas', '4 sem'], [8, 'semanas', '8 sem'], [12, 'semanas', '12 sem'], [16, 'semanas', '16 sem']];
  }
  const pasador = (c, valor, etiqueta, modoTeclado) => `<div class="contador">
    <button type="button" class="contador-btn contador-menos" data-accion="plan-menos" data-c="${c}" aria-label="Restar"><span aria-hidden="true">−</span></button>
    <input class="contador-valor num" id="plan-${c}" type="number" inputmode="${modoTeclado}" min="${c === 'edad' ? 0 : 1}" step="any" value="${esc(valor)}" aria-label="${etiqueta}" aria-describedby="plan-err-${c}">
    <button type="button" class="contador-btn contador-mas" data-accion="plan-mas" data-c="${c}" aria-label="Sumar"><span aria-hidden="true">+</span></button></div>`;
  function pasoLote() {
    const g = P.gen(), dual = g.tipo === 'doble' || g.tipo === 'criolla';
    const alts = [[100, 'Costa'], [400, 'Amazonía'], [1800, 'Valle'], [2800, 'Sierra']];
    const seg = (accion, actual, ops, etiqueta) => `<div class="segmento" role="group" aria-label="${etiqueta}">${ops.map(([v, t]) =>
      `<button type="button" class="segmento-btn" data-accion="${accion}" data-v="${v}" aria-pressed="${actual === v}">${t}</button>`).join('')}</div>`;
    return `<h1>Datos del lote</h1>
  <p class="pantalla-texto">Con la edad, el número de aves y la altitud se ajustan las recomendaciones y la proyección.</p>
  <div class="plan-elegida"><div><b class="gen-nombre">${esc(g.nombre)}</b><p class="gen-desc">${esc(g.rasgo)} · ${esc(TIPOS[g.tipo].nombre)}</p></div>
    ${Boton({ texto: 'Cambiar', variante: 'secundario', accion: 'plan-ir', datos: { paso: 'genetica' } })}</div>
  ${dual ? `<div class="reg-campo"><p class="reg-etiqueta">¿Para qué las crías?</p>${seg('plan-obj', S.obj, [['huevos', 'Huevos'], ['carne', 'Carne']], '¿Para qué las crías?')}</div>` : ''}
  <div class="reg-campo"><label class="reg-etiqueta" for="plan-edad">Edad de las aves</label>
    ${seg('plan-unidad', S.unidad, [['dias', 'Días'], ['semanas', 'Semanas']], 'Unidad de edad')}
    ${pasador('edad', S.edad === null || S.edad === undefined ? '' : S.edad, 'Edad de las aves', 'decimal')}
    <div class="nl-presets" role="group" aria-label="Edades frecuentes">${presetsEdad().map(p =>
      `<button type="button" class="segmento-btn" data-accion="plan-preset" data-v="${p[0]}" data-u="${p[1]}">${p[2]}</button>`).join('')}</div>
    <div id="plan-fase-vivo"></div>
    <p class="reg-error plan-error" id="plan-err-edad" role="alert"></p></div>
  <div class="reg-campo"><label class="reg-etiqueta" for="plan-aves">Número de aves vivas</label>
    ${pasador('aves', Number.isFinite(S.aves) ? S.aves : '', 'Número de aves vivas', 'numeric')}
    <p class="reg-error plan-error" id="plan-err-aves" role="alert"></p></div>
  <div class="reg-campo"><label class="reg-etiqueta" for="plan-alt">Altitud de la granja (msnm)</label>
    <input class="reg-texto num" id="plan-alt" type="number" inputmode="numeric" min="0" max="4500" step="50" value="${esc(S.alt)}">
    <div class="nl-presets" role="group" aria-label="Zonas">${alts.map(a =>
      `<button type="button" class="segmento-btn" data-accion="plan-alt" data-v="${a[0]}" aria-pressed="${Number(S.alt) === a[0]}">${a[1]} · ${fmt(a[0])} m</button>`).join('')}</div>
    <p class="reg-ayuda" id="plan-ayuda-alt"></p></div>
  <div id="plan-real-vivo"></div>
  <div class="reg-acciones plan-acciones">${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'plan-ir', datos: { paso: 'genetica' } })}${
    apagado(Boton({ texto: 'Ver recomendaciones', icono: 'sig', variante: 'primario', accion: 'plan-siguiente' }), !P.loteValido())}</div>`;
  }

  /* Partes del paso Lote que cambian mientras se escribe (como vivoLote del original). */
  function vivoLote() {
    const g = P.gen(); if (!g || !$v('#plan-edad')) return;
    const err = P.errorEdad();
    $v('#plan-err-edad').textContent = err;
    $v('#plan-err-aves').textContent = P.avesOk() ? '' : 'Escribe cuántas aves tienes: de 1 a 1.000.000.';
    const f = $v('#plan-fase-vivo');
    if (err) f.innerHTML = '';
    else { const ph = fase(g, P.modo(), P.dias()); f.innerHTML = `<p class="plan-fase">${icono('huevo')}<span>Fase: <b>${esc(ph.n)}</b> · ${esc(ph.r)}</span></p>`; }
    const alt = Number(S.alt) || 0;
    $v('#plan-ayuda-alt').textContent = P.modo() === 'carne' && esBroiler(g) && alt >= 2000 ? 'Sobre 2.000 m el pollo de engorde crece menos y tiene más riesgo de ascitis. La app lo incluye en la proyección.'
      : alt >= 2000 ? 'En zona alta las noches son frías: la app ajusta las recomendaciones de temperatura.' : 'La altitud ajusta temperatura, densidad y riesgo de ascitis.';
    document.querySelectorAll('#view [data-accion="plan-alt"]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === S.alt)));
    const rv = $v('#plan-real-vivo');
    if (!err && P.realVisible()) {
      const h = P.modo() === 'huevos';
      if (rv.dataset.tipo !== (h ? 'h' : 'c')) {
        rv.dataset.tipo = h ? 'h' : 'c';
        rv.innerHTML = `<div class="reg-campo"><label class="reg-etiqueta" for="plan-real">${h ? '% de postura actual' : 'Peso promedio actual (g)'} <span class="plan-opcional">· opcional</span></label>
          <input class="reg-texto num" id="plan-real" type="number" inputmode="decimal" min="0" step="${h ? '0.1' : '1'}" placeholder="${h ? 'Ej.: 88' : 'Ej.: 1250'}" value="${esc(S.real === null ? '' : S.real)}">
          <p class="reg-ayuda">${h ? 'Huevos recogidos ayer ÷ aves vivas × 100.' : 'Pesa 1 de cada 20 aves y saca el promedio.'} Con este dato la proyección parte de lo que hoy produce tu lote.</p></div>`;
      }
    } else { rv.innerHTML = ''; delete rv.dataset.tipo; }
    const btn = $v('[data-accion="plan-siguiente"]'); if (btn) btn.disabled = !P.loteValido();
  }

  /* ============================== Vista ============================== */
  VISTAS.planificar = async function (params) {
    const pedido = (params && params.paso) || 'genetica', paso = P.pasoPermitido(pedido);
    if (paso !== pedido || location.hash !== '#/plan/' + paso) history.replaceState(null, '', '#/plan/' + paso);
    const cuerpo = paso === 'genetica' ? pasoGenetica() : paso === 'lote' ? pasoLote() : paso === 'manejo' ? PlanManejo.html() : PlanProyeccion.html();
    return `<section class="pantalla planificar" data-paso="${paso}">${cabecera(paso)}${cuerpo}</section>`;
  };
  VISTAS.planificar.montar = function (raiz) {
    const sec = raiz.querySelector('.planificar'); if (!sec) return;
    const paso = sec.dataset.paso;
    if (paso === 'lote') {
      vivoLote();
      raiz.addEventListener('input', e => {
        const id = e.target.id;
        if (id === 'plan-edad' || id === 'plan-aves' || id === 'plan-alt' || id === 'plan-real') { P.escribir(id.slice(5), e.target.value); if (id !== 'plan-real') vivoLote(); }
      });
    } else if (paso === 'manejo') PlanManejo.montar(raiz);
    else if (paso === 'proyeccion') PlanProyeccion.montar(raiz);
  };

  /* ------------------------------ Acciones ------------------------------ */
  ACCIONES['plan-ir'] = el => App.ir('#/plan/' + el.dataset.paso);
  ACCIONES['plan-filtro'] = el => { S.filtro = el.dataset.v; P.guardar(); App.refrescar(); };
  ACCIONES['plan-genetica'] = el => { P.elegirGenetica(el.dataset.id); App.ir('#/plan/lote'); };
  ACCIONES['plan-obj'] = el => { if (P.elegirObjetivo(el.dataset.v)) App.refrescar(); };
  ACCIONES['plan-unidad'] = el => { if (P.elegirUnidad(el.dataset.v)) App.refrescar(); };
  ACCIONES['plan-preset'] = el => { S.edad = Number(el.dataset.v); S.unidad = el.dataset.u; S.fin = null; P.guardar(); App.refrescar(); };
  ACCIONES['plan-alt'] = el => { S.alt = Number(el.dataset.v); P.guardar(); const i = $v('#plan-alt'); if (i) i.value = S.alt; vivoLote(); };
  const pasoBtn = (el, signo) => { const v = P.paso(el.dataset.c, signo); const i = $v('#plan-' + el.dataset.c); if (i) i.value = v; vivoLote(); };
  ACCIONES['plan-mas'] = el => pasoBtn(el, 1);
  ACCIONES['plan-menos'] = el => pasoBtn(el, -1);
  ACCIONES['plan-siguiente'] = () => { if (P.loteValido()) App.ir('#/plan/manejo'); else vivoLote(); };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Registro rápido (hoja inferior): ＋ → tipo → Guardar (3 toques).
   Registrar.abrir(tipo?) abre la hoja; con `tipo` salta directo a la pantalla de valor.
   Registro: {id, loteId, fecha (hoyLocal), tipo, datos, creado}.
   ========================================================================= */
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

const Registrar = (function () {
  'use strict';
  const TIPOS = [
    { id: 'mortalidad', texto: 'Mortalidad', icono: 'cruz' },
    { id: 'alimento', texto: 'Alimento', icono: 'saco' },
    { id: 'huevos', texto: 'Huevos', icono: 'huevo' },
    { id: 'peso', texto: 'Peso', icono: 'balanza' },
    { id: 'vacuna', texto: 'Vacuna', icono: 'jeringa' },
    { id: 'sanidad', texto: 'Sanidad', icono: 'termo' },
  ];
  const CAUSAS = ['Enfermedad', 'Calor', 'Aplastamiento', 'Depredador', 'Desconocida'];
  const DIARIOS = ['alimento', 'huevos', 'mortalidad', 'peso'];
  const SUMABLES = ['alimento', 'huevos', 'mortalidad']; // sumar pesos no tiene sentido
  const UNIDAD = { mortalidad: 'aves', alimento: 'kg', huevos: 'huevos', peso: 'g' };

  let st = null; // {lotes, loteId, tipo, registros, vacunas, vacunaId, guardando, existente}
  const $h = s => { const c = App.hojaAbierta(); return c ? c.querySelector(s) : null; };
  const lote = () => st && st.lotes.find(l => l.id === st.loteId);
  const gen = l => (typeof GENETICAS !== 'undefined' ? GENETICAS.find(g => g.id === l.genetica) : null);
  const esCarne = l => { const g = gen(l); return !!g && modoDe(g) === 'carne'; };
  const redondear = (x, d) => { const f = Math.pow(10, d); return Math.round(x * f) / f; };
  const num = id => { const el = $h('#' + id); return el ? (el.value === '' ? NaN : Number(el.value)) : NaN; };
  const txt = id => { const el = $h('#' + id); return el ? el.value.trim() : ''; };
  const vivasHoy = () => Math.max(0, avesVivas(lote(), st.registros, hoyLocal()));

  /* ------------------------------ Pantallas ------------------------------ */
  function poner(titulo, html) {
    const c = App.hojaAbierta();
    if (!c) return;
    c.querySelector('.hoja-titulo').textContent = titulo;
    c.querySelector('.hoja-cuerpo').innerHTML = html;
  }

  const htmlTipos = () => `<div class="hoja-rejilla">${TIPOS.map(t =>
    Boton({ texto: t.texto, icono: t.icono, variante: 'secundario', accion: 'reg-tipo', datos: { tipo: t.id } })).join('')}</div>`;

  const htmlSinLotes = () => `<div class="reg-vacio">
  <div class="vacia-ilustracion" aria-hidden="true">${icono('gallina')}</div>
  <p class="reg-vacio-titulo">Primero crea un lote</p>
  <p>Para registrar necesitas al menos un lote de aves activo.</p>
  ${Boton({ texto: 'Crear lote', icono: 'mas', variante: 'primario', accion: 'ir', datos: { ruta: '#/nuevo-lote' }, clase: 'btn-ancho' })}
</div>`;

  function htmlLote() {
    const l = lote(), aves = formatoNumero(vivasHoy());
    const dentro = `${icono('gallina')}<span class="reg-lote-texto"><b>${esc(l.nombre || 'Lote')}</b><span>${aves} aves vivas</span></span>`;
    return st.lotes.length > 1
      ? `<button type="button" class="reg-lote reg-lote-btn" data-accion="reg-cambiar-lote">${dentro}<span class="reg-lote-cambiar">Cambiar</span></button>`
      : `<p class="reg-lote">${dentro}</p>`;
  }

  function predeterminado(tipo) {
    const l = lote(), hoy = hoyLocal(), vivas = vivasHoy();
    let e = null;
    try { e = estandarDia(l, hoy, App.estado.granja && App.estado.granja.altitud, vivas); } catch (x) { e = null; }
    const ok = x => Number.isFinite(x) && x > 0;
    if (tipo === 'mortalidad') return { valor: 1 };
    if (tipo === 'alimento') return { valor: e && ok(e.alimentoKg) ? redondear(e.alimentoKg, 1) : 0, estandar: e && ok(e.alimentoKg) };
    if (tipo === 'huevos') return { valor: e && ok(e.huevos) ? Math.round(e.huevos) : 0, estandar: e && ok(e.huevos) };
    if (tipo === 'peso') {
      // Último peso registrado; si no hay, el estándar de engorde. En postura pesoG es el peso del huevo, no del ave.
      const ps = st.registros.filter(r => r.tipo === 'peso' && Number(r.datos && r.datos.gramos) > 0).sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
      if (ps.length) return { valor: Math.round(Number(ps[ps.length - 1].datos.gramos)), ultimo: true };
      return { valor: esCarne(l) && e && ok(e.pesoG) ? Math.round(e.pesoG) : 0, estandar: esCarne(l) && e && ok(e.pesoG) };
    }
    return { valor: 0 };
  }

  const campo = (etiqueta, html, ayuda) => `<div class="reg-campo"><p class="reg-etiqueta">${etiqueta}</p>${html}${ayuda ? `<p class="reg-ayuda">${ayuda}</p>` : ''}</div>`;
  const pasoPara = v => (v >= 200 ? 5 : v >= 20 ? 1 : 0.5);

  function htmlValor() {
    const t = st.tipo, p = predeterminado(t), vivas = vivasHoy();
    const ayudaStd = p.estandar ? `Estándar de hoy para ${formatoNumero(vivas)} aves` : '';
    let campos = '', guardar = 'Guardar';
    if (t === 'mortalidad') {
      campos = campo('Aves muertas hoy', Contador({ id: 'reg-valor', valor: p.valor, min: 1, max: vivas >= 1 ? vivas : null, paso: 1, etiqueta: 'Aves muertas' })) +
        `<div class="reg-campo"><label class="reg-etiqueta" for="reg-causa">Causa (opcional)</label>
  <select class="reg-select" id="reg-causa"><option value="">Sin indicar</option>${CAUSAS.map(c => `<option>${c}</option>`).join('')}</select></div>`;
    } else if (t === 'alimento') {
      campos = campo('Alimento del día (kg)', Contador({ id: 'reg-valor', valor: p.valor, min: 0, paso: pasoPara(p.valor), etiqueta: 'Alimento en kilos' }), ayudaStd);
    } else if (t === 'huevos') {
      campos = campo('Huevos recogidos hoy', Contador({ id: 'reg-valor', valor: p.valor, min: 0, paso: p.valor >= 200 ? 10 : 1, etiqueta: 'Huevos recogidos' }), ayudaStd) +
        campo('Rotos o sucios', Contador({ id: 'reg-rotos', valor: 0, min: 0, paso: 1, etiqueta: 'Huevos rotos' }));
    } else if (t === 'peso') {
      campos = campo('Peso promedio por ave (g)', Contador({ id: 'reg-valor', valor: p.valor, min: 0, paso: 10, etiqueta: 'Peso promedio en gramos' }),
        p.ultimo ? 'Último peso registrado' : p.estandar ? 'Peso estándar para la edad' : 'Pesa una muestra de aves y anota el promedio');
    } else if (t === 'vacuna') {
      if (st.vacunas.length) {
        if (!st.vacunas.some(v => v.id === st.vacunaId)) st.vacunaId = st.vacunas[0].id;
        guardar = 'Marcar aplicada';
        campos = `<div class="reg-campo"><p class="reg-etiqueta">Vacuna pendiente</p><div class="reg-opciones">${st.vacunas.map(v =>
          `<button type="button" class="reg-opcion" data-accion="reg-vacuna" data-id="${esc(v.id)}" aria-pressed="${v.id === st.vacunaId}">
  <b>${esc(v.nombre)}</b><span>${esc(v.fechaPrevista || '')}${v.via ? ' · ' + esc(v.via) : ''}</span></button>`).join('')}</div></div>`;
      } else {
        campos = `<p class="reg-nota">No hay vacunas pendientes en este lote. Puedes anotar una vacuna aplicada fuera del plan.</p>` +
          `<div class="reg-campo"><label class="reg-etiqueta" for="reg-vacuna-nombre">Nombre de la vacuna</label><input class="reg-texto" id="reg-vacuna-nombre" type="text" autocomplete="off"></div>`;
      }
    } else if (t === 'sanidad') {
      campos = `<div class="reg-campo"><label class="reg-etiqueta" for="reg-enfermedad">Enfermedad o síntoma</label><input class="reg-texto" id="reg-enfermedad" type="text" autocomplete="off"></div>
<div class="reg-campo"><label class="reg-etiqueta" for="reg-tratamiento">Tratamiento</label><input class="reg-texto" id="reg-tratamiento" type="text" autocomplete="off"></div>` +
        campo('Días de retiro (sin vender huevos ni carne)', Contador({ id: 'reg-retiro', valor: 0, min: 0, paso: 1, etiqueta: 'Días de retiro' }));
    }
    return `${htmlLote()}
${campos}
<p class="reg-error" role="alert" hidden></p>
<div class="reg-pregunta" hidden></div>
<div class="reg-acciones">
  ${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'reg-atras' })}
  ${Boton({ texto: guardar, variante: 'primario', accion: 'reg-guardar', clase: 'reg-guardar' })}
</div>`;
  }

  function htmlElegirLote() {
    return `<div class="reg-opciones">${st.lotes.map(l =>
      `<button type="button" class="reg-opcion" data-accion="reg-elegir-lote" data-lote="${esc(l.id)}" aria-pressed="${l.id === st.loteId}">
  <b>${esc(l.nombre || 'Lote')}</b><span>${esc((gen(l) || {}).nombre || l.genetica || '')}</span></button>`).join('')}</div>
${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'reg-volver-valor', clase: 'btn-ancho' })}`;
  }

  /* ------------------------------ Flujo ------------------------------ */
  async function abrir(tipo) {
    let activos = [];
    try { activos = await DB.listar('lotes', { estado: 'activo' }); } catch (e) { activos = []; }
    if (!activos.length) { st = null; App.abrirHoja({ titulo: 'Registrar', contenido: htmlSinLotes() }); return; }
    const pref = App.estado.loteActivoId;
    st = { lotes: activos, loteId: activos.some(l => l.id === pref) ? pref : activos[0].id, tipo: null,
      registros: [], vacunas: [], vacunaId: null, guardando: false, existente: null };
    App.abrirHoja({ titulo: '¿Qué registras?', contenido: htmlTipos() });
    if (tipo && TIPOS.some(t => t.id === tipo)) await elegirTipo(tipo);
  }

  async function cargarLote() {
    st.registros = await DB.listar('registros', { loteId: st.loteId });
    st.vacunas = (await DB.listar('vacunasPlan', { loteId: st.loteId }))
      .filter(v => !v.fechaAplicada).sort((a, b) => String(a.fechaPrevista || '').localeCompare(String(b.fechaPrevista || '')));
  }

  async function elegirTipo(tipo) {
    if (!st) return;
    st.tipo = tipo; st.existente = null;
    try { await cargarLote(); } catch (e) { st.registros = []; st.vacunas = []; }
    if (!App.hojaAbierta()) return;
    poner(TIPOS.find(t => t.id === tipo).texto, htmlValor());
  }

  function mostrarError(msg) {
    const p = $h('.reg-error');
    if (p) { p.textContent = msg; p.hidden = false; }
  }
  function limpiarMensajes() {
    const p = $h('.reg-error'), q = $h('.reg-pregunta'), a = $h('.reg-acciones');
    if (p) { p.hidden = true; p.textContent = ''; }
    if (q) { q.hidden = true; q.innerHTML = ''; }
    if (a) a.hidden = false;
  }

  function leerDatos() {
    switch (st.tipo) {
      case 'mortalidad': { const d = { cantidad: num('reg-valor') }; const c = txt('reg-causa'); if (c) d.causa = c; return d; }
      case 'alimento': return { kg: num('reg-valor') };
      case 'huevos': return { cantidad: num('reg-valor'), rotos: Number.isFinite(num('reg-rotos')) ? num('reg-rotos') : 0 };
      case 'peso': return { gramos: num('reg-valor') };
      case 'vacuna': {
        const v = st.vacunas.find(x => x.id === st.vacunaId);
        return v ? { nombre: v.nombre, via: v.via || '', planId: v.id } : { nombre: txt('reg-vacuna-nombre'), via: '' };
      }
      case 'sanidad': return { enfermedad: txt('reg-enfermedad'), tratamiento: txt('reg-tratamiento'), retiroDias: num('reg-retiro') };
    }
    return {};
  }

  function sumarDatos(a, b) {
    const n = k => Number(a && a[k]) || 0, m = k => Number(b && b[k]) || 0;
    if (st.tipo === 'alimento') return { kg: redondear(n('kg') + m('kg'), 3) };
    if (st.tipo === 'huevos') return { cantidad: n('cantidad') + m('cantidad'), rotos: n('rotos') + m('rotos') };
    const d = { cantidad: n('cantidad') + m('cantidad') }, causa = (b && b.causa) || (a && a.causa);
    if (causa) d.causa = causa;
    return d;
  }

  function preguntar(existente) {
    st.existente = existente;
    const q = $h('.reg-pregunta'), a = $h('.reg-acciones');
    const d = existente.datos || {};
    const previo = st.tipo === 'alimento' ? formatoNumero(d.kg) + ' kg' : st.tipo === 'peso' ? formatoNumero(d.gramos) + ' g'
      : formatoNumero(d.cantidad) + ' ' + UNIDAD[st.tipo];
    const nombre = TIPOS.find(t => t.id === st.tipo).texto.toLowerCase();
    const sumable = SUMABLES.includes(st.tipo);
    q.innerHTML = `<p class="reg-pregunta-texto"><b>Hoy ya registraste ${esc(nombre)}: ${esc(previo)}.</b> ${sumable ? '¿Sumar o reemplazar?' : '¿Reemplazar el registro de hoy?'}</p>
<div class="reg-pregunta-botones">
  ${sumable ? Boton({ texto: 'Sumar', icono: 'mas', variante: 'primario', accion: 'reg-sumar' }) : ''}
  ${Boton({ texto: 'Reemplazar', variante: sumable ? 'secundario' : 'primario', accion: 'reg-reemplazar' })}
</div>
${Boton({ texto: 'Cancelar', variante: 'secundario', accion: 'reg-cancelar-dup', clase: 'btn-ancho' })}`;
    q.hidden = false;
    a.hidden = true;
    const b = q.querySelector('button');
    if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
  }

  /* Aplica kg al inventario vinculado; devuelve los kg realmente aplicados (0 si no hay ítem o falla). */
  async function inventario(kg) {
    if (!(Number.isFinite(kg) && kg !== 0)) return 0;
    if (typeof Inventario !== 'undefined' && Inventario && typeof Inventario.descontarAlimento === 'function') {
      try { const r = await Inventario.descontarAlimento(kg); return Number(r && r.aplicadoKg) || 0; } catch (e) { /* el registro vale aunque falle el inventario */ }
    }
    return 0;
  }
  const descontado = r => Number(r && r.datos && r.datos.descontadoKg) || 0;
  const conDescontado = (datos, kg) => { const d = Object.assign({}, datos); if (kg) d.descontadoKg = kg; else delete d.descontadoKg; return d; };

  /* Escribe el cambio y devuelve la función que lo revierte exactamente (el inventario se revierte con
     los kg realmente descontados, guardados en datos.descontadoKg). */
  async function escribir(modo, datos) {
    const l = lote(), hoy = hoyLocal(), ahora = new Date().toISOString(), ali = st.tipo === 'alimento';
    if (modo === 'sumar' || modo === 'reemplazar') {
      const previo = JSON.parse(JSON.stringify(st.existente)), prevDesc = descontado(previo);
      const final = modo === 'sumar' ? sumarDatos(previo.datos, datos) : datos;
      const guardarReg = d => DB.guardar('registros', Object.assign({}, previo, { datos: d, editado: ahora }));
      await guardarReg(final);
      let neto = 0;
      if (ali) {
        if (modo === 'sumar') neto = await inventario((Number(final.kg) || 0) - (Number(previo.datos && previo.datos.kg) || 0));
        else { await inventario(-prevDesc); neto = await inventario(Number(final.kg) || 0) - prevDesc; }
        const nuevoDesc = prevDesc + neto;
        if (nuevoDesc !== descontado({ datos: final }) || (nuevoDesc && !final.descontadoKg)) await guardarReg(conDescontado(final, nuevoDesc));
      }
      return async () => { await DB.guardar('registros', previo); if (ali) await inventario(-neto); };
    }
    let planPrevio = null;
    if (st.tipo === 'vacuna' && datos.planId) {
      const plan = st.vacunas.find(v => v.id === datos.planId);
      planPrevio = JSON.parse(JSON.stringify(plan));
      await DB.guardar('vacunasPlan', Object.assign({}, plan, { fechaAplicada: hoy }));
    }
    const nuevo = await DB.guardar('registros', { loteId: l.id, fecha: hoy, tipo: st.tipo, datos, creado: ahora });
    let desc = 0;
    if (ali) {
      desc = await inventario(Number(datos.kg) || 0);
      if (desc) await DB.guardar('registros', Object.assign({}, nuevo, { datos: conDescontado(datos, desc) }));
    }
    return async () => {
      await DB.borrar('registros', nuevo.id);
      if (planPrevio) await DB.guardar('vacunasPlan', planPrevio);
      if (desc) await inventario(-desc);
    };
  }

  async function guardar(modo) {
    if (!st || st.guardando || !st.tipo) return;
    const l = lote(), hoy = hoyLocal(), datos = leerDatos();
    if (!modo) limpiarMensajes();
    let v;
    if (modo) {
      // Se valida el resultado final contra los registros sin el que se va a cambiar.
      const sin = st.registros.filter(r => r.id !== st.existente.id);
      v = validarRegistro(st.tipo, modo === 'sumar' ? sumarDatos(st.existente.datos, datos) : datos, l, sin, hoy);
    } else {
      v = validarRegistro(st.tipo, datos, l, st.registros, hoy);
    }
    if (!v.ok) { if (modo) limpiarMensajes(); mostrarError(v.mensaje); return; }
    if (!modo && v.duplicado && DIARIOS.includes(st.tipo)) {
      const ex = st.registros.filter(r => r.tipo === st.tipo && r.fecha === hoy)
        .sort((a, b) => String(a.creado || '').localeCompare(String(b.creado || '')))[0];
      if (ex) { preguntar(ex); return; }
    }
    st.guardando = true;
    const cuerpo = $h('.hoja-cuerpo');
    if (cuerpo) cuerpo.querySelectorAll('button, input, select').forEach(b => { b.disabled = true; });
    let deshacer;
    try { deshacer = await escribir(modo, datos); } catch (e) {
      st.guardando = false;
      if (cuerpo) cuerpo.querySelectorAll('button, input, select').forEach(b => { b.disabled = false; });
      limpiarMensajes();
      mostrarError('No se pudo guardar. Intenta de nuevo.');
      return;
    }
    App.fijarLote(l.id);
    const q = $h('.reg-pregunta'), a = $h('.reg-acciones');
    if (q && !q.hidden) { q.hidden = true; a.hidden = false; }
    const btn = $h('.reg-guardar');
    if (btn) { btn.classList.add('guardado'); btn.setAttribute('aria-label', 'Guardado'); palomita(btn); }
    vibrar(30);
    const capa = App.hojaAbierta();
    const fin = () => {
      if (App.hojaAbierta() === capa) { st = null; App.cerrarHoja(); }
      App.refrescar(); App.toast('Guardado', { deshacer });
    };
    if (reducirMovimiento()) fin(); else setTimeout(fin, 700);
  }

  /* ------------------------------ Acciones ------------------------------ */
  ACCIONES['reg-tipo'] = el => elegirTipo(el.dataset.tipo);
  ACCIONES['reg-guardar'] = () => guardar();
  ACCIONES['reg-sumar'] = () => guardar('sumar');
  ACCIONES['reg-reemplazar'] = () => guardar('reemplazar');
  ACCIONES['reg-cancelar-dup'] = () => {
    limpiarMensajes(); if (st) st.existente = null;
    const g = $h('.reg-guardar'); if (g) try { g.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
  };
  ACCIONES['reg-atras'] = () => { if (!st) return; st.tipo = null; poner('¿Qué registras?', htmlTipos()); };
  ACCIONES['reg-cambiar-lote'] = () => { if (st) poner('¿Qué lote?', htmlElegirLote()); };
  ACCIONES['reg-volver-valor'] = () => { if (st && st.tipo) elegirTipo(st.tipo); };
  ACCIONES['reg-elegir-lote'] = el => { if (!st) return; st.loteId = el.dataset.lote; st.vacunaId = null; elegirTipo(st.tipo); };
  ACCIONES['reg-vacuna'] = el => {
    if (!st) return;
    st.vacunaId = el.dataset.id;
    const c = App.hojaAbierta();
    if (c) c.querySelectorAll('[data-accion="reg-vacuna"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === st.vacunaId)));
  };

  return { abrir };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Reportes: cifras de un lote en un período (semana, mes o ciclo),
   gráfica del período y botones para copiar o compartir el texto (WhatsApp).
   Lo que no se puede calcular se muestra "—", nunca NaN.
   ========================================================================= */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

(function () {
  'use strict';
  const K_PERIODO = 'appollo.v2.periodoReporte', PERIODOS = [['semana', 'Semana'], ['mes', 'Mes'], ['ciclo', 'Ciclo']];
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } };
  let periodo = PERIODOS.some(p => p[0] === lsGet(K_PERIODO)) ? lsGet(K_PERIODO) : 'semana';
  let loteId = null, actual = null; // actual: {texto, titulo}
  const r1 = x => (x === null ? null : Math.round(x * 10) / 10);
  const dinero = x => (x === null ? null : (x < 0 ? '-$' : '$') + formatoNumero(Math.abs(x), 2));
  const ddmm = f => (typeof f === 'string' && f.length >= 10 ? f.slice(8, 10) + '/' + f.slice(5, 7) : '—');

  /* Serie diaria del período (máx. 60 días finales): % postura o peso real contra el estándar. */
  function grafica(l, regs, res, g) {
    if (!g) return '';
    if (typeof res.hasta !== 'string' || typeof res.desde !== 'string') return '';
    const fin = res.hasta, tope = _repMasDias(fin, -59), desde = res.desde > tope ? res.desde : tope;
    const real = [], est = [], dias = [];
    for (let f = desde; f <= fin; f = _repMasDias(f, 1)) {
      dias.push(f);
      let e = null, v = null;
      try {
        const std = estandarDia(l, f, null, Math.max(0, avesVivas(l, regs, f)));
        if (res.carne) {
          const p = regs.filter(r => r.tipo === 'peso' && r.fecha === f).pop();
          v = p ? Number(p.datos.gramos) : null; e = std.pesoG;
        } else { v = pctPostura(l, regs, f); e = std.hdPct; }
      } catch (x) { /* día fuera de la guía */ }
      real.push(Number.isFinite(v) ? r1(v) : null); est.push(Number.isFinite(e) ? r1(e) : null);
    }
    if (!real.some(v => v !== null)) return '';
    return `<article class="tarjeta rep-grafica"><header class="tarjeta-cab"><h3 class="tarjeta-titulo">${res.carne ? 'Peso promedio (g)' : '% de postura por día'}</h3></header>${
      Grafico({ serieReal: real, serieEstandar: est, etiquetas: dias.map(ddmm) })}</article>`;
  }

  function tarjetas(s) {
    const t = (titulo, ic, cifra, unidad, pie) => `<div class="ini-celda">${Tarjeta({ titulo, icono: ic, cifra, unidad: cifra === null ? '' : unidad, pie })}</div>`;
    const m = s.mortalidad === 1 ? 'ave' : 'aves';
    return [
      t('Viabilidad', 'escudo', r1(s.viabilidad), '%', 'Aves que siguen vivas'),
      t('Mortalidad', 'cruz', s.mortalidad, m, 'En este período'),
      s.carne ? t('Peso en pie', 'balanza', r1(s.produccion), 'kg', 'Estimado: peso × aves vivas')
        : t('Huevos', 'huevo', s.produccion, 'huevos', s.cubetas === null ? 'Sin huevos registrados' : `${formatoNumero(r1(s.cubetas))} cubetas de 30`),
      s.carne ? t('Alimento', 'saco', r1(s.alimentoKg), 'kg', 'Dado en el período')
        : t('% de postura', 'grafico', r1(s.pctPostura), '%', 'Huevos ÷ aves vivas'),
      t('Conversión', 'balanza', s.conversion === null ? null : Math.round(s.conversion * 100) / 100, 'kg/kg',
        s.carne ? 'Alimento ÷ peso en pie' : 'Alimento ÷ kg de huevo'),
      t('Costo de alimento', 'saco', dinero(s.costoAlimento), '', s.costoAlimento === null ? 'Falta el precio o el alimento' : `${formatoNumero(r1(s.alimentoKg))} kg`),
      t('Ingreso', 'huevo', dinero(s.ingreso), '', s.ingreso === null ? 'Falta el precio o la producción' : s.carne ? 'Peso en pie × precio del kg' : 'Cubetas vendidas × precio'),
      t('Margen', 'grafico', dinero(s.margen), '', 'Ingreso − alimento')
    ].join('');
  }

  VISTAS.reportes = async function () {
    const lotes = await DB.listar('lotes');
    if (!lotes.length) {
      actual = null;
      return `<section class="pantalla pantalla-vacia">
  <div class="vacia-ilustracion" aria-hidden="true">${icono('grafico')}</div>
  <h1>Reportes</h1>
  <p class="pantalla-texto">Aún no tienes lotes. Crea uno y registra tus datos para ver cómo va.</p>
  ${Boton({ texto: 'Nuevo lote', icono: 'mas', variante: 'primario', accion: 'nuevo-lote', clase: 'btn-ancho btn-grande' })}
</section>`;
    }
    const orden = (a, b) => String(b.fechaLlegada || '').localeCompare(String(a.fechaLlegada || ''));
    const lista = lotes.filter(l => l.estado === 'activo').sort(orden).concat(lotes.filter(l => l.estado !== 'activo').sort(orden));
    const l = lista.find(x => x.id === loteId) || lista.find(x => x.id === App.estado.loteActivoId) || lista[0];
    loteId = l.id;
    const [regs, granja] = await Promise.all([DB.listar('registros', { loteId: l.id }), DB.obtener('granja', 'granja')]);
    const hoy = hoyLocal(), per = periodoReporte(l, periodo, hoy, regs);
    const s = resumenReporte(l, regs, per.desde, per.hasta, (granja && granja.precios) || {});
    // Lote cerrado sin registros en el período: no se muestra una viabilidad de 100 % inventada.
    const sinDatos = !regs.some(r => r.fecha >= s.desde && r.fecha <= s.hasta), cerrado = l.estado !== 'activo';
    if (cerrado && sinDatos) s.viabilidad = null;
    const g = GENETICAS.find(x => x.id === l.genetica);
    const texto = textoReporte(s, l, periodo, granja);
    actual = { texto, titulo: 'Reporte · ' + (l.nombre || 'Lote') };
    const sinPrecios = [s.costoAlimento, s.ingreso].every(v => v === null) && !(granja && granja.precios && Object.keys(granja.precios).length);
    const comp = typeof navigator.share === 'function';
    const opciones = lista.map(x => `<option value="${esc(x.id)}"${x.id === l.id ? ' selected' : ''}>${esc(x.nombre || 'Lote')}${x.estado === 'activo' ? '' : ' (cerrado)'}</option>`).join('');
    return `<section class="pantalla reportes">
  <header class="ini-cab"><h1>Reportes</h1><p class="pantalla-texto">${esc(g ? g.nombre : '')} · ${esc(ddmm(s.desde))} al ${esc(ddmm(s.hasta))}</p></header>
  ${cerrado && sinDatos && periodo !== 'ciclo' ? '<p class="rep-aviso">Este lote está cerrado: usa Ciclo</p>' : ''}
  <div class="reg-campo"><label class="reg-etiqueta" for="rep-lote">Lote</label><select class="reg-select" id="rep-lote">${opciones}</select></div>
  <div class="segmento" role="group" aria-label="Período">${PERIODOS.map(([id, t]) =>
    `<button type="button" class="segmento-btn" data-accion="rep-periodo" data-periodo="${id}" aria-pressed="${id === periodo}">${t}</button>`).join('')}</div>
  <div class="ini-rejilla rep-cifras">${tarjetas(s)}</div>
  ${sinPrecios ? `<div class="rep-aviso"><p>Escribe tus precios para ver el costo, el ingreso y el margen.</p>${Boton({ texto: 'Poner precios', icono: 'ajustes', variante: 'secundario', accion: 'ir', datos: { ruta: '#/ajustes' }, clase: 'btn-ancho' })}</div>` : ''}
  ${grafica(l, regs, s, g)}
  <div class="rep-acciones">${Boton({ texto: 'Copiar reporte', icono: 'copiar', variante: 'primario', accion: 'rep-copiar', clase: 'btn-ancho btn-grande' })}${
    comp ? Boton({ texto: 'Compartir', icono: 'sig', variante: 'secundario', accion: 'rep-compartir', clase: 'btn-ancho btn-grande' }) : ''}</div>
  <div class="rep-copia" hidden><label class="reg-etiqueta" for="rep-texto">Selecciona y copia el reporte</label><textarea class="reg-texto rep-texto" id="rep-texto" rows="8" readonly></textarea></div>
</section>`;
  };

  VISTAS.reportes.montar = function (raiz) {
    const sel = raiz.querySelector('#rep-lote');
    if (sel) sel.addEventListener('change', () => { loteId = sel.value; App.fijarLote(sel.value); App.refrescar(); });
  };

  ACCIONES['rep-periodo'] = el => { periodo = el.dataset.periodo; lsSet(K_PERIODO, periodo); App.refrescar(); };

  /* Portapapeles moderno; si no hay o se niega: textarea oculto + execCommand; si tampoco, caja visible para copiar a mano. */
  async function copiar(texto) {
    try { await navigator.clipboard.writeText(texto); return true; } catch (e) { /* respaldo */ }
    const ta = document.createElement('textarea');
    ta.value = texto; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    let ok = false;
    try { ta.focus(); ta.select(); ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  ACCIONES['rep-copiar'] = async () => {
    if (!actual) return;
    if (await copiar(actual.texto)) { App.toast('Copiado'); return; }
    const caja = document.querySelector('#view .rep-copia'), ta = document.querySelector('#rep-texto');
    if (!caja || !ta) return;
    caja.hidden = false; ta.value = actual.texto;
    ta.scrollIntoView({ block: 'center' }); ta.focus(); ta.select();
    App.toast('Copia el texto de la caja');
  };

  ACCIONES['rep-compartir'] = async () => {
    if (!actual || typeof navigator.share !== 'function') return;
    try { await navigator.share({ title: actual.titulo, text: actual.texto }); }
    catch (e) { if (!e || e.name !== 'AbortError') ACCIONES['rep-copiar'](); }
  };
})();

</script>
<script>
/* =========================================================================
   APPOLLO 2 · Shell: enrutador por hash, barra inferior, hojas, toast y arranque.
   Contrato de vistas: VISTAS.nombre = async (params) => '<html>' y, opcional,
   VISTAS.nombre.montar = (raiz, params) => {...}. Acciones de clic: ACCIONES[nombre](el, evento)
   para cualquier elemento con data-accion="nombre" (un solo oyente delegado aquí).
   ========================================================================= */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

const APP_VERSION = '2.0.0';

/* Tema: 'claro' | 'oscuro' fijan data-tema en <html>; cualquier otro valor (automático) lo quita.
   Se lee de localStorage y se aplica en seguida, antes del primer dibujo de una vista. */
const K_TEMA = 'appollo.v2.tema';
function aplicarTema(t) {
  const el = document.documentElement;
  if (t === 'claro' || t === 'oscuro') el.setAttribute('data-tema', t); else el.removeAttribute('data-tema');
}
try { aplicarTema(localStorage.getItem(K_TEMA)); } catch (e) { /* sin almacenamiento: tema automático */ }

const App = (function () {
  'use strict';
  const K_LOTE = 'appollo.v2.loteActivo';
  const $ = s => document.querySelector(s);
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } };
  const estado = { granja: null, loteActivoId: null, modo: null };
  let listo = false, turno = 0;

  /* ------------------------------ Rutas ------------------------------ */
  // Primer segmento del hash -> nombre de vista. Lo demás va en params.
  const ALIAS = { 'nuevo-lote': 'nuevoLote', lote: 'detalleLote', plan: 'planificar' };
  const NAV = { inicio: 'inicio', bienvenida: 'inicio', lotes: 'lotes', nuevoLote: 'lotes', detalleLote: 'lotes', alertas: 'alertas',
    mas: 'mas', inventario: 'mas', reportes: 'mas', ajustes: 'mas', planificar: 'mas' };
  const CONOCIDAS = ['inicio', 'lotes', 'nuevoLote', 'detalleLote', 'alertas', 'mas', 'inventario', 'reportes', 'ajustes', 'planificar'];

  function resolver(hash) {
    const partes = String(hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(p => {
      try { return decodeURIComponent(p); } catch (e) { return p; }
    });
    const seg = partes[0] || '';
    const nombre = ALIAS[seg] || seg;
    if (!nombre || !(CONOCIDAS.includes(nombre) || typeof VISTAS[nombre] === 'function')) return null;
    if (nombre === 'detalleLote' && !partes[1]) return null;
    const params = { partes: partes.slice(1) };
    if (nombre === 'detalleLote') params.id = partes[1];
    if (nombre === 'planificar') params.paso = partes[1] || 'genetica';
    return { nombre, params };
  }

  function ir(ruta) {
    cerrarHoja(true);
    const r = String(ruta || '#/inicio');
    if (location.hash === r) render({ animar: true });
    else location.hash = r;
  }

  /* --------------------- Render con captura de errores --------------------- */
  const pendiente = nombre => `<section class="pantalla"><h1>${esc(nombre)}</h1>
  <div class="proximamente">${icono('hoja')}<p>Próximamente: esta pantalla está en camino.</p></div></section>`;
  const fallo = () => `<section class="pantalla vista-error" role="alert">
  <div class="vista-error-icono">${icono('aviso')}</div>
  <h1>Algo salió mal</h1>
  <p>Esta pantalla no se pudo mostrar. Tus datos siguen guardados.</p>
  ${Boton({ texto: 'Volver al inicio', icono: 'inicio', variante: 'primario', accion: 'ir', datos: { ruta: '#/inicio' }, clase: 'btn-ancho' })}
</section>`;

  async function render({ animar } = {}) {
    if (!listo) return;
    const r = resolver(location.hash);
    if (!r) { history.replaceState(null, '', '#/inicio'); return render({ animar }); }
    // Primera vez (granja sin nombre): el Inicio es la bienvenida.
    if (r.nombre === 'inicio' && estado.granja && !estado.granja.nombre && typeof VISTAS.bienvenida === 'function') r.nombre = 'bienvenida';
    const mio = ++turno, vista = $('#view');
    marcarNav(NAV[r.nombre] || null);
    let html, montar = null;
    try {
      const fn = VISTAS[r.nombre];
      html = typeof fn === 'function' ? await fn(r.params) : pendiente(r.nombre.charAt(0).toUpperCase() + r.nombre.slice(1));
      if (typeof html !== 'string') throw new Error('La vista ' + r.nombre + ' no devolvió HTML');
      montar = typeof fn === 'function' && typeof fn.montar === 'function' ? fn.montar : null;
    } catch (e) {
      if (mio !== turno) return;
      console.warn('Error de vista', r.nombre, e);
      html = fallo();
    }
    if (mio !== turno) return; // llegó otra navegación mientras esperábamos
    vista.innerHTML = `<div class="vista-raiz${animar && !reducirMovimiento() ? ' pantalla-entra' : ''}">${html}</div>`;
    if (montar) {
      try { await montar(vista.firstElementChild, r.params); } catch (e) {
        if (mio !== turno) return;
        console.warn('Error al montar la vista', r.nombre, e);
        vista.innerHTML = `<div class="vista-raiz">${fallo()}</div>`;
      }
    }
    if (animar) {
      window.scrollTo(0, 0);
      try { vista.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
    }
  }

  function marcarNav(clave) {
    document.querySelectorAll('#nav [data-nav]').forEach(a => {
      if (a.dataset.nav === clave) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }

  /* Vuelve a dibujar la pantalla actual (sin transición) y recalcula las alertas. */
  function refrescar() {
    actualizarAlertas();
    return render({ animar: false });
  }

  /* Cuenta de alertas en la barra: rojas y ámbar (las informativas no suman). */
  async function actualizarAlertas() {
    const ins = $('#nav-insignia');
    if (!ins || typeof generarAlertas !== 'function') return 0;
    let n = 0;
    try {
      const datos = {};
      for (const s of DB.STORES) datos[s] = await DB.listar(s);
      datos.granja = estado.granja;
      n = generarAlertas(datos, new Date()).filter(a => a.gravedad !== 'info').length;
    } catch (e) { n = 0; }
    ins.hidden = !n;
    ins.innerHTML = n ? `${n > 99 ? '99+' : n}<span class="solo-lector"> pendientes</span>` : '';
    return n;
  }

  /* ------------------------------ Lote activo ------------------------------ */
  function fijarLote(id) {
    estado.loteActivoId = id || null;
    lsSet(K_LOTE, id || null);
  }

  /* ------------------------------ Hojas ------------------------------ */
  let hoja = null; // {capa, previo}
  function abrirHoja({ titulo, contenido }) {
    cerrarHoja(true);
    const caja = $('#capas');
    caja.innerHTML = Hoja({ titulo, contenido });
    const capa = caja.firstElementChild, sec = capa.querySelector('.hoja');
    sec.setAttribute('tabindex', '-1');
    hoja = { capa, previo: document.activeElement };
    ['#view', '#nav', '#franjas'].forEach(s => { const el = $(s); if (el) el.inert = true; });
    try { sec.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
    return capa;
  }
  function cerrarHoja(inmediato) {
    if (!hoja) return;
    const { capa, previo } = hoja;
    hoja = null;
    ['#view', '#nav', '#franjas'].forEach(s => { const el = $(s); if (el) el.inert = false; });
    const quitar = () => { capa.remove(); };
    if (inmediato || reducirMovimiento()) quitar();
    else { capa.classList.add('cerrando'); setTimeout(quitar, 220); }
    if (previo && document.contains(previo) && typeof previo.focus === 'function') {
      try { previo.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
    }
  }
  const hojaAbierta = () => (hoja ? hoja.capa : null);

  /* ------------------------------ Toast ------------------------------ */
  let toastT = 0;
  function toast(msg, opciones) {
    const t = $('#toast'), deshacer = opciones && typeof opciones.deshacer === 'function' ? opciones.deshacer : null;
    const ms = deshacer ? 5000 : 2600;
    clearTimeout(toastT);
    t.innerHTML = `<span class="toast-texto">${esc(msg)}</span>` +
      (deshacer ? Boton({ texto: 'Deshacer', variante: 'secundario', accion: 'deshacer' }) : '') +
      (deshacer && !reducirMovimiento() ? `<span class="toast-tiempo" aria-hidden="true" style="animation-duration:${ms}ms"></span>` : '');
    t.hidden = false;
    t._deshacer = deshacer;
    toastT = setTimeout(ocultarToast, ms);
  }
  function ocultarToast() { const t = $('#toast'); clearTimeout(toastT); t.hidden = true; t.innerHTML = ''; t._deshacer = null; }

  ACCIONES.deshacer = async () => {
    const fn = $('#toast')._deshacer;
    ocultarToast();
    if (!fn) return;
    try { await fn(); toast('Se deshizo el cambio'); } catch (e) { toast('No se pudo deshacer'); }
    refrescar();
  };
  ACCIONES.ir = el => ir(el.dataset.ruta || '#/inicio');
  ACCIONES['nuevo-lote'] = () => ir('#/nuevo-lote');
  ACCIONES['cerrar-hoja'] = () => cerrarHoja();
  ACCIONES['contador-mas'] = el => ajustarContador(el.dataset.para, 1);
  ACCIONES['contador-menos'] = el => ajustarContador(el.dataset.para, -1);
  ACCIONES.registrar = () => { if (typeof Registrar !== 'undefined') Registrar.abrir(); };

  /* ------------------------------ Franjas ------------------------------ */
  function franjaRed() { const f = $('#franja-offline'); if (f) f.hidden = navigator.onLine !== false; }

  /* ------------------------------ Arranque ------------------------------ */
  async function arrancar() {
    // Se mira antes de cualquier espera: solo se migra si ya había datos de la v1.
    const legado = lsGet('appollo.v1.lotes') !== null;
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-accion]');
      if (!el || el.disabled) return;
      const fn = ACCIONES[el.dataset.accion];
      if (typeof fn === 'function') { e.preventDefault(); fn(el, e); }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && hoja) { e.preventDefault(); cerrarHoja(); } });
    window.addEventListener('hashchange', () => { cerrarHoja(true); render({ animar: true }); });
    window.addEventListener('online', franjaRed);
    window.addEventListener('offline', franjaRed);
    franjaRed();

    try { estado.modo = (await DB.abrir()).modo; } catch (e) { estado.modo = 'memoria'; }
    if (estado.modo === 'memoria') $('#franja-memoria').hidden = false;
    if (legado) { try { await DB.migrarLS(); } catch (e) { /* la app sigue sin migrar */ } }
    try {
      estado.granja = await DB.obtener('granja', 'granja') ||
        await DB.guardar('granja', { id: 'granja', nombre: '', tipo: '', altitud: null, tema: 'auto', creado: new Date().toISOString() });
    } catch (e) { estado.granja = { id: 'granja', nombre: '', tipo: '', altitud: null, tema: 'auto' }; }
    try {
      const activos = await DB.listar('lotes', { estado: 'activo' });
      const rec = lsGet(K_LOTE);
      estado.loteActivoId = activos.some(l => l.id === rec) ? rec : activos.length === 1 ? activos[0].id : null;
    } catch (e) { estado.loteActivoId = null; }

    listo = true;
    if (!resolver(location.hash)) history.replaceState(null, '', '#/inicio');
    await render({ animar: true });
    actualizarAlertas();
  }

  return { ir, estado, refrescar, toast, actualizarAlertas, abrirHoja, cerrarHoja, hojaAbierta, fijarLote, arrancar };
})();

App.arrancar();

</script>
