<style>
/* Appollo 2 · Sistema visual
   Campo andino: papel crema, verde de potrero, tierra, yema de huevo y cielo.
   Todo par de texto/fondo cumple WCAG >= 7:1 (claro y oscuro). Los tonos "-viva" son
   solo decoración (franjas, puntos, líneas) y nunca llevan texto encima salvo --huevo. */

/* ---------- Tipografía (las @font-face las inserta build.py) ---------- */
:root {
  --f-texto: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-titulo: "Zilla Slab", "Roboto Slab", Rockwell, Georgia, serif;
  --dur: 220ms;
  --curva: cubic-bezier(.2, .7, .2, 1);
  --rebote: cubic-bezier(.34, 1.4, .5, 1);
  --r-s: 12px;
  --r: 18px;
  --r-l: 26px;
}

/* ---------- Tema claro (por defecto) ---------- */
:root, [data-tema="claro"] {
  --fondo: #F6F1E7;
  --superficie: #FFFDF8;
  --superficie-2: #EFE6D6;
  --linea: #E2D6C2;
  --linea-fuerte: #CDBDA4;
  --texto: #2B2118;
  --secundario: #5D4E3F;      /* spec #6B5A48 -> 7:1 sobre fondo */
  --primario: #285A31;        /* spec #2F6B3A -> 7:1 con texto crema encima */
  --primario-suave: #E3ECDC;
  --sobre-primario: #FFFDF8;
  --huevo: #E8A317;
  --huevo-suave: #FBEBC4;
  --sobre-huevo: #2B2118;
  --cielo: #4A90B8;
  --alerta: #902F23;          /* spec #B23A2B -> 7:1 */
  --sobre-alerta: #FFFDF8;
  --precaucion: #724708;      /* spec #C77C0E -> 7:1 como texto */
  --ok: #285A31;
  --alerta-viva: #B23A2B;
  --precaucion-viva: #C77C0E;
  --ok-viva: #3D8A4A;
  --velo: rgba(43, 33, 24, .52);
  --sombra: 0 1px 0 rgba(93, 78, 63, .08), 0 8px 22px -12px rgba(93, 78, 63, .35);
  --sombra-alta: 0 -10px 40px -10px rgba(43, 33, 24, .35);
  --brillo-esq: rgba(255, 253, 248, .75);
  color-scheme: light;
}

/* ---------- Tema oscuro: noche en el galpón (verde muy oscuro, tierra, texto crema) ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --fondo: #121A14; --superficie: #1B241D; --superficie-2: #26322A; --linea: #2F3B31; --linea-fuerte: #46553F;
    --texto: #F3EBDD; --secundario: #BFB09E; --primario: #7CC88A; --primario-suave: #203327; --sobre-primario: #0F1A11;
    --huevo: #E8A317; --huevo-suave: #3A2E14; --sobre-huevo: #1A140D; --cielo: #6FAAD0;
    --alerta: #EBA197; --sobre-alerta: #1F0E0B; --precaucion: #F0A53A; --ok: #7CC88A;
    --alerta-viva: #E0705F; --precaucion-viva: #E8A33A; --ok-viva: #5FAE6E;
    --velo: rgba(5, 9, 6, .66); --sombra: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 24px -14px rgba(0, 0, 0, .8);
    --sombra-alta: 0 -10px 40px -10px rgba(0, 0, 0, .7); --brillo-esq: rgba(243, 235, 221, .07);
    color-scheme: dark;
  }
}
[data-tema="oscuro"] {
  --fondo: #121A14; --superficie: #1B241D; --superficie-2: #26322A; --linea: #2F3B31; --linea-fuerte: #46553F;
  --texto: #F3EBDD; --secundario: #BFB09E; --primario: #7CC88A; --primario-suave: #203327; --sobre-primario: #0F1A11;

<script>
/* =========================================================================

   ========================================================================= */

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function interp(xs, ys, x) {
  const n = xs.length;
  if (x <= xs[0]) return ys[0];
  if (x >= xs[n - 1]) {
    const s = (ys[n - 1] - ys[n - 2]) / (xs[n - 1] - xs[n - 2]);
    return ys[n - 1] + s * (x - xs[n - 1]) * 0.85;
  }
  for (let i = 1; i < n; i++) {
    if (x <= xs[i]) {
      const t = (x - xs[i - 1]) / (xs[i] - xs[i - 1]);
      return ys[i - 1] + t * (ys[i] - ys[i - 1]);
    }
  }
  return ys[n - 1];
}

const modoDe = (g, obj) => g.tipo === 'postura' ? 'huevos' : g.tipo === 'carne' ? 'carne' : (obj || 'huevos');
const esBroiler = g => g.id === 'cobb500' || g.id === 'ross308';

/* ------------------------------ Curvas ------------------------------ */
function hdStd(p, w, shift = 0) {
  const L = 1 / (1 + Math.exp(-p.k * (w - (p.w50 + shift))));
  let v = p.pico * L;
  const pl = p.plat + shift;
  if (w > pl) v -= p.dec * (w - pl);
  return Math.max(0, v);
}
function ewStd(p, w, shift = 0) {
  const t = Math.max(0, w - (p.w50 + shift));
  return p.ewMax - (p.ewMax - p.ew0) * Math.exp(-p.ewc * t);
}
function consumoPostura(g, w) {
  const p = g.postura, f = g.cria.factor;
  if (w < 18) return CONSUMO_RECRIA[Math.min(17, Math.max(0, Math.floor(w)))] * f;
  const ini = 82 * f, finRampa = p.w50 + 4;
  if (w >= finRampa) return p.cons;
  return ini + (p.cons - ini) * (w - 18) / (finRampa - 18);
}
const pesoStd = (c, d) => interp(c.dias, c.peso, d);
const caStd = (c, d) => interp(c.dias, c.ca, d);
const consAcumStd = (c, d) => pesoStd(c, d) * caStd(c, d);
const consumoCarne = (c, d) => Math.max(5, consAcumStd(c, d + 1) - consAcumStd(c, d));

/* ------------------------------ Fases ------------------------------ */
function fase(g, modo, d) {

    return '8–10 aves/m² bajo techo + 1 m² de pastoreo por ave';
  }
  if (g.tipo === 'criolla' || g.tipo === 'doble') return '4–5 aves/m² bajo techo + 2–4 m² de pastoreo por ave';
  if (d < 126) return d < 42 ? '15–20 pollitas/m²' : '10–12 pollitas/m²';
  return 'Piso: 6–7 aves/m² · Jaula: según el fabricante';
}

function programaLuz(g, modo, d) {
  if (modo === 'carne') {
    if (d <= 7) return '23 h de luz y 1 h de oscuridad';
    return '18–20 h de luz con 4–6 h de oscuridad continua';
  }
  const w = d / 7, off = g.postura.w50 - 20.5;
  if (d <= 7) return '20–22 h de luz la primera semana';
  if (w < 16 + off) return 'Bajar a luz natural (≈12 h) y mantenerla constante';
  if (w < 18.5 + off) return 'Estimular con peso objetivo: subir a 13–14 h';
  return 'Subir 15–30 min por semana hasta 16 h y no reducir';
}

/* --------------------- Recomendaciones de manejo --------------------- */
function vacunasPara(g, modo) {
  if (modo === 'carne') return g.id === 'cobb500' || g.id === 'ross308' ? VACUNAS.carne : VACUNAS.campero;
  return g.tipo === 'criolla' ? VACUNAS.criolla : VACUNAS.postura;
}

function construirManejo(st) {
  const g = st.g, modo = st.modo, d = st.dias, alt = st.alt, aves = st.aves;
  const ph = fase(g, modo, d);
  const w = d / 7;
  const enPostura = modo === 'huevos' && w >= g.postura.w50 - 2;
  const joven = d <= 42;
  const cats = [];

  /* Alimentación */
  const esp = especAlimento(g, modo, ph);
  const cons = consumoDia(g, modo, d);
  const filasA = [['Alimento', esp.nombre], ['Proteína cruda', esp.pc], ['Energía metabolizable', esp.em + ' kcal/kg']];
  if (esp.ca) filasA.push(['Calcio', esp.ca]);
  filasA.push(['Presentación', esp.pres]);
  filasA.push(['Consumo estimado', fmt(cons, 0) + ' g/ave/día'], ['Tu lote', fmt(cons * aves / 1000, 1) + ' kg/día']);
  const itemsA = [
    { id: 'a_fase', n: `Dar balanceado de ${esp.nombre.toLowerCase()}`, det: 'Cambiar de alimento según la fase y no mezclar fórmulas de otras especies.', prod: 12, mort: 0.5, clave: true },
    { id: 'a_racion', n: 'Ración según tabla y comederos suficientes', det: modo === 'carne' ? 'Comederos de tolva: 1 cada 30–40 aves. Revisar que nunca se vacíen.' : 'Ofrecer la ración diaria de la tabla; 1 comedero de tolva cada 25–30 aves.', prod: 4, mort: 0 }
  ];
  if (enPostura) itemsA.push({ id: 'a_conchilla', n: 'Conchilla o carbonato grueso en la tarde', det: '2–4 g por ave al final del día para una cáscara firme.', prod: 3, mort: 0 });
  if (g.tipo === 'criolla' || g.tipo === 'doble' || g.id === 'campero') itemsA.push({ id: 'a_pastoreo', n: 'Pastoreo y forraje verde como complemento', det: 'Alfalfa, hojas de leguminosas o pasto tierno. El balanceado debe seguir siendo la base.', prod: 2, mort: 0 });
  if (g.tipo === 'criolla' || g.tipo === 'doble') itemsA.push({ id: 'a_grano', n: 'Limitar maíz y desperdicios a un tercio de la ración', det: 'El maíz solo aporta energía; en exceso baja la postura y engorda a la gallina.', prod: 4, mort: 0 });
  cats.push({ id: 'alim', n: 'Alimentación', icono: 'grano', filas: filasA, items: itemsA });

  /* Temperatura y ambiente */
  const [tmin, tmax] = tempRango(g, modo, d);
  const filasT = [['Temperatura a la altura de las aves', `${tmin}–${tmax} °C`], ['Programa de luz', programaLuz(g, modo, d)], ['Densidad', densidad(g, modo, d, alt)]];
  const notasT = ['Si se amontonan bajo la criadora tienen frío; si se alejan, abren las alas y jadean, tienen calor.'];
  if (alt >= 2000) notasT.push('Sobre los 2.000 m las noches bajan de 10 °C: cierra cortinas al atardecer y mantén la criadora encendida de noche en las primeras semanas.');
  const itemsT = [
    { id: 't_rango', n: `Mantener ${tmin}–${tmax} °C`, det: joven ? 'Criadora o campana, cortinas y termómetro a la altura de las aves.' : 'Manejo de cortinas según la hora del día.', prod: 6, mort: joven ? 3 : 1, clave: true },
    { id: 't_vent', n: 'Ventilación mínima y amoníaco bajo', det: 'Si el olor pica los ojos, el amoníaco pasa de 20 ppm: ventila aunque haga frío.', prod: 3, mort: 1 },
    { id: 't_luz', n: 'Cumplir el programa de luz', det: programaLuz(g, modo, d) + '.', prod: modo === 'huevos' ? (w >= 15 ? 6 : 2) : 1, mort: modo === 'carne' ? 0.5 : 0 }
  ];
  if (modo === 'carne' && esBroiler(g) && alt >= 2000) itemsT.push({ id: 't_asc', n: 'Programa contra ascitis por altura', det: 'Restricción de alimento entre los días 7 y 21 (8–10 h sin comida), alimento en harina y buena ventilación.', prod: 0, mort: 0, especial: 'ascitis' });
  cats.push({ id: 'temp', n: 'Temperatura y ambiente', icono: 'termo', filas: filasT, notas: notasT, items: itemsT });

  /* Humedad */
  const [hmin, hmax] = humedadRango(modo, d);
  cats.push({
    id: 'hum', n: 'Humedad', icono: 'gota', filas: [['Humedad relativa', `${hmin}–${hmax} %`], ['Cama', 'Viruta o cascarilla de arroz, 8–10 cm, seca y suelta']],
    notas: ['Prueba del puño: aprieta un poco de cama; si queda hecha bola, está muy húmeda.'],
    items: [
      { id: 'h_rango', n: `Mantener la humedad entre ${hmin} y ${hmax} %`, det: hmin >= 60 ? 'Los primeros días el aire seco deshidrata al pollito: humedecer el piso alrededor si hace falta.' : 'Evitar goteras y derrames de bebederos.', prod: 2, mort: 0.5 },
      { id: 'h_cama', n: 'Cama seca y suelta', det: 'Retirar las zonas apelmazadas cada semana y voltear la cama.', prod: 2, mort: 1 }
    ]
  });

  /* Agua */
  const ratio = modo === 'carne' ? 1.75 : 2.0;
  const agua = cons * ratio * (d <= 3 ? 1.2 : 1);
  cats.push({
    id: 'agua', n: 'Agua', icono: 'vaso',
    filas: [['Consumo a 21 °C', fmt(agua, 0) + ' ml/ave/día'], ['Tu lote', fmt(agua * aves / 1000, 0) + ' L/día'], ['Calidad', 'pH 6–8 · cloro libre 1–3 ppm'], ['Bebederos', modo === 'carne' ? '1 niple cada 10–12 aves o 1 de campana cada 80' : '1 niple cada 8–10 aves o 1 de campana cada 50']],
    notas: ['Por cada grado sobre 21 °C, el consumo de agua sube cerca de 6 %. Una caída brusca del consumo suele ser la primera señal de enfermedad.'],
    items: [
      { id: 'w_lib', n: 'Agua limpia y fresca a voluntad', det: 'Nunca dejar las aves sin agua; revisar mañana y tarde.', prod: 10, mort: 2, clave: true },
      { id: 'w_clor', n: 'Clorar o potabilizar el agua', det: 'Cloro libre de 1–3 ppm en el bebedero. Suspender 24 h antes y después de vacunar por el agua.', prod: 2, mort: 1 },
      { id: 'w_limp', n: 'Lavar bebederos a diario y ajustar la altura', det: 'El borde del bebedero a la altura del lomo del ave.', prod: 1, mort: 0.5 }
    ]
  });

  /* Vitaminas */
  const filasV = [];
  const itemsV = [];
  if (d <= 7) {
    filasV.push(['Llegada', 'Vitaminas A, D3, E + complejo B y electrolitos 3–5 días']);
    itemsV.push({ id: 'v_llegada', n: 'Vitaminas y electrolitos los primeros días', det: 'Del día 1 al 5 en el agua, según la etiqueta.', prod: 2, mort: 1 });
  }
  filasV.push(['Vacunaciones y cambios', 'Multivitamínico 2 días antes y 3 después']);
  itemsV.push({ id: 'v_estres', n: 'Vitaminas en vacunaciones, traslados y cambios de alimento', det: 'Reduce la caída de consumo por estrés.', prod: 2, mort: 0.5 });
  filasV.push(['Calor', 'Vitamina C y electrolitos en días calurosos']);
  if (modo === 'huevos' && w >= 14 && w < g.postura.w50 + 1) {
    filasV.push(['Prepostura', 'Vitamina AD3E 3 días + calcio de prepostura']);
    itemsV.push({ id: 'v_pre', n: 'Vitamina AD3E en la prepostura', det: 'Ayuda a formar el hueso medular que aporta calcio a la cáscara.', prod: 2, mort: 0 });
  }
  if (modo === 'carne' && esBroiler(g) && alt >= 2000) {
    itemsV.push({ id: 'v_alt', n: 'Vitaminas C y E en zonas altas', det: 'Apoyo antioxidante contra la ascitis, 3 días por semana desde el día 10.', prod: 1, mort: 1 });
  }
  cats.push({ id: 'vit', n: 'Vitaminas', icono: 'capsula', filas: filasV, notas: ['El balanceado comercial ya trae vitaminas y minerales. En el agua solo se dan en momentos de estrés.'], items: itemsV });

  /* Vacunas */
  const vac = vacunasPara(g, modo);
  const dFin = st.dFin;
  const itemsVac = vac.filter(v => v.d <= dFin || (v.repite && dFin >= v.d)).map(v => {
    let estado = 'proxima';
    if (v.repite && d >= v.d) estado = 'vigente';
    else if (v.d < d - 3) estado = 'pasada';
    else if (v.d <= d + 7) estado = 'ahora';
    return { id: v.id, n: v.n, det: v.via, edad: v.d, estado, prod: v.w * 1.2, mort: v.w * 1.6, vacuna: true };
  });
  cats.push({ id: 'vac', n: 'Vacunas', icono: 'jeringa', items: itemsVac, notas: ['Calendario de referencia. Ajústalo con tu médico veterinario según las enfermedades de tu zona. La vacuna contra influenza aviar solo se aplica dentro de los programas de Agrocalidad.'] });

  /* Control sanitario */
  const itemsS = [
    { id: 's_bio', n: 'Bioseguridad', det: 'Pediluvio con desinfectante, ropa y botas solo para el galpón, sin visitas ni aves de otros lugares.', prod: 3, mort: 2, clave: true },
    { id: 's_limp', n: d <= 7 ? 'Limpieza, desinfección y vacío sanitario' : 'Retirar la mortalidad a diario', det: d <= 7 ? 'Lavar, desinfectar y dejar el galpón vacío 15–21 días antes de recibir el lote.' : 'Enterrar o compostar las aves muertas lejos del galpón.', prod: 2, mort: 1 },
    { id: 's_roed', n: 'Control de roedores, moscas y aves silvestres', det: 'Mallas en ventanas, cebos en estaciones cerradas y alimento tapado.', prod: 1, mort: 1 },
    { id: 's_reg', n: 'Registro diario', det: modo === 'huevos' && enPostura ? 'Huevos recogidos, alimento, agua y mortalidad del día.' : 'Alimento, agua, mortalidad y peso semanal de 1 de cada 20 aves.', prod: 2, mort: 0 }
  ];
  if (modo === 'huevos' && d >= 42) itemsS.push({ id: 's_desp', n: 'Desparasitación programada', det: 'A las 8 y 16 semanas y luego cada 3–4 meses en aves de piso o pastoreo.', prod: 3, mort: 0.5 });
  if (modo === 'carne' && !esBroiler(g) && d >= 28) itemsS.push({ id: 's_desp', n: 'Desparasitación al salir a pastoreo', det: 'Una dosis al iniciar el pastoreo y otra a los 2 meses.', prod: 3, mort: 0.5 });
  if (d < 126 || modo === 'carne') itemsS.push({ id: 's_peso', n: 'Pesaje semanal y uniformidad', det: 'Pesar 1 de cada 20 aves; meta de uniformidad sobre 80 %.', prod: 2, mort: 0 });
  cats.push({ id: 'san', n: 'Control sanitario', icono: 'escudo', items: itemsS });

  /* Sanidad actual: remedios caseros y control químico */
  const enfDisp = ENFERMEDADES.filter(e => e.modos.includes(modo));
  cats.push({ id: 'casero', n: 'Remedios caseros', icono: 'hoja', sanidad: true, enfermedades: enfDisp });
  cats.push({ id: 'quim', n: 'Control químico', icono: 'matraz', sanidad: true, enfermedades: enfDisp });

  return { fase: ph, cats };
}

/* ----------------------- Factores de manejo ----------------------- */
function factores(st, manejo, sel) {
  const g = st.g, modo = st.modo;
  let f = 1, mortExtra = 0, pesoTot = 0, pesoCub = 0;
  const faltan = [];
  for (const c of manejo.cats) {
    if (!c.items) continue;
    for (const it of c.items) {
      if (it.especial) continue;
      const peso = it.prod + 1.5 * it.mort;
      pesoTot += peso;
      if (sel.has(it.id)) { pesoCub += peso; continue; }
      f *= 1 - it.prod / 100;
      mortExtra += it.mort;
      faltan.push({ id: it.id, n: it.n, cat: c.n });
    }
  }
  // Problema sanitario
  const enf = ENFERMEDADES.find(e => e.id === st.enf);
  let mit = 0;
  if (enf) {
    let resto = 1;
    for (const t of [...enf.caseros, ...enf.quimicos]) if (sel.has(t.id)) resto *= 1 - t.mit;
    mit = Math.min(0.9, 1 - resto);
    f *= 1 - enf.prod * (1 - mit) / 100;
    mortExtra += enf.mort * (1 - mit);
    const peso = enf.prod + 1.5 * enf.mort;
    pesoTot += peso; pesoCub += peso * mit;
  } else {
    let bono = 0;
    for (const p of PREVENTIVOS_CASEROS) if (sel.has(p.id)) bono += p.prod;
    f *= 1 + Math.min(1, bono) / 100;
  }
  // Altitud
  let altPeso = 0, altMort = 0;
  if (modo === 'carne' && st.alt > 1500) {
    const broiler = esBroiler(g);
    altPeso = (st.alt - 1500) / 1000 * (broiler ? 6 : 2);
    altMort = st.alt > 2000 ? (st.alt - 2000) / 1000 * (broiler ? 6 : 1.5) : 0;
    if (sel.has('t_asc')) { altMort *= 0.4; altPeso += 1; }
  } else if (modo === 'huevos' && st.alt > 2000) {
    altPeso = (st.alt - 2000) / 1000 * 1.5;
  }
  f *= 1 - altPeso / 100;
  mortExtra += altMort;
  f = clamp(f, 0.3, 1.02);
  // Retraso del inicio de postura por mala recría
  let shift = 0;
  if (modo === 'huevos' && st.dias / 7 < g.postura.w50 - 2) shift = (1 - f) * 5;
  const indice = pesoTot ? Math.round(100 * pesoCub / pesoTot) : 100;
  return { f, mortExtra, shift, indice, enf, mit, altPeso, altMort, faltan };
}

/* ---------------------------- Simulaciones ---------------------------- */
function simHuevos(st, F) {
  const g = st.g, p = g.postura;
  const fObj = F.f * (g.campo || 1);
  const d0 = st.dias, dFin = st.dFin;
  const w0 = d0 / 7;
  let f0 = fObj;
  const std0 = hdStd(p, w0, F.shift);
  if (st.real != null && std0 > 10) f0 = clamp(st.real / std0, 0.1, 1.15);
  const dias = Math.max(1, dFin - d0);
  const extraDia = (F.mortExtra / 100) * Math.min(1, dias / 300) / dias;
  let vivas = st.aves, huevos = 0, masa = 0, alimento = 0, alimRecria = 0;
  let pico = 0, wPico = 0, w50 = null;
  const serie = [];
  for (let d = d0; d < dFin; d++) {
    const w = (d + 0.5) / 7, t = d - d0;
    const fh = fObj + (f0 - fObj) * Math.exp(-t / 28);
    const hd = hdStd(p, w, F.shift) * fh;
    if (hd > pico) { pico = hd; wPico = w; }
    if (w50 === null && hd >= 50) w50 = w;
    const e = vivas * hd / 100;
    huevos += e;
    masa += e * ewStd(p, w, F.shift) * (1 - (1 - fh) * 0.25);
    const kg = vivas * consumoPostura(g, w) * (0.97 + 0.03 * fh) / 1000;
    alimento += kg;
    if (w < 18) alimRecria += kg;
    const mBase = d < 126 ? (1 - g.cria.viab / 100) / 126 : p.m / 7;
    vivas *= 1 - mBase - extraDia;
    if ((d - d0) % 7 === 0) serie.push({ w: d / 7, hd });
  }
  const est = [];
  for (let w = Math.max(16, Math.floor(w0) - 2); w <= dFin / 7; w++) est.push({ w, hd: hdStd(p, w) });
  const hdHoy = hdStd(p, w0 + 0.5 / 7, F.shift) * f0;
  return {
    tipo: 'huevos', huevos, huevosAve: huevos / st.aves, masaKg: masa / 1000, alimento, alimRecria,
    pesoHuevo: huevos ? masa / huevos : 0, conversion: masa ? (alimento - alimRecria) / (masa / 1000) : 0,
    kgDocena: huevos ? (alimento - alimRecria) / (huevos / 12) : 0, cubetas: huevos / 30,
    vivasFin: vivas, viab: 100 * vivas / st.aves, pico, wPico, w50, hdHoy, serie, est
  };
}

function simCarne(st, F) {
  const g = st.g, c = g.carne;
  const fObj = F.f * (g.campo || 1);
  const d0 = st.dias, dFin = st.dFin;
  const fPasado = 1 - (1 - fObj) * Math.min(1, d0 / 14);
  let peso = st.real != null && st.real > 0 ? st.real : pesoStd(c, d0) * fPasado;
  const peso0 = peso;
  const dias = Math.max(1, dFin - d0);
  const mBaseDia = c.mortBase / 100 / c.ciclo;
  const extraDia = (F.mortExtra / 100) * Math.min(1, dias / c.ciclo) / dias;
  let vivas = st.aves, alimento = 0, avesDia = 0;
  const desperdicio = 1 + (1 - F.f) * 0.35;
  const serie = [{ d: d0, p: peso }];
  for (let d = d0; d < dFin; d++) {
    const ratio = peso / pesoStd(c, d);
    const gan = (pesoStd(c, d + 1) - pesoStd(c, d)) * fObj * Math.pow(clamp(ratio, 0.4, 1.3), 0.3);
    alimento += vivas * consumoCarne(c, d) * Math.pow(clamp(ratio, 0.4, 1.3), 0.75) * desperdicio / 1000;
    avesDia += vivas;
    peso += gan;
    vivas *= 1 - mBaseDia - extraDia;
    serie.push({ d: d + 1, p: peso });
  }
  const avesProm = avesDia / dias;
  const alimAve = alimento / avesProm;
  const previo = consAcumStd(c, d0) * Math.pow(clamp(peso0 / pesoStd(c, d0), 0.4, 1.3), 0.75) / 1000;
  const caAcum = (previo + alimAve) / (peso / 1000);
  const caPeriodo = alimAve / Math.max(0.01, (peso - peso0) / 1000);
  const viabPrev = 1 - c.mortBase / 100 * Math.min(1, d0 / c.ciclo);
  const viab = 100 * viabPrev * vivas / st.aves;
  const kgVivo = vivas * peso / 1000;
  const iep = dFin > 0 ? (viab * (peso / 1000)) / (dFin * caAcum) * 100 : 0;
  const est = [];
  const dMax = Math.max(dFin, c.venta);
  for (let d = 0; d <= dMax; d += 1) est.push({ d, p: pesoStd(c, d) });
  return {
    tipo: 'carne', pesoFin: peso, pesoStdFin: pesoStd(c, dFin), peso0, kgVivo, kgCanal: kgVivo * c.rend / 100,
    alimento, caAcum, caPeriodo, vivasFin: vivas, viab, iep, serie, est
  };
}

function proyectar(st, manejo, sel) {
  const F = factores(st, manejo, sel);
  const r = st.modo === 'huevos' ? simHuevos(st, F) : simCarne(st, F);
  r.F = F;
  return r;
}

/* Cuánto gana el lote si agrega cada práctica que falta */
function brechas(st, manejo, sel, base) {
  const out = [];
  const valor = r => r.tipo === 'huevos' ? r.huevos : r.kgVivo;
  const v0 = valor(base);
  for (const fz of base.F.faltan) {
    const s2 = new Set(sel); s2.add(fz.id);
    const v = valor(proyectar(st, manejo, s2));
    if (v - v0 > 0.0005 * Math.max(1, v0)) out.push({ ...fz, gana: v - v0 });
  }
  return out.sort((a, b) => b.gana - a.gana);
}

/* ------------------------------ Formato ------------------------------ */
function fmt(x, dec = 0) {
  if (!isFinite(x)) return '—';
  return x.toLocaleString('es-EC', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

if (typeof module !== 'undefined') module.exports = { hdStd, ewStd, consumoPostura, pesoStd, caStd, construirManejo, factores, proyectar, brechas, simHuevos, simCarne, modoDe, fase, fmt };

</script>
<script>
/* =========================================================================
   APPOLLO · Cálculos puros de lote (sin DOM, sin almacenamiento)
   Fechas: cadenas locales 'YYYY-MM-DD'. Nunca se usa toISOString().
   ========================================================================= */

function fechaADate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function hoyLocal(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/* Edad en días = edad al llegar + días enteros transcurridos desde la llegada. */
function edadDias(lote, fecha) {
  const a = fechaADate(lote.fechaLlegada), b = fechaADate(fecha);
  // UTC solo para contar días enteros sin que el cambio de hora afecte el resultado
  const dias = Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) -
    Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
  return lote.edadLlegadaDias + dias;
}

const _genDe = lote => GENETICAS.find(g => g.id === lote.genetica);
const _esCarne = g => modoDe(g) === 'carne';
const _delLote = (lote, registros, tipo) =>
  registros.filter(r => r.loteId === lote.id && r.tipo === tipo);
const _suma = (rs, campo) => rs.reduce((s, r) => s + (Number(r.datos && r.datos[campo]) || 0), 0);

function mortalidadTotal(lote, registros, fecha) {
  return _suma(_delLote(lote, registros, 'mortalidad').filter(r => r.fecha <= fecha), 'cantidad');
}

function avesVivas(lote, registros, fecha) {
  return lote.avesInicio - mortalidadTotal(lote, registros, fecha);
}

function mortalidadPct(lote, registros, fecha) {
  if (!(lote.avesInicio > 0)) return null;
  return 100 * mortalidadTotal(lote, registros, fecha) / lote.avesInicio;
}

function viabilidad(lote, registros, fecha) {
  const m = mortalidadPct(lote, registros, fecha);
  return m === null ? null : 100 - m;
}

/* Valores de referencia del día para `aves` aves (por defecto avesInicio).
   `altitud` se acepta por compatibilidad de firma; el estándar de guía no la usa. */
function estandarDia(lote, fecha, altitud, aves) {
  const g = _genDe(lote), d = edadDias(lote, fecha);
  const n = aves == null ? lote.avesInicio : aves;
  if (_esCarne(g)) {
    const c = g.carne;
    return {
      alimentoKg: n * consumoCarne(c, d) / 1000,
      huevos: 0, hdPct: null,
      pesoG: pesoStd(c, d),
      mortEsperada: c.mortBase / c.ciclo // % diario
    };
  }
  const p = g.postura, w = d / 7;
  const hd = hdStd(p, w);
  return {
    alimentoKg: n * consumoPostura(g, w) / 1000,
    huevos: n * hd / 100,
    hdPct: hd,
    pesoG: ewStd(p, w), // peso del huevo (g)
    mortEsperada: p.m / 7 * 100 // % diario
  };
}

function pctPostura(lote, registros, fecha) {
  const vivas = avesVivas(lote, registros, fecha);
  if (!(vivas > 0)) return null;
  const hs = _delLote(lote, registros, 'huevos').filter(r => r.fecha === fecha);
  if (!hs.length) return null;
  return 100 * _suma(hs, 'cantidad') / vivas;
}

/* Postura: kg de alimento del día / kg de huevo del día (peso de huevo de guía).
   Carne: alimento acumulado / kg vivos (último peso registrado × aves vivas). */
function conversion(lote, registros, fecha) {
  const vivas = avesVivas(lote, registros, fecha);
  if (!(vivas > 0)) return null;
  const g = _genDe(lote);
  if (_esCarne(g)) {
    const alim = _suma(_delLote(lote, registros, 'alimento').filter(r => r.fecha <= fecha), 'kg');
    const ps = _delLote(lote, registros, 'peso').filter(r => r.fecha <= fecha).sort((a, b) => a.fecha < b.fecha ? -1 : 1);
    if (!ps.length || !alim) return null;
    const kgVivo = vivas * (Number(ps[ps.length - 1].datos.gramos) || 0) / 1000;
    return kgVivo > 0 ? alim / kgVivo : null;
  }
  const alim = _suma(_delLote(lote, registros, 'alimento').filter(r => r.fecha === fecha), 'kg');
  const huevos = _suma(_delLote(lote, registros, 'huevos').filter(r => r.fecha === fecha), 'cantidad');
  const kgHuevo = huevos * ewStd(g.postura, edadDias(lote, fecha) / 7) / 1000;
  return alim > 0 && kgHuevo > 0 ? alim / kgHuevo : null;
}

/* Real ÷ estándar × 100. Postura: % postura vs HD estándar. Carne: último peso vs peso estándar. */
function rendimiento(lote, registros, fecha) {
  const g = _genDe(lote), e = estandarDia(lote, fecha);
  if (_esCarne(g)) {
    const ps = _delLote(lote, registros, 'peso').filter(r => r.fecha <= fecha).sort((a, b) => a.fecha < b.fecha ? -1 : 1);
    if (!ps.length || !(e.pesoG > 0)) return null;
    return 100 * (Number(ps[ps.length - 1].datos.gramos) || 0) / e.pesoG;
  }
  const real = pctPostura(lote, registros, fecha);
  return real === null || !(e.hdPct > 0) ? null : 100 * real / e.hdPct;
}

/* ---------------------- Validación de un registro ----------------------
   validarRegistro(tipo, datos, lote, registros, fecha) -> {ok, mensaje?, duplicado?}
   `duplicado` (con ok:true) avisa que ya existe un registro del mismo lote, tipo y día. */
const TIPOS_DIARIOS = ['alimento', 'huevos', 'mortalidad', 'peso'];

function fechaValida(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  return hoyLocal(fechaADate(s)) === s; // descarta 2026-02-30, mes 13, etc.
}

function validarRegistro(tipo, datos, lote, registros, fecha) {
  const no = mensaje => ({ ok: false, mensaje });
  const d = datos || {}, regs = registros || [];
  const entero = x => x !== '' && x !== null && x !== undefined && Number.isInteger(Number(x));
  const texto = x => typeof x === 'string' && x.trim() !== '';
  if (!lote) return no('Elige un lote');
  if (!fechaValida(fecha)) return no('La fecha no es válida');
  if (fecha > hoyLocal()) return no('La fecha no puede ser futura');
  if (fechaValida(lote.fechaLlegada) && fecha < lote.fechaLlegada)
    return no('La fecha es anterior a la llegada del lote (' + lote.fechaLlegada + ')');

  switch (tipo) {
    case 'mortalidad': {
      if (!entero(d.cantidad) || Number(d.cantidad) < 1) return no('Las aves muertas deben ser un número entero de 1 o más');
      const vivas = Math.max(0, avesVivas(lote, regs, fecha));
      if (Number(d.cantidad) > vivas) return no('Solo quedan ' + vivas + ' aves en el lote');
      break;
    }
    case 'alimento':
      if (!(Number.isFinite(Number(d.kg)) && Number(d.kg) > 0) || d.kg === null || d.kg === '') return no('Los kilos de alimento deben ser mayores que 0');
      break;
    case 'huevos':
      if (!entero(d.cantidad) || Number(d.cantidad) < 0) return no('Los huevos deben ser un número entero de 0 o más');
      if (d.rotos !== undefined && d.rotos !== null && d.rotos !== '') {
        if (!entero(d.rotos) || Number(d.rotos) < 0) return no('Los huevos rotos deben ser un número entero de 0 o más');
        if (Number(d.rotos) > Number(d.cantidad)) return no('Los huevos rotos no pueden ser más que los recogidos');
      }
      break;
    case 'peso':
      if (!(Number.isFinite(Number(d.gramos)) && Number(d.gramos) > 0) || d.gramos === null || d.gramos === '') return no('El peso debe ser mayor que 0 gramos');
      break;
    case 'vacuna':
      if (!texto(d.nombre)) return no('Escribe el nombre de la vacuna');
      break;
    case 'sanidad':
      if (!texto(d.enfermedad) && !texto(d.tratamiento)) return no('Escribe la enfermedad o el tratamiento');
      if (d.retiroDias !== undefined && d.retiroDias !== null && d.retiroDias !== '' &&
        (!entero(d.retiroDias) || Number(d.retiroDias) < 0)) return no('Los días de retiro deben ser un número entero de 0 o más');
      break;
    default:
      return no('Tipo de registro desconocido');
  }
  const dup = TIPOS_DIARIOS.includes(tipo) &&
    regs.some(r => r && r.loteId === lote.id && r.tipo === tipo && r.fecha === fecha);
  return dup ? { ok: true, duplicado: true } : { ok: true };
}

<script>
/* =========================================================================
   APPOLLO · Reglas de alerta (puras: sin DOM, sin almacenamiento)
   Cada regla devuelve Alerta[]; generarAlertas las compone y ordena.
   Alerta{id, tipo, gravedad:'rojo'|'ambar'|'info', loteId?, texto, accion:{etiqueta, ruta}}
   ========================================================================= */

function _sumaDias(fecha, n) {
  const d = fechaADate(fecha);
  d.setDate(d.getDate() + n);
  return hoyLocal(d);
}
const _rutaLote = l => '#/lote/' + l.id;
const _activos = lotes => lotes.filter(l => l.estado === 'activo');

function alertaVacunas(datos, hoy) {
  const out = [], manana = _sumaDias(hoy, 1);
  const activos = new Map(_activos(datos.lotes).map(l => [l.id, l]));
  for (const v of datos.vacunasPlan || []) {
    const l = activos.get(v.loteId);
    if (!l || v.fechaAplicada) continue;
    let gravedad = null, cuando = '';
    if (v.fechaPrevista < hoy) { gravedad = 'rojo'; cuando = 'vencida (' + v.fechaPrevista + ')'; }
    else if (v.fechaPrevista === hoy) { gravedad = 'ambar'; cuando = 'es hoy'; }
    else if (v.fechaPrevista === manana) { gravedad = 'ambar'; cuando = 'es mañana'; }
    if (!gravedad) continue;
    out.push({ id: 'vacuna-' + v.id, tipo: 'vacuna', gravedad, loteId: l.id,
      texto: 'Vacuna ' + v.nombre + ' · ' + l.nombre + ': ' + cuando,
      accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
  }
  return out;
}

function alertaMortalidad(datos, hoy) {
  const out = [];
  for (const l of _activos(datos.lotes)) {
    const muertes = datos.registros.filter(r => r.loteId === l.id && r.tipo === 'mortalidad' && r.fecha === hoy)
      .reduce((s, r) => s + (Number(r.datos && r.datos.cantidad) || 0), 0);
    if (!muertes) continue;
    const base = avesVivas(l, datos.registros, hoy) + muertes; // aves al empezar el día
    if (!(base > 0)) continue;
    const esp = estandarDia(l, hoy, undefined).mortEsperada;
    const pct = 100 * muertes / base;
    if (esp > 0 && pct > 2 * esp) {
      out.push({ id: 'mortalidad-' + l.id + '-' + hoy, tipo: 'mortalidad', gravedad: 'rojo', loteId: l.id,
        texto: l.nombre + ': hoy murieron ' + muertes + ' aves (' + pct.toFixed(2) + ' %), más del doble de lo esperado',
        accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
    }
  }
  return out;
}

function alertaPostura(datos, hoy) {
  const out = [];
  for (const l of _activos(datos.lotes)) {
    const prom = desde => {
      const v = [0, 1, 2].map(i => pctPostura(l, datos.registros, _sumaDias(hoy, -(desde + i)))).filter(x => x !== null);
      return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
    };
    const rec = prom(0), prev = prom(3);
    if (rec !== null && prev !== null && prev - rec > 3) {
      out.push({ id: 'postura-' + l.id + '-' + hoy, tipo: 'postura', gravedad: 'ambar', loteId: l.id,
        texto: l.nombre + ': la postura bajó ' + (prev - rec).toFixed(1) + ' puntos frente a los 3 días previos',
        accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
    }
  }
  return out;
}

function alertaInventario(datos) {
  return (datos.inventario || [])
    .filter(i => Number(i.cantidad) < Number(i.minimo))
    .map(i => ({ id: 'inventario-' + i.id, tipo: 'inventario', gravedad: 'ambar',
      texto: i.nombre + ': quedan ' + i.cantidad + ' ' + i.unidad + ' (mínimo ' + i.minimo + ')',
      accion: { etiqueta: 'Ver inventario', ruta: '#/inventario' } }));
}

function alertaRetiro(datos, hoy) {
  const out = [], activos = new Map(_activos(datos.lotes).map(l => [l.id, l]));
  for (const r of datos.registros) {
    const dias = Number(r.datos && r.datos.retiroDias) || 0;
    const l = activos.get(r.loteId);
    if (r.tipo !== 'sanidad' || dias <= 0 || !l) continue;
    const fin = _sumaDias(r.fecha, dias);
    if (hoy <= fin) {
      out.push({ id: 'retiro-' + r.id, tipo: 'retiro', gravedad: 'rojo', loteId: l.id,
        texto: 'No vendas huevos/carne hasta ' + fin + ' · ' + l.nombre,
        accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
    }
  }
  return out;
}

function alertaSinRegistro(datos, hoy, ahora) {
  if (ahora.getHours() < 18) return [];
  return _activos(datos.lotes)
    .filter(l => !datos.registros.some(r => r.loteId === l.id && r.fecha === hoy))
    .map(l => ({ id: 'sin-registro-' + l.id + '-' + hoy, tipo: 'sin-registro', gravedad: 'info', loteId: l.id,
      texto: l.nombre + ': aún no hay registros de hoy',
      accion: { etiqueta: 'Registrar', ruta: _rutaLote(l) } }));
}

/* Avisa si la fase de alimento cambia hoy o en los próximos 7 días. */
function alertaCambioAlimento(datos, hoy) {
  const out = [];
  for (const l of _activos(datos.lotes)) {
    const g = GENETICAS.find(x => x.id === l.genetica);
    if (!g) continue;
    const modo = modoDe(g), d = edadDias(l, hoy);
    for (let k = 0; k <= 7; k++) {
      const antes = fase(g, modo, d + k - 1), despues = fase(g, modo, d + k);
      if (antes.id !== despues.id) {
        const cuando = k === 0 ? 'hoy' : k === 1 ? 'mañana' : 'en ' + k + ' días';
        out.push({ id: 'fase-' + l.id + '-' + despues.id, tipo: 'fase', gravedad: 'info', loteId: l.id,
          texto: l.nombre + ': ' + cuando + ' pasa a la fase "' + despues.n + '" de alimento',
          accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
        break;
      }
    }
  }
  return out;
}

function generarAlertas(datos, ahora) {
  const hoy = hoyLocal(ahora);
  const orden = { rojo: 0, ambar: 1, info: 2 };
  return [
    ...alertaVacunas(datos, hoy), ...alertaMortalidad(datos, hoy), ...alertaPostura(datos, hoy),
    ...alertaInventario(datos), ...alertaRetiro(datos, hoy), ...alertaSinRegistro(datos, hoy, ahora),
    ...alertaCambioAlimento(datos, hoy)
  ].map((a, i) => [a, i]).sort((x, y) => orden[x[0].gravedad] - orden[y[0].gravedad] || x[1] - y[1]).map(x => x[0]);
}

<script>
/* =========================================================================
   APPOLLO · Persistencia (IndexedDB con respaldo en memoria)
   Script plano: define el global DB. Todas las operaciones devuelven Promise.
   ========================================================================= */
const DB = (function () {
  'use strict';
  const NOMBRE = 'appollo', VERSION = 1;
  const STORES = ['granja', 'lotes', 'registros', 'inventario', 'vacunasPlan'];
  const K_V1 = 'appollo.v1.lotes', K_MIGRADO = 'appollo.v2.migrado';
  let impl = null, abriendo = null;

  const nuevoId = () => {
    try { if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* sigue */ }
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
  };
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
  const copia = o => JSON.parse(JSON.stringify(o));
  const coincide = (obj, filtro) => {
    if (!filtro) return true;
    if (typeof filtro === 'function') return !!filtro(obj);
    return Object.keys(filtro).every(k => obj[k] === filtro[k]);
  };
  const exigeStore = s => { if (!STORES.includes(s)) throw new Error('Almacén desconocido: ' + s); };

  /* ---------------------------- IndexedDB ---------------------------- */
  const pedido = r => new Promise((ok, mal) => { r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error || new Error('Error de IndexedDB')); });
  const transaccion = tx => new Promise((ok, mal) => {
    tx.oncomplete = () => ok();
    tx.onerror = () => mal(tx.error || new Error('Error de IndexedDB'));
    tx.onabort = () => mal(tx.error || new Error('Transacción cancelada'));
  });

  function abrirIDB() {
    return new Promise((ok, mal) => {
      let req;
      try { req = indexedDB.open(NOMBRE, VERSION); } catch (e) { mal(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        STORES.forEach(s => {
          const st = db.createObjectStore(s, { keyPath: 'id' });
          if (s === 'registros') st.createIndex('loteId+fecha', ['loteId', 'fecha']);
          if (s === 'vacunasPlan') st.createIndex('loteId', 'loteId');
        });
      };
      req.onsuccess = () => ok(req.result);
      req.onerror = () => mal(req.error || new Error('No se pudo abrir IndexedDB'));
      req.onblocked = () => mal(new Error('IndexedDB bloqueada'));
    }).then(db => ({
      modo: 'indexeddb',
      async todos(s) { return pedido(db.transaction(s).objectStore(s).getAll()); },
      async uno(s, id) { return pedido(db.transaction(s).objectStore(s).get(id)); },
      async poner(s, o) { const tx = db.transaction(s, 'readwrite'); tx.objectStore(s).put(o); await transaccion(tx); },
      async quitar(s, id) { const tx = db.transaction(s, 'readwrite'); tx.objectStore(s).delete(id); await transaccion(tx); },
      async reemplazar(datos) {
        const tx = db.transaction(STORES, 'readwrite');
        const fin = transaccion(tx);
        try {
          STORES.forEach(s => { const st = tx.objectStore(s); st.clear(); (datos[s] || []).forEach(o => st.put(o)); });
        } catch (e) {
          try { tx.abort(); } catch (x) { /* ya cerrada */ }
          try { await fin; } catch (x) { /* abortada */ }
          throw e;
        }
        await fin;
      }
    }));
  }

  /* ----------------------------- Memoria ----------------------------- */
  function abrirMemoria() {
    const m = {};
    STORES.forEach(s => { m[s] = new Map(); });
    return {
      modo: 'memoria',
      async todos(s) { return Array.from(m[s].values()).map(copia); },
      async uno(s, id) { return m[s].has(id) ? copia(m[s].get(id)) : undefined; },
      async poner(s, o) { m[s].set(o.id, copia(o)); },
      async quitar(s, id) { m[s].delete(id); },
      async reemplazar(datos) { STORES.forEach(s => { m[s] = new Map((datos[s] || []).map(o => [o.id, copia(o)])); }); }
    };
  }

  /* ------------------------------ API ------------------------------ */
  function abrir() {
    if (impl) return Promise.resolve({ modo: impl.modo });
    if (!abriendo) {
      abriendo = (typeof indexedDB === 'undefined' || !indexedDB ? Promise.reject(new Error('Sin IndexedDB')) : abrirIDB())
        .catch(() => abrirMemoria())
        .then(i => { impl = i; return { modo: i.modo }; });
    }
    return abriendo;
  }
  const lista = async () => { await abrir(); return impl; };

  async function listar(store, filtro) {
    exigeStore(store);
    const todos = await (await lista()).todos(store);
    return filtro ? todos.filter(o => coincide(o, filtro)) : todos;
  }
  async function obtener(store, id) { exigeStore(store); return (await lista()).uno(store, id); }
  async function guardar(store, obj) {
    exigeStore(store);
    const o = Object.assign({}, obj);
    if (o.id === undefined || o.id === null || o.id === '') o.id = nuevoId();
    await (await lista()).poner(store, o);
    return o;
  }
  async function borrar(store, id) { exigeStore(store); await (await lista()).quitar(store, id); }

  async function exportar() {
    const i = await lista(), datos = {};
    for (const s of STORES) datos[s] = await i.todos(s);
    return JSON.stringify({ version: 1, exportado: new Date().toISOString(), datos });
  }

  const idValido = id => (typeof id === 'string' && id !== '') || (typeof id === 'number' && isFinite(id));

  function validar(texto) {
    let j;
    try { j = JSON.parse(texto); } catch (e) { return { error: 'El archivo no es un respaldo válido: no se pudo leer el JSON.' }; }
    if (!j || typeof j !== 'object' || Array.isArray(j)) return { error: 'El respaldo no tiene el formato esperado.' };
    if (j.version !== 1) return { error: 'Versión de respaldo no compatible (se esperaba la versión 1).' };
    if (!j.datos || typeof j.datos !== 'object' || Array.isArray(j.datos)) return { error: 'El respaldo no contiene la sección de datos.' };
    for (const k of Object.keys(j.datos)) {
      if (!STORES.includes(k)) return { error: 'El respaldo contiene datos desconocidos: ' + k + '.' };
      if (!Array.isArray(j.datos[k])) return { error: 'Los datos de "' + k + '" deben ser una lista.' };
      if (!j.datos[k].every(o => o && typeof o === 'object' && !Array.isArray(o) && idValido(o.id)))
        return { error: 'Hay registros inválidos en "' + k + '" (cada uno debe tener un id de texto o número).' };
    }
    return { datos: j.datos };
  }

  async function importar(texto) {
    const v = validar(texto);
    if (v.error) return { ok: false, error: v.error };
    try { await (await lista()).reemplazar(v.datos); } catch (e) { return { ok: false, error: 'No se pudo guardar el respaldo en este dispositivo.' }; }
    return { ok: true };
  }

  async function migrarLS() {
    await abrir();
    if (lsGet(K_MIGRADO)) return 0;
    const crudo = lsGet(K_V1);
    let viejos = [];
    try { const p = crudo ? JSON.parse(crudo) : []; viejos = Array.isArray(p) ? p : []; } catch (e) { viejos = []; }
    let n = 0;
    for (const e of viejos) {
      if (!e || typeof e !== 'object') continue;
      const est = e.estado && typeof e.estado === 'object' ? e.estado : {};
      const gid = est.gid || e.gid || e.genetica || null;
      const aves = Number(est.aves !== undefined ? est.aves : (e.avesInicio !== undefined ? e.avesInicio : e.aves));
      let gNombre = gid;
      try { const g = typeof GENETICAS !== 'undefined' && GENETICAS.find(x => x.id === gid); if (g) gNombre = g.nombre; } catch (x) { /* sin catálogo */ }
      const fecha = typeof e.fecha === 'string' ? e.fecha.slice(0, 10) : '';
      const nombre = [gNombre || 'Lote anterior', fecha].filter(Boolean).join(' · ');
      await guardar('lotes', {
        id: 'ls-' + (e.id !== undefined ? e.id : nuevoId()),
        nombre, genetica: gid, avesInicio: isFinite(aves) ? aves : 0,
        fechaLlegada: fecha || null, estado: 'cerrado', origen: 'v1', resumen: e.resumen || ''
      });
      n++;
    }
    // En modo memoria los datos no persisten: no se marca la migración para reintentarla tras recargar.
    if (impl && impl.modo === 'indexeddb') lsSet(K_MIGRADO, '1');
    return n;
  }

  return { abrir, listar, obtener, guardar, borrar, exportar, importar, migrarLS, STORES };
})();

<script>
/* Appollo · Componentes de interfaz. Cada función devuelve una cadena HTML.
   Todo texto dinámico pasa por esc(); `contenido` de Hoja es HTML ya armado por otros componentes. */

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* Número con formato local (1.234,5). Lo usa también contar() para que la cifra final coincida. */
function formatoNumero(n, decimales) {
  const v = Number(n);
  if (!Number.isFinite(v)) return '';

function Contador({ id, valor, min, max, paso, etiqueta } = {}) {

/* Suma o resta un paso al Contador `id` respetando min/max; devuelve el nuevo valor. */
function ajustarContador(id, signo) {
  const el = document.getElementById(id);
  if (!el) return null;
  const p = Number(el.step) > 0 ? Number(el.step) : 1;
  const dec = (String(p).split('.')[1] || '').length;
  let v = (Number(el.value) || 0) + (signo < 0 ? -p : p);
  if (el.min !== '' && v < Number(el.min)) v = Number(el.min);
  if (el.max !== '' && v > Number(el.max)) v = Number(el.max);

<script>
/* Appollo · Gráfico de líneas en SVG: real (verde, continua) contra estándar (cielo, discontinua).
   Tolera series vacías, de un punto, con nulos o de distinto largo sin producir NaN. */

function Grafico({ serieReal, serieEstandar, etiquetas } = {}) {
  const W = 320, H = 150, PX = 10, PY = 14;
  const lista = s => (Array.isArray(s) ? s.map(v => (v === null || v === '' || v === undefined ? NaN : Number(v))) : []);
  const real = lista(serieReal), est = lista(serieEstandar);
  const ets = Array.isArray(etiquetas) ? etiquetas : [];
  const n = Math.max(real.length, est.length, ets.length);
  const vals = real.concat(est).filter(Number.isFinite);
  const f = v => (Math.round(v * 10) / 10).toString();

  let lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 1;
  if (hi - lo < 1e-9) { const d = Math.abs(hi) * 0.1 || 1; lo -= d; hi += d; }
  const m = (hi - lo) * 0.12; lo -= m; hi += m;
  const x = i => (n <= 1 ? W / 2 : PX + (i * (W - 2 * PX)) / (n - 1));
  const y = v => PY + ((hi - v) * (H - 2 * PY)) / (hi - lo);

  // Tramos continuos de puntos válidos; un punto aislado se dibuja como círculo.
  function trazar(serie, clase, extra) {
    let d = '', puntos = '', tramo = [];
    const cerrar = () => {
      if (tramo.length === 1) puntos += `<circle class="${clase}-punto" cx="${f(x(tramo[0]))}" cy="${f(y(serie[tramo[0]]))}" r="4"/>`;
      else if (tramo.length > 1) d += tramo.map((i, k) => (k ? 'L' : 'M') + f(x(i)) + ' ' + f(y(serie[i]))).join('');
      tramo = [];
    };
    serie.forEach((v, i) => (Number.isFinite(v) ? tramo.push(i) : cerrar()));
    cerrar();
    return (d ? `<path class="${clase}" d="${d}" fill="none"${extra}/>` : '') + puntos;
  }

  const rejilla = [0.25, 0.5, 0.75].map(t => `<line class="grafico-rejilla" x1="0" x2="${W}" y1="${f(PY + t * (H - 2 * PY))}" y2="${f(PY + t * (H - 2 * PY))}"/>`).join('');
  const base = `<line class="grafico-base" x1="0" x2="${W}" y1="${H - 1}" y2="${H - 1}"/>`;
  let ult = '';
  for (let i = real.length - 1; i >= 0; i--) if (Number.isFinite(real[i])) { ult = `<circle class="grafico-ultimo" cx="${f(x(i))}" cy="${f(y(real[i]))}" r="5.5"/>`; break; }

  const hayDatos = vals.length > 0;
  const svg = `<svg class="grafico-svg" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">${rejilla}${base}${hayDatos
    ? trazar(est, 'grafico-estandar', ' stroke-dasharray="7 6"') + trazar(real, 'grafico-real', ' pathLength="1"') + ult : ''}</svg>`;

  const primera = ets.length ? ets[0] : '', ultima = ets.length > 1 ? ets[ets.length - 1] : '';
  const ejes = hayDatos && (primera !== '' || ultima !== '')
    ? `<div class="grafico-ejes"><span>${esc(primera)}</span><span>${esc(ultima)}</span></div>` : '';
  const ultimoReal = real.filter(Number.isFinite).pop();
  const resumen = hayDatos
    ? `Gráfico de ${n} ${n === 1 ? 'punto' : 'puntos'}: real${ultimoReal !== undefined ? ' último ' + formatoNumero(ultimoReal) : ''} contra estándar`
    : 'Gráfico sin datos';
  return `<figure class="grafico${hayDatos ? '' : ' grafico-vacio'}" role="img" aria-label="${esc(resumen)}">
  ${svg}${hayDatos ? '' : `<p class="grafico-aviso">Aún no hay datos para graficar</p>`}
  ${ejes}
  <figcaption class="grafico-leyenda"><span class="ley ley-real">Real</span><span class="ley ley-estandar">Estándar</span></figcaption>
</figure>`;
}

<script>
/* Appollo · Animaciones pequeñas. Con prefers-reduced-motion todo ocurre al instante. */

function reducirMovimiento() {
  try { return typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch (e) { return false; }
}

/* Cuenta desde la cifra que muestra el elemento hasta `hasta`. Devuelve una promesa. */
function contar(el, hasta, ms) {
  const fin = Number(hasta);
  if (!el || !Number.isFinite(fin)) return Promise.resolve();
  const dec = Number.isInteger(fin) ? 0 : Math.min(2, (String(fin).split('.')[1] || '').length);
  const pinta = v => { el.textContent = formatoNumero(v, dec); };
  if (el._contar) cancelAnimationFrame(el._contar);
  const desde = Number(String(el.textContent || '').replace(/[^\d,-]/g, '').replace(',', '.')) || 0;
  if (reducirMovimiento() || desde === fin || typeof requestAnimationFrame !== 'function') { pinta(fin); return Promise.resolve(); }
  const dur = ms || 700;
  return new Promise(res => {
    let t0 = null;
    const paso = t => {
      if (t0 === null) t0 = t;
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      pinta(desde + (fin - desde) * e);
      if (p < 1) el._contar = requestAnimationFrame(paso);
      else { el._contar = 0; pinta(fin); res(); }
    };
    el._contar = requestAnimationFrame(paso);
  });
}

/* Dibuja una palomita verde dentro de `el` (círculo que aparece y trazo que se dibuja). */
function palomita(el) {
  if (!el) return Promise.resolve();
  el.innerHTML = '<svg class="palomita" viewBox="0 0 52 52" aria-hidden="true" focusable="false">' +
    '<circle class="palomita-circulo" cx="26" cy="26" r="23"/>' +
    '<path class="palomita-trazo" d="M15 27.5l7.2 7.2L37.5 19" pathLength="1"/></svg>';
  if (reducirMovimiento() || typeof Element.prototype.animate !== 'function') return Promise.resolve();
  const c = el.querySelector('.palomita-circulo'), p = el.querySelector('.palomita-trazo');
  const a1 = c.animate([{ transform: 'scale(.4)', opacity: 0 }, { transform: 'scale(1.08)', opacity: 1, offset: 0.7 }, { transform: 'scale(1)', opacity: 1 }],
    { duration: 320, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' });
  const a2 = p.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
    { duration: 300, delay: 180, easing: 'cubic-bezier(.6,0,.3,1)', fill: 'backwards' });
  return Promise.all([a1.finished, a2.finished]).then(() => {}, () => {});
}

/* Vibración corta si el teléfono la permite. */
function vibrar(ms) {
  try { if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') navigator.vibrate(ms || 30); }
  catch (e) { /* sin vibración */ }
}

    if (t === 'mortalidad') {
      campos = campo('Aves muertas hoy', Contador({ id: 'reg-valor', valor: p.valor, min: 1, max: vivas >= 1 ? vivas : null, paso: 1, etiqueta: 'Aves muertas' })) +
        `<div class="reg-campo"><label class="reg-etiqueta" for="reg-causa">Causa (opcional)</label>
  <select class="reg-select" id="reg-causa"><option value="">Sin indicar</option>${CAUSAS.map(c => `<option>${c}</option>`).join('')}</select></div>`;
    } else if (t === 'alimento') {
      campos = campo('Alimento del día (kg)', Contador({ id: 'reg-valor', valor: p.valor, min: 0, paso: pasoPara(p.valor), etiqueta: 'Alimento en kilos' }), ayudaStd);
    } else if (t === 'huevos') {
      campos = campo('Huevos recogidos hoy', Contador({ id: 'reg-valor', valor: p.valor, min: 0, paso: p.valor >= 200 ? 10 : 1, etiqueta: 'Huevos recogidos' }), ayudaStd) +
        campo('Rotos o sucios', Contador({ id: 'reg-rotos', valor: 0, min: 0, paso: 1, etiqueta: 'Huevos rotos' }));
    } else if (t === 'peso') {
      campos = campo('Peso promedio por ave (g)', Contador({ id: 'reg-valor', valor: p.valor, min: 0, paso: 10, etiqueta: 'Peso promedio en gramos' }),
        p.ultimo ? 'Último peso registrado' : p.estandar ? 'Peso estándar para la edad' : 'Pesa una muestra de aves y anota el promedio');
    } else if (t === 'vacuna') {
      if (st.vacunas.length) {
        if (!st.vacunas.some(v => v.id === st.vacunaId)) st.vacunaId = st.vacunas[0].id;
        guardar = 'Marcar aplicada';
        campos = `<div class="reg-campo"><p class="reg-etiqueta">Vacuna pendiente</p><div class="reg-opciones">${st.vacunas.map(v =>
          `<button type="button" class="reg-opcion" data-accion="reg-vacuna" data-id="${esc(v.id)}" aria-pressed="${v.id === st.vacunaId}">
  <b>${esc(v.nombre)}</b><span>${esc(v.fechaPrevista || '')}${v.via ? ' · ' + esc(v.via) : ''}</span></button>`).join('')}</div></div>`;
      } else {
        campos = `<p class="reg-nota">No hay vacunas pendientes en este lote. Puedes anotar una vacuna aplicada fuera del plan.</p>` +
          `<div class="reg-campo"><label class="reg-etiqueta" for="reg-vacuna-nombre">Nombre de la vacuna</label><input class="reg-texto" id="reg-vacuna-nombre" type="text" autocomplete="off"></div>`;
      }
    } else if (t === 'sanidad') {
      campos = `<div class="reg-campo"><label class="reg-etiqueta" for="reg-enfermedad">Enfermedad o síntoma</label><input class="reg-texto" id="reg-enfermedad" type="text" autocomplete="off"></div>
<div class="reg-campo"><label class="reg-etiqueta" for="reg-tratamiento">Tratamiento</label><input class="reg-texto" id="reg-tratamiento" type="text" autocomplete="off"></div>` +
        campo('Días de retiro (sin vender huevos ni carne)', Contador({ id: 'reg-retiro', valor: 0, min: 0, paso: 1, etiqueta: 'Días de retiro' }));
    }
    return `${htmlLote()}
${campos}
<p class="reg-error" role="alert" hidden></p>
<div class="reg-pregunta" hidden></div>
<div class="reg-acciones">
  ${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'reg-atras' })}
  ${Boton({ texto: guardar, variante: 'primario', accion: 'reg-guardar', clase: 'reg-guardar' })}
</div>`;
  }

  function htmlElegirLote() {
    return `<div class="reg-opciones">${st.lotes.map(l =>
      `<button type="button" class="reg-opcion" data-accion="reg-elegir-lote" data-lote="${esc(l.id)}" aria-pressed="${l.id === st.loteId}">
  <b>${esc(l.nombre || 'Lote')}</b><span>${esc((gen(l) || {}).nombre || l.genetica || '')}</span></button>`).join('')}</div>
${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'reg-volver-valor', clase: 'btn-ancho' })}`;
  }

  /* ------------------------------ Flujo ------------------------------ */
  async function abrir(tipo) {
    let activos = [];
    try { activos = await DB.listar('lotes', { estado: 'activo' }); } catch (e) { activos = []; }
    if (!activos.length) { st = null; App.abrirHoja({ titulo: 'Registrar', contenido: htmlSinLotes() }); return; }
    const pref = App.estado.loteActivoId;
    st = { lotes: activos, loteId: activos.some(l => l.id === pref) ? pref : activos[0].id, tipo: null,
      registros: [], vacunas: [], vacunaId: null, guardando: false, existente: null };
    App.abrirHoja({ titulo: '¿Qué registras?', contenido: htmlTipos() });
    if (tipo && TIPOS.some(t => t.id === tipo)) await elegirTipo(tipo);
  }

  async function cargarLote() {
    st.registros = await DB.listar('registros', { loteId: st.loteId });
    st.vacunas = (await DB.listar('vacunasPlan', { loteId: st.loteId }))
      .filter(v => !v.fechaAplicada).sort((a, b) => String(a.fechaPrevista || '').localeCompare(String(b.fechaPrevista || '')));
  }

  async function elegirTipo(tipo) {
    if (!st) return;
    st.tipo = tipo; st.existente = null;
    try { await cargarLote(); } catch (e) { st.registros = []; st.vacunas = []; }
    if (!App.hojaAbierta()) return;
    poner(TIPOS.find(t => t.id === tipo).texto, htmlValor());
  }

  function mostrarError(msg) {
    const p = $h('.reg-error');
    if (p) { p.textContent = msg; p.hidden = false; }
  }
  function limpiarMensajes() {
    const p = $h('.reg-error'), q = $h('.reg-pregunta'), a = $h('.reg-acciones');
    if (p) { p.hidden = true; p.textContent = ''; }
    if (q) { q.hidden = true; q.innerHTML = ''; }
    if (a) a.hidden = false;
  }

  function leerDatos() {
    switch (st.tipo) {
      case 'mortalidad': { const d = { cantidad: num('reg-valor') }; const c = txt('reg-causa'); if (c) d.causa = c; return d; }
      case 'alimento': return { kg: num('reg-valor') };
      case 'huevos': return { cantidad: num('reg-valor'), rotos: Number.isFinite(num('reg-rotos')) ? num('reg-rotos') : 0 };
      case 'peso': return { gramos: num('reg-valor') };
      case 'vacuna': {
        const v = st.vacunas.find(x => x.id === st.vacunaId);
        return v ? { nombre: v.nombre, via: v.via || '', planId: v.id } : { nombre: txt('reg-vacuna-nombre'), via: '' };
      }
      case 'sanidad': return { enfermedad: txt('reg-enfermedad'), tratamiento: txt('reg-tratamiento'), retiroDias: num('reg-retiro') };
    }
    return {};
  }

  function sumarDatos(a, b) {
    const n = k => Number(a && a[k]) || 0, m = k => Number(b && b[k]) || 0;
    if (st.tipo === 'alimento') return { kg: redondear(n('kg') + m('kg'), 3) };
    if (st.tipo === 'huevos') return { cantidad: n('cantidad') + m('cantidad'), rotos: n('rotos') + m('rotos') };
    const d = { cantidad: n('cantidad') + m('cantidad') }, causa = (b && b.causa) || (a && a.causa);
    if (causa) d.causa = causa;
    return d;
  }

  function preguntar(existente) {
    st.existente = existente;
    const q = $h('.reg-pregunta'), a = $h('.reg-acciones');
    const d = existente.datos || {};
    const previo = st.tipo === 'alimento' ? formatoNumero(d.kg) + ' kg' : st.tipo === 'peso' ? formatoNumero(d.gramos) + ' g'
      : formatoNumero(d.cantidad) + ' ' + UNIDAD[st.tipo];
    const nombre = TIPOS.find(t => t.id === st.tipo).texto.toLowerCase();
    const sumable = SUMABLES.includes(st.tipo);
    q.innerHTML = `<p class="reg-pregunta-texto"><b>Hoy ya registraste ${esc(nombre)}: ${esc(previo)}.</b> ${sumable ? '¿Sumar o reemplazar?' : '¿Reemplazar el registro de hoy?'}</p>
<div class="reg-pregunta-botones">
  ${sumable ? Boton({ texto: 'Sumar', icono: 'mas', variante: 'primario', accion: 'reg-sumar' }) : ''}
  ${Boton({ texto: 'Reemplazar', variante: sumable ? 'secundario' : 'primario', accion: 'reg-reemplazar' })}
</div>
${Boton({ texto: 'Cancelar', variante: 'secundario', accion: 'reg-cancelar-dup', clase: 'btn-ancho' })}`;
    q.hidden = false;
    a.hidden = true;
    const b = q.querySelector('button');
    if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
  }

  async function inventario(kg) {
    if (!(Number.isFinite(kg) && kg !== 0)) return;
    if (typeof Inventario !== 'undefined' && Inventario && typeof Inventario.descontarAlimento === 'function') {
      try { await Inventario.descontarAlimento(kg); } catch (e) { /* el registro vale aunque falle el inventario */ }
    }
  }

  /* Escribe el cambio y devuelve la función que lo revierte exactamente. */
  async function escribir(modo, datos) {
    const l = lote(), hoy = hoyLocal(), ahora = new Date().toISOString();
    if (modo === 'sumar' || modo === 'reemplazar') {
      const previo = JSON.parse(JSON.stringify(st.existente));
      const final = modo === 'sumar' ? sumarDatos(previo.datos, datos) : datos;
      await DB.guardar('registros', Object.assign({}, previo, { datos: final, editado: ahora }));
      const dkg = st.tipo === 'alimento' ? (Number(final.kg) || 0) - (Number(previo.datos && previo.datos.kg) || 0) : 0;
      await inventario(dkg);
      return async () => { await DB.guardar('registros', previo); await inventario(-dkg); };
    }
    let planPrevio = null;
    if (st.tipo === 'vacuna' && datos.planId) {
      const plan = st.vacunas.find(v => v.id === datos.planId);
      planPrevio = JSON.parse(JSON.stringify(plan));
      await DB.guardar('vacunasPlan', Object.assign({}, plan, { fechaAplicada: hoy }));
    }
    const nuevo = await DB.guardar('registros', { loteId: l.id, fecha: hoy, tipo: st.tipo, datos, creado: ahora });
    const dkg = st.tipo === 'alimento' ? Number(datos.kg) || 0 : 0;
    await inventario(dkg);
    return async () => {
      await DB.borrar('registros', nuevo.id);
      if (planPrevio) await DB.guardar('vacunasPlan', planPrevio);
      await inventario(-dkg);
    };
  }

  async function guardar(modo) {
    if (!st || st.guardando || !st.tipo) return;
    const l = lote(), hoy = hoyLocal(), datos = leerDatos();
    if (!modo) limpiarMensajes();
    let v;
    if (modo) {
      // Se valida el resultado final contra los registros sin el que se va a cambiar.
      const sin = st.registros.filter(r => r.id !== st.existente.id);
      v = validarRegistro(st.tipo, modo === 'sumar' ? sumarDatos(st.existente.datos, datos) : datos, l, sin, hoy);
    } else {
      v = validarRegistro(st.tipo, datos, l, st.registros, hoy);
    }
    if (!v.ok) { if (modo) limpiarMensajes(); mostrarError(v.mensaje); return; }
    if (!modo && v.duplicado && DIARIOS.includes(st.tipo)) {
      const ex = st.registros.filter(r => r.tipo === st.tipo && r.fecha === hoy)
        .sort((a, b) => String(a.creado || '').localeCompare(String(b.creado || '')))[0];
      if (ex) { preguntar(ex); return; }
    }
    st.guardando = true;
    const cuerpo = $h('.hoja-cuerpo');
    if (cuerpo) cuerpo.querySelectorAll('button, input, select').forEach(b => { b.disabled = true; });
    let deshacer;
    try { deshacer = await escribir(modo, datos); } catch (e) {
      st.guardando = false;
      if (cuerpo) cuerpo.querySelectorAll('button, input, select').forEach(b => { b.disabled = false; });
      limpiarMensajes();
      mostrarError('No se pudo guardar. Intenta de nuevo.');
      return;
    }
    App.fijarLote(l.id);
    const q = $h('.reg-pregunta'), a = $h('.reg-acciones');
    if (q && !q.hidden) { q.hidden = true; a.hidden = false; }
    const btn = $h('.reg-guardar');
    if (btn) { btn.classList.add('guardado'); btn.setAttribute('aria-label', 'Guardado'); palomita(btn); }
    vibrar(30);
    const capa = App.hojaAbierta();
    const fin = () => {
      if (App.hojaAbierta() === capa) { st = null; App.cerrarHoja(); }
      App.refrescar(); App.toast('Guardado', { deshacer });
    };
    if (reducirMovimiento()) fin(); else setTimeout(fin, 700);
  }

  /* ------------------------------ Acciones ------------------------------ */
  ACCIONES['reg-tipo'] = el => elegirTipo(el.dataset.tipo);
  ACCIONES['reg-guardar'] = () => guardar();
  ACCIONES['reg-sumar'] = () => guardar('sumar');
  ACCIONES['reg-reemplazar'] = () => guardar('reemplazar');
  ACCIONES['reg-cancelar-dup'] = () => {
    limpiarMensajes(); if (st) st.existente = null;
    const g = $h('.reg-guardar'); if (g) try { g.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
  };
  ACCIONES['reg-atras'] = () => { if (!st) return; st.tipo = null; poner('¿Qué registras?', htmlTipos()); };
  ACCIONES['reg-cambiar-lote'] = () => { if (st) poner('¿Qué lote?', htmlElegirLote()); };
  ACCIONES['reg-volver-valor'] = () => { if (st && st.tipo) elegirTipo(st.tipo); };
  ACCIONES['reg-elegir-lote'] = el => { if (!st) return; st.loteId = el.dataset.lote; st.vacunaId = null; elegirTipo(st.tipo); };
  ACCIONES['reg-vacuna'] = el => {
    if (!st) return;
    st.vacunaId = el.dataset.id;
    const c = App.hojaAbierta();
    if (c) c.querySelectorAll('[data-accion="reg-vacuna"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === st.vacunaId)));
  };

  return { abrir };
})();

</script>
<script>
/* Appollo · Vista "Reportes" (provisional: la reemplaza una tarea posterior). */
var VISTAS = window.VISTAS || (window.VISTAS = {});
VISTAS.reportes = async function () {
  return `<section class="pantalla"><h1>Reportes</h1>
  <div class="proximamente">${icono('hoja')}<p>Próximamente: viabilidad, conversión y producción por período.</p></div></section>`;
};

</script>
<script>
/* =========================================================================
   APPOLLO 2 · Shell: enrutador por hash, barra inferior, hojas, toast y arranque.
   Contrato de vistas: VISTAS.nombre = async (params) => '<html>' y, opcional,
   VISTAS.nombre.montar = (raiz, params) => {...}. Acciones de clic: ACCIONES[nombre](el, evento)
   para cualquier elemento con data-accion="nombre" (un solo oyente delegado aquí).
   ========================================================================= */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

const App = (function () {
  'use strict';
  const K_LOTE = 'appollo.v2.loteActivo';
  const $ = s => document.querySelector(s);
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } };
  const estado = { granja: null, loteActivoId: null, modo: null };
  let listo = false, turno = 0;

  /* ------------------------------ Rutas ------------------------------ */
  // Primer segmento del hash -> nombre de vista. Lo demás va en params.
  const ALIAS = { 'nuevo-lote': 'nuevoLote', lote: 'detalleLote', plan: 'planificar' };
  const NAV = { inicio: 'inicio', lotes: 'lotes', nuevoLote: 'lotes', detalleLote: 'lotes', alertas: 'alertas',
    mas: 'mas', inventario: 'mas', reportes: 'mas', ajustes: 'mas', planificar: 'mas' };
  const CONOCIDAS = ['inicio', 'lotes', 'nuevoLote', 'detalleLote', 'alertas', 'mas', 'inventario', 'reportes', 'ajustes', 'planificar'];

  function resolver(hash) {
    const partes = String(hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(p => {
      try { return decodeURIComponent(p); } catch (e) { return p; }
    });
    const seg = partes[0] || '';
    const nombre = ALIAS[seg] || seg;
    if (!nombre || !(CONOCIDAS.includes(nombre) || typeof VISTAS[nombre] === 'function')) return null;
    if (nombre === 'detalleLote' && !partes[1]) return null;
    const params = { partes: partes.slice(1) };
    if (nombre === 'detalleLote') params.id = partes[1];
    if (nombre === 'planificar') params.paso = partes[1] || 'genetica';
    return { nombre, params };
  }

  function ir(ruta) {
    cerrarHoja(true);
    const r = String(ruta || '#/inicio');
    if (location.hash === r) render({ animar: true });
    else location.hash = r;
  }

  /* --------------------- Render con captura de errores --------------------- */
  const pendiente = nombre => `<section class="pantalla"><h1>${esc(nombre)}</h1>
  <div class="proximamente">${icono('hoja')}<p>Próximamente: esta pantalla está en camino.</p></div></section>`;
  const fallo = () => `<section class="pantalla vista-error" role="alert">
  <div class="vista-error-icono">${icono('aviso')}</div>
  <h1>Algo salió mal</h1>
  <p>Esta pantalla no se pudo mostrar. Tus datos siguen guardados.</p>
  ${Boton({ texto: 'Volver al inicio', icono: 'inicio', variante: 'primario', accion: 'ir', datos: { ruta: '#/inicio' }, clase: 'btn-ancho' })}
</section>`;

  async function render({ animar } = {}) {
    if (!listo) return;
    const r = resolver(location.hash);
    if (!r) { history.replaceState(null, '', '#/inicio'); return render({ animar }); }
    const mio = ++turno, vista = $('#view');
    marcarNav(NAV[r.nombre] || null);
    let html, montar = null;
    try {
      const fn = VISTAS[r.nombre];
      html = typeof fn === 'function' ? await fn(r.params) : pendiente(r.nombre.charAt(0).toUpperCase() + r.nombre.slice(1));
      if (typeof html !== 'string') throw new Error('La vista ' + r.nombre + ' no devolvió HTML');
      montar = typeof fn === 'function' && typeof fn.montar === 'function' ? fn.montar : null;
    } catch (e) {
      if (mio !== turno) return;
      console.warn('Error de vista', r.nombre, e);
      html = fallo();
    }
    if (mio !== turno) return; // llegó otra navegación mientras esperábamos
    vista.innerHTML = `<div class="vista-raiz${animar && !reducirMovimiento() ? ' pantalla-entra' : ''}">${html}</div>`;
    if (montar) {
      try { await montar(vista.firstElementChild, r.params); } catch (e) {
        if (mio !== turno) return;
        console.warn('Error al montar la vista', r.nombre, e);
        vista.innerHTML = `<div class="vista-raiz">${fallo()}</div>`;
      }
    }
    if (animar) {
      window.scrollTo(0, 0);
      try { vista.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
    }
  }

  function marcarNav(clave) {
    document.querySelectorAll('#nav [data-nav]').forEach(a => {
      if (a.dataset.nav === clave) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }

  /* Vuelve a dibujar la pantalla actual (sin transición) y recalcula las alertas. */
  function refrescar() {
    actualizarAlertas();
    return render({ animar: false });
  }

  /* Cuenta de alertas en la barra: rojas y ámbar (las informativas no suman). */
  async function actualizarAlertas() {
    const ins = $('#nav-insignia');
    if (!ins || typeof generarAlertas !== 'function') return 0;
    let n = 0;
    try {
      const datos = {};
      for (const s of DB.STORES) datos[s] = await DB.listar(s);
      datos.granja = estado.granja;
      n = generarAlertas(datos, new Date()).filter(a => a.gravedad !== 'info').length;
    } catch (e) { n = 0; }
    ins.hidden = !n;
    ins.innerHTML = n ? `${n > 99 ? '99+' : n}<span class="solo-lector"> pendientes</span>` : '';
    return n;
  }

  /* ------------------------------ Lote activo ------------------------------ */
  function fijarLote(id) {
    estado.loteActivoId = id || null;
    lsSet(K_LOTE, id || null);
  }

  /* ------------------------------ Hojas ------------------------------ */
  let hoja = null; // {capa, previo}
  function abrirHoja({ titulo, contenido }) {
    cerrarHoja(true);
    const caja = $('#capas');
    caja.innerHTML = Hoja({ titulo, contenido });
    const capa = caja.firstElementChild, sec = capa.querySelector('.hoja');
    sec.setAttribute('tabindex', '-1');
    hoja = { capa, previo: document.activeElement };
    ['#view', '#nav', '#franjas'].forEach(s => { const el = $(s); if (el) el.inert = true; });
    try { sec.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
    return capa;
  }
  function cerrarHoja(inmediato) {
    if (!hoja) return;
    const { capa, previo } = hoja;
    hoja = null;
    ['#view', '#nav', '#franjas'].forEach(s => { const el = $(s); if (el) el.inert = false; });
    const quitar = () => { capa.remove(); };
    if (inmediato || reducirMovimiento()) quitar();
    else { capa.classList.add('cerrando'); setTimeout(quitar, 220); }
    if (previo && document.contains(previo) && typeof previo.focus === 'function') {
      try { previo.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
    }
  }
  const hojaAbierta = () => (hoja ? hoja.capa : null);

  /* ------------------------------ Toast ------------------------------ */
  let toastT = 0;
  function toast(msg, opciones) {
    const t = $('#toast'), deshacer = opciones && typeof opciones.deshacer === 'function' ? opciones.deshacer : null;
    const ms = deshacer ? 5000 : 2600;
    clearTimeout(toastT);
    t.innerHTML = `<span class="toast-texto">${esc(msg)}</span>` +
      (deshacer ? Boton({ texto: 'Deshacer', variante: 'secundario', accion: 'deshacer' }) : '') +
      (deshacer && !reducirMovimiento() ? `<span class="toast-tiempo" aria-hidden="true" style="animation-duration:${ms}ms"></span>` : '');
    t.hidden = false;
    t._deshacer = deshacer;
    toastT = setTimeout(ocultarToast, ms);
  }
  function ocultarToast() { const t = $('#toast'); clearTimeout(toastT); t.hidden = true; t.innerHTML = ''; t._deshacer = null; }

  ACCIONES.deshacer = async () => {
    const fn = $('#toast')._deshacer;
    ocultarToast();
    if (!fn) return;
    try { await fn(); toast('Se deshizo el cambio'); } catch (e) { toast('No se pudo deshacer'); }
    refrescar();
  };
  ACCIONES.ir = el => ir(el.dataset.ruta || '#/inicio');
  ACCIONES['nuevo-lote'] = () => ir('#/nuevo-lote');
  ACCIONES['cerrar-hoja'] = () => cerrarHoja();
  ACCIONES['contador-mas'] = el => ajustarContador(el.dataset.para, 1);
  ACCIONES['contador-menos'] = el => ajustarContador(el.dataset.para, -1);
  ACCIONES.registrar = () => { if (typeof Registrar !== 'undefined') Registrar.abrir(); };

  /* ------------------------------ Franjas ------------------------------ */
  function franjaRed() { const f = $('#franja-offline'); if (f) f.hidden = navigator.onLine !== false; }

  /* ------------------------------ Arranque ------------------------------ */
  async function arrancar() {
    // Se mira antes de cualquier espera: solo se migra si ya había datos de la v1.
    const legado = lsGet('appollo.v1.lotes') !== null;
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-accion]');
      if (!el || el.disabled) return;
      const fn = ACCIONES[el.dataset.accion];
      if (typeof fn === 'function') { e.preventDefault(); fn(el, e); }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && hoja) { e.preventDefault(); cerrarHoja(); } });
    window.addEventListener('hashchange', () => { cerrarHoja(true); render({ animar: true }); });
    window.addEventListener('online', franjaRed);
    window.addEventListener('offline', franjaRed);
    franjaRed();

    try { estado.modo = (await DB.abrir()).modo; } catch (e) { estado.modo = 'memoria'; }
    if (estado.modo === 'memoria') $('#franja-memoria').hidden = false;
    if (legado) { try { await DB.migrarLS(); } catch (e) { /* la app sigue sin migrar */ } }
    try {
      estado.granja = await DB.obtener('granja', 'granja') ||
        await DB.guardar('granja', { id: 'granja', nombre: '', tipo: '', altitud: null, tema: 'auto', creado: new Date().toISOString() });
    } catch (e) { estado.granja = { id: 'granja', nombre: '', tipo: '', altitud: null, tema: 'auto' }; }
    try {
      const activos = await DB.listar('lotes', { estado: 'activo' });
      const rec = lsGet(K_LOTE);
      estado.loteActivoId = activos.some(l => l.id === rec) ? rec : activos.length === 1 ? activos[0].id : null;
    } catch (e) { estado.loteActivoId = null; }

    listo = true;
    if (!resolver(location.hash)) history.replaceState(null, '', '#/inicio');
    await render({ animar: true });
    actualizarAlertas();
  }

  return { ir, estado, refrescar, toast, actualizarAlertas, abrirHoja, cerrarHoja, hojaAbierta, fijarLote, arrancar };
})();

App.arrancar();

</script>
