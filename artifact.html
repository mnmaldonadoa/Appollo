  VISTAS.nuevoLote = async function () { if (!precargar() && !st) st = nuevo(); return html(); };
  VISTAS.nuevoLote.crear = crear;

  ACCIONES['nl-genetica'] = el => { st.gid = el.dataset.id; st.paso = 2; pintar(true); };
  ACCIONES['nl-atras'] = () => { leer(); st.paso = Math.max(1, st.paso - 1); pintar(true); };
  ACCIONES['nl-modo'] = el => { leer(); st.modo = el.dataset.modo; pintar(); };
  ACCIONES['nl-unidad'] = el => { leer(); st.unidad = el.dataset.unidad; pintar(); };
  ACCIONES['nl-preset'] = el => { leer(); st.edad = el.dataset.valor; st.unidad = el.dataset.unidad; pintar(); };
  ACCIONES['nl-altitud'] = el => { leer(); st.altitud = el.dataset.valor; pintar(); };
  ACCIONES['nl-siguiente'] = () => {
    leer();
    const v = validar(Object.assign(datos(), { altitud: null }));
    if (v.mensaje) { error(v.mensaje); return; }
    st.paso = 3; pintar(true);
  };
  const conservar = (f, accion, id) => {
    const y = window.scrollY; f(); pintar(); window.scrollTo(0, y);
    const el = $v(`[data-accion="${accion}"][data-id="${id}"]`);
    if (el) { try { el.focus({ preventScroll: true }); } catch (e) { /* sin foco */ } }
  };
  const idsDe = cat => tareasVisibles(genDe(st.gid), edadActual(), edadLlegada()).filter(t => t.categoria === cat && !noSirve(t, genDe(st.gid))).map(t => t.id);
  ACCIONES['nl-plan-tarea'] = el => conservar(() => { const id = el.dataset.id; if (st.plan.has(id)) st.plan.delete(id); else st.plan.add(id); }, 'nl-plan-tarea', el.dataset.id);
  ACCIONES['nl-plan-todo'] = el => conservar(() => idsDe(el.dataset.id).forEach(id => st.plan.add(id)), 'nl-plan-todo', el.dataset.id);
  ACCIONES['nl-plan-ninguno'] = el => conservar(() => idsDe(el.dataset.id).forEach(id => st.plan.delete(id)), 'nl-plan-ninguno', el.dataset.id);
  ACCIONES['nl-plan-abrir'] = el => conservar(() => { const id = el.dataset.id; if (st.abiertas.has(id)) st.abiertas.delete(id); else st.abiertas.add(id); }, 'nl-plan-abrir', el.dataset.id);
  ACCIONES['nl-plan-siguiente'] = () => { st.paso = 4; pintar(true); };
  ACCIONES['nl-crear'] = async el => {
    leer();
    if (st.altitud === '' || st.altitud === null || st.altitud === undefined) { error('Elige la altitud de tu granja'); return; }
    el.disabled = true;
    let lote;
    try { lote = await crear(datos()); } catch (e) { el.disabled = false; error(e.message); return; }
    st = null;
    App.fijarLote(lote.id);
    App.ir('#/lote/' + encodeURIComponent(lote.id));
    App.toast('Lote creado');
    App.actualizarAlertas();
  };

  return { crear, validar, maxDias, planVacunas, planSugerido, tareasVisibles };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Pestaña «Plan del ciclo» del detalle del lote y hoja «Agregar labor».
   PlanCiclo.html(lote, tareas, vacunas, hoy) -> HTML de la pestaña (secciones Atrasadas / Esta semana /
   Próximas / Hechas / Quitadas). Las vacunas del lote (vacunasPlan) salen en las mismas secciones con el botón
   `dl-aplicar` del detalle. Lote cerrado: solo lectura. Todo texto de la persona o del catálogo pasa por esc().
   Acciones: pc-hecho, pc-quitar, pc-reactivar, pc-mover, pc-editar, pc-agregar (+ sus pasos en la hoja).
   ========================================================================= */
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

const PlanCiclo = (function () {
  'use strict';
  const SEMANA = 7, VISIBLES = 8, DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  const masDias = (f, n) => { const d = fechaADate(f); d.setDate(d.getDate() + n); return hoyLocal(d); };
  const ddmm = f => (typeof f === 'string' && f.length >= 10 ? f.slice(8, 10) + '/' + f.slice(5, 7) : '—');
  const diaTxt = f => (fechaValida(f) ? DIAS[fechaADate(f).getDay()] + ' ' + ddmm(f) : '—');
  const cadaTxt = n => (Number(n) === 1 ? 'cada día' : 'cada ' + formatoNumero(Number(n)) + ' días');
  const catDe = id => CATEGORIAS_PLAN.find(c => c.id === id) || { nombre: 'Otra labor', icono: 'hoja' };
  const ultimaHecha = t => ((t.hechas || []).map(h => h && h.fecha).filter(fechaValida).sort().pop() || null);
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const gen = l => (l && typeof GENETICAS !== 'undefined' ? GENETICAS.find(g => g.id === l.genetica) || null : null);
  const noSirve = (t, g) => !!(g && bloqueadaEnModo(t, modoDe(g)));
  const modoLote = l => { const g = gen(l); return g ? modoDe(g) : null; };

  /* ------------------------------ Secciones (puro) ------------------------------ */
  /* -> {atrasadas, semana, proximas, hechas, quitadas}: cada elemento {tipo:'tarea'|'vacuna', dato, estado, fecha}. */
  function secciones(tareas, vacunas, hoy) {
    const s = { atrasadas: [], semana: [], proximas: [], hechas: [], quitadas: [] }, limite = masDias(hoy, SEMANA);
    const pendiente = (it, f) => { (f < hoy ? s.atrasadas : f <= limite ? s.semana : s.proximas).push(it); };
    for (const t of tareas || []) {
      const estado = estadoTarea(t, hoy), it = { tipo: 'tarea', dato: t, estado, fecha: null };
      if (estado === 'quitada') { it.fecha = String(t.quitadaEn || '').slice(0, 10); s.quitadas.push(it); }
      else if (estado === 'hecha' || estado === 'omitida') { it.fecha = ultimaHecha(t); s.hechas.push(it); }
      else { it.fecha = proximaFecha(t, hoy); pendiente(it, it.fecha); }
    }
    for (const v of vacunas || []) {
      const it = { tipo: 'vacuna', dato: v, estado: v.fechaAplicada ? 'hecha' : '', fecha: v.fechaAplicada || v.fechaPrevista };
      if (v.fechaAplicada) { s.hechas.push(it); continue; }
      if (!fechaValida(v.fechaPrevista)) continue;
      it.estado = v.fechaPrevista < hoy ? 'atrasada' : v.fechaPrevista === hoy ? 'hoy' : 'proxima';
      pendiente(it, v.fechaPrevista);
    }
    const titulo = it => String(it.tipo === 'tarea' ? it.dato.titulo : it.dato.nombre);
    const asc = (a, b) => String(a.fecha).localeCompare(String(b.fecha)) || (a.tipo === b.tipo ? 0 : a.tipo === 'tarea' ? -1 : 1) || titulo(a).localeCompare(titulo(b));
    const desc = (a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || titulo(a).localeCompare(titulo(b));
    s.atrasadas.sort(asc); s.semana.sort(asc); s.proximas.sort(asc); s.hechas.sort(desc); s.quitadas.sort(desc);
    return s;
  }

  /* Tareas del catálogo para la hoja: -> [{t, estado:'nueva'|'enplan'|'quitada'|'nosirve', filaId?}]. */
  function catalogo(g, edad, filas, texto) {
    if (!g) return [];
    const q = norm(texto).trim();
    return tareasDelCatalogo(g, modoDe(g))
      .filter(t => t.hastaDia === undefined || t.hastaDia === null || !(Number(edad) > t.hastaDia))
      .filter(t => !q || norm(t.titulo + ' ' + t.detalle + ' ' + (t.quimico ? t.quimico.tipo + ' ' + t.quimico.ingredienteActivo : '') + ' ' + catDe(t.categoria).nombre).includes(q))
      .map(t => {
        const f = (filas || []).find(x => x.catalogoId === t.id);
        if (f) return f.estado === 'quitada' ? { t, estado: 'quitada', filaId: f.id } : { t, estado: 'enplan', filaId: f.id };
        return { t, estado: noSirve(t, g) ? 'nosirve' : 'nueva' };
      });
  }

  /* ------------------------------ HTML ------------------------------ */
  const retiroDias = x => (x === null || x === undefined || x === '' ? 'ver etiqueta' : formatoNumero(Number(x)) + (Number(x) === 1 ? ' día' : ' días'));
  const tag = x => `<span class="plan-tag">${esc(x)}</span>`;
  function quimicoHtml(q) {
    return `<div class="pc-quim"><span class="plan-tags">${tag(q.tipo)}${tag(q.ingredienteActivo)}</span>
  <p class="pc-quim-retiro">Retiro huevo: ${esc(retiroDias(q.retiroHuevoDias))} · carne: ${esc(retiroDias(q.retiroCarneDias))}</p>
  <p class="pc-quim-aviso">${icono('aviso')}<span>${esc(q.advertencia || CATALOGO_AVISO_QUIMICO)}</span></p></div>`;
  }
  const textoRetiro = r => [r.huevo ? 'No vender huevos hasta el ' + ddmm(r.huevo) : '', r.carne ? 'No vender carne hasta el ' + ddmm(r.carne) : ''].filter(Boolean);

  const CHIP = { atrasada: ['rojo', 'Atrasada'], hoy: ['ambar', 'Hoy'], hecha: ['verde', 'Hecha'], omitida: ['', 'Omitida'], quitada: ['', 'Quitada'] };
  const chip = estado => {
    const c = CHIP[estado];
    return c ? `<span class="chip${c[0] ? ' chip-' + c[0] : ''}">${c[0] ? '<span class="chip-punto" aria-hidden="true"></span>' : ''}${c[1]}</span>` : '';
  };

  function cuandoTarea(it) {
    const t = it.dato, cada = Number(t.cadaDias) > 0 ? ' · ' + cadaTxt(t.cadaDias) : '';
    switch (it.estado) {
      case 'atrasada': return 'desde el ' + ddmm(it.fecha) + cada;
      case 'hoy': return 'hoy' + cada;
      case 'proxima': return diaTxt(it.fecha) + cada;
      case 'hecha': return 'hecha el ' + ddmm(it.fecha) + cada;
      case 'omitida': return t.hastaDia != null && t.hastaDia !== '' ? 'pasó su edad sin hacerse' : 'pasó un mes sin hacerse';
      case 'quitada': return 'quitada' + (fechaValida(it.fecha) ? ' el ' + ddmm(it.fecha) : '');
    }
    return '';
  }

  function hechasHtml(t) {
    const hs = (t.hechas || []).filter(h => h && fechaValida(h.fecha)).slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
    if (!hs.length) return '';
    const etq = h => [Number.isInteger(h.etiquetaHuevoDias) ? 'huevo ' + retiroDias(h.etiquetaHuevoDias) : '', Number.isInteger(h.etiquetaCarneDias) ? 'carne ' + retiroDias(h.etiquetaCarneDias) : ''].filter(Boolean).join(', ');
    const fila = h => `<li>${t.quimico ? 'Último día' : 'Hecha el'} ${esc(ddmm(h.fecha))}${h.producto ? ' · producto: ' + esc(h.producto) : ''}${etq(h) ? ' · retiro en la etiqueta: ' + esc(etq(h)) : ''}${h.nota ? ' · ' + esc(h.nota) : ''}</li>`;
    return `<ul class="pc-hechas">${hs.slice(0, 3).map(fila).join('')}${hs.length > 3 ? `<li>y ${formatoNumero(hs.length - 3)} más</li>` : ''}</ul>`;
  }

  function tareaHtml(it, hoy, activo, modo) {
    const t = it.dato, c = catDe(t.categoria), id = t.id, unicaHecha = it.estado === 'hecha'; // única hecha o serie terminada: nada que mover
    // Un químico ya hecho admite otra «Hecho» para anotar el último día real del tratamiento (el retiro cuenta desde ahí).
    const conHecho = !unicaHecha || !!t.quimico;
    const ret = t.quimico ? textoRetiro(retiroVigente([t], [], hoy)) : [];
    const etq = t.quimico ? avisosEtiqueta([t], hoy, modo) : [];
    let acciones = '';
    if (activo) {
      if (it.estado === 'quitada') {
        acciones = `<div class="pc-acciones pc-acciones-una">${Boton({ texto: 'Reactivar', icono: 'mas', variante: 'secundario', accion: 'pc-reactivar', datos: { id } })}</div>`;
      } else {
        const menu = [
          !unicaHecha && it.estado !== 'omitida' ? Boton({ texto: 'Mover fecha', variante: 'secundario', accion: 'pc-mover', datos: { id } }) : '',
          Boton({ texto: 'Editar', variante: 'secundario', accion: 'pc-editar', datos: { id } }),
          Boton({ texto: 'Quitar', icono: 'cruz', variante: 'secundario', accion: 'pc-quitar', datos: { id }, clase: 'pc-quitar' }),
        ].join('');
        const mid = 'pc-menu-' + esc(id);
        acciones = `<div class="pc-acciones${conHecho ? '' : ' pc-acciones-una'}">
    ${conHecho ? Boton({ texto: 'Hecho', icono: 'sig', variante: unicaHecha ? 'secundario' : 'primario', accion: 'pc-hecho', datos: { id } }) : ''}
    <button type="button" class="btn btn-secundario pc-menu-btn" data-accion="pc-menu" data-id="${esc(id)}" aria-expanded="false" aria-controls="${mid}">${icono('menu')}<span class="btn-texto">Opciones</span></button>
  </div>
  <div class="pc-menu" id="${mid}" hidden>${menu}</div>`;
      }
    }
    return `<li class="pc-item pc-${esc(it.estado)}${t.quimico ? ' pc-quimico' : ''}" data-item="${esc(id)}" tabindex="-1">
  <div class="pc-item-cab">${Ilustracion(ilustracionDe('categoriaPlan', t.categoria), { tamano: 'mini' })}
    <div class="dl-fila-texto"><b>${esc(t.titulo)}</b><span>${t.origen === 'propia' ? 'Propia · ' : ''}${esc(c.nombre)} · ${esc(cuandoTarea(it))}</span>${chip(it.estado)}</div></div>
  ${t.detalle ? `<p class="pc-detalle">${esc(t.detalle)}</p>` : ''}
  ${t.quimico ? quimicoHtml(t.quimico) : ''}
  ${ret.length ? `<p class="pc-retiro-tarea">${icono('aviso')}<span>${ret.map(esc).join(' · ')}</span></p>` : ''}
  ${etq.map(a => `<p class="pc-etiqueta-tarea">${icono('aviso')}<span>${esc(a.texto)}</span></p>`).join('')}
  ${hechasHtml(t)}
  ${acciones}
</li>`;
  }

  function vacunaHtml(it, hoy, activo) {
    const v = it.dato, est = it.estado;
    const cuando = v.fechaAplicada ? 'aplicada el ' + ddmm(v.fechaAplicada) : est === 'atrasada' ? 'prevista el ' + ddmm(v.fechaPrevista) : est === 'hoy' ? 'hoy' : diaTxt(v.fechaPrevista);
    const ch = v.fechaAplicada ? chip('hecha').replace('Hecha', 'Aplicada') : est === 'atrasada' ? chip('atrasada').replace('Atrasada', 'Vencida') : chip(est);
    return `<li class="pc-item pc-vacuna pc-${esc(est)}" data-item="${esc(v.id)}" tabindex="-1">
  <div class="pc-item-cab">${Ilustracion(ilustracionDe('categoriaPlan', 'vacuna'), { tamano: 'mini' })}
    <div class="dl-fila-texto"><b>Vacuna: ${esc(v.nombre)}</b><span>${v.via ? esc(v.via) + ' · ' : ''}${esc(cuando)}</span>${ch}</div></div>
  ${!v.fechaAplicada && activo ? `<div class="pc-acciones pc-acciones-una">${Boton({ texto: 'Marcar aplicada', icono: 'jeringa', variante: 'secundario', accion: 'dl-aplicar', datos: { id: v.id } })}</div>` : ''}
</li>`;
  }

  const abiertos = new Set(); // <details> abiertos ('loteId|clave'): sobreviven al redibujo
  function html(lote, tareas, vacunas, hoy) {
    if (!fechaValida(hoy)) hoy = hoyLocal();
    const activo = !!lote && lote.estado === 'activo', s = secciones(tareas, vacunas, hoy), lid = lote ? lote.id : '';
    const modo = modoLote(lote);
    const item = it => (it.tipo === 'tarea' ? tareaHtml(it, hoy, activo, modo) : vacunaHtml(it, hoy, activo));
    const lista = its => `<ul class="dl-lista pc-lista">${its.map(item).join('')}</ul>`;
    const det = (clave, resumen, cuerpo, clase) => `<details class="dl-hechas pc-det${clase ? ' ' + clase : ''}" data-det="${esc(clave)}"${abiertos.has(lid + '|' + clave) ? ' open' : ''}><summary>${resumen}</summary>${cuerpo}</details>`;
    const seccion = (clave, titulo, its, corte) => {
      if (!its.length) return '';
      const vis = corte ? its.slice(0, VISIBLES) : its, resto = corte ? its.slice(VISIBLES) : [];
      return `<section class="pc-seccion pc-sec-${clave}" data-sec="${clave}" aria-labelledby="pc-t-${clave}">
  <h2 class="seccion-titulo pc-sec-titulo" id="pc-t-${clave}" tabindex="-1">${titulo} <span class="num">${formatoNumero(its.length)}</span></h2>
  ${lista(vis)}${resto.length ? det(clave + '-mas', `Ver ${formatoNumero(resto.length)} más`, lista(resto)) : ''}</section>`;
    };
    const ret = textoRetiro(retiroVigente(tareas, [], hoy)), etq = avisosEtiqueta(tareas, hoy, modo);
    const vacio = !s.atrasadas.length && !s.semana.length && !s.proximas.length && !s.hechas.length;
    return `<div class="pc-plan">
  ${ret.length ? `<div class="pc-retiro" role="note">${Ilustracion('san-retiro', { tamano: 'mini' })}<div>${ret.map(x => `<p><b>${esc(x)}</b></p>`).join('')}<p>Por productos aplicados en este lote, contado desde el último día de tratamiento registrado (el día indicado incluido).</p></div></div>` : ''}
  ${etq.length ? `<div class="pc-etiqueta" role="note">${Ilustracion('al-etiqueta', { tamano: 'mini' })}<div>${etq.map(a => `<p><b>${esc(a.texto)}</b></p>`).join('')}<p>Este producto no trae retiro en la lista. Si la etiqueta trae días de retiro, anótalos con «Hecho» en esa labor.</p></div></div>` : ''}
  ${activo ? Boton({ texto: 'Agregar labor', icono: 'mas', variante: 'primario', accion: 'pc-agregar', datos: { id: lid }, clase: 'btn-ancho' })
    : '<p class="pc-solo-lectura">Lote cerrado: el plan es de solo lectura.</p>'}
  ${vacio ? `<p class="pantalla-texto">Aún no hay labores en el plan${activo ? '. Usa «Agregar labor» para elegir del catálogo o escribir una propia.' : '.'}</p>` : ''}
  ${seccion('atrasadas', 'Atrasadas', s.atrasadas)}
  ${seccion('semana', 'Esta semana', s.semana)}
  ${seccion('proximas', 'Próximas', s.proximas, true)}
  ${seccion('hechas', 'Hechas', s.hechas, true)}
  ${s.quitadas.length ? `<section class="pc-seccion pc-sec-quitadas" data-sec="quitadas">${det('quitadas', `Quitadas <span class="num">${formatoNumero(s.quitadas.length)}</span>`, lista(s.quitadas), 'pc-quitadas')}</section>` : ''}
</div>`;
  }

  /* ------------------------------ Foco ------------------------------ */
  /* Se recuerda el último control tocado o enfocado dentro de #view; tras un redibujo (App.refrescar, Deshacer)
     el foco vuelve al mismo data-accion/data-id, o a su tarjeta, o al título de su sección, nunca a <body>. */
  let ultimo = null, restaurando = false;
  function anotar(e) {
    if (restaurando) return; // el foco que pone restaurarFoco no reemplaza el control que la persona tocó
    const el = e.target && e.target.closest ? e.target.closest('#view [data-accion], #view [data-item], #view summary') : null;
    if (!el) return;
    const it = el.closest('[data-item]'), sec = el.closest('[data-sec]'), d = el.closest('details[data-det]');
    ultimo = { ruta: location.hash.split('/').slice(0, 3).join('/'), accion: el.dataset.accion || '', id: el.dataset.id || '',
      item: it ? it.dataset.item : '', sec: sec ? sec.dataset.sec : '', det: el.tagName === 'SUMMARY' && d ? d.dataset.det : '' };
  }
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('focusin', anotar, true);
    document.addEventListener('click', anotar, true);
  }
  const visible = el => !!el && el.getClientRects().length > 0 && !el.disabled;
  const cssq = s => (window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&'));
  function enfocar(el) { if (!el) return false; try { el.focus({ preventScroll: true }); } catch (e) { return false; } return document.activeElement === el; }
  function restaurarFoco(raiz) {
    const a = document.activeElement;
    if (!ultimo || App.hojaAbierta() || (a && a !== document.body && document.contains(a))) return;
    if (ultimo.ruta !== location.hash.split('/').slice(0, 3).join('/')) return;
    const q = s => raiz.querySelector(s), cands = [];
    if (ultimo.accion) cands.push(q(`[data-accion="${cssq(ultimo.accion)}"]${ultimo.id ? `[data-id="${cssq(ultimo.id)}"]` : ''}`));
    if (ultimo.det) cands.push(q(`details[data-det="${cssq(ultimo.det)}"] > summary`));
    if (ultimo.item) {
      const it = q(`[data-item="${cssq(ultimo.item)}"]`);
      cands.push(it);
      const d = it && it.closest('details:not([open])');
      if (d) cands.push(d.querySelector('summary'));
    }
    if (ultimo.sec) { const s = q(`[data-sec="${cssq(ultimo.sec)}"]`); if (s) cands.push(s.querySelector('h2, summary')); }
    cands.push(q('[role=tab][aria-selected=true]'));
    restaurando = true;
    try { for (const el of cands) if (visible(el) && enfocar(el)) return; } finally { restaurando = false; }
  }
  function montar(raiz) {
    raiz.addEventListener('toggle', e => {
      const d = e.target, lid = location.hash.split('/')[2] || '';
      if (!d.dataset || !d.dataset.det) return;
      const k = decodeURIComponent(lid) + '|' + d.dataset.det;
      if (d.open) abiertos.add(k); else abiertos.delete(k);
    }, true);
    restaurarFoco(raiz);
  }

  /* ------------------------------ Hojas ------------------------------ */
  let ocupado = false; // una operación a la vez: un doble toque no duplica hechas
  const $h = s => { const c = App.hojaAbierta(); return c ? c.querySelector(s) : null; };
  const valor = s => { const el = $h(s); return el ? el.value : ''; };
  const valorNum = s => { const el = $h(s); return !el ? '' : el.validity && el.validity.badInput ? 'x' : el.value; }; // texto no numérico: se rechaza, no se ignora
  function error(msg) { const p = $h('.reg-error'); if (p) { p.textContent = msg; p.hidden = false; } }
  const campo = (id, etiqueta, control, ayuda) => `<div class="reg-campo"><label class="reg-etiqueta" for="${id}">${etiqueta}</label>${control}${ayuda ? `<p class="reg-ayuda">${ayuda}</p>` : ''}</div>`;
  const pie = (accion, id, texto) => `<p class="reg-error" role="alert" hidden></p>
<div class="reg-acciones">${Boton({ texto: 'Cancelar', variante: 'secundario', accion: 'cerrar-hoja' })}${Boton({ texto, variante: 'primario', accion, datos: { id }, clase: 'reg-guardar' })}</div>`;

  /* Ejecuta una escritura desde la hoja: bloquea los controles, muestra el mensaje si se rechaza; si va bien
     cierra la hoja, redibuja y ofrece Deshacer cuando la operación lo permite. */
  async function desdeHoja(fn, msg) {
    if (ocupado) return;
    ocupado = true;
    App.ocultarToast(); // el Deshacer anterior ya no vale
    const cuerpo = $h('.hoja-cuerpo'), ctrls = cuerpo ? [...cuerpo.querySelectorAll('button, input, select, textarea')] : [];
    ctrls.forEach(b => { b.disabled = true; });
    let r;
    try { r = await fn(); } catch (e) { r = { mensaje: 'No se pudo guardar. Intenta de nuevo.' }; }
    ocupado = false;
    if (r && r.mensaje) {
      ctrls.forEach(b => { b.disabled = false; });
      error(r.mensaje);
      return;
    }
    App.cerrarHoja();
    await App.refrescar();
    App.toast(msg, typeof r === 'function' ? { deshacer: r } : undefined);
  }
  /* Escritura con un toque desde la pestaña (Quitar, Reactivar). */
  async function desdeVista(el, fn, msg) {
    if (ocupado) return;
    ocupado = true;
    el.disabled = true;
    App.ocultarToast();
    let r;
    try { r = await fn(); } catch (e) { r = { mensaje: 'No se pudo guardar. Intenta de nuevo.' }; }
    ocupado = false;
    if (r && r.mensaje) { el.disabled = false; App.toast(r.mensaje); return; }
    await App.refrescar();
    App.toast(msg, typeof r === 'function' ? { deshacer: r } : undefined);
  }

  async function cargarTarea(id) {
    const t = await DB.obtener('planTareas', id);
    const l = t ? await DB.obtener('lotes', t.loteId) : null;
    if (!t || !l) { App.toast('La tarea ya no existe'); App.refrescar(); return null; }
    if (l.estado !== 'activo') { App.toast('El lote está cerrado'); App.refrescar(); return null; }
    return { t, l };
  }

  ACCIONES['pc-menu'] = el => {
    const m = document.getElementById(el.getAttribute('aria-controls') || '');
    if (!m) return;
    const abrir = el.getAttribute('aria-expanded') !== 'true';
    el.setAttribute('aria-expanded', String(abrir));
    m.hidden = !abrir;
  };

  /* Hoja «Marcar hecha». En un químico la fecha es el ÚLTIMO día de tratamiento (el retiro se cuenta desde ahí) y hay
     campos opcionales con los días de retiro de la etiqueta. Se abre desde la pestaña y desde Alertas. */
  async function abrirHecho(id) {
    if (ocupado) return;
    const c = await cargarTarea(id);
    if (!c) return;
    const { t, l } = c, hoy = hoyLocal(), q = t.quimico, carne = modoLote(l) === 'carne';
    // Prefill: los días de la etiqueta de la hecha más reciente de esta tarea que los tenga (huevo y carne aparte).
    const previoEtq = k => {
      const hs = (t.hechas || []).filter(h => h && fechaValida(h.fecha) && Number.isInteger(h[k]) && h[k] >= 0);
      return hs.length ? String(hs.reduce((a, b) => (b.fecha >= a.fecha ? b : a))[k]) : '';
    };
    const pre = { 'pc-etq-huevo': previoEtq('etiquetaHuevoDias'), 'pc-etq-carne': previoEtq('etiquetaCarneDias') };
    const num = (id2, et) => `<div class="reg-campo"><label class="reg-etiqueta" for="${id2}">${et}</label><input class="reg-texto" id="${id2}" type="number" inputmode="numeric" min="0" max="365" step="1" placeholder="—" value="${esc(pre[id2])}"></div>`;
    App.abrirHoja({ titulo: 'Marcar hecha', contenido: `<p class="pc-hoja-tarea"><b>${esc(t.titulo)}</b></p>
${q ? quimicoHtml(q) : ''}
${q ? campo('pc-fecha', 'Último día de tratamiento (última dosis)', `<input class="reg-texto" id="pc-fecha" type="date" value="${hoy}" max="${hoy}"${fechaValida(l.fechaLlegada) ? ` min="${esc(l.fechaLlegada)}"` : ''}>`, 'El retiro se cuenta desde el último día que las aves recibieron el producto.')
    : campo('pc-fecha', 'Fecha en que se hizo', `<input class="reg-texto" id="pc-fecha" type="date" value="${hoy}" max="${hoy}"${fechaValida(l.fechaLlegada) ? ` min="${esc(l.fechaLlegada)}"` : ''}>`)}
${q ? campo('pc-producto', 'Producto usado (nombre comercial)', '<input class="reg-texto" id="pc-producto" type="text" maxlength="80" autocomplete="off">', 'Así queda constancia de qué se aplicó.') : ''}
${q ? `<fieldset class="pc-etq"><legend class="reg-etiqueta">Días de retiro según la etiqueta (opcional)</legend>
  <div class="pc-etq-fila${carne ? ' pc-etq-una' : ''}">${carne ? '' : num('pc-etq-huevo', 'Huevo')}${num('pc-etq-carne', 'Carne')}</div>
  <p class="reg-ayuda">De 0 a 365 días. Si lo anotas, manda sobre el retiro de la lista.</p></fieldset>` : ''}
${campo('pc-nota', 'Nota (opcional)', '<input class="reg-texto" id="pc-nota" type="text" maxlength="200" autocomplete="off">')}
${pie('pc-hecho-guardar', t.id, 'Guardar')}` });
  }
  ACCIONES['pc-hecho'] = el => abrirHecho(el.dataset.id);
  ACCIONES['pc-hecho-guardar'] = el => desdeHoja(() => Plan.marcarHecha(el.dataset.id, { fecha: valor('#pc-fecha'), nota: valor('#pc-nota'), producto: valor('#pc-producto'),
    etiquetaHuevoDias: valorNum('#pc-etq-huevo'), etiquetaCarneDias: valorNum('#pc-etq-carne') }), 'Labor hecha');

  ACCIONES['pc-mover'] = async el => {
    if (ocupado) return;
    const c = await cargarTarea(el.dataset.id);
    if (!c) return;
    const { t } = c, f = proximaFecha(t, hoyLocal()) || hoyLocal();
    App.abrirHoja({ titulo: 'Mover fecha', contenido: `<p class="pc-hoja-tarea"><b>${esc(t.titulo)}</b></p>
${campo('pc-mover-fecha', 'Nueva fecha', `<input class="reg-texto" id="pc-mover-fecha" type="date" value="${esc(f)}">`, Number(t.cadaDias) > 0 ? 'Las siguientes repeticiones se cuentan desde esta fecha.' : '')}
${pie('pc-mover-guardar', t.id, 'Mover')}` });
  };
  ACCIONES['pc-mover-guardar'] = el => desdeHoja(() => Plan.mover(el.dataset.id, valor('#pc-mover-fecha')), 'Fecha cambiada');

  ACCIONES['pc-editar'] = async el => {
    if (ocupado) return;
    const c = await cargarTarea(el.dataset.id);
    if (!c) return;
    const { t } = c;
    App.abrirHoja({ titulo: 'Editar labor', contenido: `${campo('pc-edit-titulo', 'Título', `<input class="reg-texto" id="pc-edit-titulo" type="text" maxlength="80" autocomplete="off" value="${esc(t.titulo)}">`)}
${campo('pc-edit-detalle', 'Detalle o nota', `<textarea class="reg-texto pc-area" id="pc-edit-detalle" rows="4" maxlength="500">${esc(t.detalle || '')}</textarea>`)}
${pie('pc-editar-guardar', t.id, 'Guardar')}` });
  };
  ACCIONES['pc-editar-guardar'] = el => desdeHoja(() => Plan.editar(el.dataset.id, { titulo: valor('#pc-edit-titulo'), detalle: valor('#pc-edit-detalle') }), 'Labor editada');

  ACCIONES['pc-quitar'] = el => desdeVista(el, () => Plan.quitar(el.dataset.id), 'Labor quitada');

  /* Reactivar: desde la sección Quitadas o desde el catálogo de la hoja (allí la hoja sigue abierta). */
  ACCIONES['pc-reactivar'] = async el => {
    if (!el.closest('.hoja')) return desdeVista(el, () => Plan.reactivar(el.dataset.id), 'Labor reactivada');
    if (ocupado) return;
    ocupado = true; el.disabled = true;
    let r;
    try { r = await Plan.reactivar(el.dataset.id); } catch (e) { r = { mensaje: 'No se pudo guardar. Intenta de nuevo.' }; }
    ocupado = false;
    await trasCatalogo(el, r, 'Labor reactivada');
  };

  /* ---------- Hoja «Agregar labor»: pestañas Del catálogo / Propia ---------- */
  let hojaLote = null; // {lote, g, edad}
  async function pintarCatalogo() {
    const caja = $h('.pc-cat-resultados');
    if (!caja || !hojaLote) return;
    const texto = valor('#pc-buscar'), filas = await Plan.listar(hojaLote.lote.id);
    if (!$h('.pc-cat-resultados')) return;
    const res = catalogo(hojaLote.g, hojaLote.edad, filas, texto);
    const abiertas = new Set([...caja.querySelectorAll('details[open]')].map(d => d.dataset.cat));
    const fila = x => {
      const t = x.t;
      const boton = x.estado === 'nueva' ? Boton({ texto: 'Agregar', icono: 'mas', variante: 'primario', accion: 'pc-agregar-cat', datos: { id: t.id } })
        : x.estado === 'quitada' ? Boton({ texto: 'Reactivar', icono: 'mas', variante: 'secundario', accion: 'pc-reactivar', datos: { id: x.filaId } })
          : x.estado === 'enplan' ? '<span class="chip chip-verde"><span class="chip-punto" aria-hidden="true"></span>En el plan</span>'
            : `<p class="plan-item-d"><b>${esc(motivoBloqueo(t))}</b></p>`;
      return `<li class="pc-cat-item" data-cat-item="${esc(t.id)}" tabindex="-1"><div class="pc-cat-texto"><b>${esc(t.titulo)}</b>
  <span class="pc-cat-dia">Desde el día ${formatoNumero(t.desdeDia)}${Number(t.cadaDias) > 0 ? ' · ' + esc(cadaTxt(t.cadaDias)) : ''}</span>
  ${t.detalle ? `<span class="plan-item-d">${esc(t.detalle)}</span>` : ''}${t.quimico ? quimicoHtml(t.quimico) : ''}</div>${boton}</li>`;
    };
    let cuerpo;
    if (!hojaLote.g) cuerpo = '<p class="pantalla-texto">La genética de este lote no está en el catálogo. Puedes agregar labores propias.</p>';
    else if (!res.length) cuerpo = `<p class="pantalla-texto">No hay labores que coincidan con «${esc(texto.trim())}».</p>`;
    else if (texto.trim()) cuerpo = `<p class="reg-ayuda" role="status">${formatoNumero(res.length)} ${res.length === 1 ? 'labor encontrada' : 'labores encontradas'}</p><ul class="pc-cat-lista">${res.map(fila).join('')}</ul>`;
    else {
      cuerpo = CATEGORIAS_PLAN.map(c => {
        const xs = res.filter(x => x.t.categoria === c.id);
        if (!xs.length) return '';
        const nuevas = xs.filter(x => x.estado === 'nueva' || x.estado === 'quitada').length;
        return `<details class="pc-cat" data-cat="${esc(c.id)}"${abiertas.has(c.id) ? ' open' : ''}><summary><span>${esc(c.nombre)}</span><span class="nl-cat-cuenta">${nuevas ? formatoNumero(nuevas) + ' para agregar' : 'Todo en el plan'}</span></summary><ul class="pc-cat-lista">${xs.map(fila).join('')}</ul></details>`;
      }).join('');
    }
    caja.innerHTML = cuerpo;
  }
  async function trasCatalogo(el, r, msg) {
    const id = el.closest('[data-cat-item]') ? el.closest('[data-cat-item]').dataset.catItem : '';
    if (r && r.mensaje) { el.disabled = false; App.toast(r.mensaje); return; }
    await App.refrescar();
    await pintarCatalogo();
    const it = id ? $h(`[data-cat-item="${cssq(id)}"]`) : null;
    if (it) enfocar(it.querySelector('button') || it);
    App.toast(msg, typeof r === 'function' ? { deshacer: r } : undefined); // Reactivar devuelve su deshacer
  }

  ACCIONES['pc-agregar'] = async el => {
    if (ocupado) return;
    const lote = await DB.obtener('lotes', el.dataset.id);
    if (!lote || lote.estado !== 'activo') { App.refrescar(); return; }
    const g = gen(lote), hoy = hoyLocal();
    hojaLote = { lote, g, edad: edadDias(lote, hoy) };
    const pest = (id, texto, sel) => `<button type="button" class="segmento-btn" role="tab" id="pc-tab-${id}" aria-controls="pc-panel-${id}" aria-selected="${sel}" data-accion="pc-hoja-pestana" data-id="${id}">${texto}</button>`;
    App.abrirHoja({ titulo: 'Agregar labor', contenido: `<div class="segmento pc-hoja-pestanas" role="tablist" aria-label="Origen de la labor">${pest('catalogo', 'Del catálogo', true)}${pest('propia', 'Propia', false)}</div>
<div class="pc-panel" id="pc-panel-catalogo" role="tabpanel" aria-labelledby="pc-tab-catalogo">
  ${campo('pc-buscar', 'Buscar en el catálogo', '<input class="reg-texto" id="pc-buscar" type="search" autocomplete="off" placeholder="Ej.: agua, cama, piojos">')}
  <div class="pc-cat-resultados"></div>
</div>
<div class="pc-panel" id="pc-panel-propia" role="tabpanel" aria-labelledby="pc-tab-propia" hidden>
  ${campo('pc-titulo', 'Título', '<input class="reg-texto" id="pc-titulo" type="text" maxlength="80" autocomplete="off" placeholder="Ej.: Revisar cortinas">')}
  ${campo('pc-categoria', 'Categoría', `<select class="reg-select" id="pc-categoria">${CATEGORIAS_PLAN.map(c => `<option value="${esc(c.id)}">${esc(c.nombre)}</option>`).join('')}</select>`)}
  ${campo('pc-propia-fecha', 'Fecha', `<input class="reg-texto" id="pc-propia-fecha" type="date" value="${hoy}">`)}
  ${campo('pc-cada', 'Repetir cada (días, opcional)', '<input class="reg-texto" id="pc-cada" type="number" inputmode="numeric" min="1" max="365" step="1" placeholder="Vacío: una sola vez">')}
  ${campo('pc-detalle', 'Nota (opcional)', '<input class="reg-texto" id="pc-detalle" type="text" maxlength="200" autocomplete="off">')}
  ${pie('pc-propia-guardar', lote.id, 'Agregar labor')}
</div>` });
    const b = $h('#pc-buscar');
    if (b) b.addEventListener('input', () => { pintarCatalogo(); });
    await pintarCatalogo();
  };
  ACCIONES['pc-hoja-pestana'] = el => {
    const c = App.hojaAbierta();
    if (!c) return;
    c.querySelectorAll('[data-accion="pc-hoja-pestana"]').forEach(b => {
      const sel = b === el;
      b.setAttribute('aria-selected', String(sel));
      const p = c.querySelector('#' + b.getAttribute('aria-controls'));
      if (p) p.hidden = !sel;
    });
  };
  ACCIONES['pc-agregar-cat'] = async el => {
    if (ocupado || !hojaLote) return;
    ocupado = true; el.disabled = true;
    let r;
    try { r = await Plan.agregarCatalogo(hojaLote.lote, el.dataset.id); } catch (e) { r = { mensaje: 'No se pudo guardar. Intenta de nuevo.' }; }
    ocupado = false;
    await trasCatalogo(el, r, 'Labor agregada');
  };
  ACCIONES['pc-propia-guardar'] = () => {
    if (!hojaLote) return;
    return desdeHoja(async () => {
      const r = await Plan.agregarPropia(hojaLote.lote, { titulo: valor('#pc-titulo'), categoria: valor('#pc-categoria'),
        fecha: valor('#pc-propia-fecha'), cadaDias: valor('#pc-cada'), detalle: valor('#pc-detalle') });
      return r && r.mensaje ? r : null;
    }, 'Labor agregada');
  };

  return { html, secciones, catalogo, montar, abrirHecho };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Planificar: estado del planificador y reglas (sin DOM).
   Copiado del planificador original (Appollo 1, IIFE de la interfaz) sin cambiar la lógica:
   mismas claves de almacenamiento (appollo.v1.estado, appollo.v1.precios), mismos
   valores de fábrica (BASE) y mismas llamadas a construirManejo / proyectar / brechas.
   ========================================================================= */
const PlanEstado = (function () {
  'use strict';
  const LS = {
    get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }
  };
  const K_ESTADO = 'appollo.v1.estado', K_PRECIOS = 'appollo.v1.precios';
  const BASE = { gid: null, obj: 'huevos', edad: null, unidad: 'semanas', aves: 100, alt: 2800, real: null, fin: null, sel: [], enf: null, filtro: 'todas' };
  const S = Object.assign({}, BASE, LS.get(K_ESTADO, {}));
  if (!Array.isArray(S.sel)) S.sel = [];
  const precios = Object.assign({ cubeta: '', kgVivo: '', kgAlim: '' }, LS.get(K_PRECIOS, {}));
  const guardar = () => LS.set(K_ESTADO, S);
  const guardarPrecios = () => LS.set(K_PRECIOS, precios);

  const gen = () => GENETICAS.find(g => g.id === S.gid);
  const modo = () => { const g = gen(); return g ? modoDe(g, S.obj) : 'huevos'; };
  const dias = () => { const e = Number(S.edad); if (!isFinite(e)) return NaN; return Math.round(S.unidad === 'semanas' ? e * 7 : e); };
  const plural = (n, s, p) => `${fmt(n, n % 1 ? 1 : 0)} ${n === 1 ? s : p}`;
  const edadTxt = () => S.unidad === 'semanas' ? plural(Number(S.edad), 'semana', 'semanas') : plural(Number(S.edad), 'día', 'días');
  const edadCorta = d => d <= 56 ? `Día ${d}` : `Sem. ${Math.round(d / 7)}`;

  function maxDias() {
    const g = gen(); if (!g) return 0;
    return modo() === 'huevos' ? 693 : g.carne.rango[1] - 1;
  }
  function errorEdad() {
    const d = dias();
    if (S.edad === null || S.edad === '' || !isFinite(d)) return 'Escribe la edad de las aves.';
    if (d < 0) return 'La edad no puede ser negativa.';
    if (d > maxDias()) return modo() === 'huevos' ? 'Para proyectar, la edad debe ser menor a 99 semanas.' : `La edad supera la edad máxima de venta (${gen().carne.rango[1]} días).`;
    return '';
  }
  const avesOk = () => Number.isFinite(S.aves) && S.aves >= 1 && S.aves <= 1000000;
  const loteValido = () => !!gen() && !errorEdad() && avesOk();

  function opcionesFin() {
    const g = gen(), d = dias();
    if (modo() === 'huevos') {
      const o = [72, 80, 90, 100].map(w => w * 7).filter(x => x > d + 6);
      return o.length ? o : [700];
    }
    const o = [];
    for (let x = g.carne.rango[0]; x <= g.carne.rango[1]; x += 7) if (x > d) o.push(x);
    return o.length ? o : [g.carne.rango[1]];
  }
  function dFin() {
    const g = gen(), ops = opcionesFin();
    const def = modo() === 'huevos' ? g.postura.fin * 7 : g.carne.venta;
    if (S.fin && ops.includes(S.fin)) return S.fin;
    if (ops.includes(def)) return def;
    return ops[0];
  }
  function realVisible() {
    const g = gen(), d = dias();
    if (modo() === 'huevos') return d >= (g.postura.w50 - 1) * 7;
    return d >= 3;
  }
  function estado() {
    const g = gen();
    const real = realVisible() && S.real !== null && S.real !== '' && isFinite(Number(S.real)) ? Number(S.real) : null;
    return { g, modo: modo(), dias: dias(), dFin: dFin(), aves: Math.round(S.aves), alt: Number(S.alt) || 0, enf: S.enf, real };
  }
  const selSet = () => new Set(S.sel);
  const enPostura = st => st.modo === 'huevos' && st.dias / 7 >= st.g.postura.w50 - 2;

  /* Paso al que se puede llegar: sin genética no hay lote; sin lote válido no hay manejo ni proyección. */
  const PASOS = ['genetica', 'lote', 'manejo', 'proyeccion'];
  function pasoPermitido(p) {
    let r = PASOS.includes(p) ? p : 'genetica';
    if (r !== 'genetica' && !gen()) r = 'genetica';
    if ((r === 'manejo' || r === 'proyeccion') && !loteValido()) r = 'lote';
    return r;
  }

  /* ---------------------------- Acciones de estado ---------------------------- */
  function elegirGenetica(id) {
    if (S.gid === id) return;
    const g = GENETICAS.find(x => x.id === id); if (!g) return;
    Object.assign(S, { gid: g.id, obj: 'huevos', sel: [], enf: null, fin: null, real: null });
    if (modoDe(g, S.obj) === 'carne') Object.assign(S, { unidad: 'dias', edad: 1 });
    else Object.assign(S, { unidad: 'semanas', edad: 20 });
    guardar();
  }
  function elegirObjetivo(v) {
    if (S.obj === v) return false;
    S.obj = v;
    Object.assign(S, { sel: [], enf: null, fin: null, real: null });
    Object.assign(S, S.obj === 'carne' ? { unidad: 'dias', edad: 1 } : { unidad: 'semanas', edad: 20 });
    guardar(); return true;
  }
  function elegirUnidad(u) {
    if (u === S.unidad) return false;
    const e = Number(S.edad);
    if (isFinite(e)) S.edad = u === 'dias' ? Math.round(e * 7) : Math.round(e / 7 * 10) / 10;
    S.unidad = u; guardar(); return true;
  }
  /* Botones − / + : mismos pasos que el original. Devuelve el valor nuevo. */
  function paso(campo, signo) {
    let v;
    if (campo === 'edad') {
      const e = Number(S.edad) || 0;
      v = S.edad = Math.max(0, Math.round((e + signo) * 10) / 10);
    } else {
      const a = Number(S.aves) || 0;
      const p = a >= 100 ? 10 : a >= 20 ? 5 : 1;
      v = S.aves = Math.max(1, a + signo * p);
    }
    S.fin = null; guardar(); return v;
  }
  /* Lo que escribe la persona en los campos del lote (mismas reglas que el original). */
  function escribir(campo, valor) {
    if (campo === 'edad') { S.edad = valor === '' ? null : Number(valor); S.fin = null; }
    else if (campo === 'aves') S.aves = valor === '' ? NaN : Math.round(Number(valor));
    else if (campo === 'alt') S.alt = Math.max(0, Math.min(4500, Number(valor) || 0));
    else if (campo === 'real') S.real = valor === '' ? null : Number(valor);
    guardar();
  }
  function marcar(id, si) {
    const s = selSet(); if (si) s.add(id); else s.delete(id);
    S.sel = [...s]; guardar();
  }
  function marcarTodo() {
    const st = estado(), M = construirManejo(st);
    const F = factores(st, M, selSet());
    if (F.indice >= 100) { S.sel = []; guardar(); return; }
    const s = selSet();
    for (const c of M.cats) if (c.items) for (const it of c.items) s.add(it.id);
    const enf = ENFERMEDADES.find(e => e.id === st.enf);
    if (enf) {
      enf.caseros.filter(x => /comprobad/i.test(x.ev) && (!x.solo || x.solo === st.modo)).forEach(x => s.add(x.id));
      const q = enf.quimicos.filter(x => !(x.noPostura && enPostura(st))).sort((a, b) => b.mit - a.mit)[0];
      if (q) s.add(q.id);
    }
    S.sel = [...s]; guardar();
  }

  /* ------------------------------ Cálculo ------------------------------ */
  function calcular() {
    const st = estado(), M = construirManejo(st), sel = selSet();
    const r = proyectar(st, M, sel);
    const Fstd = { f: 1, mortExtra: 0, shift: 0 };
    const stStd = Object.assign({}, st, { g: Object.assign({}, st.g, { campo: 1 }), real: null });
    const ref = st.modo === 'huevos' ? simHuevos(stStd, Fstd) : simCarne(stStd, Fstd);
    const br = brechas(st, M, sel, r);
    return { st, M, r, ref, br };
  }

  function textoResumen() {
    const { st, r } = calcular();
    const h = r.tipo === 'huevos';
    const L = [`Appollo · ${st.g.nombre}`, `${fmt(st.aves)} aves de ${edadTxt()} · ${fmt(st.alt)} msnm`, `Fase: ${fase(st.g, st.modo, st.dias).n}`, `Índice de manejo: ${r.F.indice} %`];
    if (h) L.push(`Proyección a la semana ${Math.round(st.dFin / 7)}: ${fmt(r.huevos)} huevos (${fmt(r.cubetas)} cubetas de 30), ${fmt(r.huevosAve)} por ave`, `Peso medio del huevo: ${fmt(r.pesoHuevo, 1)} g · Alimento por docena: ${fmt(r.kgDocena, 2)} kg`);
    else L.push(`Proyección a ${st.dFin} días: ${fmt(r.pesoFin / 1000, 2)} kg por ave, ${fmt(r.kgVivo)} kg en pie`, `Conversión acumulada: ${fmt(r.caAcum, 2)} · Viabilidad: ${fmt(r.viab, 1)} %`);
    L.push(`Fecha: ${new Date().toLocaleDateString('es-EC')}`);
    return L.join('\n');
  }

  /* Datos para "Crear lote con este plan" (los consume una vez la vista Nuevo lote). */
  function datosLote() {
    if (!loteValido()) return null;
    return { genetica: S.gid, aves: Math.round(S.aves), altitud: Number(S.alt) || 0, edadDias: dias() };
  }

  /* Vuelve a dibujar el paso y devuelve el foco al mismo control (mismo data-accion y data-v / data-u,
     o el mismo id para el selector de enfermedad): sin esto el foco del teclado caería en <body>. */
  async function refrescar(el) {
    let sel = null;
    if (el && el.id) sel = '#' + CSS.escape(el.id);
    else if (el && el.dataset && el.dataset.accion) {
      sel = `[data-accion="${CSS.escape(el.dataset.accion)}"]`;
      for (const k of ['v', 'u']) if (el.dataset[k] !== undefined) sel += `[data-${k}="${CSS.escape(el.dataset[k])}"]`;
    }
    await App.refrescar();
    // Si el control exacto ya no existe (p. ej. cambiaron los atajos), se cae a otro de la misma acción y,
    // en último caso, a la vista misma (tabindex -1), nunca a <body>.
    const base = el && el.dataset && el.dataset.accion ? `[data-accion="${CSS.escape(el.dataset.accion)}"]` : null;
    const nuevo = (sel && document.querySelector('#view ' + sel)) || (base && document.querySelector('#view ' + base)) || document.getElementById('view');
    if (nuevo) { try { nuevo.focus({ preventScroll: true }); } catch (e) { /* sin foco */ } }
  }

  return { S, BASE, refrescar, precios, guardar, guardarPrecios, gen, modo, dias, edadTxt, edadCorta, maxDias, errorEdad, avesOk, loteValido,
    opcionesFin, dFin, realVisible, estado, selSet, enPostura, PASOS, pasoPermitido, elegirGenetica, elegirObjetivo, elegirUnidad,
    paso, escribir, marcar, marcarTodo, calcular, textoResumen, datosLote };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Planificar, paso 3: recomendaciones de manejo.
   Categorías de construirManejo(st), índice de manejo de factores(), marcar todo,
   selector de problema sanitario con remedios caseros y control químico (tiempo de retiro;
   los tratamientos no aptos en postura quedan bloqueados). Misma lógica que el original.
   ========================================================================= */
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

const PlanManejo = (function () {
  'use strict';
  const P = PlanEstado;
  const $v = s => document.querySelector('#view ' + s);

  function nivel(it) {
    const p = it.prod + 1.5 * it.mort;
    if (p >= 9) return ['alto', 'Impacto alto'];
    if (p >= 4) return ['medio', 'Impacto medio'];
    return ['bajo', 'Impacto bajo'];
  }
  const tag = (clase, texto) => `<span class="plan-tag plan-tag-${clase}">${esc(texto)}</span>`;
  /* `titulo` llega ya escapado (lo arma catHTML). */
  function itemHTML(it, sel, extra = '', bloqueado = false, titulo = null) {
    const [c, l] = it.prod !== undefined ? nivel(it) : ['', ''];
    return `<label class="plan-item${bloqueado ? ' plan-item-bloqueado' : ''}"><input type="checkbox" data-sel="${esc(it.id)}" ${sel.has(it.id) && !bloqueado ? 'checked' : ''} ${bloqueado ? 'disabled' : ''}>
      <span class="plan-caja" aria-hidden="true"></span>${tieneIlustracion('itemRecomendacion', it.id) ? Ilustracion(ilustracionDe('itemRecomendacion', it.id), { tamano: 'mini' }) : ''}
      <span class="plan-item-texto"><span class="plan-item-t">${titulo || esc(it.n)}</span>${it.det ? `<span class="plan-item-d">${esc(it.det)}</span>` : ''}
      <span class="plan-tags">${it.clave ? tag('clave', 'Esencial') : ''}${c ? tag(c, l) : ''}${extra}</span></span></label>`;
  }
  function cuenta(c, sel, st) {
    if (c.sanidad) {
      const enf = ENFERMEDADES.find(e => e.id === st.enf);
      const lista = c.id === 'casero' ? (enf ? enf.caseros.filter(x => !x.solo || x.solo === st.modo) : PREVENTIVOS_CASEROS) : (enf ? enf.quimicos : []);
      if (!lista.length) return '';
      return `${lista.filter(x => sel.has(x.id)).length}/${lista.length}`;
    }
    return `${c.items.filter(x => sel.has(x.id)).length}/${c.items.length}`;
  }
  const aviso = (texto, suave) => `<div class="plan-aviso${suave ? ' plan-aviso-suave' : ''}">${icono(suave ? 'info' : 'aviso')}<span>${texto}</span></div>`;
  const nota = t => `<p class="reg-ayuda">${esc(t)}</p>`;

  function catHTML(c, st, sel) {
    let body = '';
    if (c.filas) body += `<dl class="plan-tabla">${c.filas.map(f => `<div><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join('')}</dl>`;
    if (c.id === 'vac') {
      body += `<div class="plan-items">${c.items.map(it => {
        const et = { pasada: ['pasada', 'Edad pasada: marca si se aplicó'], ahora: ['ahora', 'Toca esta semana'], proxima: ['proxima', 'Próxima'], vigente: ['vigente', 'En curso'] }[it.estado] || ['proxima', ''];
        return itemHTML(it, sel, et[1] ? tag('estado-' + et[0], et[1]) : '', false, `<span class="plan-vac-edad">${esc(it.repite ? 'Desde sem. 20' : P.edadCorta(it.edad))}</span> · ${esc(it.n)}`);
      }).join('')}</div>`;
    } else if (c.id === 'casero') {
      const enf = ENFERMEDADES.find(e => e.id === st.enf);
      body += `<div class="reg-campo"><label class="reg-etiqueta" for="plan-enf">¿Hay algún problema sanitario en el lote?</label>
        <select id="plan-enf" class="reg-select"><option value="">Ninguno, el lote está sano</option>
        ${c.enfermedades.map(e => `<option value="${esc(e.id)}" ${st.enf === e.id ? 'selected' : ''}>${esc(e.n)}</option>`).join('')}</select></div>`;
      if (enf) {
        body += `<p class="plan-signos"><b>Signos:</b> ${esc(enf.signos)}</p>`;
        if (enf.alerta) body += aviso(esc(enf.alerta));
        const cas = enf.caseros.filter(x => !x.solo || x.solo === st.modo);
        if (cas.length) body += `<div class="plan-items">${cas.map(it => itemHTML(it, sel, tag('ev', it.ev))).join('')}</div>`;
        else body += nota('No hay un remedio casero eficaz para este problema.');
        if (enf.nota) body += nota(enf.nota);
      } else {
        body += nota('Opcionales y de apoyo. No reemplazan las vacunas ni la bioseguridad.') +
          `<div class="plan-items">${PREVENTIVOS_CASEROS.map(it => itemHTML(it, sel, tag('ev', it.ev))).join('')}</div>`;
      }
    } else if (c.id === 'quim') {
      const enf = ENFERMEDADES.find(e => e.id === st.enf);
      const enPostura = P.enPostura(st);
      if (!enf) {
        body += aviso('Sin un problema diagnosticado no se recomienda medicar. Los antibióticos preventivos crean resistencia y dejan residuos en huevos y carne. Si aparece un problema, elígelo en <b>Remedios caseros</b>.', true);
      } else if (!enf.quimicos.length) {
        body += enf.alerta ? aviso(`No existe tratamiento. ${esc(enf.alerta)}`) : nota(`No hay tratamiento químico eficaz. ${enf.nota || ''}`);
      } else {
        body += aviso('Úsalos solo con diagnóstico y receta de un médico veterinario. Respeta el tiempo de retiro: no vendas ni consumas huevos o carne durante ese período. Dosis de referencia; confirma siempre en la etiqueta.');
        body += `<div class="plan-items">${enf.quimicos.map(it => {
          const bloq = it.noPostura && enPostura;
          return itemHTML(it, sel, `${bloq ? tag('alto', 'No apto en postura') : ''}${tag('ev', 'Retiro: ' + it.retiro)}`, bloq);
        }).join('')}</div>`;
        if (enf.nota) body += nota(enf.nota);
      }
    } else if (c.items && c.items.length) {
      body += `<div class="plan-items">${c.items.map(it => itemHTML(it, sel)).join('')}</div>`;
    }
    if (c.notas) body += c.notas.map(nota).join('');
    const n = cuenta(c, sel, st);
    return `<section class="tarjeta plan-cat" id="cat-${esc(c.id)}">
      <header class="tarjeta-cab"><span class="tarjeta-il">${Ilustracion(ilustracionDe('recomendacion', c.id), { tamano: 'media' })}</span><h2 class="tarjeta-titulo plan-cat-titulo">${esc(c.n)}</h2><span class="plan-cuenta num" data-cuenta="${esc(c.id)}">${n}</span></header>
      <div class="plan-cat-cuerpo">${body}</div></section>`;
  }

  const medidor = ind => `<div class="plan-medidor${ind >= 85 ? ' plan-medidor-bueno' : ind < 50 ? ' plan-medidor-malo' : ''}" aria-hidden="true"><span style="width:${ind}%"></span></div>`;

  function html() {
    const st = P.estado(), M = construirManejo(st), sel = P.selSet();
    const F = factores(st, M, sel);
    return `<h1>Recomendaciones de manejo</h1>
  <p class="pantalla-texto">${esc(st.g.nombre)} de ${esc(P.edadTxt())} · <b>${esc(M.fase.n)}</b>. Marca lo que vas a aplicar: la proyección cambia con cada elección.</p>
  <div class="tarjeta plan-resumen">
    <div class="plan-indice-fila"><div><p class="eyebrow">Índice de manejo</p><p class="plan-indice-num num" id="plan-indice">${F.indice} %</p></div>
      ${Boton({ texto: F.indice >= 100 ? 'Desmarcar todo' : 'Marcar lo recomendado', variante: 'secundario', accion: 'plan-todo' })}</div>
    ${medidor(F.indice)}
  </div>
  <nav class="plan-saltos" aria-label="Secciones">${M.cats.map(c => `<button type="button" class="selector-btn" data-accion="plan-cat" data-v="${esc(c.id)}">${esc(c.n)}</button>`).join('')}</nav>
  ${M.cats.map(c => catHTML(c, st, sel)).join('')}
  <div class="reg-acciones plan-acciones">${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'plan-ir', datos: { paso: 'lote' } })}${
    Boton({ texto: 'Ver proyección', icono: 'sig', variante: 'primario', accion: 'plan-ir', datos: { paso: 'proyeccion' } })}</div>`;
  }

  /* Al marcar o desmarcar: índice, medidor, botón y cuentas sin volver a dibujar (como vivoManejo). */
  function vivo() {
    const st = P.estado(), M = construirManejo(st), sel = P.selSet();
    const F = factores(st, M, sel);
    $v('#plan-indice').textContent = F.indice + ' %';
    const m = $v('.plan-resumen .plan-medidor');
    if (m) m.outerHTML = medidor(F.indice);
    const b = $v('[data-accion="plan-todo"] .btn-texto');
    if (b) b.textContent = F.indice >= 100 ? 'Desmarcar todo' : 'Marcar lo recomendado';
    for (const c of M.cats) { const el = $v(`[data-cuenta="${c.id}"]`); if (el) el.textContent = cuenta(c, sel, st); }
  }

  function montar(raiz) {
    raiz.addEventListener('change', e => {
      const t = e.target;
      if (t.matches('input[data-sel]')) { if (t.disabled) return; P.marcar(t.dataset.sel, t.checked); vivo(); }
      else if (t.id === 'plan-enf') { P.S.enf = t.value || null; P.guardar(); P.refrescar(t); }
    });
  }

  ACCIONES['plan-todo'] = el => { P.marcarTodo(); P.refrescar(el); };
  ACCIONES['plan-cat'] = el => {
    const c = document.getElementById('cat-' + el.dataset.v);
    if (c) c.scrollIntoView({ behavior: reducirMovimiento() ? 'auto' : 'smooth', block: 'start' });
  };

  return { html, montar };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Planificar, paso 4: proyección.
   Cifras de proyectar() con los mismos textos y redondeos del original, gráfico del
   estándar contra la proyección, "lo que más sumaría" (brechas), ingresos y margen con
   los precios de appollo.v1.precios, copiar el resumen y "Crear lote con este plan".
   ========================================================================= */
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

const PlanProyeccion = (function () {
  'use strict';
  const P = PlanEstado;
  const $v = s => document.querySelector('#view ' + s);

  /* Serie para Grafico: estándar desde el inicio del eje y proyección desde hoy (mismo eje que el original). */
  function grafico(st, r) {
    const est = [], real = [], et = [];
    if (r.tipo === 'huevos') {
      const w0 = st.dias / 7, p = st.g.postura;
      const x0 = w0 < 16 ? 0 : Math.max(16, Math.floor(w0) - 6);
      for (let w = x0; w < w0; w++) { est.push(hdStd(p, w)); real.push(null); et.push('Sem. ' + fmt(w)); }
      for (const q of r.serie) { est.push(hdStd(p, q.w)); real.push(q.hd); et.push('Sem. ' + fmt(q.w, q.w % 1 ? 1 : 0)); }
    } else {
      const c = st.g.carne, desde = {};
      for (const q of r.serie) desde[q.d] = q.p;
      for (let d = 0; d <= st.dFin; d++) { est.push(pesoStd(c, d) / 1000); real.push(d in desde ? desde[d] / 1000 : null); et.push('Día ' + d); }
    }
    const titulo = r.tipo === 'huevos' ? '% de postura por semana' : 'Peso por ave (kg) por día';
    return `<article class="tarjeta plan-grafico"><header class="tarjeta-cab"><h2 class="tarjeta-titulo">${titulo}</h2></header>${
      Grafico({ serieReal: real, serieEstandar: est, etiquetas: et, leyendaReal: 'Tu lote (proyección)', leyendaEstandar: 'Estándar ' + st.g.nombre })}</article>`;
  }

  function ecoHTML(r) {
    const precios = P.precios, h = r.tipo === 'huevos';
    const pv = parseFloat(String(h ? precios.cubeta : precios.kgVivo).replace(',', '.'));
    const pa = parseFloat(String(precios.kgAlim).replace(',', '.'));
    const ing = isFinite(pv) ? (h ? r.cubetas * pv : r.kgVivo * pv) : NaN;
    const cos = isFinite(pa) ? r.alimento * pa : NaN;
    const mar = ing - cos;
    const usd = x => isFinite(x) ? '$ ' + fmt(x, 2) : '—';
    return `<div><span>Ingreso por ${h ? 'huevos' : 'venta en pie'}</span><span class="num">${usd(ing)}</span></div>
      <div><span>Costo del alimento${h && r.alimRecria > 0 ? ' (con recría)' : ''}</span><span class="num">${usd(cos)}</span></div>
      <div class="plan-eco-total"><span>Margen sobre alimento</span><span class="num${isFinite(mar) ? (mar >= 0 ? ' plan-pos' : ' plan-neg') : ''}">${usd(mar)}</span></div>`;
  }

  function html() {
    const { st, r, ref, br } = P.calcular();
    const h = r.tipo === 'huevos';
    const pct = h ? (ref.huevos ? 100 * r.huevos / ref.huevos : 0) : 100 * r.pesoFin / ref.pesoFin;
    const ops = P.opcionesFin();
    let heroe;
    const kpis = [];
    if (h) {
      heroe = `<p class="eyebrow plan-heroe-titulo">Huevos del lote hasta la semana ${Math.round(st.dFin / 7)}</p>
        <p class="plan-heroe-num num">${fmt(r.huevos)}<small>huevos</small></p>
        <p class="plan-heroe-sub"><b>${fmt(r.cubetas)}</b> cubetas de 30 · ${fmt(r.huevosAve)} huevos por ave</p>`;
      if (r.hdHoy >= 5) kpis.push([fmt(r.hdHoy, 1), '%', 'Postura esperada esta semana']);
      else kpis.push([r.w50 ? 'Sem. ' + fmt(r.w50, 0) : '—', '', r.w50 ? 'Llega al 50 % de postura' : 'No llega al 50 % de postura']);
      kpis.push([fmt(r.pico, 1), '%', `Pico esperado (sem. ${fmt(r.wPico, 0)})`]);
      kpis.push([fmt(r.pesoHuevo, 1), 'g', 'Peso medio del huevo']);
      kpis.push([fmt(r.kgDocena, 2), 'kg', 'Alimento por docena de huevos']);
      kpis.push([fmt(r.conversion, 2), '', 'Conversión (kg alimento / kg huevo)']);
      kpis.push([fmt(r.vivasFin), 'aves', `Al final del ciclo (${fmt(r.viab, 1)} % viven)`]);
      kpis.push([fmt(r.alimento - r.alimRecria), 'kg', 'Alimento en postura (lote)']);
      if (r.alimRecria > 0) kpis.push([fmt(r.alimRecria), 'kg', 'Alimento de recría (lote)']);
      else kpis.push([fmt(r.masaKg), 'kg', 'Masa de huevo del lote']);
    } else {
      heroe = `<p class="eyebrow plan-heroe-titulo">Peso vivo por ave a los ${st.dFin} días</p>
        <p class="plan-heroe-num num">${fmt(r.pesoFin / 1000, 2)}<small>kg</small></p>
        <p class="plan-heroe-sub"><b>${fmt(r.kgVivo)}</b> kg en pie · ${fmt(r.kgCanal)} kg de canal</p>`;
      kpis.push([fmt(r.caAcum, 2), '', 'Conversión acumulada']);
      kpis.push([fmt(r.vivasFin), 'aves', `Para la venta (${fmt(r.viab, 1)} % viven)`]);
      kpis.push([fmt(r.alimento), 'kg', 'Alimento desde hoy (lote)']);
      kpis.push([fmt(r.caPeriodo, 2), '', 'Conversión desde hoy']);
      if (esBroiler(st.g)) kpis.push([fmt(r.iep), '', 'Índice de eficiencia productiva (IEP)']);
      else kpis.push([fmt(st.g.carne.rend), '%', 'Rendimiento a canal']);
      kpis.push([fmt(r.pesoStdFin / 1000, 2), 'kg', 'Peso estándar de la genética']);
    }
    const F = r.F;
    const avisos = [];
    if (F.altPeso > 0.5) avisos.push(h ? `Altitud de ${fmt(st.alt)} m: la proyección descuenta ${fmt(F.altPeso, 1)} % de producción.` : `Altitud de ${fmt(st.alt)} m: la proyección descuenta ${fmt(F.altPeso, 1)} % del crecimiento${F.altMort > 0.1 ? ` y suma ${fmt(F.altMort, 1)} puntos de mortalidad por ascitis` : ''}.`);
    if (F.enf) avisos.push(`${F.enf.n}: ${F.mit > 0 ? `con el tratamiento elegido se recupera cerca del ${fmt(F.mit * 100)} % de la pérdida.` : 'sin tratamiento, la pérdida se aplica completa.'}`);
    if (st.real != null) avisos.push(h ? `La proyección parte de tu ${fmt(st.real, 1)} % de postura actual.` : `La proyección parte de tu peso actual de ${fmt(st.real)} g.`);
    const unidadGana = h ? 'huevos' : 'kg';
    const ind = F.indice;
    const precio = (id, etiqueta, valor, ej) => `<div class="reg-campo"><label class="reg-etiqueta" for="${id}">${etiqueta}</label>
      <input class="reg-texto num" id="${id}" type="number" inputmode="decimal" step="0.01" min="0" placeholder="${ej}" value="${esc(valor)}"></div>`;
    return `<h1>Proyección de ${h ? 'huevos' : 'carne'}</h1>
  <p class="pantalla-texto plan-lead">${esc(st.g.nombre)} · ${fmt(st.aves)} aves de ${esc(P.edadTxt())} · ${fmt(st.alt)} msnm</p>
  <div class="reg-campo"><p class="reg-etiqueta" id="plan-lbl-fin">${h ? 'Proyectar hasta la semana' : 'Edad de venta'}</p>
    <div class="nl-presets" role="group" aria-labelledby="plan-lbl-fin">${ops.map(o =>
      `<button type="button" class="segmento-btn" data-accion="plan-fin" data-v="${o}" aria-pressed="${o === st.dFin}">${h ? 'Sem. ' + o / 7 : o + ' días'}</button>`).join('')}</div></div>
  <article class="tarjeta tarjeta-verde plan-heroe">${heroe}<p class="plan-vs">${fmt(pct)} % del estándar de la genética</p></article>
  <div class="plan-kpis">${kpis.map(k => `<div class="plan-kpi"><span class="plan-kpi-v num">${esc(k[0])}${k[1] ? `<small>${esc(k[1])}</small>` : ''}</span><span class="plan-kpi-l">${esc(k[2])}</span></div>`).join('')}</div>
  ${grafico(st, r)}
  <article class="tarjeta plan-mejoras">
    <div class="plan-indice-fila"><div><p class="eyebrow">Índice de manejo</p><p class="plan-indice-num num plan-indice-proy">${ind} %</p></div>
      ${Boton({ texto: 'Ajustar manejo', variante: 'secundario', accion: 'plan-ir', datos: { paso: 'manejo' } })}</div>
    <div class="plan-medidor${ind >= 85 ? ' plan-medidor-bueno' : ind < 50 ? ' plan-medidor-malo' : ''}" aria-hidden="true"><span style="width:${ind}%"></span></div>
    ${br.length ? `<h2 class="plan-sub">Lo que más sumaría a tu ${h ? 'producción' : 'lote'}</h2>
      <ul class="plan-brechas">${br.slice(0, 5).map(b => `<li><span class="plan-brecha-texto"><span class="plan-brecha-n">${esc(b.n)}</span><span class="plan-brecha-c">${esc(b.cat)}</span></span><span class="plan-brecha-g num">+${fmt(b.gana, 0)} ${unidadGana}</span></li>`).join('')}</ul>`
      : `<p class="reg-ayuda">Aplicas todas las prácticas recomendadas para esta fase.</p>`}
  </article>
  ${avisos.length ? `<div class="plan-aviso plan-aviso-suave">${icono('info')}<span>${avisos.map(esc).join('<br>')}</span></div>` : ''}
  <article class="tarjeta plan-precios">
    <header class="tarjeta-cab"><h2 class="tarjeta-titulo">Ingresos y margen</h2></header>
    <p class="reg-ayuda">Escribe tus precios en dólares para ver el margen sobre el alimento.</p>
    ${h ? precio('plan-p-cubeta', 'Precio de la cubeta de 30', P.precios.cubeta, 'Ej.: 3,60') : precio('plan-p-kg', 'Precio del kg en pie', P.precios.kgVivo, 'Ej.: 1,90')}
    ${precio('plan-p-alim', 'Costo del kg de alimento', P.precios.kgAlim, 'Ej.: 0,62')}
    <div class="plan-eco" id="plan-eco">${ecoHTML(r)}</div>
    <p class="reg-ayuda">No incluye compra de aves, mano de obra, energía ni medicamentos.</p>
  </article>
  <details class="plan-metodo"><summary>¿Cómo se calcula?</summary>
    <ul>
      <li>La curva parte del estándar publicado: ${esc(st.g.fuente)}.</li>
      <li>Se aplica un ajuste de campo del ${fmt((st.g.campo || 1) * 100)} % por la diferencia entre las condiciones de prueba de la casa genética y una granja típica.</li>
      <li>Cada práctica que no marcas descuenta producción y suma mortalidad según su importancia. Son coeficientes de referencia de la literatura técnica, no mediciones de tu granja.</li>
      <li>La altitud reduce el crecimiento del pollo de engorde y desde los 2.000 m suma riesgo de ascitis.</li>
      <li>Si escribes un dato real (postura o peso de hoy), la proyección parte de él y en unas 4 semanas se acerca al nivel que permite el manejo elegido.</li>
      <li>Úsala para planificar y compárala cada semana con tus registros.</li>
    </ul></details>
  <div class="rep-acciones plan-acciones plan-final">
    ${Boton({ texto: 'Copiar resumen', icono: 'copiar', variante: 'secundario', accion: 'plan-copiar', clase: 'btn-ancho' })}
    <div class="rep-copia plan-copia" hidden><label class="reg-etiqueta" for="plan-copia-texto">Selecciona y copia el resumen</label><textarea class="reg-texto rep-texto" id="plan-copia-texto" rows="7" readonly></textarea></div>
    ${Boton({ texto: 'Crear lote con este plan', icono: 'mas', variante: 'primario', accion: 'plan-crear-lote', clase: 'btn-ancho btn-grande' })}
    ${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'plan-ir', datos: { paso: 'manejo' }, clase: 'btn-ancho' })}
  </div>`;
  }

  function montar(raiz) {
    raiz.addEventListener('input', e => {
      const t = e.target, k = { 'plan-p-cubeta': 'cubeta', 'plan-p-kg': 'kgVivo', 'plan-p-alim': 'kgAlim' }[t.id];
      if (!k) return;
      P.precios[k] = t.value; P.guardarPrecios();
      const { r } = P.calcular(); $v('#plan-eco').innerHTML = ecoHTML(r);
    });
  }

  /* Portapapeles; si falla, textarea oculto + execCommand; si tampoco, caja visible para copiar a mano. */
  async function copiar(texto) {
    try { await navigator.clipboard.writeText(texto); return true; } catch (e) { /* respaldo */ }
    const ta = document.createElement('textarea');
    ta.value = texto; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    let ok = false;
    try { ta.focus(); ta.select(); ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  ACCIONES['plan-fin'] = el => { P.S.fin = Number(el.dataset.v); P.guardar(); P.refrescar(el); };
  ACCIONES['plan-copiar'] = async () => {
    if (!P.loteValido()) return;
    const txt = P.textoResumen();
    if (await copiar(txt)) { App.toast('Resumen copiado'); return; }
    const caja = $v('.plan-copia'), ta = $v('#plan-copia-texto');
    if (!caja || !ta) return;
    caja.hidden = false; ta.value = txt;
    ta.scrollIntoView({ block: 'center' }); ta.focus(); ta.select();
    App.toast('Copia el texto de la caja');
  };
  ACCIONES['plan-crear-lote'] = () => {
    const d = P.datosLote();
    if (!d) { App.ir('#/plan/lote'); return; }
    App.estado.prefillLote = d;
    App.ir('#/nuevo-lote');
  };

  return { html, montar };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Planificar (#/plan/genetica|lote|manejo|proyeccion).
   Enrutador de pasos, encabezado (Atrás + indicador de 4 pasos) y los pasos
   1 · Genética y 2 · Lote. Manejo y Proyección viven en planManejo.js y planProyeccion.js;
   el estado y las reglas, en planEstado.js (copiados del planificador original).
   ========================================================================= */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

(function () {
  'use strict';
  const P = PlanEstado, S = P.S;
  const NOMBRES = { genetica: 'Genética', lote: 'Lote', manejo: 'Manejo', proyeccion: 'Proyección' };
  const ATRAS = { lote: 'genetica', manejo: 'lote', proyeccion: 'manejo' };
  const $v = s => document.querySelector('#view ' + s);
  const apagado = (html, off) => (off ? html.replace('<button ', '<button disabled ') : html);

  /* ------------------------------ Encabezado ------------------------------ */
  function cabecera(paso) {
    const i = P.PASOS.indexOf(paso);
    const puede = k => k === 'genetica' || (k === 'lote' && P.gen()) || ((k === 'manejo' || k === 'proyeccion') && P.loteValido());
    const volver = ATRAS[paso]
      ? Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'plan-ir', datos: { paso: ATRAS[paso] }, clase: 'plan-volver' })
      : Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'ir', datos: { ruta: '#/mas' }, clase: 'plan-volver' });
    return `<div class="plan-cab">${volver}<p class="eyebrow">Planificar · Paso ${i + 1} de 4</p></div>
  <ol class="plan-pasos" aria-label="Pasos">${P.PASOS.map((k, j) => `<li class="plan-paso${j < i ? ' plan-paso-hecho' : ''}"${j === i ? ' aria-current="step"' : ''}>
    <button type="button" data-accion="plan-ir" data-paso="${k}"${puede(k) ? '' : ' disabled'}><span class="paso-barra" aria-hidden="true"></span><span class="plan-paso-nombre">${NOMBRES[k]}</span></button></li>`).join('')}</ol>`;
  }

  /* ============================ 1 · GENÉTICA ============================ */
  const FILTROS = [['todas', 'Todas'], ['postura', 'Postura'], ['carne', 'Carne'], ['doble', 'Doble propósito'], ['criolla', 'Criolla']];
  function listaGen() {
    return GENETICAS.filter(g => S.filtro === 'todas' || g.tipo === S.filtro).map(g => TarjetaGenetica({
      g, elegida: S.gid === g.id, accion: 'plan-genetica', clase: 'plan-gen',
      extra: `<span class="gen-desc">${esc(g.desc)}</span>
      <span class="plan-datos">${g.datos.map(d => `<span><span class="plan-dt">${esc(d[0])}</span><b class="num">${esc(d[1])}</b></span>`).join('')}</span>` })).join('');
  }
  function pasoGenetica() {
    return `<h1>¿Qué gallinas vas a manejar?</h1>
  <p class="pantalla-texto">Elige la genética. Cada línea tiene su propio estándar de producción y sus recomendaciones.</p>
  <div class="segmento" role="group" aria-label="Filtrar por tipo">${FILTROS.map(f =>
    `<button type="button" class="segmento-btn" data-accion="plan-filtro" data-v="${f[0]}" aria-pressed="${S.filtro === f[0]}">${f[1]}</button>`).join('')}</div>
  <div class="gen-lista">${listaGen()}</div>`;
  }

  /* ============================== 2 · LOTE ============================== */
  function presetsEdad() {
    const g = P.gen();
    if (P.modo() === 'huevos') return [[1, 'dias', '1 día'], [4, 'semanas', '4 sem'], [10, 'semanas', '10 sem'], [17, 'semanas', '17 sem'], [25, 'semanas', '25 sem'], [40, 'semanas', '40 sem'], [60, 'semanas', '60 sem']];
    if (esBroiler(g)) return [1, 7, 14, 21, 28, 35].map(d => [d, 'dias', d === 1 ? '1 día' : `${d} días`]);
    if (g.id === 'campero') return [1, 14, 28, 42, 56].map(d => [d, 'dias', d === 1 ? '1 día' : `${d} días`]);
    return [[1, 'dias', '1 día'], [4, 'semanas', '4 sem'], [8, 'semanas', '8 sem'], [12, 'semanas', '12 sem'], [16, 'semanas', '16 sem']];
  }
  const pasador = (c, valor, etiqueta, modoTeclado) => `<div class="contador">
    <button type="button" class="contador-btn contador-menos" data-accion="plan-menos" data-c="${c}" aria-label="Restar"><span aria-hidden="true">−</span></button>
    <input class="contador-valor num" id="plan-${c}" type="number" inputmode="${modoTeclado}" min="${c === 'edad' ? 0 : 1}" step="any" value="${esc(valor)}" aria-label="${etiqueta}" aria-describedby="plan-err-${c}">
    <button type="button" class="contador-btn contador-mas" data-accion="plan-mas" data-c="${c}" aria-label="Sumar"><span aria-hidden="true">+</span></button></div>`;
  function pasoLote() {
    const g = P.gen(), dual = g.tipo === 'doble' || g.tipo === 'criolla';
    const alts = [[100, 'Costa'], [400, 'Amazonía'], [1800, 'Valle'], [2800, 'Sierra']];
    const seg = (accion, actual, ops, etiqueta) => `<div class="segmento" role="group" aria-label="${etiqueta}">${ops.map(([v, t]) =>
      `<button type="button" class="segmento-btn" data-accion="${accion}" data-v="${v}" aria-pressed="${actual === v}">${t}</button>`).join('')}</div>`;
    return `<div class="cab-il">${Ilustracion('man-densidad', { tamano: 'mini' })}<h1>Datos del lote</h1></div>
  <p class="pantalla-texto">Con la edad, el número de aves y la altitud se ajustan las recomendaciones y la proyección.</p>
  <div class="plan-elegida"><div><b class="gen-nombre">${esc(g.nombre)}</b><p class="gen-desc">${esc(g.rasgo)} · ${esc(TIPOS[g.tipo].nombre)}</p></div>
    ${Boton({ texto: 'Cambiar', variante: 'secundario', accion: 'plan-ir', datos: { paso: 'genetica' } })}</div>
  ${dual ? `<div class="reg-campo"><p class="reg-etiqueta">¿Para qué las crías?</p>${seg('plan-obj', S.obj, [['huevos', 'Huevos'], ['carne', 'Carne']], '¿Para qué las crías?')}</div>` : ''}
  <div class="reg-campo"><label class="reg-etiqueta" for="plan-edad">Edad de las aves</label>
    ${seg('plan-unidad', S.unidad, [['dias', 'Días'], ['semanas', 'Semanas']], 'Unidad de edad')}
    ${pasador('edad', S.edad === null || S.edad === undefined ? '' : S.edad, 'Edad de las aves', 'decimal')}
    <div class="nl-presets" role="group" aria-label="Edades frecuentes">${presetsEdad().map(p =>
      `<button type="button" class="segmento-btn" data-accion="plan-preset" data-v="${p[0]}" data-u="${p[1]}">${p[2]}</button>`).join('')}</div>
    <div id="plan-fase-vivo"></div>
    <p class="reg-error plan-error" id="plan-err-edad" role="alert"></p></div>
  <div class="reg-campo"><label class="reg-etiqueta" for="plan-aves">Número de aves vivas</label>
    ${pasador('aves', Number.isFinite(S.aves) ? S.aves : '', 'Número de aves vivas', 'numeric')}
    <p class="reg-error plan-error" id="plan-err-aves" role="alert"></p></div>
  <div class="reg-campo"><label class="reg-etiqueta" for="plan-alt">Altitud de la granja (msnm)</label>
    <input class="reg-texto num" id="plan-alt" type="number" inputmode="numeric" min="0" max="4500" step="50" value="${esc(S.alt)}">
    <div class="nl-presets" role="group" aria-label="Zonas">${alts.map(a =>
      `<button type="button" class="segmento-btn" data-accion="plan-alt" data-v="${a[0]}" aria-pressed="${Number(S.alt) === a[0]}">${a[1]} · ${fmt(a[0])} m</button>`).join('')}</div>
    <p class="reg-ayuda" id="plan-ayuda-alt"></p></div>
  <div id="plan-real-vivo"></div>
  <div class="reg-acciones plan-acciones">${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'plan-ir', datos: { paso: 'genetica' } })}${
    apagado(Boton({ texto: 'Ver recomendaciones', icono: 'sig', variante: 'primario', accion: 'plan-siguiente' }), !P.loteValido())}</div>`;
  }

  /* Partes del paso Lote que cambian mientras se escribe (como vivoLote del original). */
  function vivoLote() {
    const g = P.gen(); if (!g || !$v('#plan-edad')) return;
    const err = P.errorEdad();
    $v('#plan-err-edad').textContent = err;
    $v('#plan-err-aves').textContent = P.avesOk() ? '' : 'Escribe cuántas aves tienes: de 1 a 1.000.000.';
    const f = $v('#plan-fase-vivo');
    if (err) f.innerHTML = '';
    else { const ph = fase(g, P.modo(), P.dias()); f.innerHTML = `<p class="plan-fase">${icono('huevo')}<span>Fase: <b>${esc(ph.n)}</b> · ${esc(ph.r)}</span></p>`; }
    const alt = Number(S.alt) || 0;
    $v('#plan-ayuda-alt').textContent = P.modo() === 'carne' && esBroiler(g) && alt >= 2000 ? 'Sobre 2.000 m el pollo de engorde crece menos y tiene más riesgo de ascitis. La app lo incluye en la proyección.'
      : alt >= 2000 ? 'En zona alta las noches son frías: la app ajusta las recomendaciones de temperatura.' : 'La altitud ajusta temperatura, densidad y riesgo de ascitis.';
    document.querySelectorAll('#view [data-accion="plan-alt"]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === S.alt)));
    const rv = $v('#plan-real-vivo');
    if (!err && P.realVisible()) {
      const h = P.modo() === 'huevos';
      if (rv.dataset.tipo !== (h ? 'h' : 'c')) {
        rv.dataset.tipo = h ? 'h' : 'c';
        rv.innerHTML = `<div class="reg-campo"><label class="reg-etiqueta" for="plan-real">${h ? '% de postura actual' : 'Peso promedio actual (g)'} <span class="plan-opcional">· opcional</span></label>
          <input class="reg-texto num" id="plan-real" type="number" inputmode="decimal" min="0" step="${h ? '0.1' : '1'}" placeholder="${h ? 'Ej.: 88' : 'Ej.: 1250'}" value="${esc(S.real === null ? '' : S.real)}">
          <p class="reg-ayuda">${h ? 'Huevos recogidos ayer ÷ aves vivas × 100.' : 'Pesa 1 de cada 20 aves y saca el promedio.'} Con este dato la proyección parte de lo que hoy produce tu lote.</p></div>`;
      }
    } else { rv.innerHTML = ''; delete rv.dataset.tipo; }
    const btn = $v('[data-accion="plan-siguiente"]'); if (btn) btn.disabled = !P.loteValido();
  }

  /* ============================== Vista ============================== */
  VISTAS.planificar = async function (params) {
    const pedido = (params && params.paso) || 'genetica', paso = P.pasoPermitido(pedido);
    if (paso !== pedido || location.hash !== '#/plan/' + paso) history.replaceState(null, '', '#/plan/' + paso);
    const cuerpo = paso === 'genetica' ? pasoGenetica() : paso === 'lote' ? pasoLote() : paso === 'manejo' ? PlanManejo.html() : PlanProyeccion.html();
    return `<section class="pantalla planificar" data-paso="${paso}">${cabecera(paso)}${cuerpo}</section>`;
  };
  VISTAS.planificar.montar = function (raiz) {
    const sec = raiz.querySelector('.planificar'); if (!sec) return;
    const paso = sec.dataset.paso;
    if (paso === 'lote') {
      vivoLote();
      raiz.addEventListener('input', e => {
        const id = e.target.id;
        if (id === 'plan-edad' || id === 'plan-aves' || id === 'plan-alt' || id === 'plan-real') { P.escribir(id.slice(5), e.target.value); if (id !== 'plan-real') vivoLote(); }
      });
    } else if (paso === 'manejo') PlanManejo.montar(raiz);
    else if (paso === 'proyeccion') PlanProyeccion.montar(raiz);
  };

  /* ------------------------------ Acciones ------------------------------ */
  ACCIONES['plan-ir'] = el => App.ir('#/plan/' + el.dataset.paso);
  ACCIONES['plan-filtro'] = el => { S.filtro = el.dataset.v; P.guardar(); P.refrescar(el); };
  ACCIONES['plan-genetica'] = el => { P.elegirGenetica(el.dataset.id); App.ir('#/plan/lote'); };
  ACCIONES['plan-obj'] = el => { if (P.elegirObjetivo(el.dataset.v)) P.refrescar(el); };
  ACCIONES['plan-unidad'] = el => { if (P.elegirUnidad(el.dataset.v)) P.refrescar(el); };
  ACCIONES['plan-preset'] = el => { S.edad = Number(el.dataset.v); S.unidad = el.dataset.u; S.fin = null; P.guardar(); P.refrescar(el); };
  ACCIONES['plan-alt'] = el => { S.alt = Number(el.dataset.v); P.guardar(); const i = $v('#plan-alt'); if (i) i.value = S.alt; vivoLote(); };
  const pasoBtn = (el, signo) => { const v = P.paso(el.dataset.c, signo); const i = $v('#plan-' + el.dataset.c); if (i) i.value = v; vivoLote(); };
  ACCIONES['plan-mas'] = el => pasoBtn(el, 1);
  ACCIONES['plan-menos'] = el => pasoBtn(el, -1);
  ACCIONES['plan-siguiente'] = () => { if (P.loteValido()) App.ir('#/plan/manejo'); else vivoLote(); };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Registro rápido (hoja inferior): ＋ → tipo → Guardar (3 toques).
   Registrar.abrir(tipo?) abre la hoja; con `tipo` salta directo a la pantalla de valor.
   Registro: {id, loteId, fecha (hoyLocal), tipo, datos, creado}.
   ========================================================================= */
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

const Registrar = (function () {
  'use strict';
  const TIPOS = [
    { id: 'mortalidad', texto: 'Mortalidad', icono: 'cruz' },
    { id: 'alimento', texto: 'Alimento', icono: 'saco' },
    { id: 'huevos', texto: 'Huevos', icono: 'huevo' },
    { id: 'peso', texto: 'Peso', icono: 'balanza' },
    { id: 'vacuna', texto: 'Vacuna', icono: 'jeringa' },
    { id: 'sanidad', texto: 'Sanidad', icono: 'termo' },
  ];
  const CAUSAS = ['Enfermedad', 'Calor', 'Aplastamiento', 'Depredador', 'Desconocida'];
  const DIARIOS = ['alimento', 'huevos', 'mortalidad', 'peso'];
  const SUMABLES = ['alimento', 'huevos', 'mortalidad']; // sumar pesos no tiene sentido
  const UNIDAD = { mortalidad: 'aves', alimento: 'kg', huevos: 'huevos', peso: 'g' };

  let st = null; // {lotes, loteId, tipo, registros, vacunas, vacunaId, guardando, existente}
  const $h = s => { const c = App.hojaAbierta(); return c ? c.querySelector(s) : null; };
  const lote = () => st && st.lotes.find(l => l.id === st.loteId);
  const gen = l => (typeof GENETICAS !== 'undefined' ? GENETICAS.find(g => g.id === l.genetica) : null);
  const esCarne = l => { const g = gen(l); return !!g && modoDe(g) === 'carne'; };
  const redondear = (x, d) => { const f = Math.pow(10, d); return Math.round(x * f) / f; };
  const num = id => { const el = $h('#' + id); return el ? (el.value === '' ? NaN : Number(el.value)) : NaN; };
  const txt = id => { const el = $h('#' + id); return el ? el.value.trim() : ''; };
  const vivasHoy = () => Math.max(0, avesVivas(lote(), st.registros, hoyLocal()));

  /* ------------------------------ Pantallas ------------------------------ */
  function poner(titulo, html) {
    const c = App.hojaAbierta();
    if (!c) return;
    c.querySelector('.hoja-titulo').textContent = titulo;
    c.querySelector('.hoja-cuerpo').innerHTML = html;
  }

  const htmlTipos = () => `<div class="hoja-rejilla">${TIPOS.map(t =>
    `<button type="button" class="btn btn-secundario reg-tipo-btn" data-accion="reg-tipo" data-tipo="${t.id}">${Ilustracion(ilustracionDe('registro', t.id), { tamano: 'mini' })}<span class="btn-texto">${esc(t.texto)}</span></button>`).join('')}</div>`;

  const htmlSinLotes = () => `<div class="reg-vacio">
  <div class="vacia-ilustracion" aria-hidden="true">${Ilustracion(ilustracionDe('estado', 'sin-lotes'), { tamano: 'grande' })}</div>
