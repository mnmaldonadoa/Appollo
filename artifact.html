<script>
/* Appollo · Gráfico de líneas en SVG: real (verde, continua) contra estándar (cielo, discontinua).
   Tolera series vacías, de un punto, con nulos o de distinto largo sin producir NaN.
   leyendaReal / leyendaEstandar (opcionales) cambian los textos de la leyenda. */

function Grafico({ serieReal, serieEstandar, etiquetas, leyendaReal, leyendaEstandar } = {}) {
  const W = 320, H = 150, PX = 10, PY = 14;
  const lista = s => (Array.isArray(s) ? s.map(v => (v === null || v === '' || v === undefined ? NaN : Number(v))) : []);
  const real = lista(serieReal), est = lista(serieEstandar);
  const ets = Array.isArray(etiquetas) ? etiquetas : [];
  const n = Math.max(real.length, est.length, ets.length);
  const vals = real.concat(est).filter(Number.isFinite);
  const f = v => (Math.round(v * 10) / 10).toString();

  let lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 1;
  if (hi - lo < 1e-9) { const d = Math.abs(hi) * 0.1 || 1; lo -= d; hi += d; }
  const m = (hi - lo) * 0.12; lo -= m; hi += m;
  const x = i => (n <= 1 ? W / 2 : PX + (i * (W - 2 * PX)) / (n - 1));
  const y = v => PY + ((hi - v) * (H - 2 * PY)) / (hi - lo);

  // Tramos continuos de puntos válidos; un punto aislado se dibuja como círculo.
  function trazar(serie, clase, extra) {
    let d = '', puntos = '', tramo = [];
    const cerrar = () => {
      if (tramo.length === 1) puntos += `<circle class="${clase}-punto" cx="${f(x(tramo[0]))}" cy="${f(y(serie[tramo[0]]))}" r="4"/>`;
      else if (tramo.length > 1) d += tramo.map((i, k) => (k ? 'L' : 'M') + f(x(i)) + ' ' + f(y(serie[i]))).join('');
      tramo = [];
    };
    serie.forEach((v, i) => (Number.isFinite(v) ? tramo.push(i) : cerrar()));
    cerrar();
    return (d ? `<path class="${clase}" d="${d}" fill="none"${extra}/>` : '') + puntos;
  }

  const rejilla = [0.25, 0.5, 0.75].map(t => `<line class="grafico-rejilla" x1="0" x2="${W}" y1="${f(PY + t * (H - 2 * PY))}" y2="${f(PY + t * (H - 2 * PY))}"/>`).join('');
  const base = `<line class="grafico-base" x1="0" x2="${W}" y1="${H - 1}" y2="${H - 1}"/>`;
  let ult = '';
  for (let i = real.length - 1; i >= 0; i--) if (Number.isFinite(real[i])) { ult = `<circle class="grafico-ultimo" cx="${f(x(i))}" cy="${f(y(real[i]))}" r="5.5"/>`; break; }

  const hayDatos = vals.length > 0;
  const svg = `<svg class="grafico-svg" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">${rejilla}${base}${hayDatos
    ? trazar(est, 'grafico-estandar', ' stroke-dasharray="7 6"') + trazar(real, 'grafico-real', ' pathLength="1"') + ult : ''}</svg>`;

  const primera = ets.length ? ets[0] : '', ultima = ets.length > 1 ? ets[ets.length - 1] : '';
  const ejes = hayDatos && (primera !== '' || ultima !== '')
    ? `<div class="grafico-ejes"><span>${esc(primera)}</span><span>${esc(ultima)}</span></div>` : '';
  const ultimoReal = real.filter(Number.isFinite).pop();
  const resumen = hayDatos
    ? `Gráfico de ${n} ${n === 1 ? 'punto' : 'puntos'}: real${ultimoReal !== undefined ? ' último ' + formatoNumero(ultimoReal) : ''} contra estándar`
    : 'Gráfico sin datos';
  return `<figure class="grafico${hayDatos ? '' : ' grafico-vacio'}" role="img" aria-label="${esc(resumen)}">
  ${svg}${hayDatos ? '' : `<p class="grafico-aviso">Aún no hay datos para graficar</p>`}
  ${ejes}
  <figcaption class="grafico-leyenda"><span class="ley ley-real">${esc(leyendaReal || 'Real')}</span><span class="ley ley-estandar">${esc(leyendaEstandar || 'Estándar')}</span></figcaption>
</figure>`;
}

<script>
/* Appollo · Animaciones pequeñas. Con prefers-reduced-motion todo ocurre al instante. */

function reducirMovimiento() {
  try { return typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch (e) { return false; }
}

/* Cuenta desde la cifra que muestra el elemento hasta `hasta`. Devuelve una promesa. */
function contar(el, hasta, ms) {
  const fin = Number(hasta);
  if (!el || !Number.isFinite(fin)) return Promise.resolve();
  const dec = Number.isInteger(fin) ? 0 : Math.min(2, (String(fin).split('.')[1] || '').length);
  const pinta = v => { el.textContent = formatoNumero(v, dec); };
  if (el._contar) cancelAnimationFrame(el._contar);
  const desde = Number(String(el.textContent || '').replace(/[^\d,-]/g, '').replace(',', '.')) || 0;
  if (reducirMovimiento() || desde === fin || typeof requestAnimationFrame !== 'function') { pinta(fin); return Promise.resolve(); }
  const dur = ms || 700;
  return new Promise(res => {
    let t0 = null;
    const paso = t => {
      if (t0 === null) t0 = t;
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      pinta(desde + (fin - desde) * e);
      if (p < 1) el._contar = requestAnimationFrame(paso);
      else { el._contar = 0; pinta(fin); res(); }
    };
    el._contar = requestAnimationFrame(paso);
  });
}

/* Dibuja una palomita verde dentro de `el` (círculo que aparece y trazo que se dibuja). */
function palomita(el) {
  if (!el) return Promise.resolve();
  el.innerHTML = '<svg class="palomita" viewBox="0 0 52 52" aria-hidden="true" focusable="false">' +
    '<circle class="palomita-circulo" cx="26" cy="26" r="23"/>' +
    '<path class="palomita-trazo" d="M15 27.5l7.2 7.2L37.5 19" pathLength="1"/></svg>';
  if (reducirMovimiento() || typeof Element.prototype.animate !== 'function') return Promise.resolve();
  const c = el.querySelector('.palomita-circulo'), p = el.querySelector('.palomita-trazo');
  const a1 = c.animate([{ transform: 'scale(.4)', opacity: 0 }, { transform: 'scale(1.08)', opacity: 1, offset: 0.7 }, { transform: 'scale(1)', opacity: 1 }],
    { duration: 320, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' });
  const a2 = p.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
    { duration: 300, delay: 180, easing: 'cubic-bezier(.6,0,.3,1)', fill: 'backwards' });
  return Promise.all([a1.finished, a2.finished]).then(() => {}, () => {});
}

/* Vibración corta si el teléfono la permite. */
function vibrar(ms) {
  try { if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') navigator.vibrate(ms || 30); }
  catch (e) { /* sin vibración */ }
}

<script>
/* =========================================================================
   APPOLLO · Ajustes: granja, precios, tema y respaldo de datos (exportar / importar .json).
   Granja y precios viven en el registro único del almacén 'granja' (precios: {cubeta, kgAlimento, kgPeso}).

  const TIPOS = [['postura', 'Postura'], ['carne', 'Carne'], ['ambas', 'Ambas']];
  const TEMAS = [['claro', 'Claro'], ['oscuro', 'Oscuro'], ['auto', 'Automático']];
  const PRECIOS = [['cubeta', 'Precio de la cubeta de 30 huevos', 'Ej.: 3,60'], ['kgAlimento', 'Precio del kg de alimento', 'Ej.: 0,62'], ['kgPeso', 'Precio del kg de ave en pie', 'Ej.: 1,90']];
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } };
  const $v = s => document.querySelector('#view ' + s);
  let tipoSel = null, textoRespaldo = null;
  const temaActual = () => { const t = lsGet(K_TEMA); return t === 'claro' || t === 'oscuro' ? t : 'auto'; };
  const numTxt = x => (typeof x === 'number' && Number.isFinite(x) ? String(x).replace('.', ',') : '');

  function msg(id, texto, ok) {
    const p = $v('#' + id);
    if (!p) return;
    p.textContent = texto || '';
    p.hidden = !texto;
    p.classList.toggle('reg-error', !ok);
    p.classList.toggle('aj-ok', !!ok);
    if (texto && !ok) p.scrollIntoView({ block: 'nearest' });
  }

  VISTAS.ajustes = async function () {
    const g = (await DB.obtener('granja', 'granja')) || App.estado.granja || {}, pr = g.precios || {};
    tipoSel = TIPOS.some(t => t[0] === g.tipo) ? g.tipo : null;
    const tema = temaActual();
    const puedeCompartir = typeof navigator.canShare === 'function' && typeof File === 'function' && (() => {
      try { return navigator.canShare({ files: [new File(['{}'], 'a.json', { type: 'application/json' })] }); } catch (e) { return false; }
    })();
    return `<section class="pantalla ajustes">
  <h1>Ajustes</h1>
  <div class="aj-seccion"><h2>Mi granja</h2>
    <div class="reg-campo"><label class="reg-etiqueta" for="aj-nombre">Nombre de la granja</label>
      <input class="reg-texto" id="aj-nombre" type="text" maxlength="60" autocomplete="off" value="${esc(g.nombre || '')}" aria-describedby="aj-granja-msg"></div>
    <div class="reg-campo"><p class="reg-etiqueta" id="aj-tipo-et">¿Qué aves crías?</p>
      <div class="segmento" role="group" aria-labelledby="aj-tipo-et">${TIPOS.map(([id, t]) =>
        `<button type="button" class="segmento-btn" data-accion="aj-tipo" data-tipo="${id}" aria-pressed="${id === tipoSel}">${t}</button>`).join('')}</div></div>
    <p id="aj-granja-msg" role="alert" hidden></p>
    ${Boton({ texto: 'Guardar granja', icono: 'escudo', variante: 'primario', accion: 'aj-guardar-granja', clase: 'btn-ancho' })}
  </div>
  <div class="aj-seccion"><h2>Mis precios</h2>
    <p class="aj-nota">En dólares. Sirven para calcular el costo, el ingreso y el margen en Reportes.</p>
    ${PRECIOS.map(([k, et, ej]) => `<div class="reg-campo"><label class="reg-etiqueta" for="aj-p-${k}">${et}</label>
      <input class="reg-texto" id="aj-p-${k}" data-precio="${k}" type="text" inputmode="decimal" autocomplete="off" placeholder="${ej}" value="${esc(numTxt(pr[k]))}"></div>`).join('')}
    <p id="aj-precios-msg" role="alert" hidden></p>
    ${Boton({ texto: 'Guardar precios', icono: 'saco', variante: 'primario', accion: 'aj-guardar-precios', clase: 'btn-ancho' })}
  </div>
  <div class="aj-seccion"><h2>Tema</h2>
    <div class="segmento" role="group" aria-label="Tema">${TEMAS.map(([id, t]) =>
      `<button type="button" class="segmento-btn" data-accion="aj-tema" data-tema="${id}" aria-pressed="${id === tema}">${t}</button>`).join('')}</div>
  </div>
  <div class="aj-seccion"><h2>Respaldo de datos</h2>
    <p class="aj-nota">Guarda una copia de todos tus lotes y registros en un archivo, o recupérala en otro teléfono.</p>
    ${Boton({ texto: 'Exportar respaldo', icono: 'sig', variante: 'primario', accion: 'aj-exportar', clase: 'btn-ancho' })}
    ${puedeCompartir ? Boton({ texto: 'Compartir respaldo', icono: 'copiar', variante: 'secundario', accion: 'aj-compartir-respaldo', clase: 'btn-ancho' }) : ''}
    ${Boton({ texto: 'Importar respaldo', icono: 'atras', variante: 'secundario', accion: 'aj-importar', clase: 'btn-ancho' })}
    <input class="aj-oculto" id="aj-archivo" type="file" accept=".json,application/json" tabindex="-1" aria-label="Archivo de respaldo">
    <p id="aj-respaldo-msg" role="alert" hidden></p>
  </div>
  <p class="aj-acerca">Appollo · versión ${esc(APP_VERSION)}</p>
</section>`;
  };

  VISTAS.ajustes.montar = function (raiz) {
    const f = raiz.querySelector('#aj-archivo');
    if (f) f.addEventListener('change', async () => {
      const a = f.files && f.files[0];
      if (!a) return;
      try { textoRespaldo = await a.text(); } catch (e) { textoRespaldo = null; msg('aj-respaldo-msg', 'No se pudo leer el archivo.'); f.value = ''; return; }
      f.value = '';
      msg('aj-respaldo-msg', '');
      App.abrirHoja({ titulo: '¿Importar respaldo?', contenido: `<div class="aj-confirmar">
  <p>Esto reemplaza todos los datos de este teléfono.</p>
  <div class="reg-pregunta-botones">${Boton({ texto: 'Cancelar', variante: 'secundario', accion: 'aj-cancelar-importar' })}${Boton({ texto: 'Reemplazar', variante: 'peligro', accion: 'aj-reemplazar' })}</div></div>` });
    });
  };

  ACCIONES['aj-tipo'] = el => {
    tipoSel = el.dataset.tipo;
    document.querySelectorAll('#view [data-accion=aj-tipo]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tipo === tipoSel)));
  };

  ACCIONES['aj-guardar-granja'] = async () => {
    const nombre = ($v('#aj-nombre').value || '').trim().slice(0, 60);
    const inp = $v('#aj-nombre');
    inp.classList.toggle('aj-campo-error', !nombre);
    if (!nombre) { msg('aj-granja-msg', 'Escribe el nombre de tu granja'); inp.focus(); return; }
    try {
      const g = await DB.guardar('granja', Object.assign({}, (await DB.obtener('granja', 'granja')) || App.estado.granja, { id: 'granja', nombre, tipo: tipoSel || '' }));
      App.estado.granja = g;
      msg('aj-granja-msg', 'Granja guardada', true);
      App.toast('Granja guardada');
    } catch (e) { msg('aj-granja-msg', 'No se pudo guardar. Intenta otra vez.'); }
  };

  ACCIONES['aj-guardar-precios'] = async () => {
    const precios = {};
    for (const inp of document.querySelectorAll('#view [data-precio]')) {
      const crudo = inp.value.trim().replace(',', '.'), k = inp.dataset.precio;
      inp.classList.remove('aj-campo-error');
      if (crudo === '') continue;
      const n = /^\d+(\.\d+)?$/.test(crudo) ? Number(crudo) : NaN;
      if (!Number.isFinite(n) || n > 100000) { inp.classList.add('aj-campo-error'); msg('aj-precios-msg', 'Escribe solo números, por ejemplo 3,60'); inp.focus(); return; }
      precios[k] = Math.round(n * 100) / 100;
    }
    try {
      const g = Object.assign({}, (await DB.obtener('granja', 'granja')) || App.estado.granja, { id: 'granja' });
      if (Object.keys(precios).length) g.precios = precios; else delete g.precios;
      App.estado.granja = await DB.guardar('granja', g);
      msg('aj-precios-msg', 'Precios guardados', true);
      App.toast('Precios guardados');
    } catch (e) { msg('aj-precios-msg', 'No se pudo guardar. Intenta otra vez.'); }
  };

  ACCIONES['aj-tema'] = async el => {
    const t = el.dataset.tema;
    if (t === 'claro' || t === 'oscuro') lsSet(K_TEMA, t); else { try { localStorage.removeItem(K_TEMA); } catch (e) { /* sin almacenamiento */ } }
    aplicarTema(t);
    document.querySelectorAll('#view [data-accion=aj-tema]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tema === t)));
    try { App.estado.granja = await DB.guardar('granja', Object.assign({}, (await DB.obtener('granja', 'granja')) || App.estado.granja, { id: 'granja', tema: t })); } catch (e) { /* el tema ya quedó aplicado */ }
  };

  const nombreArchivo = () => `appollo-respaldo-${hoyLocal()}.json`;

  ACCIONES['aj-exportar'] = async () => {
    try {
      const url = URL.createObjectURL(new Blob([await DB.exportar()], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = nombreArchivo(); a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      msg('aj-respaldo-msg', 'Respaldo descargado', true);
      App.toast('Respaldo descargado');
    } catch (e) { msg('aj-respaldo-msg', 'No se pudo crear el respaldo.'); }
  };

  ACCIONES['aj-compartir-respaldo'] = async () => {
    try {
      const archivo = new File([await DB.exportar()], nombreArchivo(), { type: 'application/json' });
      await navigator.share({ files: [archivo], title: 'Respaldo de Appollo' });
    } catch (e) { if (!e || e.name !== 'AbortError') msg('aj-respaldo-msg', 'No se pudo compartir. Usa "Exportar respaldo".'); }
  };

  ACCIONES['aj-importar'] = () => { const f = $v('#aj-archivo'); if (f) f.click(); };
  ACCIONES['aj-cancelar-importar'] = () => { textoRespaldo = null; App.cerrarHoja(); };

  ACCIONES['aj-reemplazar'] = async () => {
    const texto = textoRespaldo;
    textoRespaldo = null;
    App.cerrarHoja();
    const r = typeof texto === 'string' ? await DB.importar(texto) : { ok: false, error: 'No se pudo leer el archivo.' };
    if (!r.ok) { msg('aj-respaldo-msg', r.error || 'El archivo no es un respaldo válido.'); return; }
    try {
      App.estado.granja = (await DB.obtener('granja', 'granja')) ||
        await DB.guardar('granja', { id: 'granja', nombre: '', tipo: '', altitud: null, tema: 'auto', creado: new Date().toISOString() });
    } catch (e) { App.estado.granja = { id: 'granja', nombre: '', tipo: '', altitud: null, tema: 'auto' }; }
    App.fijarLote(null);
    App.toast('Respaldo importado');
    App.actualizarAlertas();
    App.ir('#/inicio');
  };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Vista "Alertas": lista por gravedad con acción grande; las vacunas se marcan hechas aquí.
   ========================================================================= */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

(function () {
  'use strict';
  const GRAV = {
    rojo: { chip: 'Urgente', clase: 'chip chip-rojo', ic: 'aviso' },
    ambar: { chip: 'Atención', clase: 'chip chip-ambar', ic: 'campana' },
    info: { chip: 'Aviso', clase: 'chip', ic: 'info' }
  };

  async function calcular() {
    const datos = {};
    for (const s of DB.STORES) datos[s] = await DB.listar(s);
    return generarAlertas(datos, new Date());
  }

  function tarjeta(a) {
    const g = GRAV[a.gravedad] || GRAV.info;
    const hecha = a.tipo === 'vacuna' && String(a.id).startsWith('vacuna-');
    return `<li class="al-card al-${esc(a.gravedad)}" data-alerta="${esc(a.id)}">
  <div class="al-cab"><span class="al-icono">${icono(g.ic)}</span><span class="${g.clase}">${a.gravedad === 'info' ? '' : '<span class="chip-punto" aria-hidden="true"></span>'}${g.chip}</span></div>
  <p class="al-texto">${esc(a.texto)}</p>
  <div class="al-botones">
    ${Boton({ texto: a.accion && a.accion.etiqueta || 'Ver', variante: 'primario', accion: 'ir', datos: { ruta: a.accion && a.accion.ruta }, clase: 'btn-ancho' })}
    ${hecha ? Boton({ texto: 'Marcar hecha', icono: 'jeringa', variante: 'secundario', accion: 'al-hecha', datos: { id: String(a.id).slice('vacuna-'.length) }, clase: 'btn-ancho' }) : ''}
  </div>
</li>`;
  }

  VISTAS.alertas = async function () {
    const lista = await calcular();
    if (!lista.length) {
      return `<section class="pantalla pantalla-vacia"><div class="vacia-ilustracion" aria-hidden="true">${icono('escudo')}</div>
  <h1>Todo en orden</h1><p class="pantalla-texto">No hay nada pendiente. Tus aves y tu inventario van bien.</p></section>`;
    }
    return `<section class="pantalla"><h1>Alertas</h1>
  <p class="pantalla-texto">${formatoNumero(lista.length)} ${lista.length === 1 ? 'aviso' : 'avisos'}, primero lo más urgente.</p>
  <ul class="al-lista">${lista.map(tarjeta).join('')}</ul></section>`;
  };

  ACCIONES['al-hecha'] = async el => {
    el.disabled = true;
    let deshacer = null;
    try {
      const v = await DB.obtener('vacunasPlan', el.dataset.id);
      if (!v || v.fechaAplicada) { App.refrescar(); return; }
      deshacer = await Vacunas.aplicar(v);
    } catch (e) { App.toast('No se pudo guardar. Intenta de nuevo.'); el.disabled = false; return; }
    await App.refrescar();
    App.toast('Vacuna aplicada', { deshacer });
  };
})();

</script>
<script>
/* Appollo · Bienvenida (primera vez, granja sin nombre): 2 pasos → "Crear mi primer lote".
   Guarda granja {nombre, tipo: 'postura'|'carne'|'ambas'} y lleva a #/nuevo-lote. */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

(function () {
  'use strict';
  const st = { paso: 1, nombre: '', tipo: '' };
  const TIPOS = [
    { id: 'postura', texto: 'Gallinas de postura', ayuda: 'Para huevos', icono: 'huevo' },
    { id: 'carne', texto: 'Pollos de carne', ayuda: 'Para engorde y venta', icono: 'balanza' },
    { id: 'ambas', texto: 'Las dos', ayuda: 'Huevos y carne', icono: 'gallina' },
  ];
  const $v = s => document.querySelector('#view ' + s);

  function paso1() {
    return `<div class="bv-ilustracion" aria-hidden="true">${icono('gallina')}</div>
  <p class="eyebrow">Paso 1 de 2</p>
  <h1>Bienvenido a Appollo</h1>
  <p class="pantalla-texto">Lleva el control diario de tus aves, aunque no tengas internet.</p>
  <div class="reg-campo"><label class="reg-etiqueta" for="bv-nombre">¿Cómo se llama tu granja?</label>
    <input class="reg-texto" id="bv-nombre" type="text" autocomplete="organization" enterkeyhint="next" maxlength="60" placeholder="Ej.: Granja San José" value="${esc(st.nombre)}"></div>
  <p class="reg-error bv-error" role="alert" hidden></p>
  ${Boton({ texto: 'Siguiente', icono: 'sig', variante: 'primario', accion: 'bv-siguiente', clase: 'btn-ancho btn-grande' })}`;
  }

  function paso2() {
    return `<p class="eyebrow">Paso 2 de 2</p>
  <h1>¿Qué aves crías?</h1>
  <p class="pantalla-texto">Así te mostramos primero las genéticas que te sirven. Puedes tener lotes de cualquier tipo.</p>
  <div class="reg-opciones" role="group" aria-label="Tipo de granja">${TIPOS.map(t =>
    `<button type="button" class="reg-opcion bv-opcion" data-accion="bv-tipo" data-tipo="${t.id}" aria-pressed="${st.tipo === t.id}">
    ${icono(t.icono)}<span class="bv-opcion-texto"><b>${t.texto}</b><span>${t.ayuda}</span></span></button>`).join('')}</div>
  <p class="reg-error bv-error" role="alert" hidden></p>
  ${Boton({ texto: 'Crear mi primer lote', icono: 'mas', variante: 'primario', accion: 'bv-crear', clase: 'btn-ancho btn-grande' })}
  ${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'bv-atras', clase: 'btn-ancho' })}`;
  }

  const html = () => `<section class="pantalla bienvenida" data-paso="${st.paso}">${st.paso === 1 ? paso1() : paso2()}</section>`;

  function pintar() {
    const s = $v('.bienvenida');
    if (!s) return;
    s.outerHTML = html();
    const foco = st.paso === 1 ? $v('#bv-nombre') : $v('[data-accion=bv-tipo]');
    if (foco) try { foco.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
  }
  function error(msg) { const p = $v('.bv-error'); if (p) { p.textContent = msg; p.hidden = false; } }

  VISTAS.bienvenida = async function () {
    const g = App.estado.granja || {};
    if (!st.nombre && g.nombre) st.nombre = g.nombre;
    return html();
  };
  VISTAS.bienvenida.montar = function (raiz) {
    raiz.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target && e.target.id === 'bv-nombre') { e.preventDefault(); ACCIONES['bv-siguiente'](); }
    });
  };

  ACCIONES['bv-siguiente'] = () => {
    const el = $v('#bv-nombre');
    st.nombre = el ? el.value.trim() : st.nombre;
    if (!st.nombre) { error('Escribe el nombre de tu granja'); if (el) el.focus(); return; }
    st.paso = 2; pintar();
  };
  ACCIONES['bv-atras'] = () => { st.paso = 1; pintar(); };
  ACCIONES['bv-tipo'] = el => {
    st.tipo = el.dataset.tipo;
    document.querySelectorAll('#view [data-accion=bv-tipo]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tipo === st.tipo)));
    const p = $v('.bv-error'); if (p) p.hidden = true;
  };
  ACCIONES['bv-crear'] = async el => {
    if (!st.tipo) { error('Elige qué aves crías'); return; }
    el.disabled = true;
    try {
      App.estado.granja = await DB.guardar('granja', Object.assign({ id: 'granja', altitud: null, tema: 'auto' },
        App.estado.granja, { nombre: st.nombre, tipo: st.tipo }));
    } catch (e) { el.disabled = false; error('No se pudo guardar. Intenta de nuevo.'); return; }
    st.paso = 1;
    App.ir('#/nuevo-lote');
  };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Detalle de lote: resumen, gráfica real vs proyectado, historial (Borrar + Deshacer),
   calendario de vacunas (Marcar aplicada + Deshacer) y Cerrar / Reabrir lote.
   ========================================================================= */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

(function () {
  'use strict';
  const PAGINA = 30, limites = {};
  const fin = x => (Number.isFinite(x) ? x : null);
  const r1 = x => (x === null ? null : Math.round(x * 10) / 10);
  const masDias = (f, n) => { const d = fechaADate(f); d.setDate(d.getDate() + n); return hoyLocal(d); };
  const fechaTxt = f => (typeof f === 'string' && f.length >= 10 ? f.slice(8, 10) + '/' + f.slice(5, 7) + '/' + f.slice(0, 4) : '—');
  const n = x => (Number.isFinite(Number(x)) ? formatoNumero(Number(x)) : '—');
  const copia = o => JSON.parse(JSON.stringify(o));
  const TIPO = { mortalidad: ['Mortalidad', 'cruz'], alimento: ['Alimento', 'saco'], huevos: ['Huevos', 'huevo'],
    peso: ['Peso', 'balanza'], vacuna: ['Vacuna', 'jeringa'], sanidad: ['Sanidad', 'termo'] };

  function valorReg(r) {
    const d = r.datos || {};
    switch (r.tipo) {
      case 'mortalidad': return `${n(d.cantidad)} ${Number(d.cantidad) === 1 ? 'ave' : 'aves'}${d.causa ? ' · ' + d.causa : ''}`;
      case 'alimento': return `${n(d.kg)} kg`;
      case 'huevos': return `${n(d.cantidad)} huevos${Number(d.rotos) > 0 ? ' · ' + n(d.rotos) + ' rotos' : ''}`;
      case 'peso': return `${n(d.gramos)} g por ave`;
      case 'vacuna': return d.nombre || 'Vacuna';
      case 'sanidad': return [d.enfermedad, d.tratamiento].filter(Boolean).join(' · ') + (Number(d.retiroDias) > 0 ? ` · retiro ${n(d.retiroDias)} días` : '');
    }
    return '';
  }

  /* Real vs proyectado desde la llegada (máx. 60 días) hasta hoy o el cierre. */
  function grafica(l, regs, res, hasta, alt) {
    if (!res.ok) return Grafico({});
    const carne = modoDe(res.g) === 'carne', desde = [l.fechaLlegada, masDias(hasta, -59)].sort().pop(), dias = [];
    for (let f = desde; f <= hasta; f = masDias(f, 1)) dias.push(f);
    const real = [], est = [];
    for (const f of dias) {
      const e = estandarDia(l, f, alt, Math.max(0, avesVivas(l, regs, f)));
      if (carne) {
        const p = regs.filter(r => r.tipo === 'peso' && r.fecha === f).pop();
        real.push(p ? fin(Number(p.datos.gramos)) : null); est.push(r1(fin(e.pesoG)));
      } else { real.push(r1(fin(pctPostura(l, regs, f)))); est.push(r1(fin(e.hdPct))); }
    }
    return Grafico({ serieReal: real, serieEstandar: est, etiquetas: dias.map(f => f.slice(8, 10) + '/' + f.slice(5, 7)) });
  }

  function vacunaHtml(v, hoy, activo) {
    let chip = ['verde', 'Aplicada ' + fechaTxt(v.fechaAplicada)];
    if (!v.fechaAplicada) chip = v.fechaPrevista < hoy ? ['rojo', 'Vencida'] : v.fechaPrevista === hoy ? ['ambar', 'Hoy']
      : v.fechaPrevista === masDias(hoy, 1) ? ['ambar', 'Mañana'] : ['', 'Prevista'];
    return `<li class="dl-vac${v.fechaAplicada ? ' dl-vac-hecha' : ''}">
  <div class="dl-fila-texto"><b>${esc(v.nombre)}</b><span>${esc(fechaTxt(v.fechaPrevista))}${v.via ? ' · ' + esc(v.via) : ''}</span></div>
  <span class="chip${chip[0] ? ' chip-' + chip[0] : ''}">${chip[0] ? '<span class="chip-punto" aria-hidden="true"></span>' : ''}${esc(chip[1])}</span>
  ${!v.fechaAplicada && activo ? Boton({ texto: 'Marcar aplicada', icono: 'jeringa', variante: 'secundario', accion: 'dl-aplicar', datos: { id: v.id }, clase: 'btn-ancho' }) : ''}
</li>`;
  }

  VISTAS.detalleLote = async function (params) {
    const l = await DB.obtener('lotes', params.id);
    if (!l) {
      return `<section class="pantalla pantalla-vacia"><div class="vacia-ilustracion" aria-hidden="true">${icono('aviso')}</div>
  <h1>Este lote no existe</h1><p class="pantalla-texto">Quizá fue borrado o el enlace está mal.</p>
  ${Boton({ texto: 'Ver mis lotes', icono: 'lotes', variante: 'primario', accion: 'ir', datos: { ruta: '#/lotes' }, clase: 'btn-ancho' })}</section>`;
    }
    const [regs, vacs] = await Promise.all([DB.listar('registros', { loteId: l.id }), DB.listar('vacunasPlan', { loteId: l.id })]);
    const hoy = hoyLocal(), activo = l.estado === 'activo', hasta = activo ? hoy : (l.fechaCierre || hoy);
    const alt = App.estado.granja && App.estado.granja.altitud;
    const res = resumenLote(l, regs, vacs, hasta), mort = res.ok ? fin(mortalidadPct(l, regs, hasta)) : null;
    const carne = res.ok && modoDe(res.g) === 'carne';
    const orden = regs.slice().sort((a, b) => (b.fecha + (b.creado || '')).localeCompare(a.fecha + (a.creado || '')));
    const lim = limites[l.id] || PAGINA;
    const pend = vacs.filter(v => !v.fechaAplicada).sort((a, b) => String(a.fechaPrevista).localeCompare(String(b.fechaPrevista)));
    const hechas = vacs.filter(v => v.fechaAplicada).sort((a, b) => String(b.fechaAplicada).localeCompare(String(a.fechaAplicada)));
    const dato = (t, v) => `<div class="dl-dato"><span>${t}</span><b class="num">${v}</b></div>`;
    return `<section class="pantalla detalle-lote">
  ${Boton({ texto: 'Lotes', icono: 'atras', variante: 'secundario', accion: 'ir', datos: { ruta: '#/lotes' }, clase: 'dl-volver' })}
  <header class="dl-cab">
    <p class="eyebrow">${activo ? 'Lote activo' : 'Lote cerrado' + (l.fechaCierre ? ' el ' + esc(fechaTxt(l.fechaCierre)) : '')}</p>
    <h1>${esc(l.nombre || 'Lote')}</h1>
    <p class="pantalla-texto">${esc(res.g ? res.g.nombre : l.genetica || 'Genética desconocida')}${l.galpon ? ' · ' + esc(l.galpon) : ''} · llegó el ${esc(fechaTxt(l.fechaLlegada))}</p>
    ${activo ? chipEstado(res.estado) : ''}
  </header>
  <div class="dl-datos">
    ${dato('Aves vivas', res.vivas === null ? '—' : formatoNumero(res.vivas) + ' / ' + n(l.avesInicio))}
    ${dato('Edad', esc(textoEdad(res.edad)))}
    ${dato('Mortalidad', mort === null ? '—' : formatoNumero(r1(mort)) + ' %')}
    ${dato('Registros', formatoNumero(regs.length))}
  </div>
  ${l.resumen ? `<p class="pantalla-texto">${esc(l.resumen)}</p>` : ''}
  <article class="tarjeta" data-t="grafica"><header class="tarjeta-cab"><h2 class="tarjeta-titulo">${carne ? 'Peso (g)' : '% de postura'}: real vs proyectado</h2></header>${grafica(l, regs, res, hasta, alt)}</article>
  <h2 class="seccion-titulo">Historial</h2>
  ${orden.length ? `<ul class="dl-lista">${orden.slice(0, lim).map(r => {
    const t = TIPO[r.tipo] || [r.tipo, 'hoja'];
    return `<li class="dl-reg"><span class="dl-icono">${icono(t[1])}</span><div class="dl-fila-texto"><b>${esc(t[0])} · ${esc(valorReg(r))}</b><span>${esc(fechaTxt(r.fecha))}</span></div>
  ${Boton({ texto: 'Borrar', variante: 'secundario', accion: 'dl-borrar', datos: { id: r.id }, clase: 'dl-borrar' })}</li>`;
  }).join('')}</ul>${orden.length > lim ? Boton({ texto: `Ver más (${formatoNumero(orden.length - lim)})`, variante: 'secundario', accion: 'dl-mas', datos: { id: l.id }, clase: 'btn-ancho' }) : ''}`
    : '<p class="pantalla-texto">Aún no hay registros. Usa ＋ Registrar en la barra de abajo.</p>'}
  <h2 class="seccion-titulo">Calendario de vacunas</h2>
  ${vacs.length ? `${pend.length ? `<ul class="dl-lista">${pend.slice(0, 3).map(v => vacunaHtml(v, hoy, activo)).join('')}</ul>` : '<p class="pantalla-texto">No quedan vacunas pendientes.</p>'}
  ${pend.length > 3 ? `<details class="dl-hechas"><summary>Siguientes vacunas (${formatoNumero(pend.length - 3)})</summary><ul class="dl-lista">${pend.slice(3).map(v => vacunaHtml(v, hoy, activo)).join('')}</ul></details>` : ''}
  ${hechas.length ? `<details class="dl-hechas"><summary>Aplicadas (${formatoNumero(hechas.length)})</summary><ul class="dl-lista">${hechas.map(v => vacunaHtml(v, hoy, activo)).join('')}</ul></details>` : ''}`
    : '<p class="pantalla-texto">Este lote no tiene vacunas previstas.</p>'}
  <div class="dl-cierre">
  ${activo ? `${Boton({ texto: 'Cerrar lote', variante: 'secundario', accion: 'dl-cerrar', clase: 'btn-ancho dl-cerrar' })}
  <div class="dl-confirmar" hidden><p><b>¿Cerrar este lote?</b> Ya no aparecerá en Inicio ni en el registro rápido. Sus datos se conservan y puedes reabrirlo.</p>
    <div class="reg-pregunta-botones">${Boton({ texto: 'Cancelar', variante: 'secundario', accion: 'dl-cerrar-no' })}${Boton({ texto: 'Sí, cerrar lote', variante: 'peligro', accion: 'dl-cerrar-si', datos: { id: l.id } })}</div></div>`
    : Boton({ texto: 'Reabrir lote', variante: 'primario', accion: 'dl-reabrir', datos: { id: l.id }, clase: 'btn-ancho' })}
  </div>
</section>`;
  };

  /* ------------------------------ Acciones ------------------------------ */
  /* Aplica kg al inventario vinculado; devuelve los kg realmente aplicados (0 si no hay ítem o falla). */
  async function inventario(kg) {
    if (!(Number.isFinite(kg) && kg !== 0) || typeof Inventario === 'undefined' || !Inventario || typeof Inventario.descontarAlimento !== 'function') return 0;
    try { const r = await Inventario.descontarAlimento(kg); return Number(r && r.aplicadoKg) || 0; } catch (e) { return 0; }
  }
  async function hacer(fn, msg, deshacer) {
    try { await fn(); } catch (e) { App.toast('No se pudo guardar. Intenta de nuevo.'); return; }
    await App.refrescar();
    App.toast(msg, deshacer ? { deshacer } : undefined);
  }

  /* Marca una vacuna del plan como aplicada hoy y crea su registro. Devuelve la función que lo revierte.
     Compartida con la vista de Alertas (Vacunas.aplicar). */
  window.Vacunas = {
    async aplicar(v) {
      const previo = copia(v), hoy = hoyLocal();
      const nuevo = await DB.guardar('registros', { loteId: v.loteId, fecha: hoy, tipo: 'vacuna',
        datos: { nombre: v.nombre, via: v.via || '', planId: v.id }, creado: new Date().toISOString() });
      await DB.guardar('vacunasPlan', Object.assign({}, v, { fechaAplicada: hoy }));
      return async () => { await DB.borrar('registros', nuevo.id); await DB.guardar('vacunasPlan', previo); };
    }
  };

  ACCIONES['dl-borrar'] = async el => {
    el.disabled = true;
    const r = await DB.obtener('registros', el.dataset.id);
    if (!r) { App.refrescar(); return; }
    const previo = copia(r), kg = r.tipo === 'alimento' ? Number(r.datos && r.datos.descontadoKg) || 0 : 0;
    const plan = r.tipo === 'vacuna' && r.datos && r.datos.planId ? await DB.obtener('vacunasPlan', r.datos.planId) : null;
    const planPrevio = plan ? copia(plan) : null;
    await hacer(async () => {
      await DB.borrar('registros', r.id);
      if (plan) { const p = copia(plan); delete p.fechaAplicada; await DB.guardar('vacunasPlan', p); }
      await inventario(-kg);
    }, 'Registro borrado', async () => {
      await DB.guardar('registros', previo);
      if (planPrevio) await DB.guardar('vacunasPlan', planPrevio);
      const ap = await inventario(kg);
      if (kg && ap !== kg) await DB.guardar('registros', Object.assign({}, previo, { datos: Object.assign({}, previo.datos, { descontadoKg: ap }) }));
    });
  };

  ACCIONES['dl-aplicar'] = async el => {
    el.disabled = true;
    const v = await DB.obtener('vacunasPlan', el.dataset.id);
    if (!v || v.fechaAplicada) { App.refrescar(); return; }
    let deshacer = null;
    await hacer(async () => { deshacer = await Vacunas.aplicar(v); }, 'Vacuna aplicada', () => deshacer());
  };

  ACCIONES['dl-mas'] = el => { limites[el.dataset.id] = (limites[el.dataset.id] || PAGINA) + PAGINA; App.refrescar(); };
  const confirmar = ver => {
    const c = document.querySelector('#view .dl-confirmar'), b = document.querySelector('#view .dl-cerrar');
    if (!c || !b) return;
    c.hidden = !ver; b.hidden = ver;
    const foco = ver ? c.querySelector('[data-accion=dl-cerrar-no]') : b;
    try { foco.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
    if (ver) c.scrollIntoView({ block: 'nearest' });
  };
  ACCIONES['dl-cerrar'] = () => confirmar(true);
  ACCIONES['dl-cerrar-no'] = () => confirmar(false);

  async function cambiarEstado(id, cerrar) {
    const l = await DB.obtener('lotes', id);
    if (!l) return;
    const previo = copia(l), nuevo = copia(l);
    if (cerrar) { nuevo.estado = 'cerrado'; nuevo.fechaCierre = hoyLocal(); } else { nuevo.estado = 'activo'; delete nuevo.fechaCierre; }
    const lsPrevio = App.estado.loteActivoId;
    await hacer(async () => {
      await DB.guardar('lotes', nuevo);
      if (cerrar && App.estado.loteActivoId === id) App.fijarLote(null);
    }, cerrar ? 'Lote cerrado' : 'Lote reabierto', async () => {
      await DB.guardar('lotes', previo);
      if (cerrar && lsPrevio === id) App.fijarLote(id);
    });
  }
  ACCIONES['dl-cerrar-si'] = el => { el.disabled = true; return cambiarEstado(el.dataset.id, true); };
  ACCIONES['dl-reabrir'] = el => { el.disabled = true; return cambiarEstado(el.dataset.id, false); };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Inicio: selector Todos / lote y tarjetas del día (aves, mortalidad, alimento,
   producción, estado sanitario, alertas, rendimiento) con minigráfica de 14 días.
   "Todos" suma los lotes activos. Lo que no se puede calcular se muestra "—", nunca NaN.
   ========================================================================= */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

(function () {
  'use strict';
  let verTodos = false, ultimo = '', previo = {};
  const fin = x => (Number.isFinite(x) ? x : null);
  const r1 = x => (x === null ? null : Math.round(x * 10) / 10);
  const suma = xs => xs.reduce((s, x) => s + x, 0);
  const sumaDatos = (rs, campo) => suma(rs.map(r => Number(r.datos && r.datos[campo]) || 0));
  const masDias = (f, n) => { const d = fechaADate(f); d.setDate(d.getDate() + n); return hoyLocal(d); };
  const ddmm = f => f.slice(8, 10) + '/' + f.slice(5, 7);
  const ESTADO = { verde: 'Verde', ambar: 'Amarillo', rojo: 'Rojo' }, PEOR = ['verde', 'ambar', 'rojo'];

  /* Cifras de un lote para el día `hoy`. */
  function metricas(l, regs, vacs, hoy, alt) {
    const propios = regs.filter(r => r.loteId === l.id), del = t => propios.filter(r => r.tipo === t && r.fecha === hoy);
    const res = resumenLote(l, propios, vacs, hoy), carne = !!res.g && modoDe(res.g) === 'carne';
    let std = null;
    if (res.ok) { try { std = estandarDia(l, hoy, alt, res.vivas); } catch (e) { std = null; } }
    const ps = propios.filter(r => r.tipo === 'peso' && r.fecha <= hoy && Number(r.datos && r.datos.gramos) > 0).sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
    const alim = del('alimento'), hue = del('huevos');
    return { l, res, carne, std, propios,
      inicio: Number(l.avesInicio) || 0, muertesTot: mortalidadTotal(l, propios, hoy), muertesHoy: sumaDatos(del('mortalidad'), 'cantidad'),
      kg: alim.length ? sumaDatos(alim, 'kg') : null, huevos: hue.length ? sumaDatos(hue, 'cantidad') : null,
      peso: ps.length ? Number(ps[ps.length - 1].datos.gramos) : null,
      rend: res.ok ? fin(rendimiento(l, propios, hoy)) : null };
  }

  /* Suma de varios lotes (o de uno solo). */
  function agregado(ms) {
    const vivas = suma(ms.map(m => m.res.vivas || 0)), inicio = suma(ms.map(m => m.inicio));
    const post = ms.filter(m => !m.carne && m.res.ok), conH = post.filter(m => m.huevos !== null && m.res.vivas > 0);
    const vivH = suma(conH.map(m => m.res.vivas)), stdH = suma(conH.map(m => (m.std && m.std.huevos) || 0));
    const conR = ms.filter(m => m.rend !== null && m.res.vivas > 0), vivR = suma(conR.map(m => m.res.vivas));
    const conKg = ms.filter(m => m.kg !== null), stds = ms.filter(m => m.std && m.std.alimentoKg > 0);
    const estados = ms.map(m => m.res.estado).filter(Boolean);
    return {
      vivas, inicio, mortPct: inicio > 0 ? fin(100 * suma(ms.map(m => m.muertesTot)) / inicio) : null, muertesHoy: suma(ms.map(m => m.muertesHoy)),
      kg: conKg.length ? suma(conKg.map(m => m.kg)) : null, kgStd: stds.length ? suma(stds.map(m => m.std.alimentoKg)) : null,
      postura: post.length > 0 || !ms.some(m => m.carne),
      huevos: conH.length ? suma(conH.map(m => m.huevos)) : null,
      pct: vivH > 0 ? fin(100 * suma(conH.map(m => m.huevos)) / vivH) : null, pctStd: vivH > 0 ? fin(100 * stdH / vivH) : null,
      carneUnico: ms.filter(m => m.carne).length === 1 ? ms.find(m => m.carne) : null,
      rend: vivR > 0 ? fin(suma(conR.map(m => m.rend * m.res.vivas)) / vivR) : null,
      estado: estados.length ? estados.reduce((a, b) => (PEOR.indexOf(b) > PEOR.indexOf(a) ? b : a)) : null
    };
  }

  /* 14 días: % postura real vs estándar (postura) o peso real vs estándar (un lote de carne). */
  function serie14(ms, a, hoy, alt) {
    const dias = []; for (let i = 13; i >= 0; i--) dias.push(masDias(hoy, -i));
    const real = [], est = [];
    for (const f of dias) {
      if (a.postura) {
        let h = 0, vh = 0, sh = 0, vs = 0;
        for (const m of ms.filter(x => !x.carne && x.res.ok && f >= x.l.fechaLlegada)) {
          const v = Math.max(0, avesVivas(m.l, m.propios, f)), hs = m.propios.filter(r => r.tipo === 'huevos' && r.fecha === f);
          if (hs.length && v > 0) { h += sumaDatos(hs, 'cantidad'); vh += v; }
          const e = fin(estandarDia(m.l, f, alt, v).hdPct);
          if (e !== null && v > 0) { sh += e * v; vs += v; }
        }
        real.push(vh > 0 ? r1(100 * h / vh) : null); est.push(vs > 0 ? r1(sh / vs) : null);
      } else if (a.carneUnico && a.carneUnico.res.ok && f >= a.carneUnico.l.fechaLlegada) {
        const m = a.carneUnico, p = m.propios.filter(r => r.tipo === 'peso' && r.fecha === f).pop();
        real.push(p ? fin(Number(p.datos.gramos)) : null); est.push(r1(fin(estandarDia(m.l, f, alt).pesoG)));
      } else { real.push(null); est.push(null); }
    }
    return { serieReal: real, serieEstandar: est, etiquetas: dias.map(ddmm) };
  }

  const celda = (t, html, ancho) => `<div class="ini-celda${ancho ? ' ini-ancha' : ''}" data-t="${t}">${html}</div>`;
  const kg = x => (x === null ? '—' : formatoNumero(r1(x)) + ' kg');

  function construir(d) {
    const { activos, sel, ms, a, alertas, hoy, alt } = d;
    const g = App.estado.granja || {};
    const uno = sel !== 'todos' ? ms[0] : null;
    const selector = activos.length > 1 ? `<div class="ini-selector" role="group" aria-label="Ver lote">${[{ id: 'todos', nombre: 'Todos' }].concat(activos).map(l =>
      `<button type="button" class="selector-btn" data-accion="ini-lote" data-id="${esc(l.id)}" aria-pressed="${sel === l.id}">${esc(l.nombre || 'Lote')}</button>`).join('')}</div>` : '';
    const sub = uno ? `${esc(uno.l.nombre || 'Lote')} · ${esc(textoEdad(uno.res.edad))}` : `${activos.length} lotes activos`;
    const rojas = alertas.filter(x => x.gravedad === 'rojo').length;
    let prod;
    if (a.postura) prod = Tarjeta({ titulo: 'Huevos de hoy', icono: 'huevo', cifra: a.huevos, unidad: a.huevos === null ? '' : 'huevos',
      pie: `Postura ${a.pct === null ? '—' : formatoNumero(r1(a.pct)) + ' %'} · estándar ${a.pctStd === null ? '—' : formatoNumero(r1(a.pctStd)) + ' %'}` });
    else {
      const m = a.carneUnico;
      prod = Tarjeta({ titulo: 'Peso promedio', icono: 'balanza', cifra: m ? m.peso : null, unidad: m && m.peso !== null ? 'g' : '',
        pie: m ? `Estándar ${m.std && fin(m.std.pesoG) !== null ? formatoNumero(Math.round(m.std.pesoG)) + ' g' : '—'}` : 'Elige un lote para ver su peso' });
    }
    const motivo = alertas.find(x => x.gravedad !== 'info');
    const s14 = a.postura || a.carneUnico ? serie14(ms, a, hoy, alt) : null;
    const graf = Grafico(s14 && s14.serieReal.some(v => v !== null) ? s14 : {});
    return `<section class="pantalla inicio">
  <header class="ini-cab"><h1>${esc(g.nombre || 'Inicio')}</h1><p class="pantalla-texto">${sub}</p></header>
  ${selector}
  <div class="ini-rejilla">
  ${celda('aves', Tarjeta({ titulo: 'Aves vivas', icono: 'gallina', cifra: a.vivas, pie: `de ${formatoNumero(a.inicio)} al llegar` }))}
  ${celda('mortalidad', Tarjeta({ titulo: 'Mortalidad', icono: 'cruz', cifra: r1(a.mortPct), unidad: a.mortPct === null ? '' : '%', pie: `Hoy: ${formatoNumero(a.muertesHoy)} ${a.muertesHoy === 1 ? 'ave' : 'aves'}` }))}
  ${celda('alimento', Tarjeta({ titulo: 'Alimento de hoy', icono: 'saco', cifra: r1(a.kg), unidad: a.kg === null ? '' : 'kg', pie: 'Estándar ' + kg(a.kgStd) }), true)}
  ${celda('produccion', prod, true)}
  <div class="ini-celda ini-ancha" data-t="sanitario" data-estado="${a.estado || ''}">${Tarjeta({ titulo: 'Estado sanitario', icono: 'escudo', estado: a.estado || undefined,
    cifra: a.estado ? ESTADO[a.estado] : null, pie: motivo ? motivo.texto : a.estado === 'ambar' ? 'Sin registros en los últimos 3 días' : 'Todo en orden' })}</div>
  <a class="ini-celda ini-ancha ini-enlace" data-t="alertas" href="#/alertas">${Tarjeta({ titulo: 'Alertas pendientes', icono: 'campana', cifra: alertas.length,
    estado: rojas ? 'rojo' : alertas.length ? 'ambar' : undefined, pie: alertas.length ? 'Toca para verlas' : 'Nada pendiente' })}</a>
  ${celda('rendimiento', Tarjeta({ titulo: 'Rendimiento vs estándar', icono: 'grafico', cifra: r1(a.rend), unidad: a.rend === null ? '' : '%',
    pie: a.postura ? 'Postura real ÷ estándar' : 'Peso real ÷ estándar' }), true)}
  ${celda('grafica', `<article class="tarjeta"><header class="tarjeta-cab"><h3 class="tarjeta-titulo">Últimos 14 días · ${a.postura ? '% postura' : 'peso (g)'}</h3></header>${graf}</article>`, true)}
  </div>
</section>`;
  }

  const vacio = () => `<section class="pantalla pantalla-vacia">
  <div class="vacia-ilustracion" aria-hidden="true">${icono('gallina')}</div>
  <h1>${esc((App.estado.granja && App.estado.granja.nombre) || 'Bienvenido a Appollo')}</h1>
  <p class="pantalla-texto">Aún no tienes lotes. Crea el primero para registrar mortalidad, alimento y huevos cada día.</p>
  ${Boton({ texto: 'Nuevo lote', icono: 'mas', variante: 'primario', accion: 'nuevo-lote', clase: 'btn-ancho btn-grande' })}
</section>`;

  VISTAS.inicio = async function () {
    const activos = await DB.listar('lotes', { estado: 'activo' });
    if (!activos.length) { ultimo = ''; return vacio(); }
    return ultimo || `<section class="pantalla inicio">${Esqueleto(5)}</section>`;
  };

  VISTAS.inicio.montar = async function (raiz) {
    if (!raiz.querySelector('.inicio')) return;
    const [lotes, registros, vacunasPlan, inventario] = await Promise.all(['lotes', 'registros', 'vacunasPlan', 'inventario'].map(s => DB.listar(s)));
    const activos = lotes.filter(l => l.estado === 'activo').sort((x, y) => String(x.fechaLlegada || '').localeCompare(String(y.fechaLlegada || '')));
    const hoy = hoyLocal(), alt = App.estado.granja && App.estado.granja.altitud;
    const id = App.estado.loteActivoId;

<script>
/* =========================================================================
   APPOLLO · Nuevo lote (3 pasos: genética → aves y edad → altitud y galpón).
   NuevoLote.crear({genetica, avesInicio, fechaLlegada|edadDias, edadLlegadaDias?, altitud, galpon, nombre?})

  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } };

  /* --------------------------- Reglas (sin DOM) --------------------------- */
  const maxDias = g => (modoDe(g) === 'huevos' ? 693 : g.carne.rango[1] - 1);
  const masDias = (f, n) => { const d = fechaADate(f); d.setDate(d.getDate() + n); return hoyLocal(d); };
  const corta = g => g.nombre.split(' ').slice(0, 2).join(' ');

      for (const d of dias) {
        if (d < lote.edadLlegadaDias) continue;
        out.push({ loteId: lote.id, vacunaId: v.id, nombre: v.n, via: v.via, fechaPrevista: masDias(lote.fechaLlegada, d - lote.edadLlegadaDias) });
      }

      if (o.fechaLlegada > hoy) return no('La fecha de llegada no puede ser futura');
      fecha = o.fechaLlegada;
      const e = o.edadLlegadaDias === undefined || o.edadLlegadaDias === null || o.edadLlegadaDias === '' ? { n: 0 } : edadOk(o.edadLlegadaDias, 'la edad al llegar');
      if (e.m) return no(e.m);
      llegada = e.n;
    } else {
      const e = edadOk(o.edadDias, 'la edad');
      if (e.m) return no(e.m);
      llegada = e.n;
    }
    const lote = { genetica: g.id, avesInicio: aves, fechaLlegada: fecha, edadLlegadaDias: llegada, estado: 'activo' };
    const actual = edadDias(lote, hoy), max = maxDias(g);
    if (actual > max) return no(`La edad (${formatoNumero(actual)} días, ${semanas(actual)}) supera el máximo para ${g.nombre}: ${formatoNumero(max)} días (${semanas(max)})`);
    let alt = null;
    if (o.altitud !== undefined && o.altitud !== null && o.altitud !== '') {
      alt = numero(o.altitud);
      if (!Number.isFinite(alt) || alt < 0 || alt > 6000) return no('La altitud debe estar entre 0 y 6000 m');
    }
    const galpon = String(o.galpon || '').trim().slice(0, 40);
    const nombre = String(o.nombre || '').trim().slice(0, 60) || `${corta(g)} · ${galpon || 'Lote'}`;
    return { lote: Object.assign(lote, { nombre, galpon, altitud: alt, creado: new Date().toISOString() }) };
  }

  async function crear(o) {
    const v = validar(o);
    if (v.mensaje) throw new Error(v.mensaje);
    const g = genDe(v.lote.genetica), hechos = [];
    let lote;
    try {
      lote = await DB.guardar('lotes', v.lote);
      for (const p of planVacunas(g, lote)) hechos.push((await DB.guardar('vacunasPlan', p)).id);
    } catch (e) {
      for (const id of hechos) { try { await DB.borrar('vacunasPlan', id); } catch (x) { /* sigue */ } }
      if (lote) { try { await DB.borrar('lotes', lote.id); } catch (x) { /* sigue */ } }
      throw new Error('No se pudo guardar el lote. Intenta de nuevo.');
    }
    if (lote.altitud !== null) {
      lsSet(K_ALT, String(lote.altitud));
      try { // se lee de la base: App.estado puede estar desactualizado
        const gr = (await DB.obtener('granja', 'granja')) || App.estado.granja || { id: 'granja' };
        App.estado.granja = gr.altitud === lote.altitud ? gr : await DB.guardar('granja', Object.assign({}, gr, { altitud: lote.altitud }));
      } catch (e) { /* no crítico */ }
    }
    return lote;
  }

  /* ------------------------------ Pantalla ------------------------------ */
  const altGuardada = () => {
    const ls = numero(lsGet(K_ALT)), gr = App.estado.granja && App.estado.granja.altitud;
    return Number.isFinite(ls) ? ls : Number.isFinite(gr) ? gr : '';
  };
  const nuevo = () => ({ paso: 1, gid: null, aves: 100, modo: 'edad', edad: 1, unidad: 'dias', fecha: hoyLocal(), edadLlegada: 0, altitud: altGuardada(), galpon: '', nombre: '' });
  let st = null;
  const $v = s => document.querySelector('#view ' + s);
  const val = id => { const el = $v('#' + id); return el ? el.value : undefined; };

  function presets(g) {
    const d = x => [x, 'dias', x === 1 ? '1 día' : x + ' días'], s = x => [x, 'semanas', x + ' sem'];
    if (modoDe(g) === 'huevos') return [d(1), s(4), s(10), s(17), s(25), s(40), s(60)];
    return (esBroiler(g) ? [1, 7, 14, 21, 28, 35] : g.id === 'campero' ? [1, 14, 28, 42, 56] : [1, 28, 56, 84]).map(d);
  }

  function leer() {
    if (!st) return;
    const v = { aves: val('nl-aves'), edad: val('nl-edad'), fecha: val('nl-fecha'), edadLlegada: val('nl-edad-llegada'),
      altitud: val('nl-altitud'), galpon: val('nl-galpon'), nombre: val('nl-nombre') };
    Object.keys(v).forEach(k => { if (v[k] !== undefined) st[k] = v[k]; });
  }
  const datos = () => {
    const o = { genetica: st.gid, avesInicio: st.aves, altitud: st.altitud, galpon: st.galpon, nombre: st.nombre };
    if (st.modo === 'fecha') { o.fechaLlegada = st.fecha || ' '; o.edadLlegadaDias = st.edadLlegada; }
    else { const n = numero(st.edad); o.edadDias = st.unidad === 'semanas' && Number.isFinite(n) ? Math.round(n * 7) : st.edad; }
    return o;
  };
  const seg = (accion, clave, ops) => `<div class="segmento" role="group">${ops.map(([v, t]) =>
    `<button type="button" class="segmento-btn" data-accion="${accion}" data-${clave}="${v}" aria-pressed="${st[clave] === v || String(st[clave]) === String(v)}">${t}</button>`).join('')}</div>`;
  const campo = (id, etiqueta, html, ayuda) => `<div class="reg-campo"><label class="reg-etiqueta" for="${id}">${etiqueta}</label>${html}${ayuda ? `<p class="reg-ayuda">${ayuda}</p>` : ''}</div>`;
  const texto = (id, valor, extra) => `<input class="reg-texto" id="${id}" value="${esc(valor)}" ${extra}>`;

  function paso1() {
    const t = (App.estado.granja && App.estado.granja.tipo) || '', orden = ORDEN[t] || ORDEN.postura;
    const lista = GENETICAS.slice().sort((a, b) => orden.indexOf(a.tipo) - orden.indexOf(b.tipo));
    return `<h1>¿Qué aves llegan?</h1>
  <div class="gen-lista">${lista.map(g => `<button type="button" class="gen-opcion" data-accion="nl-genetica" data-id="${esc(g.id)}" aria-pressed="${st.gid === g.id}">
    <span class="gen-cab"><b class="gen-nombre">${esc(g.nombre)}</b><span class="gen-tipo gen-tipo-${esc(g.tipo)}">${esc(TIPOS[g.tipo].corto)}</span></span>
    <span class="gen-desc">${esc(g.rasgo)} · ${esc(g.origen)}</span></button>`).join('')}</div>
  ${Boton({ texto: 'Cancelar', variante: 'secundario', accion: 'ir', datos: { ruta: '#/lotes' }, clase: 'btn-ancho' })}`;
  }

  function paso2() {
    const g = genDe(st.gid), max = maxDias(g);
    const edad = st.modo === 'edad'
      ? campo('nl-edad', 'Edad de las aves hoy', Contador({ id: 'nl-edad', valor: st.edad, min: 0, paso: 1, etiqueta: 'Edad' }) +
        seg('nl-unidad', 'unidad', [['dias', 'Días'], ['semanas', 'Semanas']]) +
        `<div class="nl-presets">${presets(g).map(([n, u, t]) => `<button type="button" class="segmento-btn" data-accion="nl-preset" data-valor="${n}" data-unidad="${u}">${t}</button>`).join('')}</div>`,
        `Máximo para ${esc(g.nombre)}: ${formatoNumero(max)} días (${semanas(max)})`)
      : campo('nl-fecha', 'Fecha de llegada', texto('nl-fecha', st.fecha, `type="date" max="${hoyLocal()}"`)) +
        campo('nl-edad-llegada', 'Edad al llegar (días)', Contador({ id: 'nl-edad-llegada', valor: st.edadLlegada, min: 0, paso: 1, etiqueta: 'Edad al llegar en días' }), 'Pon 0 o 1 si llegaron pollitos recién nacidos');
    return `<h1>${esc(g.nombre)}</h1>
  ${campo('nl-aves', '¿Cuántas aves llegaron?', Contador({ id: 'nl-aves', valor: st.aves, min: 1, paso: 10, etiqueta: 'Cantidad de aves' }))}
  <div class="reg-campo"><p class="reg-etiqueta">¿Qué sabes de su edad?</p>${seg('nl-modo', 'modo', [['edad', 'Su edad hoy'], ['fecha', 'Fecha de llegada']])}</div>
  ${edad}
  <p class="reg-error nl-error" role="alert" hidden></p>
  <div class="reg-acciones">${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'nl-atras' })}${Boton({ texto: 'Siguiente', icono: 'sig', variante: 'primario', accion: 'nl-siguiente' })}</div>`;
  }

  function paso3() {
    const g = genDe(st.gid), v = validar(datos()), def = v.lote ? `${corta(g)} · ${String(st.galpon || '').trim() || 'Lote'}` : '';
    return `<h1>¿Dónde están?</h1>
  <div class="reg-campo"><label class="reg-etiqueta" for="nl-altitud">Altitud de la granja (metros)</label>
    <div class="nl-alturas">${ALTITUDES.map(([m, t]) => `<button type="button" class="segmento-btn nl-altura" data-accion="nl-altitud" data-valor="${m}" aria-pressed="${String(st.altitud) === String(m)}"><b>${formatoNumero(m)} m</b><span>${t}</span></button>`).join('')}</div>
    ${texto('nl-altitud', st.altitud, 'type="number" inputmode="numeric" min="0" max="6000" step="1" placeholder="Otra altitud en metros"')}
    <p class="reg-ayuda">La recordamos para tus próximos lotes.</p></div>
  ${campo('nl-galpon', 'Galpón (opcional)', texto('nl-galpon', st.galpon, 'type="text" maxlength="40" autocomplete="off" placeholder="Ej.: Galpón 2"'))}
  ${campo('nl-nombre', 'Nombre del lote (opcional)', texto('nl-nombre', st.nombre, `type="text" maxlength="60" autocomplete="off" placeholder="${esc(def)}"`))}
  <p class="reg-error nl-error" role="alert" hidden></p>
  <div class="reg-acciones">${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'nl-atras' })}${Boton({ texto: 'Crear lote', icono: 'mas', variante: 'primario', accion: 'nl-crear', clase: 'reg-guardar' })}</div>`;
  }

  function html() {
    const nombres = ['Genética', 'Aves y edad', 'Lugar'];
    return `<section class="pantalla nuevo-lote" data-paso="${st.paso}">
  <p class="eyebrow">Nuevo lote · Paso ${st.paso} de 3</p>
  <ol class="pasos">${nombres.map((n, i) => `<li class="paso${i + 1 < st.paso ? ' paso-hecho' : ''}"${i + 1 === st.paso ? ' aria-current="step"' : ''}><span class="paso-barra" aria-hidden="true"></span><span class="paso-nombre">${n}</span></li>`).join('')}</ol>
  ${st.paso === 1 ? paso1() : st.paso === 2 ? paso2() : paso3()}
</section>`;
  }

  function pintar(enfocar) {
    const s = $v('.nuevo-lote');
    if (!s) return;
    s.outerHTML = html();
    if (enfocar) { window.scrollTo(0, 0); const h = $v('.nuevo-lote h1'); if (h) { h.tabIndex = -1; try { h.focus({ preventScroll: true }); } catch (e) { /* sin foco */ } } }
  }
  function error(msg) { const p = $v('.nl-error'); if (p) { p.textContent = msg; p.hidden = false; p.scrollIntoView({ block: 'nearest' }); } }

  /* App.estado.prefillLote = {genetica, aves, altitud, edadDias} (lo deja "Crear lote con este plan"):
     se usa una sola vez y abre el asistente en el paso 2 con todo lleno. */
  function precargar() {
    const p = App.estado.prefillLote;
    App.estado.prefillLote = null;
    if (!p || !genDe(p.genetica)) return false;
    st = Object.assign(nuevo(), { paso: 2, gid: p.genetica, modo: 'edad', unidad: 'dias' });
    if (Number.isFinite(numero(p.aves))) st.aves = String(p.aves);
    if (Number.isFinite(numero(p.edadDias))) st.edad = String(p.edadDias);
    if (Number.isFinite(numero(p.altitud))) st.altitud = String(p.altitud);
    return true;
  }

  VISTAS.nuevoLote = async function () { if (!precargar() && !st) st = nuevo(); return html(); };
  VISTAS.nuevoLote.crear = crear;

  ACCIONES['nl-genetica'] = el => { st.gid = el.dataset.id; st.paso = 2; pintar(true); };
  ACCIONES['nl-atras'] = () => { leer(); st.paso = Math.max(1, st.paso - 1); pintar(true); };
  ACCIONES['nl-modo'] = el => { leer(); st.modo = el.dataset.modo; pintar(); };
  ACCIONES['nl-unidad'] = el => { leer(); st.unidad = el.dataset.unidad; pintar(); };
  ACCIONES['nl-preset'] = el => { leer(); st.edad = el.dataset.valor; st.unidad = el.dataset.unidad; pintar(); };
  ACCIONES['nl-altitud'] = el => { leer(); st.altitud = el.dataset.valor; pintar(); };
  ACCIONES['nl-siguiente'] = () => {
    leer();
    const v = validar(Object.assign(datos(), { altitud: null }));
    if (v.mensaje) { error(v.mensaje); return; }
    st.paso = 3; pintar(true);
  };
  ACCIONES['nl-crear'] = async el => {
    leer();
    if (st.altitud === '' || st.altitud === null || st.altitud === undefined) { error('Elige la altitud de tu granja'); return; }
    el.disabled = true;
    let lote;
    try { lote = await crear(datos()); } catch (e) { el.disabled = false; error(e.message); return; }
    st = null;
    App.fijarLote(lote.id);
    App.ir('#/lote/' + encodeURIComponent(lote.id));
    App.toast('Lote creado');
    App.actualizarAlertas();
  };

  return { crear, validar, maxDias, planVacunas };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Planificar: estado del planificador y reglas (sin DOM).
   Copiado del planificador original (Appollo 1, IIFE de la interfaz) sin cambiar la lógica:
   mismas claves de almacenamiento (appollo.v1.estado, appollo.v1.precios), mismos
   valores de fábrica (BASE) y mismas llamadas a construirManejo / proyectar / brechas.
   ========================================================================= */
const PlanEstado = (function () {
  'use strict';
  const LS = {
    get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }
  };
  const K_ESTADO = 'appollo.v1.estado', K_PRECIOS = 'appollo.v1.precios';
  const BASE = { gid: null, obj: 'huevos', edad: null, unidad: 'semanas', aves: 100, alt: 2800, real: null, fin: null, sel: [], enf: null, filtro: 'todas' };
  const S = Object.assign({}, BASE, LS.get(K_ESTADO, {}));
  if (!Array.isArray(S.sel)) S.sel = [];
  const precios = Object.assign({ cubeta: '', kgVivo: '', kgAlim: '' }, LS.get(K_PRECIOS, {}));
  const guardar = () => LS.set(K_ESTADO, S);
  const guardarPrecios = () => LS.set(K_PRECIOS, precios);

  const gen = () => GENETICAS.find(g => g.id === S.gid);
  const modo = () => { const g = gen(); return g ? modoDe(g, S.obj) : 'huevos'; };
  const dias = () => { const e = Number(S.edad); if (!isFinite(e)) return NaN; return Math.round(S.unidad === 'semanas' ? e * 7 : e); };
  const plural = (n, s, p) => `${fmt(n, n % 1 ? 1 : 0)} ${n === 1 ? s : p}`;
  const edadTxt = () => S.unidad === 'semanas' ? plural(Number(S.edad), 'semana', 'semanas') : plural(Number(S.edad), 'día', 'días');
  const edadCorta = d => d <= 56 ? `Día ${d}` : `Sem. ${Math.round(d / 7)}`;

  function maxDias() {
    const g = gen(); if (!g) return 0;
    return modo() === 'huevos' ? 693 : g.carne.rango[1] - 1;
  }
  function errorEdad() {
    const d = dias();
    if (S.edad === null || S.edad === '' || !isFinite(d)) return 'Escribe la edad de las aves.';
    if (d < 0) return 'La edad no puede ser negativa.';
    if (d > maxDias()) return modo() === 'huevos' ? 'Para proyectar, la edad debe ser menor a 99 semanas.' : `La edad supera la edad máxima de venta (${gen().carne.rango[1]} días).`;
    return '';
  }
  const avesOk = () => Number.isFinite(S.aves) && S.aves >= 1 && S.aves <= 1000000;
  const loteValido = () => !!gen() && !errorEdad() && avesOk();

  function opcionesFin() {
    const g = gen(), d = dias();
    if (modo() === 'huevos') {
      const o = [72, 80, 90, 100].map(w => w * 7).filter(x => x > d + 6);
      return o.length ? o : [700];
    }
    const o = [];
    for (let x = g.carne.rango[0]; x <= g.carne.rango[1]; x += 7) if (x > d) o.push(x);
    return o.length ? o : [g.carne.rango[1]];
  }
  function dFin() {
    const g = gen(), ops = opcionesFin();
    const def = modo() === 'huevos' ? g.postura.fin * 7 : g.carne.venta;
    if (S.fin && ops.includes(S.fin)) return S.fin;
    if (ops.includes(def)) return def;
    return ops[0];
  }
  function realVisible() {
    const g = gen(), d = dias();
    if (modo() === 'huevos') return d >= (g.postura.w50 - 1) * 7;
    return d >= 3;
  }
  function estado() {
    const g = gen();
    const real = realVisible() && S.real !== null && S.real !== '' && isFinite(Number(S.real)) ? Number(S.real) : null;
    return { g, modo: modo(), dias: dias(), dFin: dFin(), aves: Math.round(S.aves), alt: Number(S.alt) || 0, enf: S.enf, real };
  }
  const selSet = () => new Set(S.sel);
  const enPostura = st => st.modo === 'huevos' && st.dias / 7 >= st.g.postura.w50 - 2;

  /* Paso al que se puede llegar: sin genética no hay lote; sin lote válido no hay manejo ni proyección. */
  const PASOS = ['genetica', 'lote', 'manejo', 'proyeccion'];
  function pasoPermitido(p) {
    let r = PASOS.includes(p) ? p : 'genetica';
    if (r !== 'genetica' && !gen()) r = 'genetica';
    if ((r === 'manejo' || r === 'proyeccion') && !loteValido()) r = 'lote';
    return r;
  }

  /* ---------------------------- Acciones de estado ---------------------------- */
  function elegirGenetica(id) {
    if (S.gid === id) return;
    const g = GENETICAS.find(x => x.id === id); if (!g) return;
    Object.assign(S, { gid: g.id, obj: 'huevos', sel: [], enf: null, fin: null, real: null });
    if (modoDe(g, S.obj) === 'carne') Object.assign(S, { unidad: 'dias', edad: 1 });
    else Object.assign(S, { unidad: 'semanas', edad: 20 });
    guardar();
  }
  function elegirObjetivo(v) {
    if (S.obj === v) return false;
    S.obj = v;
    Object.assign(S, { sel: [], enf: null, fin: null, real: null });
    Object.assign(S, S.obj === 'carne' ? { unidad: 'dias', edad: 1 } : { unidad: 'semanas', edad: 20 });
    guardar(); return true;
  }
  function elegirUnidad(u) {
    if (u === S.unidad) return false;
    const e = Number(S.edad);
    if (isFinite(e)) S.edad = u === 'dias' ? Math.round(e * 7) : Math.round(e / 7 * 10) / 10;
    S.unidad = u; guardar(); return true;
  }
  /* Botones − / + : mismos pasos que el original. Devuelve el valor nuevo. */
  function paso(campo, signo) {
    let v;
    if (campo === 'edad') {
      const e = Number(S.edad) || 0;
      v = S.edad = Math.max(0, Math.round((e + signo) * 10) / 10);
    } else {
      const a = Number(S.aves) || 0;
      const p = a >= 100 ? 10 : a >= 20 ? 5 : 1;
      v = S.aves = Math.max(1, a + signo * p);
    }
    S.fin = null; guardar(); return v;
  }
  /* Lo que escribe la persona en los campos del lote (mismas reglas que el original). */
  function escribir(campo, valor) {
    if (campo === 'edad') { S.edad = valor === '' ? null : Number(valor); S.fin = null; }
    else if (campo === 'aves') S.aves = valor === '' ? NaN : Math.round(Number(valor));
    else if (campo === 'alt') S.alt = Math.max(0, Math.min(4500, Number(valor) || 0));
    else if (campo === 'real') S.real = valor === '' ? null : Number(valor);
    guardar();
  }
  function marcar(id, si) {
    const s = selSet(); if (si) s.add(id); else s.delete(id);
    S.sel = [...s]; guardar();
  }
  function marcarTodo() {
    const st = estado(), M = construirManejo(st);
    const F = factores(st, M, selSet());
    if (F.indice >= 100) { S.sel = []; guardar(); return; }
    const s = selSet();
    for (const c of M.cats) if (c.items) for (const it of c.items) s.add(it.id);
    const enf = ENFERMEDADES.find(e => e.id === st.enf);
    if (enf) {
      enf.caseros.filter(x => /comprobad/i.test(x.ev) && (!x.solo || x.solo === st.modo)).forEach(x => s.add(x.id));
      const q = enf.quimicos.filter(x => !(x.noPostura && enPostura(st))).sort((a, b) => b.mit - a.mit)[0];
      if (q) s.add(q.id);
    }
    S.sel = [...s]; guardar();
  }

  /* ------------------------------ Cálculo ------------------------------ */
  function calcular() {
    const st = estado(), M = construirManejo(st), sel = selSet();
    const r = proyectar(st, M, sel);
    const Fstd = { f: 1, mortExtra: 0, shift: 0 };
    const stStd = Object.assign({}, st, { g: Object.assign({}, st.g, { campo: 1 }), real: null });
    const ref = st.modo === 'huevos' ? simHuevos(stStd, Fstd) : simCarne(stStd, Fstd);
    const br = brechas(st, M, sel, r);
    return { st, M, r, ref, br };
  }

  function textoResumen() {
    const { st, r } = calcular();
    const h = r.tipo === 'huevos';
    const L = [`Appollo · ${st.g.nombre}`, `${fmt(st.aves)} aves de ${edadTxt()} · ${fmt(st.alt)} msnm`, `Fase: ${fase(st.g, st.modo, st.dias).n}`, `Índice de manejo: ${r.F.indice} %`];
    if (h) L.push(`Proyección a la semana ${Math.round(st.dFin / 7)}: ${fmt(r.huevos)} huevos (${fmt(r.cubetas)} cubetas de 30), ${fmt(r.huevosAve)} por ave`, `Peso medio del huevo: ${fmt(r.pesoHuevo, 1)} g · Alimento por docena: ${fmt(r.kgDocena, 2)} kg`);
    else L.push(`Proyección a ${st.dFin} días: ${fmt(r.pesoFin / 1000, 2)} kg por ave, ${fmt(r.kgVivo)} kg en pie`, `Conversión acumulada: ${fmt(r.caAcum, 2)} · Viabilidad: ${fmt(r.viab, 1)} %`);
    L.push(`Fecha: ${new Date().toLocaleDateString('es-EC')}`);
    return L.join('\n');
  }

  /* Datos para "Crear lote con este plan" (los consume una vez la vista Nuevo lote). */
  function datosLote() {
    if (!loteValido()) return null;
    return { genetica: S.gid, aves: Math.round(S.aves), altitud: Number(S.alt) || 0, edadDias: dias() };
  }

  return { S, BASE, precios, guardar, guardarPrecios, gen, modo, dias, edadTxt, edadCorta, maxDias, errorEdad, avesOk, loteValido,
    opcionesFin, dFin, realVisible, estado, selSet, enPostura, PASOS, pasoPermitido, elegirGenetica, elegirObjetivo, elegirUnidad,
    paso, escribir, marcar, marcarTodo, calcular, textoResumen, datosLote };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Planificar, paso 3: recomendaciones de manejo.
   Categorías de construirManejo(st), índice de manejo de factores(), marcar todo,
   selector de problema sanitario con remedios caseros y control químico (tiempo de retiro;
   los tratamientos no aptos en postura quedan bloqueados). Misma lógica que el original.
   ========================================================================= */
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

const PlanManejo = (function () {
  'use strict';
  const P = PlanEstado;
  const $v = s => document.querySelector('#view ' + s);

  function nivel(it) {
    const p = it.prod + 1.5 * it.mort;
    if (p >= 9) return ['alto', 'Impacto alto'];
    if (p >= 4) return ['medio', 'Impacto medio'];
    return ['bajo', 'Impacto bajo'];
  }
  const tag = (clase, texto) => `<span class="plan-tag plan-tag-${clase}">${esc(texto)}</span>`;
  /* `titulo` llega ya escapado (lo arma catHTML). */
  function itemHTML(it, sel, extra = '', bloqueado = false, titulo = null) {
    const [c, l] = it.prod !== undefined ? nivel(it) : ['', ''];
    return `<label class="plan-item${bloqueado ? ' plan-item-bloqueado' : ''}"><input type="checkbox" data-sel="${esc(it.id)}" ${sel.has(it.id) && !bloqueado ? 'checked' : ''} ${bloqueado ? 'disabled' : ''}>
      <span class="plan-caja" aria-hidden="true"></span>
      <span class="plan-item-texto"><span class="plan-item-t">${titulo || esc(it.n)}</span>${it.det ? `<span class="plan-item-d">${esc(it.det)}</span>` : ''}
      <span class="plan-tags">${it.clave ? tag('clave', 'Esencial') : ''}${c ? tag(c, l) : ''}${extra}</span></span></label>`;
  }
  function cuenta(c, sel, st) {
    if (c.sanidad) {
      const enf = ENFERMEDADES.find(e => e.id === st.enf);
      const lista = c.id === 'casero' ? (enf ? enf.caseros.filter(x => !x.solo || x.solo === st.modo) : PREVENTIVOS_CASEROS) : (enf ? enf.quimicos : []);
      if (!lista.length) return '';
      return `${lista.filter(x => sel.has(x.id)).length}/${lista.length}`;
    }
    return `${c.items.filter(x => sel.has(x.id)).length}/${c.items.length}`;
  }
  const aviso = (texto, suave) => `<div class="plan-aviso${suave ? ' plan-aviso-suave' : ''}">${icono(suave ? 'info' : 'aviso')}<span>${texto}</span></div>`;
  const nota = t => `<p class="reg-ayuda">${esc(t)}</p>`;

  function catHTML(c, st, sel) {
    let body = '';
    if (c.filas) body += `<dl class="plan-tabla">${c.filas.map(f => `<div><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join('')}</dl>`;
    if (c.id === 'vac') {
      body += `<div class="plan-items">${c.items.map(it => {
        const et = { pasada: ['pasada', 'Edad pasada: marca si se aplicó'], ahora: ['ahora', 'Toca esta semana'], proxima: ['proxima', 'Próxima'], vigente: ['vigente', 'En curso'] }[it.estado] || ['proxima', ''];
        return itemHTML(it, sel, et[1] ? tag('estado-' + et[0], et[1]) : '', false, `<span class="plan-vac-edad">${esc(it.repite ? 'Desde sem. 20' : P.edadCorta(it.edad))}</span> · ${esc(it.n)}`);
      }).join('')}</div>`;
    } else if (c.id === 'casero') {
      const enf = ENFERMEDADES.find(e => e.id === st.enf);
      body += `<div class="reg-campo"><label class="reg-etiqueta" for="plan-enf">¿Hay algún problema sanitario en el lote?</label>
        <select id="plan-enf" class="reg-select"><option value="">Ninguno, el lote está sano</option>
        ${c.enfermedades.map(e => `<option value="${esc(e.id)}" ${st.enf === e.id ? 'selected' : ''}>${esc(e.n)}</option>`).join('')}</select></div>`;
      if (enf) {
        body += `<p class="plan-signos"><b>Signos:</b> ${esc(enf.signos)}</p>`;
        if (enf.alerta) body += aviso(esc(enf.alerta));
        const cas = enf.caseros.filter(x => !x.solo || x.solo === st.modo);
        if (cas.length) body += `<div class="plan-items">${cas.map(it => itemHTML(it, sel, tag('ev', it.ev))).join('')}</div>`;
        else body += nota('No hay un remedio casero eficaz para este problema.');
        if (enf.nota) body += nota(enf.nota);
      } else {
        body += nota('Opcionales y de apoyo. No reemplazan las vacunas ni la bioseguridad.') +
          `<div class="plan-items">${PREVENTIVOS_CASEROS.map(it => itemHTML(it, sel, tag('ev', it.ev))).join('')}</div>`;
      }
    } else if (c.id === 'quim') {
      const enf = ENFERMEDADES.find(e => e.id === st.enf);
      const enPostura = P.enPostura(st);
      if (!enf) {
        body += aviso('Sin un problema diagnosticado no se recomienda medicar. Los antibióticos preventivos crean resistencia y dejan residuos en huevos y carne. Si aparece un problema, elígelo en <b>Remedios caseros</b>.', true);
      } else if (!enf.quimicos.length) {
        body += enf.alerta ? aviso(`No existe tratamiento. ${esc(enf.alerta)}`) : nota(`No hay tratamiento químico eficaz. ${enf.nota || ''}`);
      } else {
        body += aviso('Úsalos solo con diagnóstico y receta de un médico veterinario. Respeta el tiempo de retiro: no vendas ni consumas huevos o carne durante ese período. Dosis de referencia; confirma siempre en la etiqueta.');
        body += `<div class="plan-items">${enf.quimicos.map(it => {
          const bloq = it.noPostura && enPostura;
          return itemHTML(it, sel, `${bloq ? tag('alto', 'No apto en postura') : ''}${tag('ev', 'Retiro: ' + it.retiro)}`, bloq);
        }).join('')}</div>`;
        if (enf.nota) body += nota(enf.nota);
      }
    } else if (c.items && c.items.length) {
      body += `<div class="plan-items">${c.items.map(it => itemHTML(it, sel)).join('')}</div>`;
    }
    if (c.notas) body += c.notas.map(nota).join('');
    const n = cuenta(c, sel, st);
    return `<section class="tarjeta plan-cat" id="cat-${esc(c.id)}">
      <header class="tarjeta-cab"><span class="tarjeta-icono">${icono(c.icono)}</span><h2 class="tarjeta-titulo plan-cat-titulo">${esc(c.n)}</h2><span class="plan-cuenta num" data-cuenta="${esc(c.id)}">${n}</span></header>
      <div class="plan-cat-cuerpo">${body}</div></section>`;
  }

  const medidor = ind => `<div class="plan-medidor${ind >= 85 ? ' plan-medidor-bueno' : ind < 50 ? ' plan-medidor-malo' : ''}" aria-hidden="true"><span style="width:${ind}%"></span></div>`;

  function html() {
    const st = P.estado(), M = construirManejo(st), sel = P.selSet();
    const F = factores(st, M, sel);
    return `<h1>Recomendaciones de manejo</h1>
  <p class="pantalla-texto">${esc(st.g.nombre)} de ${esc(P.edadTxt())} · <b>${esc(M.fase.n)}</b>. Marca lo que vas a aplicar: la proyección cambia con cada elección.</p>
  <div class="tarjeta plan-resumen">
    <div class="plan-indice-fila"><div><p class="eyebrow">Índice de manejo</p><p class="plan-indice-num num" id="plan-indice">${F.indice} %</p></div>
      ${Boton({ texto: F.indice >= 100 ? 'Desmarcar todo' : 'Marcar lo recomendado', variante: 'secundario', accion: 'plan-todo' })}</div>
    ${medidor(F.indice)}
  </div>
  <nav class="plan-saltos" aria-label="Secciones">${M.cats.map(c => `<button type="button" class="selector-btn" data-accion="plan-cat" data-v="${esc(c.id)}">${esc(c.n)}</button>`).join('')}</nav>
  ${M.cats.map(c => catHTML(c, st, sel)).join('')}
  <div class="reg-acciones plan-acciones">${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'plan-ir', datos: { paso: 'lote' } })}${
    Boton({ texto: 'Ver proyección', icono: 'sig', variante: 'primario', accion: 'plan-ir', datos: { paso: 'proyeccion' } })}</div>`;
  }

  /* Al marcar o desmarcar: índice, medidor, botón y cuentas sin volver a dibujar (como vivoManejo). */
  function vivo() {
    const st = P.estado(), M = construirManejo(st), sel = P.selSet();
    const F = factores(st, M, sel);
    $v('#plan-indice').textContent = F.indice + ' %';
    const m = $v('.plan-resumen .plan-medidor');
    if (m) m.outerHTML = medidor(F.indice);
    const b = $v('[data-accion="plan-todo"] .btn-texto');
    if (b) b.textContent = F.indice >= 100 ? 'Desmarcar todo' : 'Marcar lo recomendado';
    for (const c of M.cats) { const el = $v(`[data-cuenta="${c.id}"]`); if (el) el.textContent = cuenta(c, sel, st); }
  }

  function montar(raiz) {
    raiz.addEventListener('change', e => {
      const t = e.target;
      if (t.matches('input[data-sel]')) { if (t.disabled) return; P.marcar(t.dataset.sel, t.checked); vivo(); }
      else if (t.id === 'plan-enf') { P.S.enf = t.value || null; P.guardar(); App.refrescar(); }
    });
  }

  ACCIONES['plan-todo'] = () => { P.marcarTodo(); App.refrescar(); };
  ACCIONES['plan-cat'] = el => {
    const c = document.getElementById('cat-' + el.dataset.v);
    if (c) c.scrollIntoView({ behavior: reducirMovimiento() ? 'auto' : 'smooth', block: 'start' });
  };

  return { html, montar };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Planificar, paso 4: proyección.
   Cifras de proyectar() con los mismos textos y redondeos del original, gráfico del
   estándar contra la proyección, "lo que más sumaría" (brechas), ingresos y margen con
   los precios de appollo.v1.precios, copiar el resumen y "Crear lote con este plan".
   ========================================================================= */
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

const PlanProyeccion = (function () {
  'use strict';
  const P = PlanEstado;
  const $v = s => document.querySelector('#view ' + s);

  /* Serie para Grafico: estándar desde el inicio del eje y proyección desde hoy (mismo eje que el original). */
  function grafico(st, r) {
    const est = [], real = [], et = [];
    if (r.tipo === 'huevos') {
      const w0 = st.dias / 7, p = st.g.postura;
      const x0 = w0 < 16 ? 0 : Math.max(16, Math.floor(w0) - 6);
      for (let w = x0; w < w0; w++) { est.push(hdStd(p, w)); real.push(null); et.push('Sem. ' + fmt(w)); }
      for (const q of r.serie) { est.push(hdStd(p, q.w)); real.push(q.hd); et.push('Sem. ' + fmt(q.w, q.w % 1 ? 1 : 0)); }
    } else {
      const c = st.g.carne, desde = {};
      for (const q of r.serie) desde[q.d] = q.p;
      for (let d = 0; d <= st.dFin; d++) { est.push(pesoStd(c, d) / 1000); real.push(d in desde ? desde[d] / 1000 : null); et.push('Día ' + d); }
    }
    const titulo = r.tipo === 'huevos' ? '% de postura por semana' : 'Peso por ave (kg) por día';
    return `<article class="tarjeta plan-grafico"><header class="tarjeta-cab"><h2 class="tarjeta-titulo">${titulo}</h2></header>${
      Grafico({ serieReal: real, serieEstandar: est, etiquetas: et, leyendaReal: 'Tu lote (proyección)', leyendaEstandar: 'Estándar ' + st.g.nombre })}</article>`;
  }

  function ecoHTML(r) {
    const precios = P.precios, h = r.tipo === 'huevos';
    const pv = parseFloat(String(h ? precios.cubeta : precios.kgVivo).replace(',', '.'));
    const pa = parseFloat(String(precios.kgAlim).replace(',', '.'));
    const ing = isFinite(pv) ? (h ? r.cubetas * pv : r.kgVivo * pv) : NaN;
    const cos = isFinite(pa) ? r.alimento * pa : NaN;
    const mar = ing - cos;
    const usd = x => isFinite(x) ? '$ ' + fmt(x, 2) : '—';
    return `<div><span>Ingreso por ${h ? 'huevos' : 'venta en pie'}</span><span class="num">${usd(ing)}</span></div>
      <div><span>Costo del alimento${h && r.alimRecria > 0 ? ' (con recría)' : ''}</span><span class="num">${usd(cos)}</span></div>
      <div class="plan-eco-total"><span>Margen sobre alimento</span><span class="num${isFinite(mar) ? (mar >= 0 ? ' plan-pos' : ' plan-neg') : ''}">${usd(mar)}</span></div>`;
  }

  function html() {
    const { st, r, ref, br } = P.calcular();
    const h = r.tipo === 'huevos';
    const pct = h ? (ref.huevos ? 100 * r.huevos / ref.huevos : 0) : 100 * r.pesoFin / ref.pesoFin;
    const ops = P.opcionesFin();
    let heroe;
    const kpis = [];
    if (h) {
      heroe = `<p class="eyebrow plan-heroe-titulo">Huevos del lote hasta la semana ${Math.round(st.dFin / 7)}</p>
        <p class="plan-heroe-num num">${fmt(r.huevos)}<small>huevos</small></p>
        <p class="plan-heroe-sub"><b>${fmt(r.cubetas)}</b> cubetas de 30 · ${fmt(r.huevosAve)} huevos por ave</p>`;
      if (r.hdHoy >= 5) kpis.push([fmt(r.hdHoy, 1), '%', 'Postura esperada esta semana']);
      else kpis.push([r.w50 ? 'Sem. ' + fmt(r.w50, 0) : '—', '', r.w50 ? 'Llega al 50 % de postura' : 'No llega al 50 % de postura']);
      kpis.push([fmt(r.pico, 1), '%', `Pico esperado (sem. ${fmt(r.wPico, 0)})`]);
      kpis.push([fmt(r.pesoHuevo, 1), 'g', 'Peso medio del huevo']);
