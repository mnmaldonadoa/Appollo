<style>
/* Appollo 2 · Sistema visual
   Campo andino: papel crema, verde de potrero, tierra, yema de huevo y cielo.
   Todo par de texto/fondo cumple WCAG >= 7:1 (claro y oscuro). Los tonos "-viva" son
   solo decoración (franjas, puntos, líneas) y nunca llevan texto encima salvo --huevo. */

/* ---------- Tipografía (las @font-face las inserta build.py) ---------- */
:root {
  --f-texto: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-titulo: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --dur: 220ms;
  --curva: cubic-bezier(.2, .7, .2, 1);
  --rebote: cubic-bezier(.34, 1.4, .5, 1);
  --r-s: 16px;
  --r: 24px;
  --r-l: 28px;
  --r-xl: 32px;                 /* hoja inferior */
  /* escala de espacio (4/8) */
  --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px; --e5: 24px; --e6: 32px; --e7: 48px;
  --presion: .97;               /* escala al tocar; 1 con movimiento reducido */
  --t-toque: 120ms;
}

/* ---------- Tema claro (por defecto) ----------
   Pastel mate: los pasteles puros (--p-*, --ave-*, --il-fondo-*) nunca llevan texto. Donde hay texto se usan los
   tintes --t-* con texto carbón, y los acentos profundos (--alerta, --ok, --precaucion) solo como texto, borde o
   botón de acción. tests/paleta.test.js valida cada par. */
:root, [data-tema="claro"] {
  --fondo: #F7F3E8;
  --superficie: #FFFDF8;
  --superficie-2: #EFE9DA;
  --linea: #E4DCCB;
  --linea-fuerte: #CFC4AE;
  --texto: #2D3142;           /* carbón suave */
  --secundario: #424A5C;      /* solo sobre crema o blanco */
  --primario: #2D3142;        /* botón principal: carbón con texto crema */
  --primario-suave: #E4EAE5;
  --sobre-primario: #FFFDF8;
  --huevo: #F6BD60;
  --huevo-suave: #FBE6C2;
  --sobre-huevo: #2D3142;
  --cielo: #7E9CC4;
  --alerta: #7A2F2A;          /* coral profundo */
  --sobre-alerta: #FFFDF8;
  --precaucion: #5E4210;      /* durazno profundo */
  --ok: #344E47;              /* salvia profunda: selección, enlaces, "Bien" */
  --alerta-viva: #F28482;
  --precaucion-viva: #F6BD60;
  --ok-viva: #84A59D;
  /* tintes con texto */
  --t-menta: #D8E2DC; --t-cielo: #D0E1F9; --t-lila: #E8DFF5; --t-coral: #F5C7BF; --t-salvia: #C9D4CA; --t-durazno: #F6BD60; --t-marron: #E9D3B9;
  /* pasteles puros (decoración) */
  --p-coral: #F28482; --p-salvia: #84A59D; --p-durazno: #F6BD60; --p-menta: #D8E2DC; --p-cielo: #D0E1F9; --p-lila: #E8DFF5; --p-crema: #F7F3E8;
  /* ilustración */
  --ave-hueso: #FAF9F6; --ave-pollito: #FCE181; --ave-marron: #D4A373; --ave-gris: #CCD5AE; --ave-hueso-2: #E6DFD0; --ave-marron-2: #B98A5E; --ave-caoba: #B4764E;
  --il-trazo: #2D3142; --il-ojo: #2D3142;
  --il-fondo-crema: #EFE6D2; --il-fondo-menta: #D8E2DC; --il-fondo-cielo: #D0E1F9; --il-fondo-lila: #E8DFF5; --il-fondo-coral: #F5C7BF; --il-fondo-salvia: #C9D4CA; --il-fondo-durazno: #FBE3B8;
  --foco: #2D3142;
  --velo: rgba(45, 49, 66, .52);
  --sombra-plana: 0 3px 0 0 #D9CFBC;
  --sombra-boton: 0 3px 0 0 #151821;
  --sombra-peligro: 0 3px 0 0 #521E1A;
  --tinta: rgba(45, 49, 66, .10);
  --brillo-esq: rgba(255, 253, 248, .75);
  --il-sombra: rgba(45, 49, 66, .12);
  color-scheme: light;
}

h1, h2, .titulo { font-family: var(--f-titulo); font-weight: 800; line-height: 1.15; letter-spacing: -.01em; margin: 0; }
h1 { font-size: 2rem; }
h2 { font-size: 1.5rem; font-weight: 700; }
h3 { font-family: var(--f-texto); font-size: 1rem; font-weight: 700; margin: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 3px; }
#view:focus-visible, .hoja:focus-visible { outline: none; } /* contenedores con foco programático (vista, hoja) */
.num { font-variant-numeric: tabular-nums lining-nums; }
.solo-lector { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Botón ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 12px 24px; border-radius: 999px;
  font-family: var(--f-texto); font-size: 1rem; font-weight: 700; line-height: 1.2; text-align: center;
  border: 2px solid transparent; text-decoration: none; user-select: none; touch-action: manipulation;
  transition: transform var(--dur) var(--curva), box-shadow var(--dur) var(--curva), background-color var(--dur) var(--curva);
}
.btn:active { transform: translateY(2px); }
.btn-primario {
  background: var(--primario); color: var(--sobre-primario);
  box-shadow: var(--sombra-boton);
}
.btn-primario:active, .btn-peligro:active { box-shadow: none; transform: translateY(3px); }
.btn-secundario { background: var(--superficie); color: var(--ok); border-color: var(--ok); }
.btn-secundario:active { background: var(--primario-suave); }
.btn-peligro {
  background: var(--alerta); color: var(--sobre-alerta);
  box-shadow: var(--sombra-peligro);
}
.btn-ancho { display: flex; width: 100%; }

/* ---------- Tarjeta ---------- */
.tarjeta {
  position: relative; overflow: hidden;
  background: var(--superficie); border: 2px solid var(--linea); border-radius: var(--r-l);
  padding: 16px 18px 18px 22px;
}
.tarjeta::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--linea-fuerte); }
.tarjeta-verde::before { background: var(--ok-viva); }
.tarjeta-ambar::before { background: var(--precaucion-viva); }
.tarjeta-rojo::before { background: var(--alerta-viva); }
.tarjeta-cab { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.tarjeta-il { flex: none; }
/* Tarjetas con estado: superficie tintada; dentro, el texto secundario y los chips pasan a carbón (>= 7:1). */
.tarjeta-verde { background: var(--t-salvia); --secundario: var(--texto); }
.tarjeta-ambar { background: var(--t-durazno); --secundario: var(--texto); }
.tarjeta-rojo { background: var(--t-coral); --secundario: var(--texto); }
.tarjeta-verde .chip, .tarjeta-ambar .chip, .tarjeta-rojo .chip { color: var(--texto); }
.lote-item.lote-item-il { display: flex; align-items: center; gap: 12px; }
.lote-item-texto { display: grid; gap: 4px; min-width: 0; flex: 1; }
.dl-cab-il { margin-bottom: var(--e2); }
.cab-il-texto { display: grid; gap: 2px; min-width: 0; }
.tarjeta-icono {
  display: grid; place-items: center; width: 40px; height: 40px; flex: none;
  border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%; /* forma de huevo */
  background: var(--primario-suave); color: var(--ok);
}
.tarjeta-ambar .tarjeta-icono { background: var(--huevo-suave); color: var(--precaucion); }
.tarjeta-rojo .tarjeta-icono { background: color-mix(in srgb, var(--alerta-viva) 16%, var(--superficie)); color: var(--alerta); }
.tarjeta-titulo { flex: 1; min-width: 0; color: var(--secundario); font-size: 1rem; font-weight: 700; }
.tarjeta-valor { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 8px; margin-top: 6px; }
.tarjeta-cifra { font-family: var(--f-titulo); font-weight: 800; font-size: 2.5rem; line-height: 1.05; letter-spacing: -.02em; color: var(--texto); }
.tarjeta-unidad { color: var(--secundario); font-size: 1rem; font-weight: 700; }
.tarjeta-pie { margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--linea-fuerte); color: var(--secundario); font-size: 1rem; }
.tarjeta.pop { animation: pop 420ms var(--rebote); }

.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 2px 10px 2px 8px; border-radius: 999px; border: 2px solid currentColor;
  font-size: 1rem; font-weight: 700; line-height: 1.4; background: var(--superficie);
}
.chip-punto { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.chip-verde { color: var(--ok); }
.chip-ambar { color: var(--precaucion); }
.chip-rojo { color: var(--alerta); }
.chip-verde .chip-punto { background: var(--ok-viva); }
.chip-ambar .chip-punto { background: var(--precaucion-viva); }
.chip-rojo .chip-punto { background: var(--alerta-viva); }

/* ---------- Contador ---------- */
.contador { display: flex; align-items: stretch; gap: 8px; }
.contador-btn {
  flex: none; width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center;
  font-family: var(--f-titulo); font-size: 2.25rem; font-weight: 800; line-height: 1;
  border: 2px solid var(--ok); touch-action: manipulation;
  transition: transform var(--dur) var(--curva), background-color var(--dur) var(--curva);
}
.contador-btn:active { transform: scale(.94); }
.contador-menos { background: var(--superficie); color: var(--ok); }
.contador-mas { background: var(--primario); color: var(--sobre-primario); box-shadow: var(--sombra-boton); }
.contador-valor {
  flex: 1 1 0; width: 0; min-width: 0; height: 64px; padding: 0 8px; text-align: center;
  font-family: var(--f-titulo); font-size: 2.5rem; font-weight: 800; color: var(--texto);
  background: var(--superficie); border: 2px solid var(--linea-fuerte); border-radius: 20px;
  -moz-appearance: textfield; appearance: textfield;
}
.contador-valor::-webkit-outer-spin-button, .contador-valor::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.contador-valor:focus { border-color: var(--ok); outline: 3px solid var(--foco); outline-offset: 2px; }

/* ---------- Hoja inferior ---------- */
.hoja-capa { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; }
.hoja-fondo { position: absolute; inset: 0; background: var(--velo); animation: aparecer var(--dur) var(--curva) both; }
.hoja {
  position: relative; max-height: 88%; overflow: auto; overscroll-behavior: contain;
  width: 100%; max-width: 560px; margin: 0 auto;
  background: var(--superficie); color: var(--texto);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  padding: 8px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  animation: subir 420ms var(--rebote) both;
}
.hoja-asa { width: 44px; height: 5px; border-radius: 3px; background: var(--linea-fuerte); margin: 4px auto 12px; }
.hoja-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.hoja-titulo { font-size: 1.6rem; }
.hoja-cuerpo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.hoja-rejilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.hoja-rejilla .reg-tipo-btn { min-height: 112px; }
.hoja-rejilla .btn { flex-direction: column; gap: 6px; min-height: 92px; padding: 12px 8px; border-radius: var(--r); }
.hoja-rejilla .btn .ic { width: 30px; height: 30px; }
.hoja-capa.cerrando .hoja { animation: bajar var(--dur) var(--curva) both; }
.hoja-capa.cerrando .hoja-fondo { animation: aparecer var(--dur) var(--curva) reverse both; }

/* ---------- Ilustraciones (ui/ilustraciones.js) ---------- */
.il { display: block; flex: none; overflow: visible; }
.il-media, .il-grande { animation: il-entra 260ms var(--rebote) both; }
@keyframes il-entra { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .il-media, .il-grande { animation: none; } }

/* ---------- Esqueleto ---------- */
.esqueleto { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.esqueleto-bloque {
  height: 96px; border-radius: var(--r-l);
  background: var(--superficie-2); animation: latido 1.4s ease-in-out infinite;
}
.esqueleto-bloque:nth-child(3n) { height: 64px; width: 72%; }

/* ---------- Gráfico ---------- */
.grafico { position: relative; margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.grafico-svg { display: block; width: 100%; height: auto; overflow: visible; }
.grafico-rejilla { stroke: var(--linea); stroke-width: 1; }
.grafico-base { stroke: var(--linea-fuerte); stroke-width: 2; }
.grafico-real { stroke: var(--ok); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 1; stroke-dashoffset: 0; animation: trazar 900ms var(--curva) both; }
.grafico-real-punto, .grafico-ultimo { fill: var(--ok); stroke: var(--superficie); stroke-width: 2.5; }
.grafico-estandar { stroke: var(--secundario); stroke-width: 2.5; stroke-linecap: round; }
.grafico-estandar-punto { fill: var(--secundario); }
.grafico-ejes { display: flex; justify-content: space-between; color: var(--secundario); font-size: 1rem; }
.grafico-aviso { position: absolute; inset: 22% 0 auto; color: var(--secundario); font-size: 1rem; text-align: center; }
.grafico-leyenda { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 1rem; font-weight: 700; }
.ley { display: inline-flex; align-items: center; gap: 8px; }
.ley::before { content: ""; width: 26px; height: 0; border-top: 4px solid var(--ok); border-radius: 2px; }
.ley-estandar::before { border-top: 3px dashed var(--secundario); }

/* ---------- Palomita ---------- */
.palomita { width: 72px; height: 72px; display: block; }
.palomita-circulo { fill: var(--primario-suave); stroke: var(--ok-viva); stroke-width: 3; transform-origin: 26px 26px; transform-box: view-box; }
.palomita-trazo { fill: none; stroke: var(--ok); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; }

/* ---------- Pantalla (transición de vista) ---------- */
.pantalla-entra { animation: entrar var(--dur) var(--curva) both; }

/* ---------- Shell: vista, franjas, barra inferior, toast ---------- */
.vista { padding-top: env(safe-area-inset-top, 0px); display: block; overflow-x: clip; min-height: 100vh; min-height: 100dvh; padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); outline: none; }
.vista-raiz { width: 100%; max-width: 640px; margin: 0 auto; }
.pantalla { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e4); padding: var(--e5) max(var(--e4), env(safe-area-inset-right)) var(--e2) max(var(--e4), env(safe-area-inset-left)); }
.pantalla-texto { color: var(--secundario); }
.proximamente {
  display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px; border-radius: var(--r-l);
  background: var(--superficie); border: 2px dashed var(--linea-fuerte); color: var(--secundario);
}
.proximamente .ic { color: var(--ok); margin-top: 2px; }
.pantalla-vacia { justify-items: center; text-align: center; padding-top: 48px; gap: 18px; }
.vacia-ilustracion { display: grid; place-items: center; width: 160px; margin-bottom: var(--e1); color: var(--ok); }
.pantalla-vacia .pantalla-texto { max-width: 30ch; }
.btn-grande { min-height: 64px; font-size: 1.125rem; border-radius: 999px; }
.mas-lista { display: grid; gap: 12px; }
.btn-lista { justify-content: flex-start; min-height: 64px; padding-inline: 18px; color: var(--texto); border-color: var(--linea-fuerte); }
.btn-lista .ic { color: var(--ok); }

.vista-error { justify-items: center; text-align: center; padding-top: 48px; }
.vista-error-icono { display: grid; place-items: center; width: 88px; height: 88px; border-radius: 50%;
  background: color-mix(in srgb, var(--alerta-viva) 14%, var(--superficie)); color: var(--alerta); }
.vista-error-icono .ic { width: 44px; height: 44px; }
.vista-error p { color: var(--secundario); max-width: 32ch; }

.franjas { position: sticky; top: 0; z-index: 20; }
.franja { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); font-size: 1rem; font-weight: 700; line-height: 1.35; }
.franja[hidden] { display: none; }
.franja-offline { background: var(--superficie-2); color: var(--texto); border-bottom: 1px solid var(--linea-fuerte); }
.franja-memoria { background: var(--alerta); color: var(--sobre-alerta); }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) 84px repeat(2, minmax(0, 1fr)); align-items: end; gap: 8px;
  padding: 6px max(2px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom, 0px)) max(2px, env(safe-area-inset-left));
  background: var(--superficie); border-top: 2px solid var(--linea);
}
.nav-item {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px;
  min-width: 0; min-height: 64px; padding: 6px 0 4px; margin: 0; border: 0; border-radius: 16px; background: none;
  color: var(--secundario); text-decoration: none; font-size: 1rem; font-weight: 700; line-height: 1.2; letter-spacing: -.01em;
  touch-action: manipulation;
}
.nav-texto { max-width: 100%; white-space: nowrap; }
.nav-icono { position: relative; display: grid; place-items: center; width: 52px; height: 32px; border-radius: 16px;
  transition: background-color var(--dur) var(--curva); }
.nav-item[aria-current="page"] { color: var(--ok); }
.nav-item[aria-current="page"] .nav-icono { background: var(--primario-suave); }
.nav-item[aria-current="page"] .ic { stroke-width: 2.4; }
.nav-item:active .nav-icono { transform: scale(.94); }
.nav-registrar { color: var(--texto); }
.nav-circulo {
  display: grid; place-items: center; width: 64px; height: 64px; margin-top: -30px; border-radius: 50%;
  background: var(--primario); color: var(--sobre-primario); border: 4px solid var(--superficie);
  box-shadow: var(--sombra-boton);
  transition: transform var(--dur) var(--rebote);
}
.nav-circulo .ic { width: 32px; height: 32px; stroke-width: 2.6; }
.nav-registrar:active .nav-circulo { transform: scale(.92); }
.nav-insignia {
  position: absolute; top: -6px; left: 30px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px;
  display: grid; place-items: center; background: var(--alerta); color: var(--sobre-alerta);
  font-size: 1rem; font-weight: 700; line-height: 1; border: 2px solid var(--superficie);
}
.nav-insignia[hidden] { display: none; }

.toast {
  position: fixed; z-index: 40; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  max-width: 536px; margin: 0 auto; overflow: hidden;
  display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 18px; border-radius: var(--r);
  background: var(--texto); color: var(--fondo);
  animation: subir-toast 320ms var(--rebote) both;
}
.toast[hidden] { display: none; }
.toast-texto { flex: 1; min-width: 0; font-weight: 700; }
.toast:not(:has(.btn)) { padding: 16px 18px; }
.toast .btn { flex: none; background: transparent; color: inherit; border-color: currentColor; padding-inline: 18px; }
.toast .btn:active { background: color-mix(in srgb, var(--fondo) 18%, transparent); }
.toast-tiempo { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--huevo);
  transform-origin: left; animation: vaciar linear both; }

/* ---------- Registro rápido ---------- */
.reg-lote {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 14px; margin: 0;
  border-radius: var(--r); background: var(--primario-suave); color: var(--texto); border: 2px solid transparent; text-align: left;
}
.reg-lote > .ic { color: var(--ok); }
.reg-lote-texto { display: grid; flex: 1; min-width: 0; line-height: 1.25; }
.reg-lote-texto b, .reg-lote-texto span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reg-lote-texto span { font-size: 1rem; }
.reg-lote-btn { border-color: var(--ok); touch-action: manipulation; }
.reg-lote-cambiar { flex: none; font-weight: 700; color: var(--texto); text-decoration: underline; text-underline-offset: 3px; }
.reg-campo { display: grid; gap: 6px; }
.reg-etiqueta { font-weight: 700; }
.reg-ayuda, .reg-nota { color: var(--secundario); font-size: 1rem; }
.reg-select, .reg-texto {
  width: 100%; min-height: 56px; padding: 10px 14px; border-radius: var(--r-s);
  background: var(--superficie); color: var(--texto); border: 2px solid var(--linea-fuerte); font-size: 1.125rem;
}
.reg-select:focus, .reg-texto:focus { border-color: var(--ok); outline: 3px solid var(--foco); outline-offset: 2px; }
.reg-opciones { display: grid; gap: 8px; }
.reg-opcion {
  display: grid; gap: 2px; min-height: 64px; padding: 10px 16px; border-radius: var(--r); text-align: left;
  background: var(--superficie); color: var(--texto); border: 2px solid var(--linea-fuerte); touch-action: manipulation;
}
.reg-opcion span { color: var(--secundario); font-size: 1rem; }
.reg-opcion[aria-pressed="true"] { border-color: var(--ok);  background: var(--primario-suave); }
.reg-error {
  padding: 12px 14px; border-radius: var(--r-s); font-weight: 700;
  background: color-mix(in srgb, var(--alerta-viva) 12%, var(--superficie)); color: var(--alerta); border: 2px solid var(--alerta-viva);
}
.reg-error[hidden], .reg-pregunta[hidden], .reg-acciones[hidden] { display: none; }
.reg-pregunta { display: grid; gap: 12px; padding: 14px; border-radius: var(--r); background: var(--huevo-suave); color: var(--texto); }
.reg-pregunta-botones { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.reg-acciones { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; margin-top: 4px; position: sticky; bottom: 0; }
.reg-guardar { min-height: 64px; font-size: 1.125rem; }
.reg-guardar.guardado { background: var(--primario-suave); color: var(--ok); }
.reg-guardar .palomita { width: 44px; height: 44px; }
.reg-vacio { display: grid; justify-items: center; gap: 12px; text-align: center; padding-bottom: 8px; }
.reg-vacio-titulo { font-family: var(--f-titulo); font-size: 1.5rem; font-weight: 800; }
.reg-vacio .btn { margin-top: 4px; }

@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
@keyframes subir { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes bajar { from { transform: translateY(0); } to { transform: translateY(100%); } }
@keyframes entrar { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes latido { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
@keyframes trazar { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes subir-toast { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes vaciar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- Pantallas de gestión (Task 6) ---------- */
[hidden].btn, .dl-confirmar[hidden] { display: none !important; }
.eyebrow { color: var(--secundario); font-size: 1rem; font-weight: 700; letter-spacing: .02em; }
.seccion-titulo .il { display: inline-block; vertical-align: middle; }
.seccion-titulo { margin-top: 8px; display: flex; align-items: baseline; gap: 8px; }
.seccion-titulo .num { color: var(--secundario); font-family: var(--f-texto); font-size: 1rem; }

.bienvenida { padding-top: 32px; }
.bv-ilustracion { display: grid; place-items: center; width: 168px; margin-bottom: var(--e1); }
.bv-opcion { grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 14px; min-height: 72px; }
.bv-opcion > .ic { width: 32px; height: 32px; color: var(--ok); }
.bv-opcion-texto { display: grid; gap: 2px; }

.pasos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.paso { display: grid; gap: 6px; color: var(--secundario); font-size: 1rem; font-weight: 700; }
.paso-barra { height: 6px; border-radius: 3px; background: var(--linea); }
.paso-hecho .paso-barra { background: var(--ok-viva); }
.paso[aria-current="step"] { color: var(--texto); }
.paso[aria-current="step"] .paso-barra { background: var(--huevo); }
.pasos-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.nl-contador { margin: 0; font-size: 1.25rem; }
.nl-cats { display: grid; gap: 10px; }
.nl-cat { display: grid; gap: 10px; min-width: 0; }

/* ---- Alertas e inventario (tarea 7) ---- */

/* ---- Planificar (tarea 9) ---- */
.plan-cab { display: flex; align-items: center; gap: 12px; }

.plan-item { position: relative; display: flex; align-items: flex-start; gap: 12px; min-height: 56px; padding: 12px 14px; border-radius: var(--r);
  background: var(--superficie); border: 2px solid var(--linea-fuerte); cursor: pointer; touch-action: manipulation; }

.plan-tag-clave, .plan-tag-alto, .plan-tag-medio, .plan-tag-estado-ahora { background: var(--superficie); border: 2px solid var(--ok-viva); padding: 0 9px; }

  background: color-mix(in srgb, var(--alerta-viva) 12%, var(--superficie)); color: var(--texto); border: 2px solid var(--alerta-viva); }

.plan-heroe { display: grid; gap: 6px; }

/* ---------- Pulido visual (Task 11) ---------- */
/* Presión táctil uniforme: escala suave + tinta (capa translúcida) en 120 ms; no cambia el layout. */
.btn, .contador-btn, .nav-item, .gen-opcion, .reg-opcion, .segmento-btn, .selector-btn, .lote-item, .reg-lote, .ini-enlace,
.plan-item, .plan-paso button, .dl-hechas summary, .plan-metodo summary {
  transition: transform var(--t-toque) var(--curva), background-color var(--t-toque) var(--curva), box-shadow var(--t-toque) var(--curva);
}
.btn:active, .contador-btn:active, .gen-opcion:active, .reg-opcion:active, .segmento-btn:active, .selector-btn:active, .lote-item:active, .reg-lote:active,
.plan-item:active, .plan-paso button:active {
  transform: scale(var(--presion)); background-color: var(--superficie-2);
}
.btn-primario:active, .contador-mas:active, .btn-peligro:active { background-color: var(--texto); }
.btn-peligro:active { background-color: var(--alerta); opacity: .9; }
.ini-enlace:active .tarjeta { transform: scale(var(--presion)); }
.ini-enlace .tarjeta { transition: transform var(--t-toque) var(--curva); }
.nav-item:active .nav-icono { transform: scale(var(--presion)); background-color: var(--superficie-2); }
.nav-registrar:active .nav-circulo { transform: scale(.92); }
.dl-hechas summary:active, .plan-metodo summary:active { background-color: var(--superficie-2); border-radius: var(--r-s); }

/* Jerarquía de elevación: 0 fondo, 1 filas, 2 tarjetas/ítems elegibles, 3 barra/toast, 4 hoja */

.lotes-cerrados .lote-item { box-shadow: none; }
.hoja { border-radius: var(--r-xl) var(--r-xl) 0 0; border-top: 2px solid var(--linea); }
.reg-pregunta, .dl-confirmar, .rep-aviso { }
/* Con franja visible ella ya reserva la zona segura superior: no se duplica. */
.franjas:has(.franja:not([hidden])) ~ .vista { padding-top: 0; }

/* ---------- Plan del ciclo (pestaña del detalle y hoja «Agregar labor») ---------- */
.dl-pestanas { flex-wrap: nowrap; }
.dl-pestanas .segmento-btn { flex: 1 1 0; min-width: 0; }
.segmento-btn[aria-selected="true"] { background: var(--primario); color: var(--sobre-primario); border-color: var(--primario); }
.dl-panel { display: grid; gap: var(--e4); min-width: 0; }
.pc-plan { display: grid; gap: var(--e4); min-width: 0; }
.pc-retiro { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); background: var(--t-coral); --secundario: var(--texto);
  border: 2px solid var(--alerta-viva); color: var(--texto); }
.pc-retiro > .ic { flex: none; width: 28px; height: 28px; color: var(--alerta); }
.pc-retiro div { display: grid; gap: 2px; min-width: 0; }
.pc-retiro p { margin: 0; overflow-wrap: anywhere; }
.pc-retiro p:last-child { color: var(--secundario); font-size: 1rem; }
.pc-solo-lectura { margin: 0; padding: 12px 14px; border-radius: var(--r); background: var(--superficie-2); font-weight: 700; }
.pc-seccion { display: grid; gap: 10px; min-width: 0; }
.pc-sec-titulo { margin: 4px 0 0; }
.pc-sec-atrasadas .pc-sec-titulo { color: var(--alerta); }
.pc-item { display: grid; gap: 10px; padding: 12px 12px 12px 14px; border-radius: var(--r); background: var(--superficie);
  border: 2px solid var(--linea); min-width: 0; }
.pc-item:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
.pc-atrasada { border-left: 6px solid var(--alerta-viva); }
.pc-hoy { border-left: 6px solid var(--precaucion-viva); }
.pc-hecha, .pc-omitida, .pc-quitada { background: var(--superficie-2); box-shadow: none; }
.pc-item-cab { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
.pc-item-cab .dl-fila-texto { flex: 1 1 auto; }
.pc-item-cab .chip { justify-self: start; margin-top: 4px; color: var(--texto); }
.pc-item-cab .chip-verde { color: var(--ok); }
.pc-item-cab .chip-ambar { color: var(--precaucion); }
.pc-item-cab .chip-rojo { color: var(--alerta); }
.pc-detalle { margin: 0; color: var(--secundario); font-size: 1rem; overflow-wrap: anywhere; }
.pc-quim { display: grid; gap: 6px; padding: 10px 12px; border-radius: var(--r-s); background: var(--huevo-suave); color: var(--texto); min-width: 0; }
.pc-quim p { margin: 0; overflow-wrap: anywhere; }
.pc-quim .plan-tag { background: var(--superficie); }
.pc-quim-retiro { font-weight: 700; }
.pc-quim-aviso, .pc-retiro-tarea { display: flex; gap: 8px; align-items: flex-start; font-size: 1rem; }
.pc-quim-aviso .ic, .pc-retiro-tarea .ic { flex: none; width: 22px; height: 22px; margin-top: 1px; }
.pc-retiro-tarea { margin: 0; font-weight: 700; color: var(--alerta); overflow-wrap: anywhere; }
.pc-hechas { margin: 0; padding-left: 20px; display: grid; gap: 2px; color: var(--secundario); font-size: 1rem; overflow-wrap: anywhere; }
.pc-acciones { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.pc-acciones-una { grid-template-columns: minmax(0, 1fr); }
.pc-acciones .btn, .pc-menu .btn { width: 100%; padding-inline: 12px; }
.pc-menu { display: grid; gap: 8px; padding-top: 2px; }
.pc-menu[hidden] { display: none; }
.pc-menu-btn[aria-expanded="true"] { border-color: var(--ok); background: var(--primario-suave); }
.pc-quitar { color: var(--alerta); border-color: var(--alerta); }
.pc-det { display: grid; gap: 10px; }

.pc-quitadas summary .num { margin-left: 8px; color: var(--secundario); font-weight: 700; }
.pc-hoja-tarea { margin: 0; overflow-wrap: anywhere; }
.pc-area { min-height: 112px; resize: vertical; }
.pc-hoja-pestanas { flex-wrap: nowrap; }
.pc-hoja-pestanas .segmento-btn { flex: 1 1 0; min-width: 0; }
.pc-panel { display: grid; gap: var(--e4); min-width: 0; }
.pc-panel[hidden] { display: none; }
.pc-cat-resultados { display: grid; gap: 10px; min-width: 0; }
.pc-cat { border-radius: var(--r); background: var(--superficie); border: 2px solid var(--linea-fuerte); min-width: 0; }

.pc-cat-item { display: grid; gap: 10px; padding: 12px 14px; border-radius: var(--r); background: var(--fondo); border: 2px solid var(--linea); min-width: 0; }

.pc-cat-item > .chip { justify-self: start; }

.pc-cat-texto b { overflow-wrap: anywhere; }
.pc-cat-dia { color: var(--secundario); font-size: 1rem; }

/* Plan del ciclo: aviso «revisa en la etiqueta» (ámbar) y días de retiro de la etiqueta en la hoja Hecho */
.pc-etiqueta { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); background: var(--t-durazno); --secundario: var(--texto);

<script>
/* =========================================================================
   APPOLLO · Modelo: fases, recomendaciones de manejo y proyección
   ========================================================================= */

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function interp(xs, ys, x) {
  const n = xs.length;
  if (x <= xs[0]) return ys[0];
  if (x >= xs[n - 1]) {
    const s = (ys[n - 1] - ys[n - 2]) / (xs[n - 1] - xs[n - 2]);
    return ys[n - 1] + s * (x - xs[n - 1]) * 0.85;
  }
  for (let i = 1; i < n; i++) {
    if (x <= xs[i]) {
      const t = (x - xs[i - 1]) / (xs[i] - xs[i - 1]);
      return ys[i - 1] + t * (ys[i] - ys[i - 1]);
    }
  }
  return ys[n - 1];
}

const modoDe = (g, obj) => g.tipo === 'postura' ? 'huevos' : g.tipo === 'carne' ? 'carne' : (obj || 'huevos');
const esBroiler = g => g.id === 'cobb500' || g.id === 'ross308';

/* ------------------------------ Curvas ------------------------------ */
function hdStd(p, w, shift = 0) {
  const L = 1 / (1 + Math.exp(-p.k * (w - (p.w50 + shift))));
  let v = p.pico * L;
  const pl = p.plat + shift;
  if (w > pl) v -= p.dec * (w - pl);
  return Math.max(0, v);
}
function ewStd(p, w, shift = 0) {
  const t = Math.max(0, w - (p.w50 + shift));
  return p.ewMax - (p.ewMax - p.ew0) * Math.exp(-p.ewc * t);
}
function consumoPostura(g, w) {
  const p = g.postura, f = g.cria.factor;
  if (w < 18) return CONSUMO_RECRIA[Math.min(17, Math.max(0, Math.floor(w)))] * f;
  const ini = 82 * f, finRampa = p.w50 + 4;
  if (w >= finRampa) return p.cons;
  return ini + (p.cons - ini) * (w - 18) / (finRampa - 18);
}
const pesoStd = (c, d) => interp(c.dias, c.peso, d);
const caStd = (c, d) => interp(c.dias, c.ca, d);
const consAcumStd = (c, d) => pesoStd(c, d) * caStd(c, d);
const consumoCarne = (c, d) => Math.max(5, consAcumStd(c, d + 1) - consAcumStd(c, d));

/* ------------------------------ Fases ------------------------------ */
function fase(g, modo, d) {
  const w = d / 7;
  if (modo === 'huevos') {
    const off = g.postura.w50 - 20.5;
    if (w < 6) return { id: 'cria', n: 'Cría', r: '0–6 semanas' };
    if (w < 12) return { id: 'crec', n: 'Crecimiento', r: '7–12 semanas' };
    if (w < 16 + off) return { id: 'des', n: 'Desarrollo', r: `13–${Math.round(16 + off)} semanas` };
    if (w < 18.5 + off) return { id: 'pre', n: 'Prepostura', r: 'hasta el 2 % de postura' };
    if (w < 45) return { id: 'p1', n: 'Postura fase 1', r: 'inicio al pico · hasta 45 sem' };
    if (w < 65) return { id: 'p2', n: 'Postura fase 2', r: '46–65 semanas' };
    return { id: 'p3', n: 'Postura fase 3', r: 'más de 65 semanas' };
  }
  if (esBroiler(g)) {
    if (d <= 10) return { id: 'pre', n: 'Preiniciación', r: '0–10 días' };
    if (d <= 22) return { id: 'ini', n: 'Inicial', r: '11–22 días' };
    if (d <= 35) return { id: 'eng', n: 'Engorde', r: '23–35 días' };
    return { id: 'fin', n: 'Finalización', r: '36 días a la venta' };
  }
  if (g.id === 'campero') {
    if (d <= 28) return { id: 'ini', n: 'Iniciación', r: '0–28 días' };
    if (d <= 56) return { id: 'crec', n: 'Crecimiento', r: '29–56 días' };
    return { id: 'fin', n: 'Acabado en semipastoreo', r: '57 días a la venta' };
  }
  if (d <= 42) return { id: 'ini', n: 'Cría', r: '0–6 semanas' };
  if (d <= 84) return { id: 'crec', n: 'Crecimiento', r: '7–12 semanas' };
  return { id: 'fin', n: 'Engorde y acabado', r: 'más de 12 semanas' };
}

/* --------------------------- Ambiente --------------------------- */
function tempRango(g, modo, d) {
  if (modo === 'carne') {
    const xs = [0, 3, 7, 14, 21, 28, 35, 42];
    if (d <= 42) return [Math.round(interp(xs, [32, 31, 29, 27, 24, 22, 20, 19], d)), Math.round(interp(xs, [33, 32, 30, 28, 26, 24, 22, 21], d))];
    return g.tipo === 'carne' && esBroiler(g) ? [18, 21] : [16, 24];
  }
  const xs = [0, 4, 7, 14, 21, 28, 35, 42];
  if (d <= 42) return [Math.round(interp(xs, [33, 31, 29, 27, 25, 23, 21, 19], d)), Math.round(interp(xs, [35, 32, 31, 29, 27, 25, 23, 21], d))];
  if (g.tipo === 'criolla' || g.tipo === 'doble') return [15, 26];
  return d < 126 ? [18, 22] : [18, 24];
}
function humedadRango(modo, d) {
  if (d <= 3) return [60, 70];
  if (d <= 14) return [55, 65];
  return modo === 'carne' ? [50, 65] : [45, 65];
}
function consumoDia(g, modo, d) {
  return modo === 'huevos' ? consumoPostura(g, d / 7) : consumoCarne(g.carne, d);
}
