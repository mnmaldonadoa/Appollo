  const t = _TAMANOS[tamano] ? tamano : 'media', px = _TAMANOS[t];
  const est = _estiloAve(sc, genetica);
  // Orden: fondo, objetos y al final las aves (así el ave queda sobre la balanza o el galpón).
  const objetos = sc.piezas.map(p => _pieza(p[0], p[1], p[2], p[3], p[4])).join('');
  const aves = (sc.grupo || (sc.ave ? [sc.ave] : [])).map(([x, y, s, pose]) => _ave(est, x, y, s, pose || 'adulta')).join('');

    + `<rect width="200" height="200" rx="40" style="fill:var(--il-fondo-${sc.fondo})"/>${objetos}${aves}</svg>`;

/* Mapeo de datos de la app a escenas. Devuelve siempre una clave de ESCENAS (con respaldo por contexto). */
const _MAPEO = {
  categoriaPlan: { alimento: 'man-alimento', ambiente: 'man-temperatura', seleccion: 'man-seleccion', limpieza: 'man-bioseguridad', agua: 'man-agua',

    san: 'man-bioseguridad', casero: 'san-remedio-casero', quim: 'san-quimico' },
  itemRecomendacion: { t_vent: 'man-ventilacion', t_luz: 'man-luz', a_fase: 'man-cambio-fase', s_desp: 'san-desparasitacion', s_peso: 'man-seleccion', s_bio: 'man-bioseguridad' },
  inventario: { alimento: 'man-alimento', vacuna: 'san-vacuna', medicamento: 'san-quimico', otro: 'man-registros' },
  bienvenida: { postura: 'gen-hyline-brown', carne: 'gen-ross308', ambas: 'gen-rhode-island' },
};
const _PREFIJO = { registro: 'reg-', alerta: 'al-', estado: 'est-', genetica: 'gen-' };
const _RESPALDO = { registro: 'man-registros', alerta: 'al-plan', estado: 'est-exito', genetica: 'gen-generica', categoriaPlan: 'man-registros',
  recomendacion: 'man-registros', itemRecomendacion: 'man-registros', inventario: 'man-registros', bienvenida: 'gen-generica' };

function ilustracionDe(contexto, id, respaldo) {
  const existe = k => typeof k === 'string' && Object.prototype.hasOwnProperty.call(ESCENAS, k);
  let k = null;
  if (_PREFIJO[contexto] && id !== undefined && id !== null) k = _PREFIJO[contexto] + id;
  else if (_MAPEO[contexto]) k = _MAPEO[contexto][id];
  if (existe(k)) return k;

/* Tarjeta para elegir una genética (Nuevo lote y Planificar): el ave a la izquierda, nombre, tipo y rasgo.
   `extra`: HTML ya armado que se agrega al final (p. ej. los datos del Planificador). */
function TarjetaGenetica({ g, elegida = false, accion, clase = '', extra = '' } = {}) {
  const k = ilustracionDe('genetica', g.id);

  <span class="gen-desc">${esc(g.rasgo)}${g.origen ? ' · ' + esc(g.origen) : ''}</span>${extra}</span></button>`;
}

/* true si el dato tiene una escena propia en el mapeo (no un respaldo). Sirve para poner la mini solo donde aporta. */
function tieneIlustracion(contexto, id) {
  return !!(_MAPEO[contexto] && Object.prototype.hasOwnProperty.call(_MAPEO[contexto], id));
}

<script>
/* Appollo · Gráfico de líneas en SVG: real (verde, continua) contra estándar (cielo, discontinua).
   Tolera series vacías, de un punto, con nulos o de distinto largo sin producir NaN.
   leyendaReal / leyendaEstandar (opcionales) cambian los textos de la leyenda. */

function Grafico({ serieReal, serieEstandar, etiquetas, leyendaReal, leyendaEstandar } = {}) {
  const W = 320, H = 150, PX = 10, PY = 14;
  const lista = s => (Array.isArray(s) ? s.map(v => (v === null || v === '' || v === undefined ? NaN : Number(v))) : []);
  const real = lista(serieReal), est = lista(serieEstandar);
  const ets = Array.isArray(etiquetas) ? etiquetas : [];
  const n = Math.max(real.length, est.length, ets.length);
  const vals = real.concat(est).filter(Number.isFinite);
  const f = v => (Math.round(v * 10) / 10).toString();

  let lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 1;
  if (hi - lo < 1e-9) { const d = Math.abs(hi) * 0.1 || 1; lo -= d; hi += d; }
  const m = (hi - lo) * 0.12; lo -= m; hi += m;
  const x = i => (n <= 1 ? W / 2 : PX + (i * (W - 2 * PX)) / (n - 1));
  const y = v => PY + ((hi - v) * (H - 2 * PY)) / (hi - lo);

  // Tramos continuos de puntos válidos; un punto aislado se dibuja como círculo.
  function trazar(serie, clase, extra) {
    let d = '', puntos = '', tramo = [];
    const cerrar = () => {
      if (tramo.length === 1) puntos += `<circle class="${clase}-punto" cx="${f(x(tramo[0]))}" cy="${f(y(serie[tramo[0]]))}" r="4"/>`;
      else if (tramo.length > 1) d += tramo.map((i, k) => (k ? 'L' : 'M') + f(x(i)) + ' ' + f(y(serie[i]))).join('');
      tramo = [];
    };
    serie.forEach((v, i) => (Number.isFinite(v) ? tramo.push(i) : cerrar()));
    cerrar();
    return (d ? `<path class="${clase}" d="${d}" fill="none"${extra}/>` : '') + puntos;
  }

  const rejilla = [0.25, 0.5, 0.75].map(t => `<line class="grafico-rejilla" x1="0" x2="${W}" y1="${f(PY + t * (H - 2 * PY))}" y2="${f(PY + t * (H - 2 * PY))}"/>`).join('');
  const base = `<line class="grafico-base" x1="0" x2="${W}" y1="${H - 1}" y2="${H - 1}"/>`;
  let ult = '';
  for (let i = real.length - 1; i >= 0; i--) if (Number.isFinite(real[i])) { ult = `<circle class="grafico-ultimo" cx="${f(x(i))}" cy="${f(y(real[i]))}" r="5.5"/>`; break; }

  const hayDatos = vals.length > 0;
  const svg = `<svg class="grafico-svg" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">${rejilla}${base}${hayDatos
    ? trazar(est, 'grafico-estandar', ' stroke-dasharray="7 6"') + trazar(real, 'grafico-real', ' pathLength="1"') + ult : ''}</svg>`;

  const primera = ets.length ? ets[0] : '', ultima = ets.length > 1 ? ets[ets.length - 1] : '';
  const ejes = hayDatos && (primera !== '' || ultima !== '')
    ? `<div class="grafico-ejes"><span>${esc(primera)}</span><span>${esc(ultima)}</span></div>` : '';
  const ultimoReal = real.filter(Number.isFinite).pop();
  const resumen = hayDatos
    ? `Gráfico de ${n} ${n === 1 ? 'punto' : 'puntos'}: real${ultimoReal !== undefined ? ' último ' + formatoNumero(ultimoReal) : ''} contra estándar`
    : 'Gráfico sin datos';
  return `<figure class="grafico${hayDatos ? '' : ' grafico-vacio'}" role="img" aria-label="${esc(resumen)}">
  ${svg}${hayDatos ? '' : `<p class="grafico-aviso">Aún no hay datos para graficar</p>`}
  ${ejes}
  <figcaption class="grafico-leyenda"><span class="ley ley-real">${esc(leyendaReal || 'Real')}</span><span class="ley ley-estandar">${esc(leyendaEstandar || 'Estándar')}</span></figcaption>
</figure>`;
}

<script>
/* Appollo · Animaciones pequeñas. Con prefers-reduced-motion todo ocurre al instante. */

function reducirMovimiento() {
  try { return typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch (e) { return false; }
}

/* Cuenta desde la cifra que muestra el elemento hasta `hasta`. Devuelve una promesa. */
function contar(el, hasta, ms) {
  const fin = Number(hasta);
  if (!el || !Number.isFinite(fin)) return Promise.resolve();
  const dec = Number.isInteger(fin) ? 0 : Math.min(2, (String(fin).split('.')[1] || '').length);
  const pinta = v => { el.textContent = formatoNumero(v, dec); };
  if (el._contar) cancelAnimationFrame(el._contar);
  const desde = Number(String(el.textContent || '').replace(/[^\d,-]/g, '').replace(',', '.')) || 0;
  if (reducirMovimiento() || desde === fin || typeof requestAnimationFrame !== 'function') { pinta(fin); return Promise.resolve(); }
  const dur = ms || 700;
  return new Promise(res => {
    let t0 = null;
    const paso = t => {
      if (t0 === null) t0 = t;
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      pinta(desde + (fin - desde) * e);
      if (p < 1) el._contar = requestAnimationFrame(paso);
      else { el._contar = 0; pinta(fin); res(); }
    };
    el._contar = requestAnimationFrame(paso);
  });
}

/* Dibuja una palomita verde dentro de `el` (círculo que aparece y trazo que se dibuja). */
function palomita(el) {
  if (!el) return Promise.resolve();
  el.innerHTML = '<svg class="palomita" viewBox="0 0 52 52" aria-hidden="true" focusable="false">' +
    '<circle class="palomita-circulo" cx="26" cy="26" r="23"/>' +
    '<path class="palomita-trazo" d="M15 27.5l7.2 7.2L37.5 19" pathLength="1"/></svg>';
  if (reducirMovimiento() || typeof Element.prototype.animate !== 'function') return Promise.resolve();
  const c = el.querySelector('.palomita-circulo'), p = el.querySelector('.palomita-trazo');
  const a1 = c.animate([{ transform: 'scale(.4)', opacity: 0 }, { transform: 'scale(1.08)', opacity: 1, offset: 0.7 }, { transform: 'scale(1)', opacity: 1 }],
    { duration: 320, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' });
  const a2 = p.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
    { duration: 300, delay: 180, easing: 'cubic-bezier(.6,0,.3,1)', fill: 'backwards' });
  return Promise.all([a1.finished, a2.finished]).then(() => {}, () => {});
}

/* Vibración corta si el teléfono la permite. */
function vibrar(ms) {
  try { if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') navigator.vibrate(ms || 30); }
  catch (e) { /* sin vibración */ }
}

<script>

(function () {

    m.classList.toggle('aj-ok', ok); m.classList.toggle('reg-error', !ok);
    m.textContent = ok ? 'Respaldo copiado. Pégalo en tus notas o envíatelo: sin esa copia, tus datos solo viven en este teléfono.'
      : 'No se pudo copiar solo. El texto quedó seleccionado: mantén pulsado y elige Copiar.';
    if (!ok) { try { ta.focus(); ta.select(); } catch (e) { /* sin foco */ } }
  };

  ACCIONES['aj-exportar'] = async () => {
    let json;
    try { json = await DB.exportar(); } catch (e) { msg('aj-respaldo-msg', 'No se pudo crear el respaldo.'); return; }
    if (esNativo()) { msg('aj-respaldo-msg', ''); hojaRespaldo(json); return; }
    try {
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = nombreArchivo(); a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      msg('aj-respaldo-msg', 'Respaldo descargado', true); // el clic ya se envió al navegador
      App.toast('Respaldo descargado');
    } catch (e) { msg('aj-respaldo-msg', 'No se pudo crear el respaldo.'); }
  };

  ACCIONES['aj-pegar'] = () => {
    msg('aj-respaldo-msg', '');
    App.abrirHoja({ titulo: 'Pegar respaldo', contenido: `<div class="aj-confirmar">
  <p>Pega aquí el texto del respaldo que copiaste antes.</p>
  <textarea class="reg-texto rep-texto aj-respaldo-texto" id="aj-pegado" spellcheck="false" aria-label="Texto del respaldo" aria-describedby="aj-pegado-msg"></textarea>
  <p id="aj-pegado-msg" class="reg-error" role="alert" hidden></p>
  <div class="reg-pregunta-botones">${Boton({ texto: 'Cancelar', variante: 'secundario', accion: 'aj-cancelar-importar' })}${Boton({ texto: 'Revisar', variante: 'primario', accion: 'aj-pegar-revisar' })}</div></div>` });
  };

  ACCIONES['aj-pegar-revisar'] = () => {
    const ta = document.getElementById('aj-pegado'), m = document.getElementById('aj-pegado-msg');
    const t = ta ? ta.value.trim() : '';
    if (!t) { if (m) { m.hidden = false; m.textContent = 'Pega primero el texto del respaldo.'; } if (ta) ta.focus(); return; }
    textoRespaldo = t;
    confirmarImportar();
  };

  ACCIONES['aj-compartir-respaldo'] = async () => {
    try {
      const archivo = new File([await DB.exportar()], nombreArchivo(), { type: 'application/json' });
      await navigator.share({ files: [archivo], title: 'Respaldo de Appollo' });
    } catch (e) { if (!e || e.name !== 'AbortError') msg('aj-respaldo-msg', 'No se pudo compartir. Usa "Exportar respaldo".'); }
  };

  ACCIONES['aj-importar'] = () => { const f = $v('#aj-archivo'); if (f) f.click(); };
  ACCIONES['aj-cancelar-importar'] = () => { textoRespaldo = null; App.cerrarHoja(); };

  ACCIONES['aj-reemplazar'] = async () => {
    const texto = textoRespaldo;
    textoRespaldo = null;
    App.cerrarHoja();
    const r = typeof texto === 'string' ? await DB.importar(texto) : { ok: false, error: 'No se pudo leer el archivo.' };
    if (!r.ok) { msg('aj-respaldo-msg', r.error || 'El archivo no es un respaldo válido.'); return; }
    try {
      App.estado.granja = (await DB.obtener('granja', 'granja')) ||
        await DB.guardar('granja', { id: 'granja', nombre: '', tipo: '', altitud: null, tema: 'auto', creado: new Date().toISOString() });
    } catch (e) { App.estado.granja = { id: 'granja', nombre: '', tipo: '', altitud: null, tema: 'auto' }; }
    App.fijarLote(null);
    App.toast('Respaldo importado');
    App.actualizarAlertas();
    App.ir('#/inicio');
  };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Vista "Alertas": lista por gravedad con acción grande; las vacunas se marcan hechas aquí.
   ========================================================================= */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

(function () {
  'use strict';
  const GRAV = {
    rojo: { chip: 'Urgente', clase: 'chip chip-rojo', ic: 'aviso' },
    ambar: { chip: 'Atención', clase: 'chip chip-ambar', ic: 'campana' },
    info: { chip: 'Aviso', clase: 'chip', ic: 'info' }
  };

  async function calcular() {
    const datos = {};
    for (const s of DB.STORES) datos[s] = await DB.listar(s);
    return generarAlertas(datos, new Date());
  }

  function tarjeta(a) {
    const g = GRAV[a.gravedad] || GRAV.info;
    const hecha = a.tipo === 'vacuna' && String(a.id).startsWith('vacuna-');
    const labor = a.tipo === 'plan' && a.tareaId; // la alerta agrupada de atrasadas no lleva Hecho
    return `<li class="al-card al-${esc(a.gravedad)}" data-alerta="${esc(a.id)}">
  <div class="al-cab"><span class="al-il">${Ilustracion(ilustracionDe('alerta', a.tipo), { tamano: 'mini' })}</span><span class="${g.clase}">${a.gravedad === 'info' ? '' : '<span class="chip-punto" aria-hidden="true"></span>'}${g.chip}</span></div>
  <p class="al-texto">${esc(a.texto)}</p>
  <div class="al-botones">
    ${Boton({ texto: a.accion && a.accion.etiqueta || 'Ver', variante: 'primario', accion: 'ir', datos: { ruta: a.accion && a.accion.ruta }, clase: 'btn-ancho' })}
    ${labor ? Boton({ texto: 'Hecho', icono: 'sig', variante: 'secundario', accion: 'al-plan-hecho', datos: { id: a.tareaId }, clase: 'btn-ancho' }) : ''}
    ${hecha ? Boton({ texto: 'Marcar hecha', icono: 'jeringa', variante: 'secundario', accion: 'al-hecha', datos: { id: String(a.id).slice('vacuna-'.length) }, clase: 'btn-ancho' }) : ''}
  </div>
</li>`;
  }

  VISTAS.alertas = async function () {
    const lista = await calcular();
    if (!lista.length) {
      return `<section class="pantalla pantalla-vacia"><div class="vacia-ilustracion" aria-hidden="true">${Ilustracion(ilustracionDe('estado', 'sin-alertas'), { tamano: 'grande' })}</div>
  <h1>Todo en orden</h1><p class="pantalla-texto">No hay nada pendiente. Tus aves y tu inventario van bien.</p></section>`;
    }
    return `<section class="pantalla"><h1>Alertas</h1>
  <p class="pantalla-texto">${formatoNumero(lista.length)} ${lista.length === 1 ? 'aviso' : 'avisos'}, primero lo más urgente.</p>
  <ul class="al-lista">${lista.map(tarjeta).join('')}</ul></section>`;
  };

  /* Foco: tras redibujar (Hecho, Deshacer) vuelve al mismo data-accion/data-id; si esa tarjeta ya no está, a la primera
     acción de la lista o al título; nunca a <body>. */
  let ultimo = null, restaurando = false;
  const cssq = x => (window.CSS && CSS.escape ? CSS.escape(x) : String(x).replace(/["\\]/g, '\\$&'));
  const anotar = e => {
    if (restaurando) return;
    const el = e.target && e.target.closest ? e.target.closest('#view [data-accion]') : null;
    if (el && el.closest('.al-card')) ultimo = { accion: el.dataset.accion || '', id: el.dataset.id || '', ruta: el.dataset.ruta || '' };
  };
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('focusin', anotar, true);
    document.addEventListener('click', anotar, true);
    window.addEventListener('hashchange', () => { ultimo = null; }); // otra pantalla: nada que restaurar
  }
  VISTAS.alertas.montar = raiz => {
    const a = document.activeElement;
    if (!ultimo || location.hash !== '#/alertas' || App.hojaAbierta() || (a && a !== document.body && document.contains(a))) return;
    const q = x => raiz.querySelector(x), cands = [];
    if (ultimo.id) cands.push(q(`[data-accion="${cssq(ultimo.accion)}"][data-id="${cssq(ultimo.id)}"]`));
    cands.push(q('.al-card .btn'), q('h1'));
    restaurando = true;
    try {
      for (const el of cands) {
        if (!el || el.disabled || !el.getClientRects().length) continue;
        if (el.tagName === 'H1') el.tabIndex = -1;
        try { el.focus({ preventScroll: true }); } catch (e) { continue; }
        if (document.activeElement === el) return;
      }
    } finally { restaurando = false; }
  };

  let ocupado = false; // una acción a la vez: un doble toque no duplica la labor hecha
  /* Hecho desde Alertas: una labor común se guarda con un toque (con Deshacer). Un químico NO: abre la hoja del plan
     para anotar el último día de tratamiento (desde ahí se cuenta el retiro), el producto y la etiqueta. */
  ACCIONES['al-plan-hecho'] = async el => {
    if (ocupado) return;
    ocupado = true; // antes de cualquier await: un doble toque no pasa dos veces
    let t = null;
    try { t = await DB.obtener('planTareas', el.dataset.id); } catch (e) { t = null; }
    if (t && t.quimico) { ocupado = false; return PlanCiclo.abrirHecho(t.id); }
    el.disabled = true;
    App.ocultarToast(); // el Deshacer anterior ya no vale
    let r;
    try { r = await Plan.marcarHecha(el.dataset.id); } catch (e) { r = { mensaje: 'No se pudo guardar. Intenta de nuevo.' }; }
    ocupado = false;
    if (r && r.mensaje) { el.disabled = false; App.toast(r.mensaje); return; }
    await App.refrescar();
    App.toast('Labor hecha', typeof r === 'function' ? { deshacer: r } : undefined);
  };

  ACCIONES['al-hecha'] = async el => {
    el.disabled = true;
    let deshacer = null;
    try {
      const v = await DB.obtener('vacunasPlan', el.dataset.id);
      if (!v || v.fechaAplicada) { App.refrescar(); return; }
      deshacer = await Vacunas.aplicar(v);
    } catch (e) { App.toast('No se pudo guardar. Intenta de nuevo.'); el.disabled = false; return; }
    await App.refrescar();
    App.toast('Vacuna aplicada', { deshacer });
  };
})();

</script>
<script>

  function paso2() {
    return `<p class="eyebrow">Paso 2 de 2</p>

  <p class="pantalla-texto">Así te mostramos primero las genéticas que te sirven. Puedes tener lotes de cualquier tipo.</p>
  <div class="reg-opciones" role="group" aria-label="Tipo de granja">${TIPOS.map(t =>

  }

  VISTAS.bienvenida = async function () {

      if (e.key === 'Enter' && e.target && e.target.id === 'bv-nombre') { e.preventDefault(); ACCIONES['bv-siguiente'](); }

  ACCIONES['bv-siguiente'] = () => {

<script>
/* =========================================================================
   APPOLLO · Detalle de lote: pestañas Resumen (gráfica real vs proyectado, historial con Borrar + Deshacer,
   calendario de vacunas con Marcar aplicada + Deshacer, Cerrar / Reabrir / Borrar lote) y Plan del ciclo (planCiclo.js).
   ========================================================================= */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

(function () {
  'use strict';
  const PAGINA = 30, limites = {};
  const fin = x => (Number.isFinite(x) ? x : null);
  const r1 = x => (x === null ? null : Math.round(x * 10) / 10);
  const masDias = (f, n) => { const d = fechaADate(f); d.setDate(d.getDate() + n); return hoyLocal(d); };
  const fechaTxt = f => (typeof f === 'string' && f.length >= 10 ? f.slice(8, 10) + '/' + f.slice(5, 7) + '/' + f.slice(0, 4) : '—');
  const n = x => (Number.isFinite(Number(x)) ? formatoNumero(Number(x)) : '—');
  const copia = o => JSON.parse(JSON.stringify(o));
  const TIPO = { mortalidad: ['Mortalidad', 'cruz'], alimento: ['Alimento', 'saco'], huevos: ['Huevos', 'huevo'],
    peso: ['Peso', 'balanza'], vacuna: ['Vacuna', 'jeringa'], sanidad: ['Sanidad', 'termo'], plan: ['Labor', 'hoja'] };

  function valorReg(r) {
    const d = r.datos || {};
    switch (r.tipo) {
      case 'mortalidad': return `${n(d.cantidad)} ${Number(d.cantidad) === 1 ? 'ave' : 'aves'}${d.causa ? ' · ' + d.causa : ''}`;
      case 'alimento': return `${n(d.kg)} kg`;
      case 'huevos': return `${n(d.cantidad)} huevos${Number(d.rotos) > 0 ? ' · ' + n(d.rotos) + ' rotos' : ''}`;
      case 'peso': return `${n(d.gramos)} g por ave`;
      case 'vacuna': return d.nombre || 'Vacuna';
      case 'plan': return d.titulo || 'Labor del plan';
      case 'sanidad': return [d.enfermedad, d.tratamiento].filter(Boolean).join(' · ') + (Number(d.retiroDias) > 0 ? ` · retiro ${n(d.retiroDias)} días` : '');
    }
    return '';
  }

  /* Real vs proyectado desde la llegada (máx. 60 días) hasta hoy o el cierre. */
  function grafica(l, regs, res, hasta, alt) {
    if (!res.ok) return Grafico({});
    const carne = modoDe(res.g) === 'carne', desde = [l.fechaLlegada, masDias(hasta, -59)].sort().pop(), dias = [];
    for (let f = desde; f <= hasta; f = masDias(f, 1)) dias.push(f);
    const real = [], est = [];
    for (const f of dias) {
      const e = estandarDia(l, f, alt, Math.max(0, avesVivas(l, regs, f)));
      if (carne) {
        const p = regs.filter(r => r.tipo === 'peso' && r.fecha === f).pop();
        real.push(p ? fin(Number(p.datos.gramos)) : null); est.push(r1(fin(e.pesoG)));
      } else { real.push(r1(fin(pctPostura(l, regs, f)))); est.push(r1(fin(e.hdPct))); }
    }
    return Grafico({ serieReal: real, serieEstandar: est, etiquetas: dias.map(f => f.slice(8, 10) + '/' + f.slice(5, 7)) });
  }

  function vacunaHtml(v, hoy, activo) {
    let chip = ['verde', 'Aplicada ' + fechaTxt(v.fechaAplicada)];
    if (!v.fechaAplicada) chip = v.fechaPrevista < hoy ? ['rojo', 'Vencida'] : v.fechaPrevista === hoy ? ['ambar', 'Hoy']
      : v.fechaPrevista === masDias(hoy, 1) ? ['ambar', 'Mañana'] : ['', 'Prevista'];
    return `<li class="dl-vac${v.fechaAplicada ? ' dl-vac-hecha' : ''}">
  <div class="dl-fila-texto"><b>${esc(v.nombre)}</b><span>${esc(fechaTxt(v.fechaPrevista))}${v.via ? ' · ' + esc(v.via) : ''}</span></div>
  <span class="chip${chip[0] ? ' chip-' + chip[0] : ''}">${chip[0] ? '<span class="chip-punto" aria-hidden="true"></span>' : ''}${esc(chip[1])}</span>
  ${!v.fechaAplicada && activo ? Boton({ texto: 'Marcar aplicada', icono: 'jeringa', variante: 'secundario', accion: 'dl-aplicar', datos: { id: v.id }, clase: 'btn-ancho' }) : ''}
</li>`;
  }

  VISTAS.detalleLote = async function (params) {
    const l = await DB.obtener('lotes', params.id);
    if (!l) {
      return `<section class="pantalla pantalla-vacia"><div class="vacia-ilustracion" aria-hidden="true">${Ilustracion(ilustracionDe('estado', 'sin-registros'), { tamano: 'grande' })}</div>
  <h1>Este lote no existe</h1><p class="pantalla-texto">Quizá fue borrado o el enlace está mal.</p>
  ${Boton({ texto: 'Ver mis lotes', icono: 'lotes', variante: 'primario', accion: 'ir', datos: { ruta: '#/lotes' }, clase: 'btn-ancho' })}</section>`;
    }
    const pestana = params.partes && params.partes[1] === 'plan' ? 'plan' : 'resumen';
    const [regs, vacs, tareas] = await Promise.all([DB.listar('registros', { loteId: l.id }), DB.listar('vacunasPlan', { loteId: l.id }), Plan.listar(l.id)]);
    const hoy = hoyLocal(), activo = l.estado === 'activo', hasta = activo ? hoy : (l.fechaCierre || hoy);
    const alt = App.estado.granja && App.estado.granja.altitud;
    const res = resumenLote(l, regs, vacs, hasta), mort = res.ok ? fin(mortalidadPct(l, regs, hasta)) : null;
    const carne = res.ok && modoDe(res.g) === 'carne';
    const orden = regs.slice().sort((a, b) => (b.fecha + (b.creado || '')).localeCompare(a.fecha + (a.creado || '')));
    const lim = limites[l.id] || PAGINA;
    const pend = vacs.filter(v => !v.fechaAplicada).sort((a, b) => String(a.fechaPrevista).localeCompare(String(b.fechaPrevista)));
    const hechas = vacs.filter(v => v.fechaAplicada).sort((a, b) => String(b.fechaAplicada).localeCompare(String(a.fechaAplicada)));
    const dato = (t, v) => `<div class="dl-dato"><span>${t}</span><b class="num">${v}</b></div>`;
    return `<section class="pantalla detalle-lote">
  ${Boton({ texto: 'Lotes', icono: 'atras', variante: 'secundario', accion: 'ir', datos: { ruta: '#/lotes' }, clase: 'dl-volver' })}
  <header class="dl-cab">
    <div class="dl-cab-il">${Ilustracion(ilustracionDe('genetica', l.genetica), { tamano: 'media' })}</div>
    <p class="eyebrow">${activo ? 'Lote activo' : 'Lote cerrado' + (l.fechaCierre ? ' el ' + esc(fechaTxt(l.fechaCierre)) : '')}</p>
    <h1>${esc(l.nombre || 'Lote')}</h1>
    <p class="pantalla-texto">${esc(res.g ? res.g.nombre : l.genetica || 'Genética desconocida')}${l.galpon ? ' · ' + esc(l.galpon) : ''} · llegó el ${esc(fechaTxt(l.fechaLlegada))}</p>
    ${activo ? chipEstado(res.estado) : ''}
  </header>
  <div class="segmento dl-pestanas" role="tablist" aria-label="Secciones del lote">${[['resumen', 'Resumen'], ['plan', 'Plan del ciclo']].map(([k, t]) =>
    `<button type="button" class="segmento-btn" role="tab" id="dl-tab-${k}" aria-controls="dl-panel" aria-selected="${pestana === k}" data-accion="dl-pestana" data-id="${k}" data-lote="${esc(l.id)}">${t}</button>`).join('')}</div>
  <div class="dl-panel" id="dl-panel" role="tabpanel" aria-labelledby="dl-tab-${pestana}">
  ${pestana === 'plan' ? PlanCiclo.html(l, tareas, vacs, hoy) : `
  <div class="dl-datos">
    ${dato('Aves vivas', res.vivas === null ? '—' : formatoNumero(res.vivas) + ' / ' + n(l.avesInicio))}
    ${dato('Edad', esc(textoEdad(res.edad)))}
    ${dato('Mortalidad', mort === null ? '—' : formatoNumero(r1(mort)) + ' %')}
    ${dato('Registros', formatoNumero(regs.length))}
  </div>
  ${l.resumen ? `<p class="pantalla-texto">${esc(l.resumen)}</p>` : ''}
  <article class="tarjeta" data-t="grafica"><header class="tarjeta-cab"><h2 class="tarjeta-titulo">${carne ? 'Peso (g)' : '% de postura'}: real vs proyectado</h2></header>${grafica(l, regs, res, hasta, alt)}</article>
  <h2 class="seccion-titulo">Historial</h2>
  ${orden.length ? `<ul class="dl-lista">${orden.slice(0, lim).map(r => {
    const t = TIPO[r.tipo] || [r.tipo, 'hoja'];
    return `<li class="dl-reg">${Ilustracion(ilustracionDe('registro', r.tipo), { tamano: 'mini' })}<div class="dl-fila-texto"><b>${r.tipo === 'plan' ? esc(t[0] + ': ' + valorReg(r)) : esc(t[0] + ' · ' + valorReg(r))}</b><span>${esc(fechaTxt(r.fecha))}</span></div>
  ${r.tipo === 'plan' && !activo ? '' : Boton({ texto: 'Borrar', variante: 'secundario', accion: 'dl-borrar', datos: { id: r.id }, clase: 'dl-borrar' })}</li>`;
  }).join('')}</ul>${orden.length > lim ? Boton({ texto: `Ver más (${formatoNumero(orden.length - lim)})`, variante: 'secundario', accion: 'dl-mas', datos: { id: l.id }, clase: 'btn-ancho' }) : ''}`
    : '<p class="pantalla-texto">Aún no hay registros. Usa ＋ Registrar en la barra de abajo.</p>'}
  <h2 class="seccion-titulo">Calendario de vacunas</h2>
  ${vacs.length ? `${pend.length ? `<ul class="dl-lista">${pend.slice(0, 3).map(v => vacunaHtml(v, hoy, activo)).join('')}</ul>` : '<p class="pantalla-texto">No quedan vacunas pendientes.</p>'}
  ${pend.length > 3 ? `<details class="dl-hechas"><summary>Siguientes vacunas (${formatoNumero(pend.length - 3)})</summary><ul class="dl-lista">${pend.slice(3).map(v => vacunaHtml(v, hoy, activo)).join('')}</ul></details>` : ''}
  ${hechas.length ? `<details class="dl-hechas"><summary>Aplicadas (${formatoNumero(hechas.length)})</summary><ul class="dl-lista">${hechas.map(v => vacunaHtml(v, hoy, activo)).join('')}</ul></details>` : ''}`
    : '<p class="pantalla-texto">Este lote no tiene vacunas previstas.</p>'}
  ${l.planV1 ? `<div class="dl-plan"><p class="pantalla-texto">Este lote viene de una proyección guardada en la versión 1 de Appollo.</p>
  ${Boton({ texto: 'Abrir en Planificador', icono: 'grafico', variante: 'secundario', accion: 'dl-abrir-plan', datos: { id: l.id }, clase: 'btn-ancho' })}</div>` : ''}
  <div class="dl-cierre">
  ${activo ? `${Boton({ texto: 'Cerrar lote', variante: 'secundario', accion: 'dl-cerrar', clase: 'btn-ancho dl-cerrar' })}
  <div class="dl-confirmar" hidden><p><b>¿Cerrar este lote?</b> Ya no aparecerá en Inicio ni en el registro rápido. Sus datos se conservan y puedes reabrirlo.</p>
    <div class="reg-pregunta-botones">${Boton({ texto: 'Cancelar', variante: 'secundario', accion: 'dl-cerrar-no' })}${Boton({ texto: 'Sí, cerrar lote', variante: 'peligro', accion: 'dl-cerrar-si', datos: { id: l.id } })}</div></div>`
    : Boton({ texto: 'Reabrir lote', variante: 'primario', accion: 'dl-reabrir', datos: { id: l.id }, clase: 'btn-ancho' })}
  </div>
  <div class="dl-borrar-lote">
  ${Boton({ texto: 'Borrar lote', icono: 'cruz', variante: 'secundario', accion: 'dl-borrar-lote', clase: 'btn-ancho dl-borrar-lote-btn' })}
  <div class="dl-confirmar-borrar" hidden><p><b>¿Borrar este lote?</b> Se borran también sus ${formatoNumero(regs.length)} registros, ${formatoNumero(vacs.length)} vacunas y ${formatoNumero(tareas.length)} ${tareas.length === 1 ? 'labor' : 'labores'} del plan del ciclo. No se puede deshacer.</p>
    <div class="reg-pregunta-botones">${Boton({ texto: 'Cancelar', variante: 'secundario', accion: 'dl-borrar-lote-no' })}${Boton({ texto: 'Sí, borrar lote', variante: 'peligro', accion: 'dl-borrar-lote-si', datos: { id: l.id } })}</div></div>
  </div>`}
  </div>
</section>`;
  };
  /* Tras cada dibujo: el foco vuelve al control que se tocó (ver PlanCiclo.montar). */
  VISTAS.detalleLote.montar = raiz => PlanCiclo.montar(raiz);

  /* Pestañas Resumen | Plan del ciclo: la elegida vive en la ruta (#/lote/id o #/lote/id/plan) sin sumar historial. */
  ACCIONES['dl-pestana'] = el => {
    const ruta = '#/lote/' + encodeURIComponent(el.dataset.lote) + (el.dataset.id === 'plan' ? '/plan' : '');
    if (location.hash === ruta) return;
    history.replaceState(null, '', ruta);
    App.refrescar();
  };

  /* ------------------------------ Acciones ------------------------------ */
  /* Aplica kg al inventario vinculado; devuelve los kg realmente aplicados (0 si no hay ítem o falla). */
  async function inventario(kg) {
    if (!(Number.isFinite(kg) && kg !== 0) || typeof Inventario === 'undefined' || !Inventario || typeof Inventario.descontarAlimento !== 'function') return 0;
    try { const r = await Inventario.descontarAlimento(kg); return Number(r && r.aplicadoKg) || 0; } catch (e) { return 0; }
  }
  async function hacer(fn, msg, deshacer) {
    try { await fn(); } catch (e) { App.toast('No se pudo guardar. Intenta de nuevo.'); return; }
    await App.refrescar();
    App.toast(msg, deshacer ? { deshacer } : undefined);
  }

  /* Marca una vacuna del plan como aplicada hoy y crea su registro. Devuelve la función que lo revierte.
     Compartida con la vista de Alertas (Vacunas.aplicar). */
  window.Vacunas = {
    async aplicar(v) {
      const previo = copia(v), hoy = hoyLocal();
      const nuevo = await DB.guardar('registros', { loteId: v.loteId, fecha: hoy, tipo: 'vacuna',
        datos: { nombre: v.nombre, via: v.via || '', planId: v.id }, creado: new Date().toISOString() });
      await DB.guardar('vacunasPlan', Object.assign({}, v, { fechaAplicada: hoy }));
      return async () => { await DB.borrar('registros', nuevo.id); await DB.guardar('vacunasPlan', previo); };
    }
  };

  ACCIONES['dl-borrar'] = async el => {
    el.disabled = true;
    const r = await DB.obtener('registros', el.dataset.id);
    if (!r) { App.refrescar(); return; }
    if (r.tipo === 'plan') { // el plan de un lote cerrado es de solo lectura: su labor hecha no se borra
      const lr = await DB.obtener('lotes', r.loteId);
      if (!lr || lr.estado !== 'activo') { App.toast('El lote está cerrado'); App.refrescar(); return; }
    }
    const previo = copia(r), kg = r.tipo === 'alimento' ? Number(r.datos && r.datos.descontadoKg) || 0 : 0;
    const plan = r.tipo === 'vacuna' && r.datos && r.datos.planId ? await DB.obtener('vacunasPlan', r.datos.planId) : null;
    const planPrevio = plan ? copia(plan) : null;
    const tarea = r.tipo === 'plan' && r.datos && r.datos.tareaId ? await DB.obtener('planTareas', r.datos.tareaId) : null;
    const tareaPrevia = tarea ? copia(tarea) : null;
    await hacer(async () => {
      await DB.borrar('registros', r.id);
      if (tarea) { // la labor ya no consta como hecha
        const t = copia(tarea), i = (t.hechas || []).findIndex(h => h.fecha === r.fecha);
        if (i >= 0) t.hechas.splice(i, 1);
        await DB.guardar('planTareas', t);
      }
      if (plan) { const p = copia(plan); delete p.fechaAplicada; await DB.guardar('vacunasPlan', p); }
      await inventario(-kg);
    }, 'Registro borrado', async () => {
      await DB.guardar('registros', previo);
      if (planPrevio) await DB.guardar('vacunasPlan', planPrevio);
      if (tareaPrevia) await DB.guardar('planTareas', tareaPrevia);
      const ap = await inventario(kg);
      if (kg && ap !== kg) await DB.guardar('registros', Object.assign({}, previo, { datos: Object.assign({}, previo.datos, { descontadoKg: ap }) }));
    });
  };

  ACCIONES['dl-aplicar'] = async el => {
    el.disabled = true;
    const v = await DB.obtener('vacunasPlan', el.dataset.id);
    if (!v || v.fechaAplicada) { App.refrescar(); return; }
    let deshacer = null;
    await hacer(async () => { deshacer = await Vacunas.aplicar(v); }, 'Vacuna aplicada', () => deshacer());
  };

  ACCIONES['dl-mas'] = el => { limites[el.dataset.id] = (limites[el.dataset.id] || PAGINA) + PAGINA; App.refrescar(); };
  const confirmar = ver => {
    const c = document.querySelector('#view .dl-confirmar'), b = document.querySelector('#view .dl-cerrar');
    if (!c || !b) return;
    c.hidden = !ver; b.hidden = ver;
    const foco = ver ? c.querySelector('[data-accion=dl-cerrar-no]') : b;
    try { foco.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
    if (ver) c.scrollIntoView({ block: 'nearest' });
  };
  ACCIONES['dl-cerrar'] = () => confirmar(true);
  ACCIONES['dl-cerrar-no'] = () => confirmar(false);

  async function cambiarEstado(id, cerrar) {
    const l = await DB.obtener('lotes', id);
    if (!l) return;
    const previo = copia(l), nuevo = copia(l);
    if (cerrar) { nuevo.estado = 'cerrado'; nuevo.fechaCierre = hoyLocal(); } else { nuevo.estado = 'activo'; delete nuevo.fechaCierre; }
    const lsPrevio = App.estado.loteActivoId;
    await hacer(async () => {
      await DB.guardar('lotes', nuevo);
      if (cerrar && App.estado.loteActivoId === id) App.fijarLote(null);
    }, cerrar ? 'Lote cerrado' : 'Lote reabierto', async () => {
      await DB.guardar('lotes', previo);
      if (cerrar && lsPrevio === id) App.fijarLote(id);
    });
  }
  /* Borrar lote (con confirmación): también sirve para los lotes migrados de la v1. */
  const confirmarBorrar = ver => {
    const c = document.querySelector('#view .dl-confirmar-borrar'), b = document.querySelector('#view .dl-borrar-lote-btn');
    if (!c || !b) return;
    c.hidden = !ver; b.hidden = ver;
    const foco = ver ? c.querySelector('[data-accion=dl-borrar-lote-no]') : b;
    try { foco.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
    if (ver) c.scrollIntoView({ block: 'nearest' });
  };
  ACCIONES['dl-borrar-lote'] = () => confirmarBorrar(true);
  ACCIONES['dl-borrar-lote-no'] = () => confirmarBorrar(false);
  ACCIONES['dl-borrar-lote-si'] = async el => {
    el.disabled = true;
    const id = el.dataset.id;
    try {
      const [regs, vacs] = await Promise.all([DB.listar('registros', { loteId: id }), DB.listar('vacunasPlan', { loteId: id })]);
      for (const r of regs) await DB.borrar('registros', r.id);
      for (const v of vacs) await DB.borrar('vacunasPlan', v.id);
      await Plan.borrarDeLote(id);
      await DB.borrar('lotes', id);
      if (App.estado.loteActivoId === id) App.fijarLote(null);
    } catch (e) { el.disabled = false; App.toast('No se pudo borrar. Intenta de nuevo.'); return; }
    App.toast('Lote borrado');
    App.actualizarAlertas();
    App.ir('#/lotes');
  };

  /* Restaura en el Planificador la proyección que el lote guardó en la v1 (mismo estado que usa el Planificador). */
  ACCIONES['dl-abrir-plan'] = async el => {
    const l = await DB.obtener('lotes', el.dataset.id);
    if (!l || !l.planV1 || typeof PlanEstado === 'undefined') return;
    const P = PlanEstado;
    Object.assign(P.S, P.BASE, { filtro: P.S.filtro }, copia(l.planV1));
    if (!Array.isArray(P.S.sel)) P.S.sel = [];
    P.guardar();
    App.ir(P.loteValido() ? '#/plan/proyeccion' : '#/plan/genetica');
  };

  ACCIONES['dl-cerrar-si'] = el => { el.disabled = true; return cambiarEstado(el.dataset.id, true); };
  ACCIONES['dl-reabrir'] = el => { el.disabled = true; return cambiarEstado(el.dataset.id, false); };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Inicio: selector Todos / lote y tarjetas del día (aves, mortalidad, alimento,
   producción, estado sanitario, alertas, rendimiento) con minigráfica de 14 días.
   "Todos" suma los lotes activos. Lo que no se puede calcular se muestra "—", nunca NaN.
   ========================================================================= */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

(function () {
  'use strict';
  let verTodos = false, ultimo = '', previo = {};
  /* Aviso único «Elegir tareas del ciclo»: la marca vive en localStorage (puede fallar: sin ella, el aviso sigue sin romper nada). */
  const kAviso = id => 'appollo.v2.planAvisado:' + id;
  const avisado = id => { try { return localStorage.getItem(kAviso(id)) === '1'; } catch (e) { return false; } };
  const marcarAvisado = id => { try { localStorage.setItem(kAviso(id), '1'); } catch (e) { /* sin almacenamiento */ } };
  /* Primer lote activo sin filas de plan y sin avisar (los cerrados nunca entran: `lotes` ya viene filtrado). */
  const loteSinPlan = (lotes, filas) => lotes.find(l => !filas.some(f => f.loteId === l.id) && !avisado(l.id)) || null;
  const fin = x => (Number.isFinite(x) ? x : null);
  const r1 = x => (x === null ? null : Math.round(x * 10) / 10);
  const suma = xs => xs.reduce((s, x) => s + x, 0);
  const sumaDatos = (rs, campo) => suma(rs.map(r => Number(r.datos && r.datos[campo]) || 0));
  const masDias = (f, n) => { const d = fechaADate(f); d.setDate(d.getDate() + n); return hoyLocal(d); };
  const ddmm = f => f.slice(8, 10) + '/' + f.slice(5, 7);
  const ESTADO = { verde: 'Verde', ambar: 'Amarillo', rojo: 'Rojo' }, PEOR = ['verde', 'ambar', 'rojo'];

  /* Cifras de un lote para el día `hoy`. */
  function metricas(l, regs, vacs, hoy, alt) {
    const propios = regs.filter(r => r.loteId === l.id), del = t => propios.filter(r => r.tipo === t && r.fecha === hoy);
    const res = resumenLote(l, propios, vacs, hoy), carne = !!res.g && modoDe(res.g) === 'carne';
    let std = null;
    if (res.ok) { try { std = estandarDia(l, hoy, alt, res.vivas); } catch (e) { std = null; } }
    const ps = propios.filter(r => r.tipo === 'peso' && r.fecha <= hoy && Number(r.datos && r.datos.gramos) > 0).sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
    const alim = del('alimento'), hue = del('huevos');
    return { l, res, carne, std, propios,
      inicio: Number(l.avesInicio) || 0, muertesTot: mortalidadTotal(l, propios, hoy), muertesHoy: sumaDatos(del('mortalidad'), 'cantidad'),
      kg: alim.length ? sumaDatos(alim, 'kg') : null, huevos: hue.length ? sumaDatos(hue, 'cantidad') : null,
      peso: ps.length ? Number(ps[ps.length - 1].datos.gramos) : null,
      rend: res.ok ? fin(rendimiento(l, propios, hoy)) : null };
  }

  /* Suma de varios lotes (o de uno solo). */
  function agregado(ms) {
    const vivas = suma(ms.map(m => m.res.vivas || 0)), inicio = suma(ms.map(m => m.inicio));
    const post = ms.filter(m => !m.carne && m.res.ok), conH = post.filter(m => m.huevos !== null && m.res.vivas > 0);
    const vivH = suma(conH.map(m => m.res.vivas)), stdH = suma(conH.map(m => (m.std && m.std.huevos) || 0));
    const conR = ms.filter(m => m.rend !== null && m.res.vivas > 0), vivR = suma(conR.map(m => m.res.vivas));
    const conKg = ms.filter(m => m.kg !== null), stds = ms.filter(m => m.std && m.std.alimentoKg > 0);
    const estados = ms.map(m => m.res.estado).filter(Boolean);
    return {
      vivas, inicio, mortPct: inicio > 0 ? fin(100 * suma(ms.map(m => m.muertesTot)) / inicio) : null, muertesHoy: suma(ms.map(m => m.muertesHoy)),
      kg: conKg.length ? suma(conKg.map(m => m.kg)) : null, kgStd: stds.length ? suma(stds.map(m => m.std.alimentoKg)) : null,
      postura: post.length > 0 || !ms.some(m => m.carne),
      huevos: conH.length ? suma(conH.map(m => m.huevos)) : null,
      pct: vivH > 0 ? fin(100 * suma(conH.map(m => m.huevos)) / vivH) : null, pctStd: vivH > 0 ? fin(100 * stdH / vivH) : null,
      carneUnico: ms.filter(m => m.carne).length === 1 ? ms.find(m => m.carne) : null,
      rend: vivR > 0 ? fin(suma(conR.map(m => m.rend * m.res.vivas)) / vivR) : null,
      estado: estados.length ? estados.reduce((a, b) => (PEOR.indexOf(b) > PEOR.indexOf(a) ? b : a)) : null
    };
  }

  /* 14 días: % postura real vs estándar (postura) o peso real vs estándar (un lote de carne). */
  function serie14(ms, a, hoy, alt) {
    const dias = []; for (let i = 13; i >= 0; i--) dias.push(masDias(hoy, -i));
    const real = [], est = [];
    for (const f of dias) {
      if (a.postura) {
        let h = 0, vh = 0, sh = 0, vs = 0;
        for (const m of ms.filter(x => !x.carne && x.res.ok && f >= x.l.fechaLlegada)) {
          const v = Math.max(0, avesVivas(m.l, m.propios, f)), hs = m.propios.filter(r => r.tipo === 'huevos' && r.fecha === f);
          if (hs.length && v > 0) { h += sumaDatos(hs, 'cantidad'); vh += v; }
          const e = fin(estandarDia(m.l, f, alt, v).hdPct);
          if (e !== null && v > 0) { sh += e * v; vs += v; }
        }
        real.push(vh > 0 ? r1(100 * h / vh) : null); est.push(vs > 0 ? r1(sh / vs) : null);
      } else if (a.carneUnico && a.carneUnico.res.ok && f >= a.carneUnico.l.fechaLlegada) {
        const m = a.carneUnico, p = m.propios.filter(r => r.tipo === 'peso' && r.fecha === f).pop();
        real.push(p ? fin(Number(p.datos.gramos)) : null); est.push(r1(fin(estandarDia(m.l, f, alt).pesoG)));
      } else { real.push(null); est.push(null); }
    }
    return { serieReal: real, serieEstandar: est, etiquetas: dias.map(ddmm) };
  }

  const celda = (t, html, ancho) => `<div class="ini-celda${ancho ? ' ini-ancha' : ''}" data-t="${t}">${html}</div>`;
  const kg = x => (x === null ? '—' : formatoNumero(r1(x)) + ' kg');

  function construir(d) {
    const { activos, sel, ms, a, alertas, hoy, alt, sinPlan } = d;
    const g = App.estado.granja || {};
    const uno = sel !== 'todos' ? ms[0] : null;
    const selector = activos.length > 1 ? `<div class="ini-selector" role="group" aria-label="Ver lote">${[{ id: 'todos', nombre: 'Todos' }].concat(activos).map(l =>
      `<button type="button" class="selector-btn" data-accion="ini-lote" data-id="${esc(l.id)}" aria-pressed="${sel === l.id}">${esc(l.nombre || 'Lote')}</button>`).join('')}</div>` : '';
    const sub = uno ? `${esc(uno.l.nombre || 'Lote')} · ${esc(textoEdad(uno.res.edad))}` : `${activos.length} lotes activos`;
    const rojas = alertas.filter(x => x.gravedad === 'rojo').length;
    let prod;
    if (a.postura) prod = Tarjeta({ titulo: 'Huevos de hoy', ilustracion: 'reg-huevos', cifra: a.huevos, unidad: a.huevos === null ? '' : 'huevos',
      pie: `Postura ${a.pct === null ? '—' : formatoNumero(r1(a.pct)) + ' %'} · estándar ${a.pctStd === null ? '—' : formatoNumero(r1(a.pctStd)) + ' %'}` });
    else {
      const m = a.carneUnico;
      prod = Tarjeta({ titulo: 'Peso promedio', ilustracion: 'reg-peso', cifra: m ? m.peso : null, unidad: m && m.peso !== null ? 'g' : '',
        pie: m ? `Estándar ${m.std && fin(m.std.pesoG) !== null ? formatoNumero(Math.round(m.std.pesoG)) + ' g' : '—'}` : 'Elige un lote para ver su peso' });
    }
    const motivo = alertas.find(x => x.gravedad !== 'info');
    const s14 = a.postura || a.carneUnico ? serie14(ms, a, hoy, alt) : null;
    const graf = Grafico(s14 && s14.serieReal.some(v => v !== null) ? s14 : {});
    return `<section class="pantalla inicio">
  <header class="ini-cab cab-il">${Ilustracion(ilustracionDe('genetica', uno ? uno.l.genetica : null), { tamano: 'media' })}<div class="cab-il-texto"><h1>${esc(g.nombre || 'Inicio')}</h1><p class="pantalla-texto">${sub}</p></div></header>
  ${selector}
  <div class="ini-rejilla">
  ${sinPlan ? `<div class="ini-celda ini-ancha" data-t="plan-aviso"><article class="tarjeta ini-aviso-plan">

  ${celda('aves', Tarjeta({ titulo: 'Aves vivas', ilustracion: ilustracionDe('genetica', uno ? uno.l.genetica : null), cifra: a.vivas, pie: `de ${formatoNumero(a.inicio)} al llegar` }))}

</section>`;

  VISTAS.inicio = async function () {

    const activos = lotes.filter(l => l.estado === 'activo').sort((x, y) => String(x.fechaLlegada || '').localeCompare(String(y.fechaLlegada || '')));

  ACCIONES['ini-lote'] = el => {
    const id = el.dataset.id;
    verTodos = id === 'todos';

<script>
/* =========================================================================
   APPOLLO · Inventario: ítems por categoría, entradas de stock, alta/edición/borrado con Deshacer.
   Inventario.descontarAlimento(kg) lo llaman Registrar y Detalle del lote (kg negativo = devolver).
   ========================================================================= */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

var Inventario = {
  /* Aplica `kg` de alimento (negativo = devolver) al ítem vinculado. Devuelve {aplicadoKg}: los kg que de verdad
     salieron (o volvieron) del stock, para poder deshacer exactamente aunque el stock se haya recortado a 0. */
  async descontarAlimento(kg) {
    if (typeof kg !== 'number' || !Number.isFinite(kg)) return { aplicadoKg: 0 };
    const item = (await DB.listar('inventario')).filter(i => i.vinculoAlimento === true)
      .sort((a, b) => String(a.id).localeCompare(String(b.id)))[0];
    if (!item) return { aplicadoKg: 0 };
    const nueva = calcularDescuento(item, kg), aplicadoKg = kgDescontados(item, kg);
    if (nueva === item.cantidad || !Number.isFinite(Number(nueva))) return { aplicadoKg: 0 };
    await DB.guardar('inventario', Object.assign({}, item, { cantidad: nueva }));
    return { aplicadoKg };
  }
};

(function () {
  'use strict';
  const CATS = [['alimento', 'Alimento', 'saco'], ['vacuna', 'Vacunas', 'jeringa'], ['medicamento', 'Medicamentos', 'capsula'], ['otro', 'Otros', 'hoja']];
  const UNIDADES = ['kg', 'sacos', 'dosis', 'frascos', 'unidades', 'litros'];
  const copia = o => JSON.parse(JSON.stringify(o));
  const num = x => formatoNumero(Number(x));
  const bajo = i => Number(i.cantidad) < Number(i.minimo);
  const $c = s => document.querySelector('#capas ' + s);

  function fila(i) {
    const b = bajo(i);
    return `<li class="inv-fila${b ? ' inv-bajo' : ''}" data-item="${esc(i.id)}">
  <div class="inv-info"><b class="inv-nombre">${esc(i.nombre)}</b>
    <span class="inv-cant num">${num(i.cantidad)} ${esc(i.unidad)}</span>
    <span class="inv-min">Mínimo: ${num(i.minimo)} ${esc(i.unidad)}</span></div>
  ${b ? '<span class="chip chip-ambar"><span class="chip-punto" aria-hidden="true"></span>Bajo</span>' : ''}
  <div class="inv-botones">${Boton({ texto: 'Entrada', icono: 'mas', variante: 'primario', accion: 'inv-entrada', datos: { id: i.id } })}
    ${Boton({ texto: 'Editar', variante: 'secundario', accion: 'inv-editar', datos: { id: i.id } })}</div>
</li>`;
  }

  VISTAS.inventario = async function () {
    const items = (await DB.listar('inventario')).sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es'));
    const grupos = CATS.map(([id, tit, ic]) => {
      const l = items.filter(i => (CATS.some(c => c[0] === i.categoria) ? i.categoria : 'otro') === id);
      return l.length ? `<section class="inv-grupo"><h2 class="seccion-titulo">${Ilustracion(ilustracionDe('inventario', id), { tamano: 'mini' })} ${tit} <span class="num">${formatoNumero(l.length)}</span></h2>
  <ul class="dl-lista">${l.map(fila).join('')}</ul></section>` : '';
    }).join('');
    return `<section class="pantalla"><h1>Inventario</h1>
  ${Boton({ texto: 'Nuevo ítem', icono: 'mas', variante: 'primario', accion: 'inv-nuevo', clase: 'btn-ancho' })}
  ${grupos || `<div class="vacia-ilustracion" aria-hidden="true">${Ilustracion(ilustracionDe('estado', 'sin-inventario'), { tamano: 'grande' })}</div>
  <p class="pantalla-texto">Aún no tienes nada guardado. Agrega tu alimento, vacunas y medicinas para que Appollo te avise cuando se acaben.</p>`}</section>`;
  };

  /* ------------------------------ Entrada de stock ------------------------------ */
  ACCIONES['inv-entrada'] = async el => {
    const i = await DB.obtener('inventario', el.dataset.id);
    if (!i) return;
    App.abrirHoja({ titulo: 'Entrada: ' + i.nombre, contenido: `<div class="inv-form" data-id="${esc(i.id)}">
  <div class="reg-campo"><label class="reg-etiqueta" for="inv-suma">¿Cuánto entró? (${esc(i.unidad)})</label>
  ${Contador({ id: 'inv-suma', valor: 1, min: 0, paso: i.unidad === 'kg' ? 10 : 1, etiqueta: 'Cantidad que entró' })}</div>
  <p class="reg-error" role="alert" hidden></p>
  ${Boton({ texto: 'Guardar entrada', icono: 'saco', variante: 'primario', accion: 'inv-entrada-ok', clase: 'btn-ancho' })}</div>` });
  };
  ACCIONES['inv-entrada-ok'] = async el => {
    const f = el.closest('.inv-form'), suma = Number(f.querySelector('#inv-suma').value), err = f.querySelector('.reg-error');
    if (!Number.isFinite(suma) || suma <= 0) { err.textContent = 'Escribe una cantidad mayor que 0'; err.hidden = false; return; }
    el.disabled = true;
    try {
      const i = await DB.obtener('inventario', f.dataset.id);
      if (!i) { App.cerrarHoja(); return; }
      const previo = copia(i);
      await DB.guardar('inventario', Object.assign({}, i, { cantidad: Math.round((Number(i.cantidad) + suma) * 1e6) / 1e6 }));
      App.cerrarHoja(); await App.refrescar();
      App.toast('Entrada guardada', { deshacer: () => DB.guardar('inventario', previo) });
    } catch (e) { el.disabled = false; App.toast('No se pudo guardar. Intenta de nuevo.'); }
  };

  /* ------------------------------ Formulario ------------------------------ */
  const sel = (id, opts, val) => `<select class="reg-select" id="${id}">${opts.map(([v, t]) => `<option value="${v}"${v === val ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  const campo = (id, et, html, cl) => `<div class="reg-campo${cl ? ' ' + cl : ''}"><label class="reg-etiqueta" for="${id}">${et}</label>${html}</div>`;

  function formulario(i) {
    const n = i || { categoria: 'alimento', unidad: 'kg', cantidad: 0, minimo: 0 };
    return `<div class="inv-form" data-id="${esc(n.id || '')}">
  ${campo('inv-nombre', 'Nombre', `<input class="reg-texto" id="inv-nombre" type="text" maxlength="60" autocomplete="off" value="${esc(n.nombre || '')}" placeholder="Ej.: Balanceado postura">`)}
  ${campo('inv-cat', 'Categoría', sel('inv-cat', CATS.map(c => [c[0], c[1]]), n.categoria))}
  ${campo('inv-unidad', 'Unidad', sel('inv-unidad', UNIDADES.map(u => [u, u]), n.unidad))}
  ${campo('inv-kgpu', 'Kilos por saco o unidad', Contador({ id: 'inv-kgpu', valor: n.kgPorUnidad || 40, min: 0, paso: 1, etiqueta: 'Kilos por unidad' }), 'inv-kgpu-c')}
  ${campo('inv-cant', 'Cantidad que tienes', Contador({ id: 'inv-cant', valor: n.cantidad, min: 0, paso: 1, etiqueta: 'Cantidad' }))}
  ${campo('inv-min', 'Avisarme cuando queden menos de', Contador({ id: 'inv-min', valor: n.minimo, min: 0, paso: 1, etiqueta: 'Mínimo' }))}
  ${campo('inv-costo', 'Costo por unidad en dólares (opcional)', `<input class="reg-texto" id="inv-costo" type="text" inputmode="decimal" autocomplete="off" value="${n.costo === undefined || n.costo === null ? '' : esc(String(n.costo).replace('.', ','))}" placeholder="Ej.: 22,50">`)}
  <div class="reg-campo inv-vinculo-c"><button type="button" class="segmento-btn" id="inv-vinculo" data-accion="inv-vinculo" aria-pressed="${n.vinculoAlimento ? 'true' : 'false'}">Descontar al registrar consumo</button></div>
  <p class="reg-error" role="alert" hidden></p>
  ${Boton({ texto: 'Guardar', variante: 'primario', accion: 'inv-guardar', clase: 'btn-ancho' })}
  ${n.id ? `${Boton({ texto: 'Eliminar ítem', variante: 'secundario', accion: 'inv-borrar', clase: 'btn-ancho inv-borrar' })}
  <div class="dl-confirmar inv-confirmar" hidden><p><b>¿Eliminar "${esc(n.nombre)}"?</b> Podrás deshacerlo unos segundos.</p>
    <div class="reg-pregunta-botones">${Boton({ texto: 'Cancelar', variante: 'secundario', accion: 'inv-borrar-no' })}${Boton({ texto: 'Sí, eliminar', variante: 'peligro', accion: 'inv-borrar-si' })}</div></div>` : ''}</div>`;
  }

  function sincronizar() {
    const cat = $c('#inv-cat'), un = $c('#inv-unidad');
    if (!cat || !un) return;
    const ali = cat.value === 'alimento';
    $c('.inv-vinculo-c').hidden = !ali;
    $c('.inv-kgpu-c').hidden = !(ali && un.value !== 'kg');
  }
  function abrirForm(i) {
    const capa = App.abrirHoja({ titulo: i ? 'Editar ítem' : 'Nuevo ítem', contenido: formulario(i) });
    capa.addEventListener('change', sincronizar);
    sincronizar();
  }
  ACCIONES['inv-nuevo'] = () => abrirForm(null);
  ACCIONES['inv-editar'] = async el => { const i = await DB.obtener('inventario', el.dataset.id); if (i) abrirForm(i); };
  ACCIONES['inv-vinculo'] = el => el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');

  function leer(f) {
    const v = id => f.querySelector('#' + id).value, cat = v('inv-cat'), unidad = v('inv-unidad');
    const nombre = v('inv-nombre').trim(), cant = v('inv-cant').trim(), min = v('inv-min').trim(), costoT = v('inv-costo').trim().replace(',', '.');
    if (!nombre) return { error: 'Escribe el nombre del ítem' };
    if (cant === '' || !Number.isFinite(Number(cant))) return { error: 'Escribe la cantidad que tienes' };
    if (Number(cant) < 0) return { error: 'La cantidad no puede ser menor que 0' };
    if (min === '' || !Number.isFinite(Number(min))) return { error: 'Escribe el mínimo (puede ser 0)' };
    if (Number(min) < 0) return { error: 'El mínimo no puede ser menor que 0' };
    if (costoT !== '' && !(Number.isFinite(Number(costoT)) && Number(costoT) >= 0)) return { error: 'El costo debe ser 0 o más (o déjalo vacío)' };
    const o = { nombre, categoria: cat, unidad, cantidad: Number(cant), minimo: Number(min) };
    if (costoT !== '') o.costo = Number(costoT);
    if (cat === 'alimento') {
      if (unidad !== 'kg') {
        const k = Number(v('inv-kgpu'));
        if (!(Number.isFinite(k) && k > 0)) return { error: 'Escribe cuántos kilos trae cada ' + unidad.replace(/s$/, '') };
        o.kgPorUnidad = k;
      }
      if (f.querySelector('#inv-vinculo').getAttribute('aria-pressed') === 'true') o.vinculoAlimento = true;
    }
    return { datos: o };
  }

  ACCIONES['inv-guardar'] = async el => {
    const f = el.closest('.inv-form'), err = f.querySelector('.reg-error'), r = leer(f);
    if (r.error) { err.textContent = r.error; err.hidden = false; err.scrollIntoView({ block: 'nearest' }); return; }
    el.disabled = true;
    try {
      const todos = await DB.listar('inventario'), id = f.dataset.id;
      const previos = todos.map(copia);
      const actual = id ? todos.find(i => i.id === id) : null;
      const nuevo = Object.assign({}, actual ? { id: actual.id } : {}, r.datos);
      const guardado = await DB.guardar('inventario', nuevo);
      if (r.datos.vinculoAlimento) {
        for (const o of todos) if (o.id !== id && o.vinculoAlimento) { const c = copia(o); delete c.vinculoAlimento; await DB.guardar('inventario', c); }
      }
      App.cerrarHoja(); await App.refrescar();
      App.toast(id ? 'Cambios guardados' : 'Ítem guardado', { deshacer: async () => {
        if (!id) await DB.borrar('inventario', guardado.id);
        for (const p of previos) await DB.guardar('inventario', p);
      } });
    } catch (e) { el.disabled = false; err.textContent = 'No se pudo guardar. Intenta de nuevo.'; err.hidden = false; }
  };

  const confirmar = ver => {
    const c = $c('.inv-confirmar'), b = $c('.inv-borrar');
    if (!c || !b) return;
    c.hidden = !ver; b.hidden = ver;
    if (ver) c.scrollIntoView({ block: 'nearest' });
  };
  ACCIONES['inv-borrar'] = () => confirmar(true);
  ACCIONES['inv-borrar-no'] = () => confirmar(false);
  ACCIONES['inv-borrar-si'] = async el => {
    el.disabled = true;
    try {
      const id = el.closest('.inv-form').dataset.id, previo = await DB.obtener('inventario', id);
      if (!previo) { App.cerrarHoja(); App.refrescar(); return; }
      await DB.borrar('inventario', id);
      App.cerrarHoja(); await App.refrescar();
      App.toast('Ítem eliminado', { deshacer: () => DB.guardar('inventario', previo) });
    } catch (e) { el.disabled = false; App.toast('No se pudo eliminar. Intenta de nuevo.'); }
  };
})();

<script>
/* Appollo · Vista "Lotes": activos y cerrados como tarjetas tocables → #/lote/:id. */
var VISTAS = window.VISTAS || (window.VISTAS = {});

/* Resumen compartido por Lotes, Inicio y Detalle. Nunca devuelve NaN: lo que no se puede calcular es null. */
function resumenLote(l, registros, vacunas, fecha) {
  const g = typeof GENETICAS !== 'undefined' ? GENETICAS.find(x => x.id === l.genetica) : null;
  const ok = g && typeof l.fechaLlegada === 'string' && fechaValida(l.fechaLlegada) && Number.isFinite(Number(l.edadLlegadaDias));
  const fin = fecha || hoyLocal();
  const edad = ok ? edadDias(l, fin) : null;
  const vivas = Number.isFinite(Number(l.avesInicio)) ? Math.max(0, avesVivas(l, registros, fin)) : null;
  return { g, ok, edad, vivas, estado: ok ? estadoSanitario(l, registros, vacunas, fin) : null };
}
const textoEdad = d => (d === null || d === undefined ? 'Edad —' : `${formatoNumero(d)}\u00a0${d === 1 ? 'día' : 'días'} · ${formatoNumero(Math.floor(d / 7))}\u00a0sem`);
const chipEstado = e => (e ? `<span class="chip chip-${e}"><span class="chip-punto" aria-hidden="true"></span>${{ verde: 'Bien', ambar: 'Revisar', rojo: 'Atención' }[e]}</span>` : '');

VISTAS.lotes = async function () {
  const [lotes, registros, vacunas] = await Promise.all(['lotes', 'registros', 'vacunasPlan'].map(s => DB.listar(s)));
  const hoy = hoyLocal();
  const tarjeta = l => {
    const r = resumenLote(l, registros, vacunas, l.estado === 'activo' ? hoy : (l.fechaCierre || hoy));
    return `<button type="button" class="lote-item lote-item-il" data-accion="ir" data-ruta="#/lote/${esc(encodeURIComponent(l.id))}">
  ${Ilustracion(ilustracionDe('genetica', l.genetica), { tamano: 'mini' })}<span class="lote-item-texto"><span class="lote-cab"><b class="lote-nombre">${esc(l.nombre || 'Lote')}</b>${chipEstado(l.estado === 'activo' ? r.estado : null)}</span>
  <span class="lote-gen">${esc(r.g ? r.g.nombre : l.genetica || 'Genética desconocida')}</span>
  <span class="lote-datos"><span><b class="num">${r.vivas === null ? '—' : formatoNumero(r.vivas)}</b> aves vivas</span><span>${textoEdad(r.edad)}</span></span></span>
</button>`;
  };
  const orden = (a, b) => String(b.fechaLlegada || '').localeCompare(String(a.fechaLlegada || ''));
  const activos = lotes.filter(l => l.estado === 'activo').sort(orden), cerrados = lotes.filter(l => l.estado !== 'activo').sort(orden);
  const nuevo = Boton({ texto: 'Nuevo lote', icono: 'mas', variante: 'primario', accion: 'nuevo-lote', clase: 'btn-ancho btn-grande' });
  if (!lotes.length) {
    return `<section class="pantalla pantalla-vacia"><div class="vacia-ilustracion" aria-hidden="true">${Ilustracion(ilustracionDe('estado', 'sin-lotes'), { tamano: 'grande' })}</div>
  <h1>Lotes</h1><p class="pantalla-texto">Aún no tienes lotes. Un lote es un grupo de aves que llegó junto.</p>${nuevo}</section>`;
  }
  return `<section class="pantalla">
  <h1>Lotes</h1>
  ${nuevo}
  <h2 class="seccion-titulo">Activos <span class="num">(${activos.length})</span></h2>
  <div class="lotes-lista lotes-activos">${activos.length ? activos.map(tarjeta).join('') : '<p class="pantalla-texto">No hay lotes activos.</p>'}</div>
  ${cerrados.length ? `<h2 class="seccion-titulo">Cerrados <span class="num">(${cerrados.length})</span></h2>
  <div class="lotes-lista lotes-cerrados">${cerrados.map(tarjeta).join('')}</div>` : ''}
</section>`;
};

</script>
<script>
/* Appollo · Vista "Más": acceso a Inventario, Reportes, Planificar y Ajustes. */
var VISTAS = window.VISTAS || (window.VISTAS = {});
VISTAS.mas = async function () {
  const destinos = [
    ['Inventario', 'saco', '#/inventario'],
    ['Reportes', 'grafico', '#/reportes'],
    ['Planificar', 'huevo', '#/plan/genetica'],
    ['Ajustes', 'ajustes', '#/ajustes'],
  ];
  return `<section class="pantalla"><h1>Más</h1>
  <div class="mas-lista">${destinos.map(([t, i, r]) =>
    Boton({ texto: t, icono: i, variante: 'secundario', accion: 'ir', datos: { ruta: r }, clase: 'btn-ancho btn-lista' })).join('')}</div>
</section>`;
};

</script>
<script>
/* =========================================================================
   APPOLLO · Nuevo lote (4 pasos: genética → aves y edad → tareas del ciclo → altitud y galpón).
   NuevoLote.crear({genetica, avesInicio, fechaLlegada|edadDias, edadLlegadaDias?, altitud, galpon, nombre?, plan?: string[]})
   -> Promise<Lote>; rechaza con un Error de mensaje en español y sin guardar nada.
   Escribe también el vacunasPlan del lote desde vacunasPara(g, modo) y, si llega `plan` (ids del catálogo), las tareas del ciclo con Plan.crearInicial.
   ========================================================================= */
var VISTAS = window.VISTAS || (window.VISTAS = {});
var ACCIONES = window.ACCIONES || (window.ACCIONES = {});

const NuevoLote = (function () {
  'use strict';
  const K_ALT = 'appollo.v2.altitud', REPITE_CADA = 63, MAX_AVES = 1000000;
  const ALTITUDES = [[0, 'Costa'], [500, 'Amazonía'], [1500, 'Valle'], [2800, 'Sierra'], [3500, 'Páramo']];
  const ORDEN = { postura: ['postura', 'doble', 'criolla', 'carne'], carne: ['carne', 'doble', 'criolla', 'postura'] };
  const genDe = id => GENETICAS.find(g => g.id === id);
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } };

  /* --------------------------- Reglas (sin DOM) --------------------------- */
  const maxDias = g => (modoDe(g) === 'huevos' ? 693 : g.carne.rango[1] - 1);
  const masDias = (f, n) => { const d = fechaADate(f); d.setDate(d.getDate() + n); return hoyLocal(d); };
  const corta = g => g.nombre.split(' ').slice(0, 2).join(' ');
  const numero = x => (typeof x === 'number' ? x : typeof x === 'string' && x.trim() !== '' ? Number(x) : NaN);
  const semanas = d => formatoNumero(Math.floor(d / 7)) + ' sem';

  /* Fechas del plan: cada vacuna a su día de vida; las ya pasadas al llegar se omiten. */
  function planVacunas(g, lote) {
    const max = maxDias(g), out = [];
    for (const v of vacunasPara(g, modoDe(g))) {
      const dias = [v.d];
      if (v.repite) for (let d = v.d + REPITE_CADA; d <= max; d += REPITE_CADA) dias.push(d);
      for (const d of dias) {
        if (d < lote.edadLlegadaDias) continue;
        out.push({ loteId: lote.id, vacunaId: v.id, nombre: v.n, via: v.via, fechaPrevista: masDias(lote.fechaLlegada, d - lote.edadLlegadaDias) });
      }
    }
    return out.sort((a, b) => (a.fechaPrevista < b.fechaPrevista ? -1 : 1));
  }

  /* Tareas del catálogo que se muestran: las de la genética y el modo que aún no pasaron por edad (hastaDia >= edad).
     Sin edad válida (null) se muestran todas. */
  const noSirve = (t, g) => bloqueadaEnModo(t, modoDe(g));
  /* `edadLlegada` (por defecto = edad): edad con que llegaron; las tareas únicas de días anteriores no se muestran
     (ver sugeribleAlLlegar en catalogo.js). */
  function tareasVisibles(g, edad, edadLlegada) {
    const e = edadLlegada === undefined ? edad : edadLlegada;
    return tareasDelCatalogo(g, modoDe(g)).filter(t => (edad === null || edad === undefined || t.hastaDia === undefined || t.hastaDia === null || t.hastaDia >= edad)
      && (e === null || e === undefined || sugeribleAlLlegar(t, e)));
  }
  /* Ids marcados por defecto: todas las visibles menos las que no se usan en postura de huevo. */
  const planSugerido = (g, edad, edadLlegada) => tareasVisibles(g, edad, edadLlegada).filter(t => !noSirve(t, g)).map(t => t.id);

  /* -> {mensaje} si algo no vale, o {lote} listo para guardar (sin id). */
  function validar(o) {
    const no = mensaje => ({ mensaje }), hoy = hoyLocal();
    const g = o && genDe(o.genetica);
    if (!g) return no('Elige la genética de tus aves');
    const aves = numero(o.avesInicio);
    if (!Number.isInteger(aves) || aves < 1) return no('La cantidad de aves debe ser un número entero de 1 o más');
    if (aves > MAX_AVES) return no('La cantidad de aves no puede pasar de 1.000.000');
    let fecha = hoy, llegada;
    const edadOk = (x, que) => {
      const n = numero(x);
      if (!Number.isFinite(n)) return { m: 'Escribe ' + que + ' de las aves con números' };
      if (n < 0) return { m: 'La edad no puede ser negativa' };
      if (!Number.isInteger(n)) return { m: 'La edad debe ser un número entero de días' };
      return { n };
    };
    if (o.fechaLlegada !== undefined && o.fechaLlegada !== null && o.fechaLlegada !== '') {
      if (!fechaValida(o.fechaLlegada)) return no('La fecha de llegada no es válida');
      if (o.fechaLlegada > hoy) return no('La fecha de llegada no puede ser futura');
      fecha = o.fechaLlegada;
      const e = o.edadLlegadaDias === undefined || o.edadLlegadaDias === null || o.edadLlegadaDias === '' ? { n: 0 } : edadOk(o.edadLlegadaDias, 'la edad al llegar');
      if (e.m) return no(e.m);
      llegada = e.n;
    } else {
      const e = edadOk(o.edadDias, 'la edad');
      if (e.m) return no(e.m);
      llegada = e.n;
    }
    const lote = { genetica: g.id, avesInicio: aves, fechaLlegada: fecha, edadLlegadaDias: llegada, estado: 'activo' };
    const actual = edadDias(lote, hoy), max = maxDias(g);
    if (actual > max) return no(`La edad (${formatoNumero(actual)} días, ${semanas(actual)}) supera el máximo para ${g.nombre}: ${formatoNumero(max)} días (${semanas(max)})`);
    let alt = null;
    if (o.altitud !== undefined && o.altitud !== null && o.altitud !== '') {
      alt = numero(o.altitud);
      if (!Number.isFinite(alt) || alt < 0 || alt > 6000) return no('La altitud debe estar entre 0 y 6000 m');
    }
    const galpon = String(o.galpon || '').trim().slice(0, 40);
    const nombre = String(o.nombre || '').trim().slice(0, 60) || `${corta(g)} · ${galpon || 'Lote'}`;
    return { lote: Object.assign(lote, { nombre, galpon, altitud: alt, creado: new Date().toISOString() }) };
  }

  async function crear(o) {
    const v = validar(o);
    if (v.mensaje) throw new Error(v.mensaje);
    const g = genDe(v.lote.genetica), hechos = [];
    let lote;
    try {
      lote = await DB.guardar('lotes', v.lote);
      for (const p of planVacunas(g, lote)) hechos.push((await DB.guardar('vacunasPlan', p)).id);
      if (Array.isArray(o.plan) && o.plan.length) {
        const r = await Plan.crearInicial(lote, g, modoDe(g), o.plan);
        if (!Array.isArray(r)) throw new Error('plan');
      }
    } catch (e) {
      for (const id of hechos) { try { await DB.borrar('vacunasPlan', id); } catch (x) { /* sigue */ } }
      if (lote) { try { await Plan.borrarDeLote(lote.id); } catch (x) { /* sigue */ } }
      if (lote) { try { await DB.borrar('lotes', lote.id); } catch (x) { /* sigue */ } }
      throw new Error('No se pudo guardar el lote. Intenta de nuevo.');
    }
    if (lote.altitud !== null) {
      lsSet(K_ALT, String(lote.altitud));
      try { // se lee de la base: App.estado puede estar desactualizado
        const gr = (await DB.obtener('granja', 'granja')) || App.estado.granja || { id: 'granja' };
        App.estado.granja = gr.altitud === lote.altitud ? gr : await DB.guardar('granja', Object.assign({}, gr, { altitud: lote.altitud }));
      } catch (e) { /* no crítico */ }
    }
    return lote;
  }

  /* ------------------------------ Pantalla ------------------------------ */
  const altGuardada = () => {
    const ls = numero(lsGet(K_ALT)), gr = App.estado.granja && App.estado.granja.altitud;
    return Number.isFinite(ls) ? ls : Number.isFinite(gr) ? gr : '';
  };
  const nuevo = () => ({ paso: 1, gid: null, aves: 100, modo: 'edad', edad: 1, unidad: 'dias', fecha: hoyLocal(), edadLlegada: 0, altitud: altGuardada(), galpon: '', nombre: '', plan: new Set(), planClave: null, abiertas: new Set(['alimento']) });
  let st = null;
  const $v = s => document.querySelector('#view ' + s);
  const val = id => { const el = $v('#' + id); return el ? el.value : undefined; };

  function presets(g) {
    const d = x => [x, 'dias', x === 1 ? '1 día' : x + ' días'], s = x => [x, 'semanas', x + ' sem'];
    if (modoDe(g) === 'huevos') return [d(1), s(4), s(10), s(17), s(25), s(40), s(60)];
    return (esBroiler(g) ? [1, 7, 14, 21, 28, 35] : g.id === 'campero' ? [1, 14, 28, 42, 56] : [1, 28, 56, 84]).map(d);
  }

  function leer() {
    if (!st) return;
    const v = { aves: val('nl-aves'), edad: val('nl-edad'), fecha: val('nl-fecha'), edadLlegada: val('nl-edad-llegada'),
      altitud: val('nl-altitud'), galpon: val('nl-galpon'), nombre: val('nl-nombre') };
    Object.keys(v).forEach(k => { if (v[k] !== undefined) st[k] = v[k]; });
  }
  const datos = () => {
    const o = { genetica: st.gid, avesInicio: st.aves, altitud: st.altitud, galpon: st.galpon, nombre: st.nombre, plan: Array.from(st.plan) };
    if (st.modo === 'fecha') { o.fechaLlegada = st.fecha || ' '; o.edadLlegadaDias = st.edadLlegada; }
    else { const n = numero(st.edad); o.edadDias = st.unidad === 'semanas' && Number.isFinite(n) ? Math.round(n * 7) : st.edad; }
    return o;
  };
  const seg = (accion, clave, ops) => `<div class="segmento" role="group">${ops.map(([v, t]) =>
    `<button type="button" class="segmento-btn" data-accion="${accion}" data-${clave}="${v}" aria-pressed="${st[clave] === v || String(st[clave]) === String(v)}">${t}</button>`).join('')}</div>`;
  const campo = (id, etiqueta, html, ayuda) => `<div class="reg-campo"><label class="reg-etiqueta" for="${id}">${etiqueta}</label>${html}${ayuda ? `<p class="reg-ayuda">${ayuda}</p>` : ''}</div>`;
  const texto = (id, valor, extra) => `<input class="reg-texto" id="${id}" value="${esc(valor)}" ${extra}>`;

  function paso1() {
    const t = (App.estado.granja && App.estado.granja.tipo) || '', orden = ORDEN[t] || ORDEN.postura;
    const lista = GENETICAS.slice().sort((a, b) => orden.indexOf(a.tipo) - orden.indexOf(b.tipo));
    return `<h1>¿Qué aves llegan?</h1>
  <div class="gen-lista">${lista.map(g => TarjetaGenetica({ g, elegida: st.gid === g.id, accion: 'nl-genetica' })).join('')}</div>
  ${Boton({ texto: 'Cancelar', variante: 'secundario', accion: 'ir', datos: { ruta: '#/lotes' }, clase: 'btn-ancho' })}`;
  }

  function paso2() {
    const g = genDe(st.gid), max = maxDias(g);
    const edad = st.modo === 'edad'
      ? campo('nl-edad', 'Edad de las aves hoy', Contador({ id: 'nl-edad', valor: st.edad, min: 0, paso: 1, etiqueta: 'Edad' }) +
        seg('nl-unidad', 'unidad', [['dias', 'Días'], ['semanas', 'Semanas']]) +
        `<div class="nl-presets">${presets(g).map(([n, u, t]) => `<button type="button" class="segmento-btn" data-accion="nl-preset" data-valor="${n}" data-unidad="${u}">${t}</button>`).join('')}</div>`,
        `Máximo para ${esc(g.nombre)}: ${formatoNumero(max)} días (${semanas(max)})`)
      : campo('nl-fecha', 'Fecha de llegada', texto('nl-fecha', st.fecha, `type="date" max="${hoyLocal()}"`)) +
        campo('nl-edad-llegada', 'Edad al llegar (días)', Contador({ id: 'nl-edad-llegada', valor: st.edadLlegada, min: 0, paso: 1, etiqueta: 'Edad al llegar en días' }), 'Pon 0 o 1 si llegaron pollitos recién nacidos');
    return `<div class="cab-il">${Ilustracion('man-densidad', { tamano: 'mini' })}<h1>${esc(g.nombre)}</h1></div>
  ${campo('nl-aves', '¿Cuántas aves llegaron?', Contador({ id: 'nl-aves', valor: st.aves, min: 1, paso: 10, etiqueta: 'Cantidad de aves' }))}
  <div class="reg-campo"><p class="reg-etiqueta">¿Qué sabes de su edad?</p>${seg('nl-modo', 'modo', [['edad', 'Su edad hoy'], ['fecha', 'Fecha de llegada']])}</div>
  ${edad}
  <p class="reg-error nl-error" role="alert" hidden></p>
  <div class="reg-acciones">${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'nl-atras' })}${Boton({ texto: 'Siguiente', icono: 'sig', variante: 'primario', accion: 'nl-siguiente' })}</div>`;
  }

  /* Edad actual de las aves según el paso 2 (null si no vale). */
  const edadActual = () => { const v = validar(Object.assign(datos(), { altitud: null })); return v.lote ? edadDias(v.lote, hoyLocal()) : null; };
  const edadLlegada = () => { const v = validar(Object.assign(datos(), { altitud: null })); return v.lote ? Number(v.lote.edadLlegadaDias) || 0 : null; };
  /* La selección se reinicia solo si cambia lo que se sugiere (genética o edad actual). */
  function prepararPlan() {
    const g = genDe(st.gid), edad = edadActual(), llegada = edadLlegada(), clave = st.gid + '|' + edad + '|' + llegada;
    if (st.planClave !== clave) { st.planClave = clave; st.plan = new Set(planSugerido(g, edad, llegada)); st.abiertas = new Set(['alimento']); }
  }
  function tareaHTML(t, g) {
    const bloq = noSirve(t, g), marcada = !bloq && st.plan.has(t.id), q = t.quimico;
    const retiro = x => (x === null || x === undefined ? 'ver etiqueta' : x + ' d');
    const tag = x => `<span class="plan-tag">${esc(x)}</span>`;
    const quim = q ? `<span class="plan-tags">${tag(q.tipo)}${tag(q.ingredienteActivo)}${tag('Retiro huevo: ' + retiro(q.retiroHuevoDias) + ' · carne: ' + retiro(q.retiroCarneDias))}</span>
        <span class="plan-item-d">${esc(CATALOGO_AVISO_QUIMICO)}</span>` : '';
    const nota = bloq ? `<span class="plan-item-d"><b>${esc(motivoBloqueo(t))}</b></span>` : '';
    return `<label class="plan-item nl-tarea${q ? ' nl-tarea-quimica' : ''}${bloq ? ' plan-item-bloqueado' : ''}"><input type="checkbox" data-accion="nl-plan-tarea" data-id="${esc(t.id)}" ${marcada ? 'checked' : ''} ${bloq ? 'disabled' : ''}>
      <span class="plan-caja" aria-hidden="true"></span>
      <span class="plan-item-texto"><span class="plan-item-t">${esc(t.titulo)}</span><span class="plan-item-d nl-detalle">${esc(t.detalle)}</span>${quim}${nota}</span></label>`;
  }
  function paso3() {
    prepararPlan();
    const g = genDe(st.gid), todas = tareasVisibles(g, edadActual(), edadLlegada());
    const elegidas = todas.filter(t => st.plan.has(t.id) && !noSirve(t, g)).length;
    const cats = CATEGORIAS_PLAN.map(c => {
      const ts = todas.filter(t => t.categoria === c.id);
      if (!ts.length) return '';
      const k = ts.filter(t => st.plan.has(t.id) && !noSirve(t, g)).length, abierta = st.abiertas.has(c.id);
      return `<section class="nl-cat" data-cat="${esc(c.id)}">
    <button type="button" class="nl-cat-cab" data-accion="nl-plan-abrir" data-id="${esc(c.id)}" aria-expanded="${abierta}"><span class="nl-cat-nombre">${Ilustracion(ilustracionDe('categoriaPlan', c.id), { tamano: 'mini' })}<b>${esc(c.nombre)}</b></span><span class="nl-cat-cuenta">${k}/${ts.length}</span></button>
    ${abierta ? `<div class="nl-cat-cuerpo"><div class="nl-cat-botones">${Boton({ texto: 'Todo', variante: 'secundario', accion: 'nl-plan-todo', datos: { id: c.id } })}${Boton({ texto: 'Ninguno', variante: 'secundario', accion: 'nl-plan-ninguno', datos: { id: c.id } })}</div>
      <div class="plan-items">${ts.map(t => tareaHTML(t, g)).join('')}</div></div>` : ''}</section>`;
    }).join('');
    return `<h1>¿Qué vas a hacer en este ciclo?</h1>
  <p class="nl-contador" role="status" aria-live="polite"><b>${elegidas}</b> ${elegidas === 1 ? 'tarea elegida' : 'tareas elegidas'}</p>
  <p class="reg-ayuda">Puedes cambiar esto después en el plan del lote.</p>
  <div class="nl-cats">${cats}</div>
  <div class="reg-acciones">${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'nl-atras' })}${Boton({ texto: 'Continuar', icono: 'sig', variante: 'primario', accion: 'nl-plan-siguiente' })}</div>`;
  }

  function paso4() {
    const g = genDe(st.gid), v = validar(datos()), def = v.lote ? `${corta(g)} · ${String(st.galpon || '').trim() || 'Lote'}` : '';
    return `<div class="cab-il">${Ilustracion('man-temperatura', { tamano: 'mini' })}<h1>¿Dónde están?</h1></div>
  <div class="reg-campo"><label class="reg-etiqueta" for="nl-altitud">Altitud de la granja (metros)</label>
    <div class="nl-alturas">${ALTITUDES.map(([m, t]) => `<button type="button" class="segmento-btn nl-altura" data-accion="nl-altitud" data-valor="${m}" aria-pressed="${String(st.altitud) === String(m)}"><b>${formatoNumero(m)} m</b><span>${t}</span></button>`).join('')}</div>
    ${texto('nl-altitud', st.altitud, 'type="number" inputmode="numeric" min="0" max="6000" step="1" placeholder="Otra altitud en metros"')}
    <p class="reg-ayuda">La recordamos para tus próximos lotes.</p></div>
  ${campo('nl-galpon', 'Galpón (opcional)', texto('nl-galpon', st.galpon, 'type="text" maxlength="40" autocomplete="off" placeholder="Ej.: Galpón 2"'))}
  ${campo('nl-nombre', 'Nombre del lote (opcional)', texto('nl-nombre', st.nombre, `type="text" maxlength="60" autocomplete="off" placeholder="${esc(def)}"`))}
  <p class="reg-error nl-error" role="alert" hidden></p>
  <div class="reg-acciones">${Boton({ texto: 'Atrás', icono: 'atras', variante: 'secundario', accion: 'nl-atras' })}${Boton({ texto: 'Crear lote', icono: 'mas', variante: 'primario', accion: 'nl-crear', clase: 'reg-guardar' })}</div>`;
  }

  function html() {
    const nombres = ['Genética', 'Aves', 'Tareas', 'Lugar'];
    return `<section class="pantalla nuevo-lote" data-paso="${st.paso}">
  <p class="eyebrow">Nuevo lote · Paso ${st.paso} de 4</p>
  <ol class="pasos pasos-4">${nombres.map((n, i) => `<li class="paso${i + 1 < st.paso ? ' paso-hecho' : ''}"${i + 1 === st.paso ? ' aria-current="step"' : ''}><span class="paso-barra" aria-hidden="true"></span><span class="paso-nombre">${n}</span></li>`).join('')}</ol>
  ${st.paso === 1 ? paso1() : st.paso === 2 ? paso2() : st.paso === 3 ? paso3() : paso4()}
</section>`;
  }

  function pintar(enfocar) {
    const s = $v('.nuevo-lote');
    if (!s) return;
    s.outerHTML = html();
    if (enfocar) { window.scrollTo(0, 0); const h = $v('.nuevo-lote h1'); if (h) { h.tabIndex = -1; try { h.focus({ preventScroll: true }); } catch (e) { /* sin foco */ } } }
  }
  function error(msg) { const p = $v('.nl-error'); if (p) { p.textContent = msg; p.hidden = false; p.scrollIntoView({ block: 'nearest' }); } }

  /* App.estado.prefillLote = {genetica, aves, altitud, edadDias} (lo deja "Crear lote con este plan"):
     se usa una sola vez y abre el asistente en el paso 2 con todo lleno. */
  function precargar() {
    const p = App.estado.prefillLote;
    App.estado.prefillLote = null;
    if (!p || !genDe(p.genetica)) return false;
    st = Object.assign(nuevo(), { paso: 2, gid: p.genetica, modo: 'edad', unidad: 'dias' });
    if (Number.isFinite(numero(p.aves))) st.aves = String(p.aves);
    if (Number.isFinite(numero(p.edadDias))) st.edad = String(p.edadDias);
    if (Number.isFinite(numero(p.altitud))) st.altitud = String(p.altitud);
    return true;
  }
