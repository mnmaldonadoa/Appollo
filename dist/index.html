<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Appollo</title>
<meta name="description" content="Manejo de gallinas por genética y proyección de huevos o carne. Funciona sin internet.">
<meta name="theme-color" content="#17201B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
/* Layout: app de una columna (máx. 560 px), barra superior con la "huevera" de pasos
   y barra de acción fija abajo. Tokens: cáscara (fondo), tinta verde-negra, yema (acento). */
:root {
  --bg: #F2F4EF;
  --surface: #FFFFFF;
  --surface-2: #E8ECE5;
  --ink: #17201B;
  --muted: #59655E;
  --line: #D5DCD2;
  --yolk: #E7A11B;
  --yolk-soft: #FBEBC7;
  --yolk-ink: #855300;
  --leaf: #2C7650;
  --leaf-soft: #DCEEE2;
  --comb: #B8392A;
  --comb-soft: #F7DFDA;
  --chart-std: #97A29A;
  --hero-bg: #17201B;
  --hero-fg: #F2F4EF;
  --shadow: 0 1px 2px rgba(23, 32, 27, .06), 0 6px 18px rgba(23, 32, 27, .06);
  --f-display: "Zilla Slab", "Roboto Slab", Rockwell, Georgia, serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1311; --surface: #171D1A; --surface-2: #1F2723; --ink: #E8EDE8; --muted: #9AA69E; --line: #2B3530;
    --yolk: #F0B23A; --yolk-soft: #3A2D12; --yolk-ink: #F5C565; --leaf: #63C190; --leaf-soft: #17321F;
    --comb: #F06E58; --comb-soft: #3A1B16; --chart-std: #66736B; --shadow: 0 1px 2px rgba(0,0,0,.4);
    --hero-bg: #232D28; --hero-fg: #EEF2EE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1311; --surface: #171D1A; --surface-2: #1F2723; --ink: #E8EDE8; --muted: #9AA69E; --line: #2B3530;
  --yolk: #F0B23A; --yolk-soft: #3A2D12; --yolk-ink: #F5C565; --leaf: #63C190; --leaf-soft: #17321F;
  --comb: #F06E58; --comb-soft: #3A1B16; --chart-std: #66736B; --shadow: 0 1px 2px rgba(0,0,0,.4);
  --hero-bg: #232D28; --hero-fg: #EEF2EE;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--yolk); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.egg-shell { fill: none; stroke: currentColor; stroke-width: 1.6; }
.egg-yolk { fill: currentColor; }
.logo .egg-shell { fill: var(--surface); stroke: var(--ink); stroke-width: 1.7; }
.logo .egg-yolk { fill: var(--yolk); }

.app {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px));
}

/* ---------- Barra superior ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); padding-block: 10px 10px;
  border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-row { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.marca { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; letter-spacing: -.01em; flex: 1; min-width: 0; }
.marca svg { width: 22px; height: 28px; flex: none; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 40px; min-width: 40px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-size: .9rem; font-weight: 700;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.solo { padding: 0; }

.huevera { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 0; padding: 0; }
.huevera li { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .72rem; color: var(--muted); letter-spacing: .02em; }
.huevera li button { all: unset; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; border-radius: 8px; padding: 2px 6px; }
.huevera li button[disabled] { cursor: default; }
.huevera svg { width: 18px; height: 22px; }
.huevera .egg-shell { fill: var(--surface); stroke: var(--line); stroke-width: 1.6; }
.huevera .egg-yolk { fill: transparent; }
.huevera li.hecho .egg-shell { fill: var(--surface); stroke: var(--yolk); }
.huevera li.hecho .egg-yolk { fill: var(--yolk); }
.huevera li.actual .egg-shell { stroke: var(--ink); stroke-width: 2; }
.huevera li.actual .egg-yolk { fill: var(--yolk); }
.huevera li.actual { color: var(--ink); font-weight: 700; }

/* ---------- Tipografía ---------- */
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 1.85rem; line-height: 1.12; font-weight: 700; }
h2 { font-size: 1.3rem; line-height: 1.2; font-weight: 700; }
h3 { font-size: 1.12rem; line-height: 1.25; font-weight: 600; }
.lead { color: var(--muted); margin: 6px 0 0; max-width: 60ch; }
.eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

.screen { display: flex; flex-direction: column; gap: 18px; padding-top: 18px; }
.intro { display: flex; flex-direction: column; gap: 2px; }

/* ---------- Filtros ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: .9rem; font-weight: 700; color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- Tarjetas de genética ---------- */
.lista { display: flex; flex-direction: column; gap: 12px; }
.gen {
  all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px;
}
.gen:hover { border-color: var(--chart-std); }
.gen:focus-visible { outline: 3px solid var(--yolk); outline-offset: 2px; }
.gen[aria-current="true"] { border-color: var(--yolk); box-shadow: 0 0 0 2px var(--yolk) inset; }
.gen-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.gen-nombre { font-family: var(--f-display); font-size: 1.32rem; font-weight: 700; line-height: 1.15; }
.gen-desc { margin: 0; color: var(--muted); font-size: .94rem; }
.tag {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: .74rem; font-weight: 700; letter-spacing: .03em; white-space: nowrap;
  background: var(--surface-2); color: var(--muted);
}
.tag.postura { background: var(--yolk-soft); color: var(--yolk-ink); }
.tag.carne { background: var(--comb-soft); color: var(--comb); }
.tag.doble, .tag.criolla { background: var(--leaf-soft); color: var(--leaf); }
.gen > span { display: block; }
.gen .gen-head, .gen .gen-pie { display: flex; }
.datos { display: grid !important; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 0; }
.datos > span { display: flex; flex-direction: column; min-width: 0; }
.datos .dt { font-size: .74rem; color: var(--muted); }
.datos .dd { font-weight: 700; font-variant-numeric: tabular-nums; }
.gen-pie { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; color: var(--muted); gap: 8px; }
.gen-pie .ir { color: var(--ink); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }

/* ---------- Formularios ---------- */
.bloque { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.bloque-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.campo { display: flex; flex-direction: column; gap: 8px; }
.campo label, .campo .lbl { font-weight: 700; }
.ayuda { font-size: .86rem; color: var(--muted); margin: 0; }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: stretch; }
.stepper button { height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 1.4rem; font-weight: 700; }
.stepper input, .entrada {
  width: 100%; min-width: 0; height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
  text-align: center; font-family: var(--f-display); font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
.entrada.chica { height: 48px; font-size: 1.2rem; text-align: left; padding: 0 12px; font-family: var(--f-body); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.fase {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--yolk-soft); color: var(--yolk-ink);
}
.fase strong { color: inherit; }
.fase svg { width: 20px; height: 24px; flex: none; }
.error { color: var(--comb); font-weight: 700; font-size: .9rem; margin: 0; }
select.entrada { text-align: left; font-family: var(--f-body); font-size: 1rem; font-weight: 700; height: 48px; padding: 0 12px; }

/* ---------- Seleccionada ---------- */
.sel-gen { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.sel-gen > div { flex: 1; min-width: 0; }
.sel-gen .gen-nombre { font-size: 1.1rem; }
.link { background: none; border: 0; padding: 6px 4px; color: var(--yolk-ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Manejo ---------- */
.resumen-manejo {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 98px) + 8px); z-index: 10;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px;
  display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow);
}
.indice-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.indice-num { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.medidor { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.medidor span { display: block; height: 100%; background: var(--yolk); border-radius: 999px; transition: width .25s ease; }
.medidor.bueno span { background: var(--leaf); }
.medidor.malo span { background: var(--comb); }
.btn-sec { height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: .86rem; white-space: nowrap; }

.cat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 98px) + var(--res-h, 130px) + 20px); }
.cat-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.cat-ico { width: 38px; height: 38px; border-radius: 10px; background: var(--yolk-soft); color: var(--yolk-ink); display: grid; place-items: center; flex: none; }
.cat-ico svg { width: 22px; height: 22px; }
.cat-head h2 { font-size: 1.16rem; flex: 1; }
.cuenta { font-size: .8rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat-body { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.tabla { margin: 0; display: flex; flex-direction: column; }
.tabla div { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.tabla div:last-child { border-bottom: 0; }
.tabla dt { color: var(--muted); font-size: .9rem; }
.tabla dd { margin: 0; font-weight: 700; font-size: .94rem; font-variant-numeric: tabular-nums; text-align: right; }
.nota { margin: 0; font-size: .88rem; color: var(--muted); padding-left: 12px; border-left: 3px solid var(--line); }
.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
.item input { appearance: none; -webkit-appearance: none; margin: 2px 0 0; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--chart-std); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.item input:checked { background: var(--leaf); border-color: var(--leaf); }
.item input:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--surface); border-width: 0 2.5px 2.5px 0; transform: translate(0, -1px) rotate(45deg); }
.item input:disabled { opacity: .45; }
.item:has(input:checked) { border-color: var(--leaf); background: var(--leaf-soft); }
.item:has(input:disabled) { cursor: not-allowed; }
.item-t { font-weight: 700; line-height: 1.3; }
.item-d { font-size: .87rem; color: var(--muted); margin-top: 2px; }
.item-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag.alto { background: var(--comb-soft); color: var(--comb); }
.tag.medio { background: var(--yolk-soft); color: var(--yolk-ink); }
.tag.bajo { background: var(--surface-2); color: var(--muted); }
.tag.clave { background: var(--ink); color: var(--bg); }
.tag.ev { background: var(--surface-2); color: var(--muted); font-weight: 400; letter-spacing: 0; height: auto; padding: 3px 9px; white-space: normal; line-height: 1.35; }
.vac-edad { font-variant-numeric: tabular-nums; font-weight: 700; }
.estado-pasada { background: var(--surface-2); color: var(--muted); }
.estado-ahora { background: var(--comb-soft); color: var(--comb); }
.estado-proxima { background: var(--yolk-soft); color: var(--yolk-ink); }
.estado-vigente { background: var(--leaf-soft); color: var(--leaf); }
.aviso { display: flex; gap: 10px; padding: 12px; border-radius: 12px; background: var(--comb-soft); color: var(--ink); font-size: .9rem; }
.aviso svg { width: 20px; height: 20px; flex: none; color: var(--comb); margin-top: 2px; }
.aviso.suave { background: var(--surface-2); }
.aviso.suave svg { color: var(--muted); }
.signos { margin: 0; font-size: .9rem; }

/* ---------- Proyección ---------- */
.heroe { background: var(--hero-bg); color: var(--hero-fg); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
.heroe .eyebrow { color: color-mix(in srgb, var(--hero-fg) 70%, transparent); }
.heroe-num { font-family: var(--f-display); font-size: clamp(2.4rem, 11vw, 3.4rem); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.heroe-num small { font-size: .45em; font-weight: 600; letter-spacing: 0; margin-left: 4px; }
.heroe-sub { font-size: 1rem; }
.heroe-sub strong { color: #F0B23A; }
.vs { display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; margin-top: 6px; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--hero-fg) 14%, transparent); font-size: .84rem; font-weight: 700; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .v { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .v small { font-family: var(--f-body); font-size: .74rem; font-weight: 700; color: var(--muted); margin-left: 3px; }
.kpi .l { font-size: .8rem; color: var(--muted); line-height: 1.3; }
.grafico { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 12px 8px; }
.grafico svg { width: 100%; height: auto; display: block; }
.leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); padding: 4px 4px 0; }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 18px; height: 0; border-top: 3px solid var(--yolk-ink); display: inline-block; }
.leyenda i.std { border-top: 2px dashed var(--chart-std); }
.ax { font-size: 10px; fill: var(--muted); font-family: var(--f-body); }
.grid-l { stroke: var(--line); stroke-width: 1; }
.l-std { fill: none; stroke: var(--chart-std); stroke-width: 2; stroke-dasharray: 5 4; }
.l-proj { fill: none; stroke: var(--yolk-ink); stroke-width: 2.6; stroke-linejoin: round; }
.a-proj { fill: var(--yolk); opacity: .18; }
.hoy-l { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 3; }
.hoy-t { font-size: 10px; fill: var(--ink); font-weight: 700; font-family: var(--f-body); }
.punto { fill: var(--yolk-ink); stroke: var(--surface); stroke-width: 2; }

.brechas { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.brechas li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.brechas .g { font-weight: 700; color: var(--leaf); font-variant-numeric: tabular-nums; white-space: nowrap; }
.brechas .c { font-size: .78rem; color: var(--muted); }
.eco { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
.eco .campo label { font-size: .86rem; }
.eco-res { display: flex; flex-direction: column; }
.eco-res div { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--line); font-variant-numeric: tabular-nums; }
.eco-res div:last-child { border-bottom: 0; font-weight: 700; font-size: 1.05rem; }
.pos { color: var(--leaf); } .neg { color: var(--comb); }
details.metodo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 16px; }
details.metodo summary { cursor: pointer; font-weight: 700; padding: 12px 0; }
details.metodo p, details.metodo li { font-size: .9rem; color: var(--muted); }
details.metodo ul { padding-left: 18px; }

/* ---------- Lotes guardados ---------- */
.lote { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.lote-acc { display: flex; gap: 8px; flex-wrap: wrap; }
.vacio { text-align: center; padding: 36px 16px; border: 1.5px dashed var(--line); border-radius: var(--r); color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.vacio svg { width: 34px; height: 42px; }

/* ---------- Barra inferior ---------- */
.barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
}
.barra-in { max-width: 528px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.btn {
  flex: 1; height: 54px; border-radius: 14px; border: 0; background: var(--yolk); color: #1A1305;
  font-weight: 700; font-size: 1.05rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn svg { width: 20px; height: 20px; }
.btn[disabled] { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
.btn.oscuro { background: var(--ink); color: var(--bg); }
.btn.borde { background: var(--surface); color: var(--ink); border: 1px solid var(--line); flex: none; padding: 0 16px; }
.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: .9rem; z-index: 40;
  max-width: calc(100% - 32px);
}
.copia { width: 100%; min-height: 160px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 10px; font-size: .85rem; }

@media (min-width: 600px) {
  .app { padding-top: 8px; }
  h1 { font-size: 2.1rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function interp(xs, ys, x) {
  const n = xs.length;
  if (x <= xs[0]) return ys[0];
  if (x >= xs[n - 1]) {
    const s = (ys[n - 1] - ys[n - 2]) / (xs[n - 1] - xs[n - 2]);
    return ys[n - 1] + s * (x - xs[n - 1]) * 0.85;
  }
  for (let i = 1; i < n; i++) {
    if (x <= xs[i]) {
      const t = (x - xs[i - 1]) / (xs[i] - xs[i - 1]);
      return ys[i - 1] + t * (ys[i] - ys[i - 1]);
    }
  }
  return ys[n - 1];
}

  if (w > pl) v -= p.dec * (w - pl);
  return Math.max(0, v);
}

  const t = Math.max(0, w - (p.w50 + shift));

    { id: 't_rango', n: `Mantener ${tmin}–${tmax} °C`, det: joven ? 'Criadora o campana, cortinas y termómetro a la altura de las aves.' : 'Manejo de cortinas según la hora del día.', prod: 6, mort: joven ? 3 : 1, clave: true },
    { id: 't_vent', n: 'Ventilación mínima y amoníaco bajo', det: 'Si el olor pica los ojos, el amoníaco pasa de 20 ppm: ventila aunque haga frío.', prod: 3, mort: 1 },

  ];
  if (modo === 'carne' && esBroiler(g) && alt >= 2000) itemsT.push({ id: 't_asc', n: 'Programa contra ascitis por altura', det: 'Restricción de alimento entre los días 7 y 21 (8–10 h sin comida), alimento en harina y buena ventilación.', prod: 0, mort: 0, especial: 'ascitis' });

  /* Humedad */
  const [hmin, hmax] = humedadRango(modo, d);
  cats.push({
    id: 'hum', n: 'Humedad', icono: 'gota', filas: [['Humedad relativa', `${hmin}–${hmax} %`], ['Cama', 'Viruta o cascarilla de arroz, 8–10 cm, seca y suelta']],
    notas: ['Prueba del puño: aprieta un poco de cama; si queda hecha bola, está muy húmeda.'],
    items: [
      { id: 'h_rango', n: `Mantener la humedad entre ${hmin} y ${hmax} %`, det: hmin >= 60 ? 'Los primeros días el aire seco deshidrata al pollito: humedecer el piso alrededor si hace falta.' : 'Evitar goteras y derrames de bebederos.', prod: 2, mort: 0.5 },
      { id: 'h_cama', n: 'Cama seca y suelta', det: 'Retirar las zonas apelmazadas cada semana y voltear la cama.', prod: 2, mort: 1 }
    ]
  });

  /* Agua */
  const ratio = modo === 'carne' ? 1.75 : 2.0;
  const agua = cons * ratio * (d <= 3 ? 1.2 : 1);
  cats.push({
    id: 'agua', n: 'Agua', icono: 'vaso',
    filas: [['Consumo a 21 °C', fmt(agua, 0) + ' ml/ave/día'], ['Tu lote', fmt(agua * aves / 1000, 0) + ' L/día'], ['Calidad', 'pH 6–8 · cloro libre 1–3 ppm'], ['Bebederos', modo === 'carne' ? '1 niple cada 10–12 aves o 1 de campana cada 80' : '1 niple cada 8–10 aves o 1 de campana cada 50']],
    notas: ['Por cada grado sobre 21 °C, el consumo de agua sube cerca de 6 %. Una caída brusca del consumo suele ser la primera señal de enfermedad.'],
    items: [
      { id: 'w_lib', n: 'Agua limpia y fresca a voluntad', det: 'Nunca dejar las aves sin agua; revisar mañana y tarde.', prod: 10, mort: 2, clave: true },
      { id: 'w_clor', n: 'Clorar o potabilizar el agua', det: 'Cloro libre de 1–3 ppm en el bebedero. Suspender 24 h antes y después de vacunar por el agua.', prod: 2, mort: 1 },
      { id: 'w_limp', n: 'Lavar bebederos a diario y ajustar la altura', det: 'El borde del bebedero a la altura del lomo del ave.', prod: 1, mort: 0.5 }
    ]
  });

  /* Vitaminas */
  const filasV = [];
  const itemsV = [];
  if (d <= 7) {
    filasV.push(['Llegada', 'Vitaminas A, D3, E + complejo B y electrolitos 3–5 días']);
    itemsV.push({ id: 'v_llegada', n: 'Vitaminas y electrolitos los primeros días', det: 'Del día 1 al 5 en el agua, según la etiqueta.', prod: 2, mort: 1 });
  }
  filasV.push(['Vacunaciones y cambios', 'Multivitamínico 2 días antes y 3 después']);
  itemsV.push({ id: 'v_estres', n: 'Vitaminas en vacunaciones, traslados y cambios de alimento', det: 'Reduce la caída de consumo por estrés.', prod: 2, mort: 0.5 });
  filasV.push(['Calor', 'Vitamina C y electrolitos en días calurosos']);
  if (modo === 'huevos' && w >= 14 && w < g.postura.w50 + 1) {
    filasV.push(['Prepostura', 'Vitamina AD3E 3 días + calcio de prepostura']);
    itemsV.push({ id: 'v_pre', n: 'Vitamina AD3E en la prepostura', det: 'Ayuda a formar el hueso medular que aporta calcio a la cáscara.', prod: 2, mort: 0 });
  }
  if (modo === 'carne' && esBroiler(g) && alt >= 2000) {
    itemsV.push({ id: 'v_alt', n: 'Vitaminas C y E en zonas altas', det: 'Apoyo antioxidante contra la ascitis, 3 días por semana desde el día 10.', prod: 1, mort: 1 });
  }
  cats.push({ id: 'vit', n: 'Vitaminas', icono: 'capsula', filas: filasV, notas: ['El balanceado comercial ya trae vitaminas y minerales. En el agua solo se dan en momentos de estrés.'], items: itemsV });

  /* Vacunas */
  const vac = vacunasPara(g, modo);
  const dFin = st.dFin;
  const itemsVac = vac.filter(v => v.d <= dFin || (v.repite && dFin >= v.d)).map(v => {
    let estado = 'proxima';
    if (v.repite && d >= v.d) estado = 'vigente';
    else if (v.d < d - 3) estado = 'pasada';
    else if (v.d <= d + 7) estado = 'ahora';
    return { id: v.id, n: v.n, det: v.via, edad: v.d, estado, prod: v.w * 1.2, mort: v.w * 1.6, vacuna: true };
  });
  cats.push({ id: 'vac', n: 'Vacunas', icono: 'jeringa', items: itemsVac, notas: ['Calendario de referencia. Ajústalo con tu médico veterinario según las enfermedades de tu zona. La vacuna contra influenza aviar solo se aplica dentro de los programas de Agrocalidad.'] });

  /* Control sanitario */
  const itemsS = [
    { id: 's_bio', n: 'Bioseguridad', det: 'Pediluvio con desinfectante, ropa y botas solo para el galpón, sin visitas ni aves de otros lugares.', prod: 3, mort: 2, clave: true },
    { id: 's_limp', n: d <= 7 ? 'Limpieza, desinfección y vacío sanitario' : 'Retirar la mortalidad a diario', det: d <= 7 ? 'Lavar, desinfectar y dejar el galpón vacío 15–21 días antes de recibir el lote.' : 'Enterrar o compostar las aves muertas lejos del galpón.', prod: 2, mort: 1 },
    { id: 's_roed', n: 'Control de roedores, moscas y aves silvestres', det: 'Mallas en ventanas, cebos en estaciones cerradas y alimento tapado.', prod: 1, mort: 1 },
    { id: 's_reg', n: 'Registro diario', det: modo === 'huevos' && enPostura ? 'Huevos recogidos, alimento, agua y mortalidad del día.' : 'Alimento, agua, mortalidad y peso semanal de 1 de cada 20 aves.', prod: 2, mort: 0 }
  ];
  if (modo === 'huevos' && d >= 42) itemsS.push({ id: 's_desp', n: 'Desparasitación programada', det: 'A las 8 y 16 semanas y luego cada 3–4 meses en aves de piso o pastoreo.', prod: 3, mort: 0.5 });
  if (modo === 'carne' && !esBroiler(g) && d >= 28) itemsS.push({ id: 's_desp', n: 'Desparasitación al salir a pastoreo', det: 'Una dosis al iniciar el pastoreo y otra a los 2 meses.', prod: 3, mort: 0.5 });
  if (d < 126 || modo === 'carne') itemsS.push({ id: 's_peso', n: 'Pesaje semanal y uniformidad', det: 'Pesar 1 de cada 20 aves; meta de uniformidad sobre 80 %.', prod: 2, mort: 0 });
  cats.push({ id: 'san', n: 'Control sanitario', icono: 'escudo', items: itemsS });

  /* Sanidad actual: remedios caseros y control químico */
  const enfDisp = ENFERMEDADES.filter(e => e.modos.includes(modo));
  cats.push({ id: 'casero', n: 'Remedios caseros', icono: 'hoja', sanidad: true, enfermedades: enfDisp });
  cats.push({ id: 'quim', n: 'Control químico', icono: 'matraz', sanidad: true, enfermedades: enfDisp });

  return { fase: ph, cats };
}

/* ----------------------- Factores de manejo ----------------------- */
function factores(st, manejo, sel) {
  const g = st.g, modo = st.modo;
  let f = 1, mortExtra = 0, pesoTot = 0, pesoCub = 0;
  const faltan = [];
  for (const c of manejo.cats) {
    if (!c.items) continue;
    for (const it of c.items) {
      if (it.especial) continue;
      const peso = it.prod + 1.5 * it.mort;
      pesoTot += peso;
      if (sel.has(it.id)) { pesoCub += peso; continue; }
      f *= 1 - it.prod / 100;
      mortExtra += it.mort;
      faltan.push({ id: it.id, n: it.n, cat: c.n });
    }
  }
  // Problema sanitario
  const enf = ENFERMEDADES.find(e => e.id === st.enf);
  let mit = 0;
  if (enf) {
    let resto = 1;
    for (const t of [...enf.caseros, ...enf.quimicos]) if (sel.has(t.id)) resto *= 1 - t.mit;
    mit = Math.min(0.9, 1 - resto);
    f *= 1 - enf.prod * (1 - mit) / 100;
    mortExtra += enf.mort * (1 - mit);
    const peso = enf.prod + 1.5 * enf.mort;
    pesoTot += peso; pesoCub += peso * mit;
  } else {
    let bono = 0;
    for (const p of PREVENTIVOS_CASEROS) if (sel.has(p.id)) bono += p.prod;
    f *= 1 + Math.min(1, bono) / 100;
  }
  // Altitud
  let altPeso = 0, altMort = 0;
  if (modo === 'carne' && st.alt > 1500) {
    const broiler = esBroiler(g);
    altPeso = (st.alt - 1500) / 1000 * (broiler ? 6 : 2);
    altMort = st.alt > 2000 ? (st.alt - 2000) / 1000 * (broiler ? 6 : 1.5) : 0;
    if (sel.has('t_asc')) { altMort *= 0.4; altPeso += 1; }
  } else if (modo === 'huevos' && st.alt > 2000) {
    altPeso = (st.alt - 2000) / 1000 * 1.5;
  }
  f *= 1 - altPeso / 100;
  mortExtra += altMort;
  f = clamp(f, 0.3, 1.02);
  // Retraso del inicio de postura por mala recría
  let shift = 0;
  if (modo === 'huevos' && st.dias / 7 < g.postura.w50 - 2) shift = (1 - f) * 5;
  const indice = pesoTot ? Math.round(100 * pesoCub / pesoTot) : 100;
  return { f, mortExtra, shift, indice, enf, mit, altPeso, altMort, faltan };
}

/* ---------------------------- Simulaciones ---------------------------- */
function simHuevos(st, F) {
  const g = st.g, p = g.postura;
  const fObj = F.f * (g.campo || 1);
  const d0 = st.dias, dFin = st.dFin;
  const w0 = d0 / 7;
  let f0 = fObj;
  const std0 = hdStd(p, w0, F.shift);
  if (st.real != null && std0 > 10) f0 = clamp(st.real / std0, 0.1, 1.15);
  const dias = Math.max(1, dFin - d0);
  const extraDia = (F.mortExtra / 100) * Math.min(1, dias / 300) / dias;
  let vivas = st.aves, huevos = 0, masa = 0, alimento = 0, alimRecria = 0;
  let pico = 0, wPico = 0, w50 = null;
  const serie = [];
  for (let d = d0; d < dFin; d++) {
    const w = (d + 0.5) / 7, t = d - d0;
    const fh = fObj + (f0 - fObj) * Math.exp(-t / 28);
    const hd = hdStd(p, w, F.shift) * fh;
    if (hd > pico) { pico = hd; wPico = w; }
    if (w50 === null && hd >= 50) w50 = w;
    const e = vivas * hd / 100;
    huevos += e;
    masa += e * ewStd(p, w, F.shift) * (1 - (1 - fh) * 0.25);
    const kg = vivas * consumoPostura(g, w) * (0.97 + 0.03 * fh) / 1000;
    alimento += kg;
    if (w < 18) alimRecria += kg;
    const mBase = d < 126 ? (1 - g.cria.viab / 100) / 126 : p.m / 7;
    vivas *= 1 - mBase - extraDia;
    if ((d - d0) % 7 === 0) serie.push({ w: d / 7, hd });
  }
  const est = [];
  for (let w = Math.max(16, Math.floor(w0) - 2); w <= dFin / 7; w++) est.push({ w, hd: hdStd(p, w) });
  const hdHoy = hdStd(p, w0 + 0.5 / 7, F.shift) * f0;
  return {
    tipo: 'huevos', huevos, huevosAve: huevos / st.aves, masaKg: masa / 1000, alimento, alimRecria,
    pesoHuevo: huevos ? masa / huevos : 0, conversion: masa ? (alimento - alimRecria) / (masa / 1000) : 0,
    kgDocena: huevos ? (alimento - alimRecria) / (huevos / 12) : 0, cubetas: huevos / 30,
    vivasFin: vivas, viab: 100 * vivas / st.aves, pico, wPico, w50, hdHoy, serie, est
  };
}

function simCarne(st, F) {
  const g = st.g, c = g.carne;
  const fObj = F.f * (g.campo || 1);
  const d0 = st.dias, dFin = st.dFin;
  const fPasado = 1 - (1 - fObj) * Math.min(1, d0 / 14);
  let peso = st.real != null && st.real > 0 ? st.real : pesoStd(c, d0) * fPasado;
  const peso0 = peso;
  const dias = Math.max(1, dFin - d0);
  const mBaseDia = c.mortBase / 100 / c.ciclo;
  const extraDia = (F.mortExtra / 100) * Math.min(1, dias / c.ciclo) / dias;
  let vivas = st.aves, alimento = 0, avesDia = 0;
  const desperdicio = 1 + (1 - F.f) * 0.35;
  const serie = [{ d: d0, p: peso }];
  for (let d = d0; d < dFin; d++) {
    const ratio = peso / pesoStd(c, d);
    const gan = (pesoStd(c, d + 1) - pesoStd(c, d)) * fObj * Math.pow(clamp(ratio, 0.4, 1.3), 0.3);
    alimento += vivas * consumoCarne(c, d) * Math.pow(clamp(ratio, 0.4, 1.3), 0.75) * desperdicio / 1000;
    avesDia += vivas;
    peso += gan;
    vivas *= 1 - mBaseDia - extraDia;
    serie.push({ d: d + 1, p: peso });
  }
  const avesProm = avesDia / dias;
  const alimAve = alimento / avesProm;
  const previo = consAcumStd(c, d0) * Math.pow(clamp(peso0 / pesoStd(c, d0), 0.4, 1.3), 0.75) / 1000;
  const caAcum = (previo + alimAve) / (peso / 1000);
  const caPeriodo = alimAve / Math.max(0.01, (peso - peso0) / 1000);
  const viabPrev = 1 - c.mortBase / 100 * Math.min(1, d0 / c.ciclo);
  const viab = 100 * viabPrev * vivas / st.aves;
  const kgVivo = vivas * peso / 1000;
  const iep = dFin > 0 ? (viab * (peso / 1000)) / (dFin * caAcum) * 100 : 0;
  const est = [];
  const dMax = Math.max(dFin, c.venta);
  for (let d = 0; d <= dMax; d += 1) est.push({ d, p: pesoStd(c, d) });
  return {
    tipo: 'carne', pesoFin: peso, pesoStdFin: pesoStd(c, dFin), peso0, kgVivo, kgCanal: kgVivo * c.rend / 100,
    alimento, caAcum, caPeriodo, vivasFin: vivas, viab, iep, serie, est
  };
}

function proyectar(st, manejo, sel) {
  const F = factores(st, manejo, sel);
  const r = st.modo === 'huevos' ? simHuevos(st, F) : simCarne(st, F);
  r.F = F;
  return r;
}

/* Cuánto gana el lote si agrega cada práctica que falta */
function brechas(st, manejo, sel, base) {
  const out = [];
  const valor = r => r.tipo === 'huevos' ? r.huevos : r.kgVivo;
  const v0 = valor(base);
  for (const fz of base.F.faltan) {
    const s2 = new Set(sel); s2.add(fz.id);
    const v = valor(proyectar(st, manejo, s2));
    if (v - v0 > 0.0005 * Math.max(1, v0)) out.push({ ...fz, gana: v - v0 });
  }
  return out.sort((a, b) => b.gana - a.gana);
}

/* ------------------------------ Formato ------------------------------ */
function fmt(x, dec = 0) {
  if (!isFinite(x)) return '—';
  return x.toLocaleString('es-EC', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

if (typeof module !== 'undefined') module.exports = { hdStd, ewStd, consumoPostura, pesoStd, caStd, construirManejo, factores, proyectar, brechas, simHuevos, simCarne, modoDe, fase, fmt };

</script>
<script>
/* =========================================================================
   APPOLLO · Cálculos puros de lote (sin DOM, sin almacenamiento)
   Fechas: cadenas locales 'YYYY-MM-DD'. Nunca se usa toISOString().
   ========================================================================= */

function fechaADate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function hoyLocal(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/* Edad en días = edad al llegar + días enteros transcurridos desde la llegada. */
function edadDias(lote, fecha) {
  const a = fechaADate(lote.fechaLlegada), b = fechaADate(fecha);
  // UTC solo para contar días enteros sin que el cambio de hora afecte el resultado
  const dias = Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) -
    Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
  return lote.edadLlegadaDias + dias;
}

const _genDe = lote => GENETICAS.find(g => g.id === lote.genetica);
const _esCarne = g => modoDe(g) === 'carne';
const _delLote = (lote, registros, tipo) =>
  registros.filter(r => r.loteId === lote.id && r.tipo === tipo);
const _suma = (rs, campo) => rs.reduce((s, r) => s + (Number(r.datos && r.datos[campo]) || 0), 0);

function mortalidadTotal(lote, registros, fecha) {
  return _suma(_delLote(lote, registros, 'mortalidad').filter(r => r.fecha <= fecha), 'cantidad');
}

function avesVivas(lote, registros, fecha) {
  return lote.avesInicio - mortalidadTotal(lote, registros, fecha);
}

function mortalidadPct(lote, registros, fecha) {
  if (!(lote.avesInicio > 0)) return null;
  return 100 * mortalidadTotal(lote, registros, fecha) / lote.avesInicio;
}

function viabilidad(lote, registros, fecha) {
  const m = mortalidadPct(lote, registros, fecha);
  return m === null ? null : 100 - m;
}

/* Valores de referencia del día para `aves` aves (por defecto avesInicio).
   `altitud` se acepta por compatibilidad de firma; el estándar de guía no la usa. */
function estandarDia(lote, fecha, altitud, aves) {
  const g = _genDe(lote), d = edadDias(lote, fecha);
  const n = aves == null ? lote.avesInicio : aves;
  if (_esCarne(g)) {
    const c = g.carne;
    return {
      alimentoKg: n * consumoCarne(c, d) / 1000,
      huevos: 0, hdPct: null,
      pesoG: pesoStd(c, d),
      mortEsperada: c.mortBase / c.ciclo // % diario
    };
  }
  const p = g.postura, w = d / 7;
  const hd = hdStd(p, w);
  return {
    alimentoKg: n * consumoPostura(g, w) / 1000,
    huevos: n * hd / 100,
    hdPct: hd,
    pesoG: ewStd(p, w), // peso del huevo (g)
    mortEsperada: p.m / 7 * 100 // % diario
  };
}

function pctPostura(lote, registros, fecha) {
  const vivas = avesVivas(lote, registros, fecha);
  if (!(vivas > 0)) return null;
  const hs = _delLote(lote, registros, 'huevos').filter(r => r.fecha === fecha);
  if (!hs.length) return null;
  return 100 * _suma(hs, 'cantidad') / vivas;
}

/* Postura: kg de alimento del día / kg de huevo del día (peso de huevo de guía).
   Carne: alimento acumulado / kg vivos (último peso registrado × aves vivas). */
function conversion(lote, registros, fecha) {
  const vivas = avesVivas(lote, registros, fecha);
  if (!(vivas > 0)) return null;
  const g = _genDe(lote);
  if (_esCarne(g)) {
    const alim = _suma(_delLote(lote, registros, 'alimento').filter(r => r.fecha <= fecha), 'kg');
    const ps = _delLote(lote, registros, 'peso').filter(r => r.fecha <= fecha).sort((a, b) => a.fecha < b.fecha ? -1 : 1);
    if (!ps.length || !alim) return null;
    const kgVivo = vivas * (Number(ps[ps.length - 1].datos.gramos) || 0) / 1000;
    return kgVivo > 0 ? alim / kgVivo : null;
  }
  const alim = _suma(_delLote(lote, registros, 'alimento').filter(r => r.fecha === fecha), 'kg');
  const huevos = _suma(_delLote(lote, registros, 'huevos').filter(r => r.fecha === fecha), 'cantidad');
  const kgHuevo = huevos * ewStd(g.postura, edadDias(lote, fecha) / 7) / 1000;
  return alim > 0 && kgHuevo > 0 ? alim / kgHuevo : null;
}

/* Real ÷ estándar × 100. Postura: % postura vs HD estándar. Carne: último peso vs peso estándar. */
function rendimiento(lote, registros, fecha) {
  const g = _genDe(lote), e = estandarDia(lote, fecha);
  if (_esCarne(g)) {
    const ps = _delLote(lote, registros, 'peso').filter(r => r.fecha <= fecha).sort((a, b) => a.fecha < b.fecha ? -1 : 1);
    if (!ps.length || !(e.pesoG > 0)) return null;
    return 100 * (Number(ps[ps.length - 1].datos.gramos) || 0) / e.pesoG;
  }
  const real = pctPostura(lote, registros, fecha);
  return real === null || !(e.hdPct > 0) ? null : 100 * real / e.hdPct;
}

</script>
<script>
/* =========================================================================
   APPOLLO · Reglas de alerta (puras: sin DOM, sin almacenamiento)
   Cada regla devuelve Alerta[]; generarAlertas las compone y ordena.
   Alerta{id, tipo, gravedad:'rojo'|'ambar'|'info', loteId?, texto, accion:{etiqueta, ruta}}
   ========================================================================= */

function _sumaDias(fecha, n) {
  const d = fechaADate(fecha);
  d.setDate(d.getDate() + n);
  return hoyLocal(d);
}
const _rutaLote = l => '#/lote/' + l.id;
const _activos = lotes => lotes.filter(l => l.estado === 'activo');

function alertaVacunas(datos, hoy) {
  const out = [], manana = _sumaDias(hoy, 1);
  const activos = new Map(_activos(datos.lotes).map(l => [l.id, l]));
  for (const v of datos.vacunasPlan || []) {
    const l = activos.get(v.loteId);
    if (!l || v.fechaAplicada) continue;
    let gravedad = null, cuando = '';
    if (v.fechaPrevista < hoy) { gravedad = 'rojo'; cuando = 'vencida (' + v.fechaPrevista + ')'; }
    else if (v.fechaPrevista === hoy) { gravedad = 'ambar'; cuando = 'es hoy'; }
    else if (v.fechaPrevista === manana) { gravedad = 'ambar'; cuando = 'es mañana'; }
    if (!gravedad) continue;
    out.push({ id: 'vacuna-' + v.id, tipo: 'vacuna', gravedad, loteId: l.id,
      texto: 'Vacuna ' + v.nombre + ' · ' + l.nombre + ': ' + cuando,
      accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
  }
  return out;
}

function alertaMortalidad(datos, hoy) {
  const out = [];
  for (const l of _activos(datos.lotes)) {
    const muertes = datos.registros.filter(r => r.loteId === l.id && r.tipo === 'mortalidad' && r.fecha === hoy)
      .reduce((s, r) => s + (Number(r.datos && r.datos.cantidad) || 0), 0);
    if (!muertes) continue;
    const base = avesVivas(l, datos.registros, hoy) + muertes; // aves al empezar el día
    if (!(base > 0)) continue;
    const esp = estandarDia(l, hoy, undefined).mortEsperada;
    const pct = 100 * muertes / base;
    if (esp > 0 && pct > 2 * esp) {
      out.push({ id: 'mortalidad-' + l.id + '-' + hoy, tipo: 'mortalidad', gravedad: 'rojo', loteId: l.id,
        texto: l.nombre + ': hoy murieron ' + muertes + ' aves (' + pct.toFixed(2) + ' %), más del doble de lo esperado',
        accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
    }
  }
  return out;
}

function alertaPostura(datos, hoy) {
  const out = [];
  for (const l of _activos(datos.lotes)) {
    const prom = desde => {
      const v = [0, 1, 2].map(i => pctPostura(l, datos.registros, _sumaDias(hoy, -(desde + i)))).filter(x => x !== null);
      return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
    };
    const rec = prom(0), prev = prom(3);
    if (rec !== null && prev !== null && prev - rec > 3) {
      out.push({ id: 'postura-' + l.id + '-' + hoy, tipo: 'postura', gravedad: 'ambar', loteId: l.id,
        texto: l.nombre + ': la postura bajó ' + (prev - rec).toFixed(1) + ' puntos frente a los 3 días previos',
        accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
    }
  }
  return out;
}

function alertaInventario(datos) {
  return (datos.inventario || [])
    .filter(i => Number(i.cantidad) < Number(i.minimo))
    .map(i => ({ id: 'inventario-' + i.id, tipo: 'inventario', gravedad: 'ambar',
      texto: i.nombre + ': quedan ' + i.cantidad + ' ' + i.unidad + ' (mínimo ' + i.minimo + ')',
      accion: { etiqueta: 'Ver inventario', ruta: '#/inventario' } }));
}

function alertaRetiro(datos, hoy) {
  const out = [], activos = new Map(_activos(datos.lotes).map(l => [l.id, l]));
  for (const r of datos.registros) {
    const dias = Number(r.datos && r.datos.retiroDias) || 0;
    const l = activos.get(r.loteId);
    if (r.tipo !== 'sanidad' || dias <= 0 || !l) continue;
    const fin = _sumaDias(r.fecha, dias);
    if (hoy <= fin) {
      out.push({ id: 'retiro-' + r.id, tipo: 'retiro', gravedad: 'rojo', loteId: l.id,
        texto: 'No vendas huevos/carne hasta ' + fin + ' · ' + l.nombre,
        accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
    }
  }
  return out;
}

function alertaSinRegistro(datos, hoy, ahora) {
  if (ahora.getHours() < 18) return [];
  return _activos(datos.lotes)
    .filter(l => !datos.registros.some(r => r.loteId === l.id && r.fecha === hoy))
    .map(l => ({ id: 'sin-registro-' + l.id + '-' + hoy, tipo: 'sin-registro', gravedad: 'info', loteId: l.id,
      texto: l.nombre + ': aún no hay registros de hoy',
      accion: { etiqueta: 'Registrar', ruta: _rutaLote(l) } }));
}

/* Avisa si la fase de alimento cambia hoy o en los próximos 7 días. */
function alertaCambioAlimento(datos, hoy) {
  const out = [];
  for (const l of _activos(datos.lotes)) {
    const g = GENETICAS.find(x => x.id === l.genetica);
    if (!g) continue;
    const modo = modoDe(g), d = edadDias(l, hoy);
    for (let k = 0; k <= 7; k++) {
      const antes = fase(g, modo, d + k - 1), despues = fase(g, modo, d + k);
      if (antes.id !== despues.id) {
        const cuando = k === 0 ? 'hoy' : k === 1 ? 'mañana' : 'en ' + k + ' días';
        out.push({ id: 'fase-' + l.id + '-' + despues.id, tipo: 'fase', gravedad: 'info', loteId: l.id,
          texto: l.nombre + ': ' + cuando + ' pasa a la fase "' + despues.n + '" de alimento',
          accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
        break;
      }
    }
  }
  return out;
}

function generarAlertas(datos, ahora) {
  const hoy = hoyLocal(ahora);
  const orden = { rojo: 0, ambar: 1, info: 2 };
  return [
    ...alertaVacunas(datos, hoy), ...alertaMortalidad(datos, hoy), ...alertaPostura(datos, hoy),
    ...alertaInventario(datos), ...alertaRetiro(datos, hoy), ...alertaSinRegistro(datos, hoy, ahora),
    ...alertaCambioAlimento(datos, hoy)
  ].map((a, i) => [a, i]).sort((x, y) => orden[x[0].gravedad] - orden[y[0].gravedad] || x[1] - y[1]).map(x => x[0]);
}

<script>
/* =========================================================================
   APPOLLO · Persistencia (IndexedDB con respaldo en memoria)
   Script plano: define el global DB. Todas las operaciones devuelven Promise.
   ========================================================================= */
const DB = (function () {
  'use strict';
  const NOMBRE = 'appollo', VERSION = 1;
  const STORES = ['granja', 'lotes', 'registros', 'inventario', 'vacunasPlan'];
  const K_V1 = 'appollo.v1.lotes', K_MIGRADO = 'appollo.v2.migrado';
  let impl = null, abriendo = null;

  const nuevoId = () => {
    try { if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* sigue */ }
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
  };
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
  const copia = o => JSON.parse(JSON.stringify(o));
  const coincide = (obj, filtro) => {
    if (!filtro) return true;
    if (typeof filtro === 'function') return !!filtro(obj);
    return Object.keys(filtro).every(k => obj[k] === filtro[k]);
  };
  const exigeStore = s => { if (!STORES.includes(s)) throw new Error('Almacén desconocido: ' + s); };

  /* ---------------------------- IndexedDB ---------------------------- */
  const pedido = r => new Promise((ok, mal) => { r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error || new Error('Error de IndexedDB')); });
  const transaccion = tx => new Promise((ok, mal) => {
    tx.oncomplete = () => ok();
    tx.onerror = () => mal(tx.error || new Error('Error de IndexedDB'));
    tx.onabort = () => mal(tx.error || new Error('Transacción cancelada'));
  });

  function abrirIDB() {
    return new Promise((ok, mal) => {
      let req;
      try { req = indexedDB.open(NOMBRE, VERSION); } catch (e) { mal(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        STORES.forEach(s => {
          const st = db.createObjectStore(s, { keyPath: 'id' });
          if (s === 'registros') st.createIndex('loteId+fecha', ['loteId', 'fecha']);
          if (s === 'vacunasPlan') st.createIndex('loteId', 'loteId');
        });
      };
      req.onsuccess = () => ok(req.result);
      req.onerror = () => mal(req.error || new Error('No se pudo abrir IndexedDB'));
      req.onblocked = () => mal(new Error('IndexedDB bloqueada'));
    }).then(db => ({
      modo: 'indexeddb',
      async todos(s) { return pedido(db.transaction(s).objectStore(s).getAll()); },
      async uno(s, id) { return pedido(db.transaction(s).objectStore(s).get(id)); },
      async poner(s, o) { const tx = db.transaction(s, 'readwrite'); tx.objectStore(s).put(o); await transaccion(tx); },
      async quitar(s, id) { const tx = db.transaction(s, 'readwrite'); tx.objectStore(s).delete(id); await transaccion(tx); },
      async reemplazar(datos) {
        const tx = db.transaction(STORES, 'readwrite');
        STORES.forEach(s => { const st = tx.objectStore(s); st.clear(); (datos[s] || []).forEach(o => st.put(o)); });
        await transaccion(tx);
      }
    }));
  }

  /* ----------------------------- Memoria ----------------------------- */
  function abrirMemoria() {
    const m = {};
    STORES.forEach(s => { m[s] = new Map(); });
    return {
      modo: 'memoria',
      async todos(s) { return Array.from(m[s].values()).map(copia); },
      async uno(s, id) { return m[s].has(id) ? copia(m[s].get(id)) : undefined; },
      async poner(s, o) { m[s].set(o.id, copia(o)); },
      async quitar(s, id) { m[s].delete(id); },
      async reemplazar(datos) { STORES.forEach(s => { m[s] = new Map((datos[s] || []).map(o => [o.id, copia(o)])); }); }
    };
  }

  /* ------------------------------ API ------------------------------ */
  function abrir() {
    if (impl) return Promise.resolve({ modo: impl.modo });
    if (!abriendo) {
      abriendo = (typeof indexedDB === 'undefined' || !indexedDB ? Promise.reject(new Error('Sin IndexedDB')) : abrirIDB())
        .catch(() => abrirMemoria())
        .then(i => { impl = i; return { modo: i.modo }; });
    }
    return abriendo;
  }
  const lista = async () => { await abrir(); return impl; };

  async function listar(store, filtro) {
    exigeStore(store);
    const todos = await (await lista()).todos(store);
    return filtro ? todos.filter(o => coincide(o, filtro)) : todos;
  }
  async function obtener(store, id) { exigeStore(store); return (await lista()).uno(store, id); }
  async function guardar(store, obj) {
    exigeStore(store);
    const o = Object.assign({}, obj);
    if (o.id === undefined || o.id === null || o.id === '') o.id = nuevoId();
    await (await lista()).poner(store, o);
    return o;
  }
  async function borrar(store, id) { exigeStore(store); await (await lista()).quitar(store, id); }

  async function exportar() {
    const i = await lista(), datos = {};
    for (const s of STORES) datos[s] = await i.todos(s);
    return JSON.stringify({ version: 1, exportado: new Date().toISOString(), datos });
  }

  function validar(texto) {
    let j;
    try { j = JSON.parse(texto); } catch (e) { return { error: 'El archivo no es un respaldo válido: no se pudo leer el JSON.' }; }
    if (!j || typeof j !== 'object' || Array.isArray(j)) return { error: 'El respaldo no tiene el formato esperado.' };
    if (j.version !== 1) return { error: 'Versión de respaldo no compatible (se esperaba la versión 1).' };
    if (!j.datos || typeof j.datos !== 'object' || Array.isArray(j.datos)) return { error: 'El respaldo no contiene la sección de datos.' };
    for (const k of Object.keys(j.datos)) {
      if (!STORES.includes(k)) return { error: 'El respaldo contiene datos desconocidos: ' + k + '.' };
      if (!Array.isArray(j.datos[k])) return { error: 'Los datos de "' + k + '" deben ser una lista.' };
      if (!j.datos[k].every(o => o && typeof o === 'object' && !Array.isArray(o) && o.id !== undefined && o.id !== null && o.id !== ''))
        return { error: 'Hay registros inválidos en "' + k + '" (cada uno debe tener un id).' };
    }
    return { datos: j.datos };
  }

  async function importar(texto) {
    const v = validar(texto);
    if (v.error) return { ok: false, error: v.error };
    try { await (await lista()).reemplazar(v.datos); } catch (e) { return { ok: false, error: 'No se pudo guardar el respaldo en este dispositivo.' }; }
    return { ok: true };
  }

  async function migrarLS() {
    if (lsGet(K_MIGRADO)) return 0;
    const crudo = lsGet(K_V1);
    let viejos = [];
    try { const p = crudo ? JSON.parse(crudo) : []; viejos = Array.isArray(p) ? p : []; } catch (e) { viejos = []; }
    let n = 0;
    for (const e of viejos) {
      if (!e || typeof e !== 'object') continue;
      const est = e.estado && typeof e.estado === 'object' ? e.estado : {};
      const gid = est.gid || e.gid || e.genetica || null;
      const aves = Number(est.aves !== undefined ? est.aves : (e.avesInicio !== undefined ? e.avesInicio : e.aves));
      let gNombre = gid;
      try { const g = typeof GENETICAS !== 'undefined' && GENETICAS.find(x => x.id === gid); if (g) gNombre = g.nombre; } catch (x) { /* sin catálogo */ }
      const fecha = typeof e.fecha === 'string' ? e.fecha.slice(0, 10) : '';
      const nombre = [gNombre || 'Lote anterior', fecha].filter(Boolean).join(' · ');
      await guardar('lotes', {
        id: 'ls-' + (e.id !== undefined ? e.id : nuevoId()),
        nombre, genetica: gid, avesInicio: isFinite(aves) ? aves : 0,
        fechaLlegada: fecha || null, estado: 'cerrado', origen: 'v1', resumen: e.resumen || ''
      });
      n++;
    }
    lsSet(K_MIGRADO, '1');
    return n;
  }

  return { abrir, listar, obtener, guardar, borrar, exportar, importar, migrarLS, STORES };
})();

</script>
<script>
/* =========================================================================
   APPOLLO · Interfaz
   ========================================================================= */
(function () {
  'use strict';

  /* ----------------------- Almacenamiento local ----------------------- */
  const LS = {
    get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }
  };
  const K_ESTADO = 'appollo.v1.estado', K_LOTES = 'appollo.v1.lotes', K_PRECIOS = 'appollo.v1.precios';
  const BASE = { gid: null, obj: 'huevos', edad: null, unidad: 'semanas', aves: 100, alt: 2800, real: null, fin: null, sel: [], enf: null, filtro: 'todas' };
  const S = Object.assign({}, BASE, LS.get(K_ESTADO, {}));
  const precios = Object.assign({ cubeta: '', kgVivo: '', kgAlim: '' }, LS.get(K_PRECIOS, {}));
  const guardar = () => LS.set(K_ESTADO, S);

  /* ------------------------------ Útiles ------------------------------ */
  const $ = (s, el = document) => el.querySelector(s);
  const view = $('#view'), barra = $('#barra'), top = $('#top');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ic = (n, extra = '') => `<svg class="ic ${extra}" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
  const huevo = (cls = '') => `<svg viewBox="0 0 20 24" aria-hidden="true" class="${cls}"><path class="egg-shell" d="M10 1.5C5.2 1.5 1.8 9 1.8 14.2 1.8 19 5.4 22.5 10 22.5s8.2-3.5 8.2-8.3C18.2 9 14.8 1.5 10 1.5z"/><circle class="egg-yolk" cx="10" cy="14.6" r="4.3"/></svg>`;
  const gen = () => GENETICAS.find(g => g.id === S.gid);
  const modo = () => { const g = gen(); return g ? modoDe(g, S.obj) : 'huevos'; };
  const dias = () => { const e = Number(S.edad); if (!isFinite(e)) return NaN; return Math.round(S.unidad === 'semanas' ? e * 7 : e); };
  const plural = (n, s, p) => `${fmt(n, n % 1 ? 1 : 0)} ${n === 1 ? s : p}`;
  const edadTxt = () => S.unidad === 'semanas' ? plural(Number(S.edad), 'semana', 'semanas') : plural(Number(S.edad), 'día', 'días');
  const edadCorta = d => d <= 56 ? `Día ${d}` : `Sem. ${Math.round(d / 7)}`;

  function maxDias() {
    const g = gen(); if (!g) return 0;
    return modo() === 'huevos' ? 693 : g.carne.rango[1] - 1;
  }
  function errorEdad() {
    const d = dias();
    if (S.edad === null || S.edad === '' || !isFinite(d)) return 'Escribe la edad de las aves.';
    if (d < 0) return 'La edad no puede ser negativa.';
    if (d > maxDias()) return modo() === 'huevos' ? 'Para proyectar, la edad debe ser menor a 99 semanas.' : `La edad supera la edad máxima de venta (${gen().carne.rango[1]} días).`;
    return '';
  }
  const avesOk = () => Number.isFinite(S.aves) && S.aves >= 1 && S.aves <= 1000000;
  const loteValido = () => gen() && !errorEdad() && avesOk();

  function opcionesFin() {
    const g = gen(), d = dias();
    if (modo() === 'huevos') {
      const o = [72, 80, 90, 100].map(w => w * 7).filter(x => x > d + 6);
      return o.length ? o : [700];
    }
    const o = [];
    for (let x = g.carne.rango[0]; x <= g.carne.rango[1]; x += 7) if (x > d) o.push(x);
    return o.length ? o : [g.carne.rango[1]];
  }
  function dFin() {
    const g = gen(), ops = opcionesFin();
    const def = modo() === 'huevos' ? g.postura.fin * 7 : g.carne.venta;
    if (S.fin && ops.includes(S.fin)) return S.fin;
    if (ops.includes(def)) return def;
    return ops[0];
  }
  function realVisible() {
    const g = gen(), d = dias();
    if (modo() === 'huevos') return d >= (g.postura.w50 - 1) * 7;
    return d >= 3;
  }
  function estado() {
    const g = gen();
    const real = realVisible() && S.real !== null && S.real !== '' && isFinite(Number(S.real)) ? Number(S.real) : null;
    return { g, modo: modo(), dias: dias(), dFin: dFin(), aves: Math.round(S.aves), alt: Number(S.alt) || 0, enf: S.enf, real };
  }
  const selSet = () => new Set(S.sel);

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2200);
  }

  /* ------------------------------ Rutas ------------------------------ */
  const RUTAS = ['genetica', 'lote', 'manejo', 'proyeccion', 'lotes'];
  let rutaActual = null;
  function ruta() {
    let r = location.hash.slice(1);
    if (!RUTAS.includes(r)) r = 'genetica';
    if ((r === 'lote' || r === 'manejo' || r === 'proyeccion') && !gen()) r = 'genetica';
    if ((r === 'manejo' || r === 'proyeccion') && !loteValido()) r = 'lote';
    return r;
  }
  function ir(r) {
    if (location.hash.slice(1) !== r) location.hash = r;
    else render();
  }
  window.addEventListener('hashchange', () => render());

  function render(mantenerScroll) {
    const r = ruta();
    const y = window.scrollY;
    top.innerHTML = cabecera(r);
    view.innerHTML = PANTALLAS[r]();
    const b = BARRAS[r]();
    barra.innerHTML = b ? `<div class="barra-in">${b}</div>` : '';
    barra.hidden = !b;
    if (r !== rutaActual) { window.scrollTo(0, 0); rutaActual = r; }
    else if (mantenerScroll) window.scrollTo(0, y);
    if (r === 'lote') vivoLote();
    document.documentElement.style.setProperty('--top-h', top.offsetHeight + 'px');
    const res = document.querySelector('.resumen-manejo');
    if (res) document.documentElement.style.setProperty('--res-h', res.offsetHeight + 'px');
  }

  /* ----------------------------- Cabecera ----------------------------- */
  function cabecera(r) {
    const atras = { lote: 'genetica', manejo: 'lote', proyeccion: 'manejo', lotes: gen() && loteValido() ? 'proyeccion' : 'genetica' }[r];
    const nLotes = LS.get(K_LOTES, []).length;
    const pasos = [['genetica', 'Genética'], ['lote', 'Lote'], ['manejo', 'Manejo'], ['proyeccion', 'Proyección']];
    const idx = pasos.findIndex(p => p[0] === r);
    const puede = k => k === 'genetica' || (k === 'lote' && gen()) || ((k === 'manejo' || k === 'proyeccion') && loteValido());
    return `
      <div class="top-row">
        ${atras ? `<button class="icon-btn solo" data-act="ir" data-r="${atras}" aria-label="Volver">${ic('atras')}</button>` : ''}
        <div class="marca">${huevo('logo')}<span>Appollo</span></div>
        <button class="icon-btn" data-act="ir" data-r="lotes" aria-label="Mis lotes guardados">${ic('lotes')}<span>Mis lotes${nLotes ? ` · ${nLotes}` : ''}</span></button>
      </div>
      ${r === 'lotes' ? '' : `<ol class="huevera" aria-label="Pasos">
        ${pasos.map((p, i) => `<li class="${i < idx ? 'hecho' : i === idx ? 'actual' : ''}"><button data-act="ir" data-r="${p[0]}" ${puede(p[0]) ? '' : 'disabled'} ${i === idx ? 'aria-current="step"' : ''}>${huevo()}<span>${p[1]}</span></button></li>`).join('')}
      </ol>`}`;
  }

  /* ========================= 1 · GENÉTICA ========================= */
  function pantGenetica() {
    const filtros = [['todas', 'Todas'], ['postura', 'Postura'], ['carne', 'Carne'], ['doble', 'Doble propósito'], ['criolla', 'Criolla']];
    return `<section class="screen">
      <div class="intro"><span class="eyebrow">Paso 1 de 4</span>
        <h1>¿Qué gallinas vas a manejar?</h1>
        <p class="lead">Elige la genética. Cada línea tiene su propio estándar de producción y sus recomendaciones.</p></div>
      <div class="chips" role="group" aria-label="Filtrar por tipo">

  /* =========================== 2 · LOTE =========================== */
  function presetsEdad() {

    if (esBroiler(g)) return [1, 7, 14, 21, 28, 35].map(d => [d, 'dias', d === 1 ? '1 día' : `${d} días`]);
    if (g.id === 'campero') return [1, 14, 28, 42, 56].map(d => [d, 'dias', d === 1 ? '1 día' : `${d} días`]);
    return [[1, 'dias', '1 día'], [4, 'semanas', '4 sem'], [8, 'semanas', '8 sem'], [12, 'semanas', '12 sem'], [16, 'semanas', '16 sem']];
  }

  function vivoLote() {
