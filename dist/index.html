<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Appollo</title>
<meta name="description" content="Manejo de gallinas por genética y proyección de huevos o carne. Funciona sin internet.">
<meta name="theme-color" content="#17201B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
@font-face { font-family: "Atkinson Hyperlegible"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Zilla Slab"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/zilla-slab-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Zilla Slab"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/zilla-slab-latin-700-normal.woff2) format("woff2"); }
</style>
<style>
/* Appollo 2 · Sistema visual
   Campo andino: papel crema, verde de potrero, tierra, yema de huevo y cielo.
   Todo par de texto/fondo cumple WCAG >= 7:1 (claro y oscuro). Los tonos "-viva" son
   solo decoración (franjas, puntos, líneas) y nunca llevan texto encima salvo --huevo. */

/* ---------- Tipografía (las @font-face las inserta build.py) ---------- */
:root {
  --f-texto: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-titulo: "Zilla Slab", "Roboto Slab", Rockwell, Georgia, serif;
  --dur: 220ms;
  --curva: cubic-bezier(.2, .7, .2, 1);
  --rebote: cubic-bezier(.34, 1.4, .5, 1);
  --r-s: 12px;
  --r: 18px;
  --r-l: 26px;
}

/* ---------- Tema claro (por defecto) ---------- */
:root, [data-tema="claro"] {
  --fondo: #F6F1E7;
  --superficie: #FFFDF8;
  --superficie-2: #EFE6D6;
  --linea: #E2D6C2;
  --linea-fuerte: #CDBDA4;
  --texto: #2B2118;
  --secundario: #5D4E3F;      /* spec #6B5A48 -> 7:1 sobre fondo */
  --primario: #285A31;        /* spec #2F6B3A -> 7:1 con texto crema encima */
  --primario-suave: #E3ECDC;
  --sobre-primario: #FFFDF8;
  --huevo: #E8A317;
  --huevo-suave: #FBEBC4;
  --sobre-huevo: #2B2118;
  --cielo: #4A90B8;
  --alerta: #902F23;          /* spec #B23A2B -> 7:1 */
  --sobre-alerta: #FFFDF8;
  --precaucion: #724708;      /* spec #C77C0E -> 7:1 como texto */
  --ok: #285A31;
  --alerta-viva: #B23A2B;
  --precaucion-viva: #C77C0E;
  --ok-viva: #3D8A4A;
  --velo: rgba(43, 33, 24, .52);
  --sombra: 0 1px 0 rgba(93, 78, 63, .08), 0 8px 22px -12px rgba(93, 78, 63, .35);
  --sombra-alta: 0 -10px 40px -10px rgba(43, 33, 24, .35);
  --brillo-esq: rgba(255, 253, 248, .75);
  color-scheme: light;
}

/* ---------- Tema oscuro: noche en el galpón (verde muy oscuro, tierra, texto crema) ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --fondo: #121A14; --superficie: #1B241D; --superficie-2: #26322A; --linea: #2F3B31; --linea-fuerte: #46553F;
    --texto: #F3EBDD; --secundario: #BFB09E; --primario: #7CC88A; --primario-suave: #203327; --sobre-primario: #0F1A11;
    --huevo: #E8A317; --huevo-suave: #3A2E14; --sobre-huevo: #1A140D; --cielo: #6FAAD0;
    --alerta: #EBA197; --sobre-alerta: #1F0E0B; --precaucion: #F0A53A; --ok: #7CC88A;
    --alerta-viva: #E0705F; --precaucion-viva: #E8A33A; --ok-viva: #5FAE6E;
    --velo: rgba(5, 9, 6, .66); --sombra: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 24px -14px rgba(0, 0, 0, .8);
    --sombra-alta: 0 -10px 40px -10px rgba(0, 0, 0, .7); --brillo-esq: rgba(243, 235, 221, .07);
    color-scheme: dark;
  }
}
[data-tema="oscuro"] {
  --fondo: #121A14; --superficie: #1B241D; --superficie-2: #26322A; --linea: #2F3B31; --linea-fuerte: #46553F;
  --texto: #F3EBDD; --secundario: #BFB09E; --primario: #7CC88A; --primario-suave: #203327; --sobre-primario: #0F1A11;
  --huevo: #E8A317; --huevo-suave: #3A2E14; --sobre-huevo: #1A140D; --cielo: #6FAAD0;
  --alerta: #EBA197; --sobre-alerta: #1F0E0B; --precaucion: #F0A53A; --ok: #7CC88A;
  --alerta-viva: #E0705F; --precaucion-viva: #E8A33A; --ok-viva: #5FAE6E;
  --velo: rgba(5, 9, 6, .66); --sombra: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 24px -14px rgba(0, 0, 0, .8);
  --sombra-alta: 0 -10px 40px -10px rgba(0, 0, 0, .7); --brillo-esq: rgba(243, 235, 221, .07);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--fondo); color: var(--texto);
  font-family: var(--f-texto); font-size: 18px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
[data-tema] { background: var(--fondo); color: var(--texto); }
h1, h2, .titulo { font-family: var(--f-titulo); font-weight: 700; line-height: 1.15; letter-spacing: -.01em; margin: 0; }
h1 { font-size: 2rem; }
h2 { font-size: 1.5rem; font-weight: 600; }
h3 { font-family: var(--f-texto); font-size: 1rem; font-weight: 700; margin: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--huevo); outline-offset: 3px; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.solo-lector { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Botón ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 12px 22px; border-radius: var(--r);
  font-family: var(--f-texto); font-size: 1rem; font-weight: 700; line-height: 1.2; text-align: center;
  border: 2px solid transparent; text-decoration: none; user-select: none; touch-action: manipulation;
  transition: transform var(--dur) var(--curva), box-shadow var(--dur) var(--curva), background-color var(--dur) var(--curva);
}
.btn:active { transform: translateY(2px); }
.btn-primario {
  background: var(--primario); color: var(--sobre-primario);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22), inset 0 1px 0 rgba(255, 255, 255, .14), var(--sombra);
}
.btn-primario:active { box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .22), var(--sombra); }
.btn-secundario { background: var(--superficie); color: var(--primario); border-color: var(--primario); }
.btn-secundario:active { background: var(--primario-suave); }
.btn-peligro {
  background: var(--alerta); color: var(--sobre-alerta);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22), var(--sombra);
}
.btn-ancho { display: flex; width: 100%; }

/* ---------- Tarjeta ---------- */
.tarjeta {
  position: relative; overflow: hidden;
  background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--r-l);
  padding: 16px 18px 18px 22px; box-shadow: var(--sombra);
}
.tarjeta::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--linea-fuerte); }
.tarjeta-verde::before { background: var(--ok-viva); }
.tarjeta-ambar::before { background: var(--precaucion-viva); }
.tarjeta-rojo::before { background: var(--alerta-viva); }
.tarjeta-cab { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.tarjeta-icono {
  display: grid; place-items: center; width: 40px; height: 40px; flex: none;
  border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%; /* forma de huevo */
  background: var(--primario-suave); color: var(--primario);
}
.tarjeta-ambar .tarjeta-icono { background: var(--huevo-suave); color: var(--precaucion); }
.tarjeta-rojo .tarjeta-icono { background: color-mix(in srgb, var(--alerta-viva) 16%, var(--superficie)); color: var(--alerta); }
.tarjeta-titulo { flex: 1; min-width: 0; color: var(--secundario); font-size: 1rem; font-weight: 700; }
.tarjeta-valor { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 8px; margin-top: 6px; }
.tarjeta-cifra { font-family: var(--f-titulo); font-weight: 700; font-size: 2.5rem; line-height: 1.05; letter-spacing: -.02em; color: var(--texto); }
.tarjeta-unidad { color: var(--secundario); font-size: 1rem; font-weight: 700; }
.tarjeta-pie { margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--linea-fuerte); color: var(--secundario); font-size: 1rem; }
.tarjeta.pop { animation: pop 420ms var(--rebote); }

.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 2px 10px 2px 8px; border-radius: 999px; border: 2px solid currentColor;
  font-size: 1rem; font-weight: 700; line-height: 1.4; background: var(--superficie);
}
.chip-punto { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.chip-verde { color: var(--ok); }
.chip-ambar { color: var(--precaucion); }
.chip-rojo { color: var(--alerta); }
.chip-verde .chip-punto { background: var(--ok-viva); }
.chip-ambar .chip-punto { background: var(--precaucion-viva); }
.chip-rojo .chip-punto { background: var(--alerta-viva); }

/* ---------- Contador ---------- */
.contador { display: flex; align-items: stretch; gap: 8px; }
.contador-btn {
  flex: none; width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center;
  font-family: var(--f-titulo); font-size: 2.25rem; font-weight: 700; line-height: 1;
  border: 2px solid var(--primario); touch-action: manipulation;
  transition: transform var(--dur) var(--curva), background-color var(--dur) var(--curva);
}
.contador-btn:active { transform: scale(.94); }
.contador-menos { background: var(--superficie); color: var(--primario); }
.contador-mas { background: var(--primario); color: var(--sobre-primario); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22); }
.contador-valor {
  flex: 1 1 0; width: 0; min-width: 0; height: 64px; padding: 0 8px; text-align: center;
  font-family: var(--f-titulo); font-size: 2.5rem; font-weight: 700; color: var(--texto);
  background: var(--superficie); border: 2px solid var(--linea-fuerte); border-radius: 20px;
  -moz-appearance: textfield; appearance: textfield;
}
.contador-valor::-webkit-outer-spin-button, .contador-valor::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.contador-valor:focus { border-color: var(--primario); outline: none; box-shadow: 0 0 0 3px var(--huevo); }

/* ---------- Hoja inferior ---------- */
.hoja-capa { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; }
.hoja-fondo { position: absolute; inset: 0; background: var(--velo); animation: aparecer var(--dur) var(--curva) both; }
.hoja {
  position: relative; max-height: 88%; overflow: auto; overscroll-behavior: contain;
  width: 100%; max-width: 560px; margin: 0 auto;
  background: var(--superficie); color: var(--texto);
  border-radius: 28px 28px 0 0; box-shadow: var(--sombra-alta);
  padding: 8px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  animation: subir 420ms var(--rebote) both;
}
.hoja-asa { width: 44px; height: 5px; border-radius: 3px; background: var(--linea-fuerte); margin: 4px auto 12px; }
.hoja-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.hoja-titulo { font-size: 1.6rem; }
.hoja-cuerpo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.hoja-rejilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.hoja-rejilla .btn { flex-direction: column; gap: 6px; min-height: 92px; padding: 12px 8px; border-radius: 22px; }
.hoja-rejilla .btn .ic { width: 30px; height: 30px; }
.hoja-capa.cerrando .hoja { animation: bajar var(--dur) var(--curva) both; }
.hoja-capa.cerrando .hoja-fondo { animation: aparecer var(--dur) var(--curva) reverse both; }

/* ---------- Esqueleto ---------- */
.esqueleto { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.esqueleto-bloque {
  height: 96px; border-radius: var(--r-l);
  background: linear-gradient(100deg, transparent 30%, var(--brillo-esq) 50%, transparent 70%) var(--superficie-2);
  background-size: 220% 100%; animation: brillo 1.4s linear infinite;
}
.esqueleto-bloque:nth-child(3n) { height: 64px; width: 72%; }

/* ---------- Gráfico ---------- */
.grafico { position: relative; margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.grafico-svg { display: block; width: 100%; height: auto; overflow: visible; }
.grafico-rejilla { stroke: var(--linea); stroke-width: 1; }
.grafico-base { stroke: var(--linea-fuerte); stroke-width: 2; }
.grafico-real { stroke: var(--ok-viva); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 1; stroke-dashoffset: 0; animation: trazar 900ms var(--curva) both; }
.grafico-real-punto, .grafico-ultimo { fill: var(--ok-viva); stroke: var(--superficie); stroke-width: 2.5; }
.grafico-estandar { stroke: var(--cielo); stroke-width: 2.5; stroke-linecap: round; }
.grafico-estandar-punto { fill: var(--cielo); }
.grafico-ejes { display: flex; justify-content: space-between; color: var(--secundario); font-size: 1rem; }
.grafico-aviso { position: absolute; inset: 22% 0 auto; color: var(--secundario); font-size: 1rem; text-align: center; }
.grafico-leyenda { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 1rem; font-weight: 700; }
.ley { display: inline-flex; align-items: center; gap: 8px; }
.ley::before { content: ""; width: 26px; height: 0; border-top: 4px solid var(--ok-viva); border-radius: 2px; }
.ley-estandar::before { border-top: 3px dashed var(--cielo); }

/* ---------- Palomita ---------- */
.palomita { width: 72px; height: 72px; display: block; }
.palomita-circulo { fill: var(--primario-suave); stroke: var(--ok-viva); stroke-width: 3; transform-origin: 26px 26px; transform-box: view-box; }
.palomita-trazo { fill: none; stroke: var(--primario); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; }

/* ---------- Pantalla (transición de vista) ---------- */
.pantalla-entra { animation: entrar var(--dur) var(--curva) both; }

/* ---------- Shell: vista, franjas, barra inferior, toast ---------- */
.vista { display: block; overflow-x: clip; min-height: 100vh; min-height: 100dvh; padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); outline: none; }
.vista-raiz { width: 100%; max-width: 640px; margin: 0 auto; }
.pantalla { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 24px 16px 8px; }
.pantalla-texto { color: var(--secundario); }
.proximamente {
  display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px; border-radius: var(--r-l);
  background: var(--superficie); border: 2px dashed var(--linea-fuerte); color: var(--secundario);
}
.proximamente .ic { color: var(--primario); margin-top: 2px; }
.pantalla-vacia { justify-items: center; text-align: center; padding-top: 48px; gap: 18px; }
.vacia-ilustracion {
  display: grid; place-items: center; width: 112px; height: 132px; color: var(--primario);
  border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%; background: var(--primario-suave);
  box-shadow: inset 0 -8px 0 color-mix(in srgb, var(--huevo) 30%, transparent);
}
.vacia-ilustracion .ic { width: 56px; height: 56px; stroke-width: 1.6; }
.pantalla-vacia .pantalla-texto { max-width: 30ch; }
.btn-grande { min-height: 64px; font-size: 1.125rem; border-radius: 22px; }
.mas-lista { display: grid; gap: 12px; }
.btn-lista { justify-content: flex-start; min-height: 64px; padding-inline: 18px; color: var(--texto); border-color: var(--linea-fuerte); }
.btn-lista .ic { color: var(--primario); }

.vista-error { justify-items: center; text-align: center; padding-top: 48px; }
.vista-error-icono { display: grid; place-items: center; width: 88px; height: 88px; border-radius: 50%;
  background: color-mix(in srgb, var(--alerta-viva) 14%, var(--superficie)); color: var(--alerta); }
.vista-error-icono .ic { width: 44px; height: 44px; }
.vista-error p { color: var(--secundario); max-width: 32ch; }

.franjas { position: sticky; top: 0; z-index: 20; }
.franja { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 1rem; font-weight: 700; line-height: 1.35; }
.franja[hidden] { display: none; }
.franja-offline { background: var(--superficie-2); color: var(--texto); border-bottom: 1px solid var(--linea-fuerte); }
.franja-memoria { background: var(--alerta); color: var(--sobre-alerta); }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) 88px repeat(2, minmax(0, 1fr)); align-items: end; gap: 2px;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--superficie); border-top: 1px solid var(--linea); box-shadow: 0 -6px 20px -14px rgba(43, 33, 24, .5);
}
.nav-item {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px;
  min-width: 0; min-height: 64px; padding: 6px 0 4px; margin: 0; border: 0; border-radius: 16px; background: none;
  color: var(--secundario); text-decoration: none; font-size: 1rem; font-weight: 700; line-height: 1.2; letter-spacing: -.01em;
  touch-action: manipulation;
}
.nav-texto { max-width: 100%; white-space: nowrap; }
.nav-icono { position: relative; display: grid; place-items: center; width: 52px; height: 32px; border-radius: 16px;
  transition: background-color var(--dur) var(--curva); }
.nav-item[aria-current="page"] { color: var(--primario); }
.nav-item[aria-current="page"] .nav-icono { background: var(--primario-suave); }
.nav-item[aria-current="page"] .ic { stroke-width: 2.4; }
.nav-item:active .nav-icono { transform: scale(.94); }
.nav-registrar { color: var(--texto); }
.nav-circulo {
  display: grid; place-items: center; width: 64px; height: 64px; margin-top: -30px; border-radius: 50%;
  background: var(--primario); color: var(--sobre-primario); border: 4px solid var(--superficie);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22), 0 6px 16px -6px rgba(43, 33, 24, .55);
  transition: transform var(--dur) var(--rebote);
}
.nav-circulo .ic { width: 32px; height: 32px; stroke-width: 2.6; }
.nav-registrar:active .nav-circulo { transform: scale(.92); }
.nav-insignia {
  position: absolute; top: -6px; left: 30px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px;
  display: grid; place-items: center; background: var(--alerta); color: var(--sobre-alerta);
  font-size: 1rem; font-weight: 700; line-height: 1; border: 2px solid var(--superficie);
}
.nav-insignia[hidden] { display: none; }

.toast {
  position: fixed; z-index: 40; left: 12px; right: 12px; bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  max-width: 536px; margin: 0 auto; overflow: hidden;
  display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 18px; border-radius: var(--r);
  background: var(--texto); color: var(--fondo); box-shadow: var(--sombra-alta);
  animation: subir-toast 320ms var(--rebote) both;
}
.toast[hidden] { display: none; }
.toast-texto { flex: 1; min-width: 0; font-weight: 700; }
.toast:not(:has(.btn)) { padding: 16px 18px; }
.toast .btn { flex: none; background: transparent; color: inherit; border-color: currentColor; padding-inline: 18px; }
.toast .btn:active { background: color-mix(in srgb, var(--fondo) 18%, transparent); }
.toast-tiempo { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--huevo);
  transform-origin: left; animation: vaciar linear both; }

/* ---------- Registro rápido ---------- */
.reg-lote {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 14px; margin: 0;
  border-radius: var(--r); background: var(--primario-suave); color: var(--texto); border: 2px solid transparent; text-align: left;
}
.reg-lote > .ic { color: var(--primario); }
.reg-lote-texto { display: grid; flex: 1; min-width: 0; line-height: 1.25; }
.reg-lote-texto b, .reg-lote-texto span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reg-lote-texto span { font-size: 1rem; }
.reg-lote-btn { border-color: var(--primario); touch-action: manipulation; }
.reg-lote-cambiar { flex: none; font-weight: 700; color: var(--texto); text-decoration: underline; text-underline-offset: 3px; }
.reg-campo { display: grid; gap: 6px; }
.reg-etiqueta { font-weight: 700; }
.reg-ayuda, .reg-nota { color: var(--secundario); font-size: 1rem; }
.reg-select, .reg-texto {
  width: 100%; min-height: 56px; padding: 10px 14px; border-radius: var(--r-s);
  background: var(--superficie); color: var(--texto); border: 2px solid var(--linea-fuerte); font-size: 1.125rem;
}
.reg-select:focus, .reg-texto:focus { outline: none; border-color: var(--primario); box-shadow: 0 0 0 3px var(--huevo); }
.reg-opciones { display: grid; gap: 8px; }
.reg-opcion {
  display: grid; gap: 2px; min-height: 64px; padding: 10px 16px; border-radius: var(--r); text-align: left;
  background: var(--superficie); color: var(--texto); border: 2px solid var(--linea-fuerte); touch-action: manipulation;
}
.reg-opcion span { color: var(--secundario); font-size: 1rem; }
.reg-opcion[aria-pressed="true"] { border-color: var(--primario); box-shadow: inset 0 0 0 2px var(--primario); background: var(--primario-suave); }
.reg-error {
  padding: 12px 14px; border-radius: var(--r-s); font-weight: 700;
  background: color-mix(in srgb, var(--alerta-viva) 12%, var(--superficie)); color: var(--alerta); border: 2px solid var(--alerta-viva);
}
.reg-error[hidden], .reg-pregunta[hidden], .reg-acciones[hidden] { display: none; }
.reg-pregunta { display: grid; gap: 12px; padding: 14px; border-radius: var(--r); background: var(--huevo-suave); color: var(--texto); }
.reg-pregunta-botones { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.reg-acciones { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; margin-top: 4px; position: sticky; bottom: 0; }
.reg-guardar { min-height: 64px; font-size: 1.125rem; }
.reg-guardar.guardado { background: var(--primario-suave); color: var(--primario); }
.reg-guardar .palomita { width: 44px; height: 44px; }
.reg-vacio { display: grid; justify-items: center; gap: 12px; text-align: center; padding-bottom: 8px; }
.reg-vacio-titulo { font-family: var(--f-titulo); font-size: 1.5rem; font-weight: 700; }
.reg-vacio .btn { margin-top: 4px; }

@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
@keyframes subir { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes bajar { from { transform: translateY(0); } to { transform: translateY(100%); } }
@keyframes entrar { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes brillo { from { background-position: 120% 0; } to { background-position: -120% 0; } }
@keyframes trazar { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes subir-toast { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes vaciar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* =========================================================================

   ========================================================================= */

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function interp(xs, ys, x) {
  const n = xs.length;
  if (x <= xs[0]) return ys[0];
  if (x >= xs[n - 1]) {
    const s = (ys[n - 1] - ys[n - 2]) / (xs[n - 1] - xs[n - 2]);
    return ys[n - 1] + s * (x - xs[n - 1]) * 0.85;
  }
  for (let i = 1; i < n; i++) {
    if (x <= xs[i]) {
      const t = (x - xs[i - 1]) / (xs[i] - xs[i - 1]);
      return ys[i - 1] + t * (ys[i] - ys[i - 1]);
    }
  }
  return ys[n - 1];
}

const modoDe = (g, obj) => g.tipo === 'postura' ? 'huevos' : g.tipo === 'carne' ? 'carne' : (obj || 'huevos');
const esBroiler = g => g.id === 'cobb500' || g.id === 'ross308';

/* ------------------------------ Curvas ------------------------------ */
function hdStd(p, w, shift = 0) {
  const L = 1 / (1 + Math.exp(-p.k * (w - (p.w50 + shift))));
  let v = p.pico * L;
  const pl = p.plat + shift;
  if (w > pl) v -= p.dec * (w - pl);
  return Math.max(0, v);
}
function ewStd(p, w, shift = 0) {
  const t = Math.max(0, w - (p.w50 + shift));
  return p.ewMax - (p.ewMax - p.ew0) * Math.exp(-p.ewc * t);
}
function consumoPostura(g, w) {
  const p = g.postura, f = g.cria.factor;

  if (w >= finRampa) return p.cons;
  return ini + (p.cons - ini) * (w - 18) / (finRampa - 18);

  if (d <= 84) return { id: 'crec', n: 'Crecimiento', r: '7–12 semanas' };
  return { id: 'fin', n: 'Engorde y acabado', r: 'más de 12 semanas' };
}

/* --------------------------- Ambiente --------------------------- */
function tempRango(g, modo, d) {
  if (modo === 'carne') {
    const xs = [0, 3, 7, 14, 21, 28, 35, 42];
    if (d <= 42) return [Math.round(interp(xs, [32, 31, 29, 27, 24, 22, 20, 19], d)), Math.round(interp(xs, [33, 32, 30, 28, 26, 24, 22, 21], d))];
    return g.tipo === 'carne' && esBroiler(g) ? [18, 21] : [16, 24];
  }
  const xs = [0, 4, 7, 14, 21, 28, 35, 42];
  if (d <= 42) return [Math.round(interp(xs, [33, 31, 29, 27, 25, 23, 21, 19], d)), Math.round(interp(xs, [35, 32, 31, 29, 27, 25, 23, 21], d))];
  if (g.tipo === 'criolla' || g.tipo === 'doble') return [15, 26];
  return d < 126 ? [18, 22] : [18, 24];
}
function humedadRango(modo, d) {
  if (d <= 3) return [60, 70];
  if (d <= 14) return [55, 65];
  return modo === 'carne' ? [50, 65] : [45, 65];
}
function consumoDia(g, modo, d) {
  return modo === 'huevos' ? consumoPostura(g, d / 7) : consumoCarne(g.carne, d);
}

/* ----------------------- Factores de manejo ----------------------- */
function factores(st, manejo, sel) {
  const g = st.g, modo = st.modo;
  let f = 1, mortExtra = 0, pesoTot = 0, pesoCub = 0;
  const faltan = [];
  for (const c of manejo.cats) {
    if (!c.items) continue;
    for (const it of c.items) {
      if (it.especial) continue;
      const peso = it.prod + 1.5 * it.mort;
      pesoTot += peso;
      if (sel.has(it.id)) { pesoCub += peso; continue; }
      f *= 1 - it.prod / 100;
      mortExtra += it.mort;
      faltan.push({ id: it.id, n: it.n, cat: c.n });
    }
  }
  // Problema sanitario
  const enf = ENFERMEDADES.find(e => e.id === st.enf);
  let mit = 0;
  if (enf) {
    let resto = 1;
    for (const t of [...enf.caseros, ...enf.quimicos]) if (sel.has(t.id)) resto *= 1 - t.mit;
    mit = Math.min(0.9, 1 - resto);
    f *= 1 - enf.prod * (1 - mit) / 100;
    mortExtra += enf.mort * (1 - mit);
    const peso = enf.prod + 1.5 * enf.mort;
    pesoTot += peso; pesoCub += peso * mit;
  } else {
    let bono = 0;
    for (const p of PREVENTIVOS_CASEROS) if (sel.has(p.id)) bono += p.prod;
    f *= 1 + Math.min(1, bono) / 100;
  }
  // Altitud
  let altPeso = 0, altMort = 0;
  if (modo === 'carne' && st.alt > 1500) {
    const broiler = esBroiler(g);
    altPeso = (st.alt - 1500) / 1000 * (broiler ? 6 : 2);
    altMort = st.alt > 2000 ? (st.alt - 2000) / 1000 * (broiler ? 6 : 1.5) : 0;
    if (sel.has('t_asc')) { altMort *= 0.4; altPeso += 1; }
  } else if (modo === 'huevos' && st.alt > 2000) {
    altPeso = (st.alt - 2000) / 1000 * 1.5;
  }
  f *= 1 - altPeso / 100;
  mortExtra += altMort;
  f = clamp(f, 0.3, 1.02);
  // Retraso del inicio de postura por mala recría
  let shift = 0;
  if (modo === 'huevos' && st.dias / 7 < g.postura.w50 - 2) shift = (1 - f) * 5;
  const indice = pesoTot ? Math.round(100 * pesoCub / pesoTot) : 100;
  return { f, mortExtra, shift, indice, enf, mit, altPeso, altMort, faltan };
}

/* ---------------------------- Simulaciones ---------------------------- */
function simHuevos(st, F) {
  const g = st.g, p = g.postura;
  const fObj = F.f * (g.campo || 1);
  const d0 = st.dias, dFin = st.dFin;
  const w0 = d0 / 7;
  let f0 = fObj;
  const std0 = hdStd(p, w0, F.shift);
  if (st.real != null && std0 > 10) f0 = clamp(st.real / std0, 0.1, 1.15);
  const dias = Math.max(1, dFin - d0);
  const extraDia = (F.mortExtra / 100) * Math.min(1, dias / 300) / dias;
  let vivas = st.aves, huevos = 0, masa = 0, alimento = 0, alimRecria = 0;
  let pico = 0, wPico = 0, w50 = null;
  const serie = [];
  for (let d = d0; d < dFin; d++) {
    const w = (d + 0.5) / 7, t = d - d0;
    const fh = fObj + (f0 - fObj) * Math.exp(-t / 28);
    const hd = hdStd(p, w, F.shift) * fh;
    if (hd > pico) { pico = hd; wPico = w; }
    if (w50 === null && hd >= 50) w50 = w;
    const e = vivas * hd / 100;
    huevos += e;
    masa += e * ewStd(p, w, F.shift) * (1 - (1 - fh) * 0.25);
    const kg = vivas * consumoPostura(g, w) * (0.97 + 0.03 * fh) / 1000;
    alimento += kg;
    if (w < 18) alimRecria += kg;
    const mBase = d < 126 ? (1 - g.cria.viab / 100) / 126 : p.m / 7;
    vivas *= 1 - mBase - extraDia;
    if ((d - d0) % 7 === 0) serie.push({ w: d / 7, hd });
  }
  const est = [];
  for (let w = Math.max(16, Math.floor(w0) - 2); w <= dFin / 7; w++) est.push({ w, hd: hdStd(p, w) });
  const hdHoy = hdStd(p, w0 + 0.5 / 7, F.shift) * f0;
  return {
    tipo: 'huevos', huevos, huevosAve: huevos / st.aves, masaKg: masa / 1000, alimento, alimRecria,
    pesoHuevo: huevos ? masa / huevos : 0, conversion: masa ? (alimento - alimRecria) / (masa / 1000) : 0,
    kgDocena: huevos ? (alimento - alimRecria) / (huevos / 12) : 0, cubetas: huevos / 30,
    vivasFin: vivas, viab: 100 * vivas / st.aves, pico, wPico, w50, hdHoy, serie, est
  };
}

function simCarne(st, F) {
  const g = st.g, c = g.carne;
  const fObj = F.f * (g.campo || 1);
  const d0 = st.dias, dFin = st.dFin;
  const fPasado = 1 - (1 - fObj) * Math.min(1, d0 / 14);
  let peso = st.real != null && st.real > 0 ? st.real : pesoStd(c, d0) * fPasado;
  const peso0 = peso;
  const dias = Math.max(1, dFin - d0);
  const mBaseDia = c.mortBase / 100 / c.ciclo;
  const extraDia = (F.mortExtra / 100) * Math.min(1, dias / c.ciclo) / dias;
  let vivas = st.aves, alimento = 0, avesDia = 0;
  const desperdicio = 1 + (1 - F.f) * 0.35;
  const serie = [{ d: d0, p: peso }];
  for (let d = d0; d < dFin; d++) {
    const ratio = peso / pesoStd(c, d);
    const gan = (pesoStd(c, d + 1) - pesoStd(c, d)) * fObj * Math.pow(clamp(ratio, 0.4, 1.3), 0.3);
    alimento += vivas * consumoCarne(c, d) * Math.pow(clamp(ratio, 0.4, 1.3), 0.75) * desperdicio / 1000;
    avesDia += vivas;
    peso += gan;
    vivas *= 1 - mBaseDia - extraDia;
    serie.push({ d: d + 1, p: peso });
  }
  const avesProm = avesDia / dias;
  const alimAve = alimento / avesProm;
  const previo = consAcumStd(c, d0) * Math.pow(clamp(peso0 / pesoStd(c, d0), 0.4, 1.3), 0.75) / 1000;
  const caAcum = (previo + alimAve) / (peso / 1000);
  const caPeriodo = alimAve / Math.max(0.01, (peso - peso0) / 1000);
  const viabPrev = 1 - c.mortBase / 100 * Math.min(1, d0 / c.ciclo);
  const viab = 100 * viabPrev * vivas / st.aves;
  const kgVivo = vivas * peso / 1000;
  const iep = dFin > 0 ? (viab * (peso / 1000)) / (dFin * caAcum) * 100 : 0;
  const est = [];
  const dMax = Math.max(dFin, c.venta);
  for (let d = 0; d <= dMax; d += 1) est.push({ d, p: pesoStd(c, d) });
  return {
    tipo: 'carne', pesoFin: peso, pesoStdFin: pesoStd(c, dFin), peso0, kgVivo, kgCanal: kgVivo * c.rend / 100,
    alimento, caAcum, caPeriodo, vivasFin: vivas, viab, iep, serie, est
  };
}

function proyectar(st, manejo, sel) {
  const F = factores(st, manejo, sel);
  const r = st.modo === 'huevos' ? simHuevos(st, F) : simCarne(st, F);
  r.F = F;
  return r;
}

/* Cuánto gana el lote si agrega cada práctica que falta */
function brechas(st, manejo, sel, base) {
  const out = [];
  const valor = r => r.tipo === 'huevos' ? r.huevos : r.kgVivo;
  const v0 = valor(base);
  for (const fz of base.F.faltan) {
    const s2 = new Set(sel); s2.add(fz.id);
    const v = valor(proyectar(st, manejo, s2));
    if (v - v0 > 0.0005 * Math.max(1, v0)) out.push({ ...fz, gana: v - v0 });
  }
  return out.sort((a, b) => b.gana - a.gana);
}

/* ------------------------------ Formato ------------------------------ */
function fmt(x, dec = 0) {
  if (!isFinite(x)) return '—';
  return x.toLocaleString('es-EC', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

if (typeof module !== 'undefined') module.exports = { hdStd, ewStd, consumoPostura, pesoStd, caStd, construirManejo, factores, proyectar, brechas, simHuevos, simCarne, modoDe, fase, fmt };

<script>
/* =========================================================================
   APPOLLO · Cálculos puros de lote (sin DOM, sin almacenamiento)
   Fechas: cadenas locales 'YYYY-MM-DD'. Nunca se usa toISOString().
   ========================================================================= */

function fechaADate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function hoyLocal(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/* Edad en días = edad al llegar + días enteros transcurridos desde la llegada. */
function edadDias(lote, fecha) {
  const a = fechaADate(lote.fechaLlegada), b = fechaADate(fecha);
  // UTC solo para contar días enteros sin que el cambio de hora afecte el resultado
  const dias = Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) -
    Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
  return lote.edadLlegadaDias + dias;
}

const _genDe = lote => GENETICAS.find(g => g.id === lote.genetica);
const _esCarne = g => modoDe(g) === 'carne';
const _delLote = (lote, registros, tipo) =>
  registros.filter(r => r.loteId === lote.id && r.tipo === tipo);
const _suma = (rs, campo) => rs.reduce((s, r) => s + (Number(r.datos && r.datos[campo]) || 0), 0);

function mortalidadTotal(lote, registros, fecha) {
  return _suma(_delLote(lote, registros, 'mortalidad').filter(r => r.fecha <= fecha), 'cantidad');
}

function avesVivas(lote, registros, fecha) {
  return lote.avesInicio - mortalidadTotal(lote, registros, fecha);
}

function mortalidadPct(lote, registros, fecha) {
  if (!(lote.avesInicio > 0)) return null;
  return 100 * mortalidadTotal(lote, registros, fecha) / lote.avesInicio;
}

function viabilidad(lote, registros, fecha) {
  const m = mortalidadPct(lote, registros, fecha);
  return m === null ? null : 100 - m;
}

/* Valores de referencia del día para `aves` aves (por defecto avesInicio).
   `altitud` se acepta por compatibilidad de firma; el estándar de guía no la usa. */
function estandarDia(lote, fecha, altitud, aves) {
  const g = _genDe(lote), d = edadDias(lote, fecha);
  const n = aves == null ? lote.avesInicio : aves;
  if (_esCarne(g)) {
    const c = g.carne;
    return {
      alimentoKg: n * consumoCarne(c, d) / 1000,
      huevos: 0, hdPct: null,
      pesoG: pesoStd(c, d),
      mortEsperada: c.mortBase / c.ciclo // % diario
    };
  }
  const p = g.postura, w = d / 7;
  const hd = hdStd(p, w);
  return {
    alimentoKg: n * consumoPostura(g, w) / 1000,
    huevos: n * hd / 100,
    hdPct: hd,
    pesoG: ewStd(p, w), // peso del huevo (g)
    mortEsperada: p.m / 7 * 100 // % diario
  };
}

function pctPostura(lote, registros, fecha) {
  const vivas = avesVivas(lote, registros, fecha);
  if (!(vivas > 0)) return null;
  const hs = _delLote(lote, registros, 'huevos').filter(r => r.fecha === fecha);
  if (!hs.length) return null;
  return 100 * _suma(hs, 'cantidad') / vivas;
}

/* Postura: kg de alimento del día / kg de huevo del día (peso de huevo de guía).
   Carne: alimento acumulado / kg vivos (último peso registrado × aves vivas). */
function conversion(lote, registros, fecha) {
  const vivas = avesVivas(lote, registros, fecha);
  if (!(vivas > 0)) return null;
  const g = _genDe(lote);
  if (_esCarne(g)) {
    const alim = _suma(_delLote(lote, registros, 'alimento').filter(r => r.fecha <= fecha), 'kg');
    const ps = _delLote(lote, registros, 'peso').filter(r => r.fecha <= fecha).sort((a, b) => a.fecha < b.fecha ? -1 : 1);
    if (!ps.length || !alim) return null;
    const kgVivo = vivas * (Number(ps[ps.length - 1].datos.gramos) || 0) / 1000;
    return kgVivo > 0 ? alim / kgVivo : null;
  }
  const alim = _suma(_delLote(lote, registros, 'alimento').filter(r => r.fecha === fecha), 'kg');
  const huevos = _suma(_delLote(lote, registros, 'huevos').filter(r => r.fecha === fecha), 'cantidad');
  const kgHuevo = huevos * ewStd(g.postura, edadDias(lote, fecha) / 7) / 1000;
  return alim > 0 && kgHuevo > 0 ? alim / kgHuevo : null;
}

/* Real ÷ estándar × 100. Postura: % postura vs HD estándar. Carne: último peso vs peso estándar. */
function rendimiento(lote, registros, fecha) {
  const g = _genDe(lote), e = estandarDia(lote, fecha);
  if (_esCarne(g)) {
    const ps = _delLote(lote, registros, 'peso').filter(r => r.fecha <= fecha).sort((a, b) => a.fecha < b.fecha ? -1 : 1);
    if (!ps.length || !(e.pesoG > 0)) return null;
    return 100 * (Number(ps[ps.length - 1].datos.gramos) || 0) / e.pesoG;
  }
  const real = pctPostura(lote, registros, fecha);
  return real === null || !(e.hdPct > 0) ? null : 100 * real / e.hdPct;
}

/* ---------------------- Validación de un registro ----------------------
   validarRegistro(tipo, datos, lote, registros, fecha) -> {ok, mensaje?, duplicado?}
   `duplicado` (con ok:true) avisa que ya existe un registro del mismo lote, tipo y día. */
const TIPOS_DIARIOS = ['alimento', 'huevos', 'mortalidad', 'peso'];

function fechaValida(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  return hoyLocal(fechaADate(s)) === s; // descarta 2026-02-30, mes 13, etc.
}

function validarRegistro(tipo, datos, lote, registros, fecha) {
  const no = mensaje => ({ ok: false, mensaje });
  const d = datos || {}, regs = registros || [];
  const entero = x => x !== '' && x !== null && x !== undefined && Number.isInteger(Number(x));
  const texto = x => typeof x === 'string' && x.trim() !== '';
  if (!lote) return no('Elige un lote');
  if (!fechaValida(fecha)) return no('La fecha no es válida');
  if (fecha > hoyLocal()) return no('La fecha no puede ser futura');
  if (fechaValida(lote.fechaLlegada) && fecha < lote.fechaLlegada)
    return no('La fecha es anterior a la llegada del lote (' + lote.fechaLlegada + ')');

  switch (tipo) {
    case 'mortalidad': {
      if (!entero(d.cantidad) || Number(d.cantidad) < 1) return no('Las aves muertas deben ser un número entero de 1 o más');
      const vivas = Math.max(0, avesVivas(lote, regs, fecha));
      if (Number(d.cantidad) > vivas) return no('Solo quedan ' + vivas + ' aves en el lote');
      break;
    }
    case 'alimento':
      if (!(Number.isFinite(Number(d.kg)) && Number(d.kg) > 0) || d.kg === null || d.kg === '') return no('Los kilos de alimento deben ser mayores que 0');
      break;
    case 'huevos':
      if (!entero(d.cantidad) || Number(d.cantidad) < 0) return no('Los huevos deben ser un número entero de 0 o más');
      if (d.rotos !== undefined && d.rotos !== null && d.rotos !== '') {
        if (!entero(d.rotos) || Number(d.rotos) < 0) return no('Los huevos rotos deben ser un número entero de 0 o más');
        if (Number(d.rotos) > Number(d.cantidad)) return no('Los huevos rotos no pueden ser más que los recogidos');
      }
      break;
    case 'peso':
      if (!(Number.isFinite(Number(d.gramos)) && Number(d.gramos) > 0) || d.gramos === null || d.gramos === '') return no('El peso debe ser mayor que 0 gramos');
      break;
    case 'vacuna':
      if (!texto(d.nombre)) return no('Escribe el nombre de la vacuna');
      break;
    case 'sanidad':
      if (!texto(d.enfermedad) && !texto(d.tratamiento)) return no('Escribe la enfermedad o el tratamiento');
      if (d.retiroDias !== undefined && d.retiroDias !== null && d.retiroDias !== '' &&
        (!entero(d.retiroDias) || Number(d.retiroDias) < 0)) return no('Los días de retiro deben ser un número entero de 0 o más');
      break;
    default:
      return no('Tipo de registro desconocido');
  }
  const dup = TIPOS_DIARIOS.includes(tipo) &&
    regs.some(r => r && r.loteId === lote.id && r.tipo === tipo && r.fecha === fecha);
  return dup ? { ok: true, duplicado: true } : { ok: true };
}

<script>
/* =========================================================================
   APPOLLO · Reglas de alerta (puras: sin DOM, sin almacenamiento)
   Cada regla devuelve Alerta[]; generarAlertas las compone y ordena.
   Alerta{id, tipo, gravedad:'rojo'|'ambar'|'info', loteId?, texto, accion:{etiqueta, ruta}}
   ========================================================================= */

function _sumaDias(fecha, n) {
  const d = fechaADate(fecha);
  d.setDate(d.getDate() + n);
  return hoyLocal(d);
}
const _rutaLote = l => '#/lote/' + l.id;
const _activos = lotes => lotes.filter(l => l.estado === 'activo');

function alertaVacunas(datos, hoy) {
  const out = [], manana = _sumaDias(hoy, 1);
  const activos = new Map(_activos(datos.lotes).map(l => [l.id, l]));
  for (const v of datos.vacunasPlan || []) {
    const l = activos.get(v.loteId);
    if (!l || v.fechaAplicada) continue;
    let gravedad = null, cuando = '';
    if (v.fechaPrevista < hoy) { gravedad = 'rojo'; cuando = 'vencida (' + v.fechaPrevista + ')'; }
    else if (v.fechaPrevista === hoy) { gravedad = 'ambar'; cuando = 'es hoy'; }
    else if (v.fechaPrevista === manana) { gravedad = 'ambar'; cuando = 'es mañana'; }
    if (!gravedad) continue;
    out.push({ id: 'vacuna-' + v.id, tipo: 'vacuna', gravedad, loteId: l.id,
      texto: 'Vacuna ' + v.nombre + ' · ' + l.nombre + ': ' + cuando,
      accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
  }
  return out;
}

function alertaMortalidad(datos, hoy) {
  const out = [];
  for (const l of _activos(datos.lotes)) {
    const muertes = datos.registros.filter(r => r.loteId === l.id && r.tipo === 'mortalidad' && r.fecha === hoy)
      .reduce((s, r) => s + (Number(r.datos && r.datos.cantidad) || 0), 0);
    if (!muertes) continue;
    const base = avesVivas(l, datos.registros, hoy) + muertes; // aves al empezar el día
    if (!(base > 0)) continue;
    const esp = estandarDia(l, hoy, undefined).mortEsperada;
    const pct = 100 * muertes / base;
    if (esp > 0 && pct > 2 * esp) {
      out.push({ id: 'mortalidad-' + l.id + '-' + hoy, tipo: 'mortalidad', gravedad: 'rojo', loteId: l.id,
        texto: l.nombre + ': hoy murieron ' + muertes + ' aves (' + pct.toFixed(2) + ' %), más del doble de lo esperado',
        accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
    }
  }
  return out;
}

function alertaPostura(datos, hoy) {
  const out = [];
  for (const l of _activos(datos.lotes)) {
    const prom = desde => {
      const v = [0, 1, 2].map(i => pctPostura(l, datos.registros, _sumaDias(hoy, -(desde + i)))).filter(x => x !== null);
      return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
    };
    const rec = prom(0), prev = prom(3);
    if (rec !== null && prev !== null && prev - rec > 3) {
      out.push({ id: 'postura-' + l.id + '-' + hoy, tipo: 'postura', gravedad: 'ambar', loteId: l.id,
        texto: l.nombre + ': la postura bajó ' + (prev - rec).toFixed(1) + ' puntos frente a los 3 días previos',
        accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
    }
  }
  return out;
}

function alertaInventario(datos) {
  return (datos.inventario || [])
    .filter(i => Number(i.cantidad) < Number(i.minimo))
    .map(i => ({ id: 'inventario-' + i.id, tipo: 'inventario', gravedad: 'ambar',
      texto: i.nombre + ': quedan ' + i.cantidad + ' ' + i.unidad + ' (mínimo ' + i.minimo + ')',
      accion: { etiqueta: 'Ver inventario', ruta: '#/inventario' } }));
}

function alertaRetiro(datos, hoy) {
  const out = [], activos = new Map(_activos(datos.lotes).map(l => [l.id, l]));
  for (const r of datos.registros) {
    const dias = Number(r.datos && r.datos.retiroDias) || 0;
    const l = activos.get(r.loteId);
    if (r.tipo !== 'sanidad' || dias <= 0 || !l) continue;
    const fin = _sumaDias(r.fecha, dias);
    if (hoy <= fin) {
      out.push({ id: 'retiro-' + r.id, tipo: 'retiro', gravedad: 'rojo', loteId: l.id,
        texto: 'No vendas huevos/carne hasta ' + fin + ' · ' + l.nombre,
        accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
    }
  }
  return out;
}

function alertaSinRegistro(datos, hoy, ahora) {
  if (ahora.getHours() < 18) return [];
  return _activos(datos.lotes)
    .filter(l => !datos.registros.some(r => r.loteId === l.id && r.fecha === hoy))
    .map(l => ({ id: 'sin-registro-' + l.id + '-' + hoy, tipo: 'sin-registro', gravedad: 'info', loteId: l.id,
      texto: l.nombre + ': aún no hay registros de hoy',
      accion: { etiqueta: 'Registrar', ruta: _rutaLote(l) } }));
}

/* Avisa si la fase de alimento cambia hoy o en los próximos 7 días. */
function alertaCambioAlimento(datos, hoy) {
  const out = [];
  for (const l of _activos(datos.lotes)) {
    const g = GENETICAS.find(x => x.id === l.genetica);
    if (!g) continue;
    const modo = modoDe(g), d = edadDias(l, hoy);
    for (let k = 0; k <= 7; k++) {
      const antes = fase(g, modo, d + k - 1), despues = fase(g, modo, d + k);
      if (antes.id !== despues.id) {
        const cuando = k === 0 ? 'hoy' : k === 1 ? 'mañana' : 'en ' + k + ' días';
        out.push({ id: 'fase-' + l.id + '-' + despues.id, tipo: 'fase', gravedad: 'info', loteId: l.id,
          texto: l.nombre + ': ' + cuando + ' pasa a la fase "' + despues.n + '" de alimento',
          accion: { etiqueta: 'Ver lote', ruta: _rutaLote(l) } });
        break;
      }
    }
  }
  return out;
}

function generarAlertas(datos, ahora) {
  const hoy = hoyLocal(ahora);
  const orden = { rojo: 0, ambar: 1, info: 2 };
  return [
    ...alertaVacunas(datos, hoy), ...alertaMortalidad(datos, hoy), ...alertaPostura(datos, hoy),
    ...alertaInventario(datos), ...alertaRetiro(datos, hoy), ...alertaSinRegistro(datos, hoy, ahora),
    ...alertaCambioAlimento(datos, hoy)
  ].map((a, i) => [a, i]).sort((x, y) => orden[x[0].gravedad] - orden[y[0].gravedad] || x[1] - y[1]).map(x => x[0]);
}

<script>
/* =========================================================================
   APPOLLO · Persistencia (IndexedDB con respaldo en memoria)
   Script plano: define el global DB. Todas las operaciones devuelven Promise.
   ========================================================================= */
const DB = (function () {
  'use strict';
  const NOMBRE = 'appollo', VERSION = 1;
  const STORES = ['granja', 'lotes', 'registros', 'inventario', 'vacunasPlan'];
  const K_V1 = 'appollo.v1.lotes', K_MIGRADO = 'appollo.v2.migrado';
  let impl = null, abriendo = null;

  const nuevoId = () => {
    try { if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* sigue */ }
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
  };
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
  const copia = o => JSON.parse(JSON.stringify(o));
  const coincide = (obj, filtro) => {
    if (!filtro) return true;
    if (typeof filtro === 'function') return !!filtro(obj);
    return Object.keys(filtro).every(k => obj[k] === filtro[k]);
  };
  const exigeStore = s => { if (!STORES.includes(s)) throw new Error('Almacén desconocido: ' + s); };

  /* ---------------------------- IndexedDB ---------------------------- */
  const pedido = r => new Promise((ok, mal) => { r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error || new Error('Error de IndexedDB')); });
  const transaccion = tx => new Promise((ok, mal) => {
    tx.oncomplete = () => ok();
    tx.onerror = () => mal(tx.error || new Error('Error de IndexedDB'));
    tx.onabort = () => mal(tx.error || new Error('Transacción cancelada'));
  });

  function abrirIDB() {
    return new Promise((ok, mal) => {
      let req;
      try { req = indexedDB.open(NOMBRE, VERSION); } catch (e) { mal(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        STORES.forEach(s => {
          const st = db.createObjectStore(s, { keyPath: 'id' });
          if (s === 'registros') st.createIndex('loteId+fecha', ['loteId', 'fecha']);
          if (s === 'vacunasPlan') st.createIndex('loteId', 'loteId');
        });
      };
      req.onsuccess = () => ok(req.result);
      req.onerror = () => mal(req.error || new Error('No se pudo abrir IndexedDB'));
      req.onblocked = () => mal(new Error('IndexedDB bloqueada'));
    }).then(db => ({
      modo: 'indexeddb',
      async todos(s) { return pedido(db.transaction(s).objectStore(s).getAll()); },
      async uno(s, id) { return pedido(db.transaction(s).objectStore(s).get(id)); },
      async poner(s, o) { const tx = db.transaction(s, 'readwrite'); tx.objectStore(s).put(o); await transaccion(tx); },
      async quitar(s, id) { const tx = db.transaction(s, 'readwrite'); tx.objectStore(s).delete(id); await transaccion(tx); },
      async reemplazar(datos) {
        const tx = db.transaction(STORES, 'readwrite');
        const fin = transaccion(tx);
        try {
          STORES.forEach(s => { const st = tx.objectStore(s); st.clear(); (datos[s] || []).forEach(o => st.put(o)); });
        } catch (e) {
          try { tx.abort(); } catch (x) { /* ya cerrada */ }
          try { await fin; } catch (x) { /* abortada */ }
          throw e;
        }
        await fin;
      }
    }));
  }

  /* ----------------------------- Memoria ----------------------------- */
  function abrirMemoria() {
    const m = {};
    STORES.forEach(s => { m[s] = new Map(); });
    return {
      modo: 'memoria',
      async todos(s) { return Array.from(m[s].values()).map(copia); },
      async uno(s, id) { return m[s].has(id) ? copia(m[s].get(id)) : undefined; },
      async poner(s, o) { m[s].set(o.id, copia(o)); },
      async quitar(s, id) { m[s].delete(id); },
      async reemplazar(datos) { STORES.forEach(s => { m[s] = new Map((datos[s] || []).map(o => [o.id, copia(o)])); }); }
    };
  }

  /* ------------------------------ API ------------------------------ */
  function abrir() {
    if (impl) return Promise.resolve({ modo: impl.modo });
    if (!abriendo) {
      abriendo = (typeof indexedDB === 'undefined' || !indexedDB ? Promise.reject(new Error('Sin IndexedDB')) : abrirIDB())
        .catch(() => abrirMemoria())
        .then(i => { impl = i; return { modo: i.modo }; });
    }
    return abriendo;
  }
  const lista = async () => { await abrir(); return impl; };

  async function listar(store, filtro) {
    exigeStore(store);
    const todos = await (await lista()).todos(store);
    return filtro ? todos.filter(o => coincide(o, filtro)) : todos;
  }
  async function obtener(store, id) { exigeStore(store); return (await lista()).uno(store, id); }
  async function guardar(store, obj) {
    exigeStore(store);
    const o = Object.assign({}, obj);

    await abrir();

    let viejos = [];
    try { const p = crudo ? JSON.parse(crudo) : []; viejos = Array.isArray(p) ? p : []; } catch (e) { viejos = []; }

    for (const e of viejos) {
      if (!e || typeof e !== 'object') continue;
      const est = e.estado && typeof e.estado === 'object' ? e.estado : {};
      const gid = est.gid || e.gid || e.genetica || null;
      const aves = Number(est.aves !== undefined ? est.aves : (e.avesInicio !== undefined ? e.avesInicio : e.aves));
      let gNombre = gid;
      try { const g = typeof GENETICAS !== 'undefined' && GENETICAS.find(x => x.id === gid); if (g) gNombre = g.nombre; } catch (x) { /* sin catálogo */ }
      const fecha = typeof e.fecha === 'string' ? e.fecha.slice(0, 10) : '';
      const nombre = [gNombre || 'Lote anterior', fecha].filter(Boolean).join(' · ');
      await guardar('lotes', {
        id: 'ls-' + (e.id !== undefined ? e.id : nuevoId()),
        nombre, genetica: gid, avesInicio: isFinite(aves) ? aves : 0,
        fechaLlegada: fecha || null, estado: 'cerrado', origen: 'v1', resumen: e.resumen || ''

function formatoNumero(n, decimales) {

function Contador({ id, valor, min, max, paso, etiqueta } = {}) {

/* Suma o resta un paso al Contador `id` respetando min/max; devuelve el nuevo valor. */
function ajustarContador(id, signo) {

/* Appollo · Gráfico de líneas en SVG: real (verde, continua) contra estándar (cielo, discontinua).
   Tolera series vacías, de un punto, con nulos o de distinto largo sin producir NaN. */

function Grafico({ serieReal, serieEstandar, etiquetas } = {}) {
  const W = 320, H = 150, PX = 10, PY = 14;
  const lista = s => (Array.isArray(s) ? s.map(v => (v === null || v === '' || v === undefined ? NaN : Number(v))) : []);
  const real = lista(serieReal), est = lista(serieEstandar);
  const ets = Array.isArray(etiquetas) ? etiquetas : [];
  const n = Math.max(real.length, est.length, ets.length);
  const vals = real.concat(est).filter(Number.isFinite);
  const f = v => (Math.round(v * 10) / 10).toString();

  let lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 1;
  if (hi - lo < 1e-9) { const d = Math.abs(hi) * 0.1 || 1; lo -= d; hi += d; }
  const m = (hi - lo) * 0.12; lo -= m; hi += m;
  const x = i => (n <= 1 ? W / 2 : PX + (i * (W - 2 * PX)) / (n - 1));
  const y = v => PY + ((hi - v) * (H - 2 * PY)) / (hi - lo);

  // Tramos continuos de puntos válidos; un punto aislado se dibuja como círculo.
  function trazar(serie, clase, extra) {
    let d = '', puntos = '', tramo = [];
    const cerrar = () => {
      if (tramo.length === 1) puntos += `<circle class="${clase}-punto" cx="${f(x(tramo[0]))}" cy="${f(y(serie[tramo[0]]))}" r="4"/>`;
      else if (tramo.length > 1) d += tramo.map((i, k) => (k ? 'L' : 'M') + f(x(i)) + ' ' + f(y(serie[i]))).join('');
      tramo = [];
    };
    serie.forEach((v, i) => (Number.isFinite(v) ? tramo.push(i) : cerrar()));
    cerrar();
    return (d ? `<path class="${clase}" d="${d}" fill="none"${extra}/>` : '') + puntos;
  }

  const rejilla = [0.25, 0.5, 0.75].map(t => `<line class="grafico-rejilla" x1="0" x2="${W}" y1="${f(PY + t * (H - 2 * PY))}" y2="${f(PY + t * (H - 2 * PY))}"/>`).join('');
  const base = `<line class="grafico-base" x1="0" x2="${W}" y1="${H - 1}" y2="${H - 1}"/>`;
  let ult = '';
  for (let i = real.length - 1; i >= 0; i--) if (Number.isFinite(real[i])) { ult = `<circle class="grafico-ultimo" cx="${f(x(i))}" cy="${f(y(real[i]))}" r="5.5"/>`; break; }

  const hayDatos = vals.length > 0;
  const svg = `<svg class="grafico-svg" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">${rejilla}${base}${hayDatos
    ? trazar(est, 'grafico-estandar', ' stroke-dasharray="7 6"') + trazar(real, 'grafico-real', ' pathLength="1"') + ult : ''}</svg>`;

  const primera = ets.length ? ets[0] : '', ultima = ets.length > 1 ? ets[ets.length - 1] : '';
  const ejes = hayDatos && (primera !== '' || ultima !== '')
    ? `<div class="grafico-ejes"><span>${esc(primera)}</span><span>${esc(ultima)}</span></div>` : '';
  const ultimoReal = real.filter(Number.isFinite).pop();
  const resumen = hayDatos
    ? `Gráfico de ${n} ${n === 1 ? 'punto' : 'puntos'}: real${ultimoReal !== undefined ? ' último ' + formatoNumero(ultimoReal) : ''} contra estándar`
    : 'Gráfico sin datos';
  return `<figure class="grafico${hayDatos ? '' : ' grafico-vacio'}" role="img" aria-label="${esc(resumen)}">
  ${svg}${hayDatos ? '' : `<p class="grafico-aviso">Aún no hay datos para graficar</p>`}
  ${ejes}
  <figcaption class="grafico-leyenda"><span class="ley ley-real">Real</span><span class="ley ley-estandar">Estándar</span></figcaption>
</figure>`;
}

/* Appollo · Animaciones pequeñas. Con prefers-reduced-motion todo ocurre al instante. */

function reducirMovimiento() {
  try { return typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch (e) { return false; }
}

/* Cuenta desde la cifra que muestra el elemento hasta `hasta`. Devuelve una promesa. */
function contar(el, hasta, ms) {
  const fin = Number(hasta);
  if (!el || !Number.isFinite(fin)) return Promise.resolve();
  const dec = Number.isInteger(fin) ? 0 : Math.min(2, (String(fin).split('.')[1] || '').length);
  const pinta = v => { el.textContent = formatoNumero(v, dec); };
  if (el._contar) cancelAnimationFrame(el._contar);
  const desde = Number(String(el.textContent || '').replace(/[^\d,-]/g, '').replace(',', '.')) || 0;
  if (reducirMovimiento() || desde === fin || typeof requestAnimationFrame !== 'function') { pinta(fin); return Promise.resolve(); }
  const dur = ms || 700;
  return new Promise(res => {
    let t0 = null;
    const paso = t => {
      if (t0 === null) t0 = t;
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      pinta(desde + (fin - desde) * e);
      if (p < 1) el._contar = requestAnimationFrame(paso);
      else { el._contar = 0; pinta(fin); res(); }
    };
    el._contar = requestAnimationFrame(paso);
  });
}

function palomita(el) {
  if (!el) return Promise.resolve();
  el.innerHTML = '<svg class="palomita" viewBox="0 0 52 52" aria-hidden="true" focusable="false">' +
    '<circle class="palomita-circulo" cx="26" cy="26" r="23"/>' +
    '<path class="palomita-trazo" d="M15 27.5l7.2 7.2L37.5 19" pathLength="1"/></svg>';
  if (reducirMovimiento() || typeof Element.prototype.animate !== 'function') return Promise.resolve();
  const c = el.querySelector('.palomita-circulo'), p = el.querySelector('.palomita-trazo');
  const a1 = c.animate([{ transform: 'scale(.4)', opacity: 0 }, { transform: 'scale(1.08)', opacity: 1, offset: 0.7 }, { transform: 'scale(1)', opacity: 1 }],
    { duration: 320, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' });
